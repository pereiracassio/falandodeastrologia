  <style>
    .proj-passo{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--azul-egipcio-claro)}
    .proj-passo:last-child{border-bottom:0}
    .proj-passo input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--azul-egipcio-claro);background:transparent;border-radius:0;padding:0;cursor:pointer;position:relative}
    .proj-passo input[type=checkbox]:checked::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--terracota);font-size:20px;font-weight:700;font-family:Arial,sans-serif}
    .proj-grupo{margin:22px 0 6px}
    .proj-titulo{font-size:17px;line-height:1.4;color:var(--preto-tinta);display:block;overflow-wrap:anywhere}
    .proj-acoes{display:flex;gap:18px;align-items:center;margin-top:6px}
    .compras-novo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
    .compras-novo .campo{flex:1;min-width:200px}

<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">

  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Compras</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=178"></script>
  <script src="menu.js?v=69" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '', itens = [];

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('compras', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function erro(msg) { var m = el('p', { class: 'portal-msg erro', text: msg }); app.insertBefore(m, app.firstChild); setTimeout(function () { if (m.parentNode) m.parentNode.removeChild(m); }, 6000); }

    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          carregar();
        });
      });
    }

    function carregar() {
      C.from('compras_itens').select('id,nome,estado,criado_em').in('estado', ['lista', 'carrinho']).order('criado_em').then(function (r) {
        if (r.error) { limpar(); app.appendChild(topo(nomeAdmin)); app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a lista: ' + r.error.message })); return; }
        itens = r.data;
        desenhar();
      });
    }

    function mudar(x, estado) {
      var dados = { estado: estado, comprado_em: estado === 'comprado' ? new Date().toISOString() : null };
      C.from('compras_itens').update(dados).eq('id', x.id).then(function (r) { if (r.error) erro('Não foi possível gravar: ' + r.error.message); else carregar(); });
    }

    function linha(x) {
      var noCarrinho = x.estado === 'carrinho';
      var cb = el('input', { type: 'checkbox' });
      cb.checked = noCarrinho;
      cb.addEventListener('change', function () { mudar(x, noCarrinho ? 'lista' : 'carrinho'); });
      var apagar = P.botaoApagar('Apagar');
      apagar.addEventListener('click', function () {
        if (!confirm('Apagar "' + x.nome + '"?')) return;
        C.from('compras_itens').delete().eq('id', x.id).then(function (r) { if (r.error) erro('Não foi possível apagar: ' + r.error.message); else carregar(); });
      });
      return el('div', { class: 'proj-passo' }, [cb, el('div', { style: 'flex:1;min-width:0' }, [el('span', { class: 'proj-titulo', text: x.nome }), el('div', { class: 'proj-acoes' }, [apagar])])]);
    }

    function desenhar() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' });
      var campo = el('input', { type: 'text', placeholder: '', autocomplete: 'off' });
      var adicionar = el('button', { type: 'button', class: 'portal-btn', text: 'Adicionar' });
      function incluir() {
        var nome = campo.value.trim();
        if (!nome) return;
        adicionar.disabled = true;
        C.from('compras_itens').insert({ nome: nome }).then(function (r) {
          adicionar.disabled = false;
          if (r.error) { erro('Não foi possível adicionar: ' + r.error.message); return; }
          campo.value = '';
          carregar();
        });
      }
      adicionar.addEventListener('click', incluir);
      campo.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); incluir(); } });
      cartao.appendChild(el('div', { class: 'compras-novo' }, [el('div', { class: 'campo' }, [el('label', { text: 'Novo item' }), campo]), adicionar]));

      var naLista = itens.filter(function (x) { return x.estado === 'lista'; });
      var noCarrinho = itens.filter(function (x) { return x.estado === 'carrinho'; });
      if (naLista.length) { cartao.appendChild(el('div', { class: 'proj-grupo', text: 'Na lista' })); naLista.forEach(function (x) { cartao.appendChild(linha(x)); }); }
      if (noCarrinho.length) {
        cartao.appendChild(el('div', { class: 'proj-grupo', text: 'No carrinho' }));
        noCarrinho.forEach(function (x) { cartao.appendChild(linha(x)); });
        var comprei = el('button', { type: 'button', class: 'portal-btn', text: 'Comprei tudo' });
        comprei.addEventListener('click', function () {
          comprei.disabled = true;
          C.from('compras_itens').update({ estado: 'comprado', comprado_em: new Date().toISOString() }).eq('estado', 'carrinho').then(function (r) { if (r.error) { comprei.disabled = false; erro('Não foi possível gravar: ' + r.error.message); } else carregar(); });
        });
        cartao.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:18px' }, [comprei]));
      }
      if (!itens.length) cartao.appendChild(el('p', { text: 'Nenhum item.' }));
      app.appendChild(cartao);
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
