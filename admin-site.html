  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var TAMANHO = 720; /* lado da foto em pixels (quadrada); na página ela aparece com 180 px, então dá de sobra até em tela retina */

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('site', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          tela();
        });
      });
    }

    /* corta a foto num quadrado (pelo centro) e reduz: o arquivo fica leve e sempre do mesmo formato */
    function prepararFoto(arquivo) {
      return new Promise(function (ok, erro) {
        var url = URL.createObjectURL(arquivo), img = new Image();
        img.onload = function () {
          var lado = Math.min(img.naturalWidth, img.naturalHeight);
          var c = document.createElement('canvas'); c.width = c.height = TAMANHO;
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, TAMANHO, TAMANHO);
          g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, TAMANHO, TAMANHO);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) { blob ? ok(blob) : erro(new Error('foto')); }, 'image/jpeg', 0.9);
        };
        img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('foto')); };
        img.src = url;
      });
    }
    var caminhoDe = function (url) { var i = String(url || '').indexOf('/object/public/site/'); return i >= 0 ? decodeURIComponent(String(url).slice(i + '/object/public/site/'.length).split('?')[0]) : null; };


    /* lugar usado nas horas planetárias da Produção e da Agenda (guardado em site_config.prod_local_horas, vale em qualquer aparelho) */
    var LOCAIS = [
      ['Jacareí', -23.3053, -45.9658, -3], ['São Paulo', -23.5505, -46.6333, -3], ['Guarulhos', -23.4543, -46.5333, -3], ['São José dos Campos', -23.1896, -45.8841, -3],
      ['Campinas', -22.9099, -47.0626, -3], ['Santos', -23.9608, -46.3336, -3], ['Rio de Janeiro', -22.9068, -43.1729, -3], ['Belo Horizonte', -19.9167, -43.9345, -3],
      ['Brasília', -15.7939, -47.8828, -3], ['Curitiba', -25.4284, -49.2733, -3], ['Porto Alegre', -30.0346, -51.2177, -3], ['Florianópolis', -27.5954, -48.548, -3],
      ['Vitória', -20.3155, -40.3128, -3], ['Goiânia', -16.6869, -49.2648, -3], ['Salvador', -12.9777, -38.5016, -3], ['Recife', -8.0476, -34.877, -3],
      ['Fortaleza', -3.7319, -38.5267, -3], ['Natal', -5.7945, -35.211, -3], ['Belém', -1.4558, -48.4902, -3], ['Manaus', -3.119, -60.0217, -4],
      ['Cuiabá', -15.6014, -56.0979, -4], ['Campo Grande', -20.4697, -54.6201, -4], ['Porto Velho', -8.7612, -63.9004, -4]
    ];
    function cartaoLugar() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Lugar das horas planetárias' })]);
      var corpo = el('div'); cartao.appendChild(corpo);
      var atual = { nome: 'Jacareí', lat: -23.3053, lon: -45.9658, fuso: -3 };
      var campo = function (r, c) { return [el('label', { text: r }), c]; };
      function desenhar() {
        corpo.textContent = '';
        var lista = el('select');
        LOCAIS.forEach(function (l, i) { var o = el('option', { value: String(i), text: l[0] }); if (l[0] === atual.nome) o.selected = true; lista.appendChild(o); });
        var outro = el('option', { value: 'outro', text: 'Outro lugar (digitar)' }); if (!LOCAIS.some(function (l) { return l[0] === atual.nome; })) outro.selected = true; lista.appendChild(outro);
        var nomeC = el('input', { type: 'text', placeholder: 'Nome do lugar', value: atual.nome });
        var latC = el('input', { type: 'number', step: 'any', placeholder: 'Latitude (sul é negativo)', value: atual.lat });
        var lonC = el('input', { type: 'number', step: 'any', placeholder: 'Longitude (oeste é negativo)', value: atual.lon });
        var fusoC = el('input', { type: 'number', step: 'any', placeholder: 'Fuso (Brasília é -3)', value: atual.fuso });
        var manual = el('div', { style: 'display:none' }, [].concat(campo('Nome', nomeC), campo('Latitude', latC), campo('Longitude', lonC), campo('Fuso (horas em relação a Greenwich)', fusoC)));
        var mostrar = function () { manual.style.display = lista.value === 'outro' ? 'block' : 'none'; };
        lista.addEventListener('change', mostrar); mostrar();
        var msg = el('p', { class: 'portal-msg' });
        var aqui = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Usar a localização deste aparelho agora' });
        aqui.addEventListener('click', function () {
          if (!navigator.geolocation) { P.mensagem(msg, 'Este aparelho não informa a localização.', 'erro'); return; }
          P.mensagem(msg, 'Pedindo a localização...');
          navigator.geolocation.getCurrentPosition(function (pos) {
            lista.value = 'outro'; mostrar();
            nomeC.value = 'localização do aparelho'; latC.value = pos.coords.latitude.toFixed(4); lonC.value = pos.coords.longitude.toFixed(4); fusoC.value = String(-new Date().getTimezoneOffset() / 60);
            salvar.click();
          }, function () { P.mensagem(msg, 'Não consegui a localização. Escolha na lista ou digite.', 'erro'); }, { timeout: 10000 });
        });
        var salvar = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar o lugar' });
        salvar.addEventListener('click', function () {
          var novo;
          if (lista.value === 'outro') {
            novo = { nome: nomeC.value.trim() || 'outro lugar', lat: parseFloat(latC.value), lon: parseFloat(lonC.value), fuso: parseFloat(fusoC.value) };
            if (!isFinite(novo.lat) || !isFinite(novo.lon) || !isFinite(novo.fuso) || Math.abs(novo.lat) > 66 || Math.abs(novo.lon) > 180 || Math.abs(novo.fuso) > 14) { P.mensagem(msg, 'Confira a latitude, a longitude e o fuso. Perto dos polos o sol pode não nascer e a conta não funciona.', 'erro'); return; }
          } else { var l = LOCAIS[+lista.value]; novo = { nome: l[0], lat: l[1], lon: l[2], fuso: l[3] }; }
          C.from('site_config').upsert({ chave: 'prod_local_horas', valor: JSON.stringify(novo), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) {
            if (r.error) { P.mensagem(msg, 'Não consegui salvar (' + r.error.message + ')', 'erro'); return; }
            atual = novo; desenhar(); P.mensagem(msg, 'Lugar salvo.', 'ok');
          });
        });
        [].concat(campo('Lugar', lista)).forEach(function (n) { corpo.appendChild(n); });
        corpo.appendChild(manual);
        corpo.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:12px' }, [salvar, aqui])); corpo.appendChild(msg); P.salvarSozinho(salvar);
      }
      desenhar();
      C.from('site_config').select('valor').eq('chave', 'prod_local_horas').maybeSingle().then(function (r) {
        try { var v = r.data && r.data.valor ? JSON.parse(r.data.valor) : null; if (v && isFinite(v.lat) && isFinite(v.lon) && isFinite(v.fuso)) { atual = { nome: String(v.nome || 'outro lugar'), lat: +v.lat, lon: +v.lon, fuso: +v.fuso }; desenhar(); } } catch (e) { /* fica em Jacareí */ }
      });
      return cartao;
    }

    /* quais agendas do Google aparecem na aba Agenda (guardado em site_config.agenda_ocultas = as que ele DESMARCOU; agenda nova aparece sozinha) */
    var PALETA_AGENDA = ['#ac725e', '#d06b64', '#f83a22', '#fa573c', '#ff7537', '#ffad46', '#42d692', '#16a765', '#7bd148', '#b3dc6c', '#fbe983', '#fad165', '#92e1c0', '#9fe1e7', '#9fc6e7', '#4986e7', '#9a9cff', '#b99aff', '#c2c2c2', '#cabdbf', '#cca6ac', '#f691b2', '#cd74e6', '#a47ae2'];
    function textoSobreHex(hex) { var n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 120 ? '#000000' : '#ffffff'; }
    /* o Google ainda não deixou trocar a cor: pede a permissão de novo */
    function permitirDeNovo(msg) {
      msg.textContent = '';
      var b = el('button', { type: 'button', class: 'portal-btn', text: 'Permitir o Google Agenda' });
      b.addEventListener('click', function () {
        try { sessionStorage.removeItem('fda_drive_token'); } catch (e) { /* sem armazenamento */ }
        C.auth.getSession().then(function (r) { return fetch('https://falandodeastrologia.vercel.app/api/drive?acao=iniciar&volta=' + encodeURIComponent('/admin-site.html'), { headers: { Authorization: 'Bearer ' + r.data.session.access_token } }); })
          .then(function (r) { return r.json(); }).then(function (d) { location.href = d.url; });
      });
      msg.appendChild(b);
    }
    function cartaoAgendas() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Agendas que aparecem' })]);
      var corpo = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]); cartao.appendChild(corpo);
      Promise.all([
        P.tokenGoogle().then(function (t) { return fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=freeBusyReader', { headers: { Authorization: 'Bearer ' + t } }); }).then(function (r) { if (!r.ok) throw new Error(r.status === 403 ? 'permissao' : 'Google ' + r.status); return r.json(); }),
        C.from('site_config').select('valor').eq('chave', 'agenda_ocultas').maybeSingle()
      ]).then(function (rs) {
        var ocultas = []; try { ocultas = rs[1].data && rs[1].data.valor ? JSON.parse(rs[1].data.valor) : []; } catch (e) { /* todas */ }
        corpo.textContent = '';
        var msg = el('p', { class: 'portal-msg' });
        (rs[0].items || []).forEach(function (c) {
          var marcada = ocultas.indexOf(c.id) < 0;
          var cx = el('button', { type: 'button', role: 'checkbox', style: 'flex:none;width:26px;height:26px;padding:0;margin:0;background:transparent;border:2px solid #1F5FA3;border-radius:0;color:#A03E25;font-size:18px;line-height:20px;font-weight:700;cursor:pointer;text-align:center' });
          var pinta = function () { cx.textContent = marcada ? '✓' : ''; cx.setAttribute('aria-checked', marcada ? 'true' : 'false'); };
          pinta();
          var alterna = function () {
            marcada = !marcada; pinta();
            var i = ocultas.indexOf(c.id);
            if (marcada && i >= 0) ocultas.splice(i, 1); else if (!marcada && i < 0) ocultas.push(c.id);
            C.from('site_config').upsert({ chave: 'agenda_ocultas', valor: JSON.stringify(ocultas), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) {
              P.mensagem(msg, r.error ? 'Não consegui salvar (' + r.error.message + ')' : 'Salvo.', r.error ? 'erro' : 'ok');
            });
          };
          var nome = el('span', { text: c.summaryOverride || c.summary || c.id, style: 'flex:1;text-align:left;cursor:pointer' });
          cx.addEventListener('click', alterna); nome.addEventListener('click', alterna);
          /* a cor da agenda: a mesma do Google; trocar aqui troca lá */
          var cor = el('button', { type: 'button', title: 'Cor', 'aria-label': 'Cor', style: 'flex:none;width:26px;height:26px;padding:0;margin:0;border:0;border-radius:0;cursor:pointer;background:' + (c.backgroundColor || '#B5852F') });
          var paleta = el('div', { style: 'display:none;flex-wrap:wrap;gap:6px;padding:8px 0 4px 38px' });
          PALETA_AGENDA.forEach(function (hex) {
            var q = el('button', { type: 'button', 'aria-label': hex, style: 'width:30px;height:30px;padding:0;border:0;border-radius:0;cursor:pointer;background:' + hex });
            q.addEventListener('click', function () {
              paleta.style.display = 'none';
              P.tokenGoogle().then(function (t) {
                return fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList/' + encodeURIComponent(c.id) + '?colorRgbFormat=true', { method: 'PATCH', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ backgroundColor: hex, foregroundColor: textoSobreHex(hex) }) });
              }).then(function (r) {
                if (r.status === 403) { permitirDeNovo(msg); return; }
                if (!r.ok) throw new Error('Google ' + r.status);
                c.backgroundColor = hex; cor.style.background = hex; P.mensagem(msg, 'Salvo.', 'ok');
              }).catch(function (er) { P.mensagem(msg, 'Não consegui trocar a cor (' + er.message + ')', 'erro'); });
            });
            paleta.appendChild(q);
          });
          cor.addEventListener('click', function () { paleta.style.display = paleta.style.display === 'none' ? 'flex' : 'none'; });
          var linha = el('div', { style: 'display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(31,95,163,.5)' }, [cx, cor, nome]);
          corpo.appendChild(el('div', {}, [linha, paleta]));
        });
        corpo.appendChild(msg);
      }).catch(function (e) {
        corpo.textContent = '';
        corpo.appendChild(el('p', { text: e.message === 'desconectado' || e.message === 'permissao' ? 'Para escolher as agendas, conecte o Google (cartão Google Drive, acima) e abra a aba Agenda uma vez para permitir o Google Agenda.' : 'Não foi possível ler as agendas agora (' + e.message + ').' }));
      });
      return cartao;
    }

    /* clientes do Astro Hellenic: arquivo CSV (codigo, nome, email, whatsapp, nascimento). Cria o cadastro de quem ainda não existe aqui (mesmo sem e-mail)
       e completa o que faltar nos que já existem (WhatsApp, nascimento, código), sem nunca trocar o que já está salvo. Alunos só são completados. */
    function cartaoImportarClientes() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Importar clientes' })]);
      var msg = el('p', { class: 'portal-msg' });
      var arq = el('input', { type: 'file', accept: '.csv,text/csv,text/plain' }); arq.style.display = 'none';
      var botao = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Importar arquivo' });
      botao.addEventListener('click', function () { arq.click(); });
      var iso = function (t) { var x = String(t || '').replace(/\s+/g, ''), m = x.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) || x.match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; return x.indexOf('/') > 0 ? m[3] + '-' + m[2] + '-' + m[1] : m[1] + '-' + m[2] + '-' + m[3]; };
      var campos = function (l) { var r = [], c = '', q = false; for (var i = 0; i < l.length; i++) { var ch = l[i]; if (ch === '"') q = !q; else if ((ch === ',' || ch === ';') && !q) { r.push(c); c = ''; } else c += ch; } r.push(c); return r.map(function (x) { x = x.trim(); return /^null$/i.test(x) ? '' : x; }); };
      arq.addEventListener('change', function () {
        var f = arq.files && arq.files[0]; arq.value = ''; if (!f) return;
        P.mensagem(msg, 'Lendo...');
        f.text().then(function (txt) {
          var linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter(function (l) { return l.trim(); }), cab = campos(linhas[0] || '').map(function (x) { return x.toLowerCase(); });
          var col = function (re) { return cab.findIndex(function (x) { return re.test(x); }); };
          var ic = col(/c[oó]d/), inome = col(/nome/), ie = col(/e-?mail/), iw = col(/whats|fone|tel/), inn = col(/nasc/);
          if (inome < 0) throw new Error('o arquivo precisa da coluna nome');
          var pessoas = linhas.slice(1).map(function (l) {
            var c = campos(l), em = (ie >= 0 ? c[ie] : '').toLowerCase();
            return { codigo: ic >= 0 ? c[ic].replace(/\s+[AB]$/i, '').trim() : '', nome: c[inome] || '', email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em) ? em : '', whatsapp: iw >= 0 ? c[iw] : '', nascimento: inn >= 0 ? iso(c[inn]) : '' };
          }).filter(function (p) { return p.nome; });
          return Promise.all([C.from('clientes').select('id,email,nome,whatsapp,nascimento'), C.from('cliente_codigos').select('cliente_id,codigo'), C.from('alunos').select('id,email,whatsapp,nascimento')]).then(function (rs) {
            var erro = rs[0].error || rs[1].error || rs[2].error; if (erro) throw new Error(erro.message);
            var clientes = rs[0].data || [], porEmail = {}, porCodigo = {}, codigoDe = {}, alunosPorEmail = {};
            clientes.forEach(function (x) { if (x.email) porEmail[x.email.toLowerCase()] = x; });
            (rs[1].data || []).forEach(function (x) { porCodigo[x.codigo] = x.cliente_id; codigoDe[x.cliente_id] = x.codigo; });
            (rs[2].data || []).forEach(function (x) { if (x.email) alunosPorEmail[x.email.toLowerCase()] = x; });
            var porId = {}; clientes.forEach(function (x) { porId[x.id] = x; });
            var criados = 0, completados = 0, falhas = 0, i = 0;
            var uma = function () {
              var p = pessoas[i++]; if (!p) return Promise.resolve();
              var ex = (p.email && porEmail[p.email]) || (p.codigo && porId[porCodigo[p.codigo]]) || null, tarefas = [];
              var al = p.email && alunosPorEmail[p.email];
              if (al) { var u = {}; if (p.whatsapp && !al.whatsapp) u.whatsapp = p.whatsapp; if (p.nascimento && !al.nascimento) u.nascimento = p.nascimento; if (Object.keys(u).length) tarefas.push(C.from('alunos').update(u).eq('id', al.id).then(function (r) { if (!r.error) completados++; else falhas++; })); }
              if (ex) {
                var u2 = {}; if (p.whatsapp && !ex.whatsapp) u2.whatsapp = p.whatsapp; if (p.nascimento && !ex.nascimento) u2.nascimento = p.nascimento; if (p.email && !ex.email) u2.email = p.email;
                if (Object.keys(u2).length) tarefas.push(C.from('clientes').update(u2).eq('id', ex.id).then(function (r) { if (!r.error) completados++; else falhas++; }));
                if (p.codigo && !codigoDe[ex.id] && !porCodigo[p.codigo]) tarefas.push(C.from('cliente_codigos').insert({ cliente_id: ex.id, codigo: p.codigo }).then(function (r) { if (r.error) falhas++; }));
              } else if (!al) {
                tarefas.push(C.from('clientes').insert({ nome: p.nome, email: p.email || null, whatsapp: p.whatsapp || null, nascimento: p.nascimento || null }).select('id').single().then(function (r) {
                  if (r.error) { falhas++; return; }
                  criados++; if (p.email) porEmail[p.email] = { id: r.data.id, email: p.email, whatsapp: p.whatsapp, nascimento: p.nascimento };
                  if (p.codigo && !porCodigo[p.codigo]) { porCodigo[p.codigo] = r.data.id; codigoDe[r.data.id] = p.codigo; porId[r.data.id] = { id: r.data.id }; return C.from('cliente_codigos').insert({ cliente_id: r.data.id, codigo: p.codigo }).then(function (r2) { if (r2.error) falhas++; }); }
                }));
              }
              return Promise.all(tarefas).then(uma);
            };
            return uma().then(function () { P.mensagem(msg, criados + ' cadastros criados, ' + completados + ' completados' + (falhas ? ', ' + falhas + ' com erro' : '') + '.', falhas ? 'erro' : 'ok'); });
          });
        }).catch(function (e) { P.mensagem(msg, 'Não consegui importar (' + e.message + ')', 'erro'); });
      });
      cartao.appendChild(el('div', { class: 'portal-acoes' }, [botao])); cartao.appendChild(arq); cartao.appendChild(msg);
      return cartao;
    }

    /* áreas e serviços do Financeiro (o cadastro mora aqui; o Financeiro só lança entradas e usa estas listas) */
    var areas = [], servicosCad = [], cartaoAreas = el('div', { class: 'portal-cartao' }), cartaoServicos = el('div', { class: 'portal-cartao' });
    function moeda(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function lerValor(txt) {
      var s = String(txt || '').replace(/[R$\s]/g, '');
      if (!s) return null;
      if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
    }
    function todosServicos() {
      var lista = servicosCad.map(function (x) { return { nome: x.nome, valor: x.valor, area_id: x.area_id }; });
      var tem = {}; lista.forEach(function (x) { tem[x.nome.toLowerCase()] = true; });
      var site = window.Carrinho.servicos;
      /* serviço do site que ainda não está na sua lista entra na área Astrologia */
      var astro = areas.filter(function (a) { return /astrolog/i.test(a.nome); })[0];
      Object.keys(site).filter(function (k) { return !/teste/i.test(k); }).forEach(function (k) {
        if (!tem[site[k].titulo.toLowerCase()]) lista.push({ nome: site[k].titulo, valor: site[k].centavos / 100, area_id: astro ? astro.id : null });
      });
      return lista;
    }
    function carregarFin() {
      return Promise.all([C.from('fin_areas').select('*').order('ordem').order('nome'), C.from('fin_servicos').select('*').order('nome')]).then(function (r) {
        areas = (r[0] && !r[0].error && r[0].data) || []; servicosCad = (r[1] && !r[1].error && r[1].data) || [];
        formAreas(cartaoAreas); formServicos(cartaoServicos);
      });
    }

    /* cadastro de serviços: nome, valor e área. Ao lançar uma entrada, escolher o serviço já preenche o valor e a área */
    function formServicos(destino) {
      destino.textContent = '';
      destino.appendChild(el('h2', { text: 'Serviços' }));
      var porArea = {}; areas.forEach(function (a) { porArea[a.id] = a; });
      var caixa = el('div', [
        el('p', { text: 'Cadastre cada serviço com o valor e a área. Na hora de lançar uma entrada, ao escolher o serviço, o valor e a área já vêm preenchidos.' })]);
      var msg = el('p', { class: 'portal-msg' });
      function aviso(r) { if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return false; } return true; }
      var editando = null;
      servicosCad.forEach(function (x) {
        var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
        var apagar = P.botaoApagar('Apagar');
        editar.addEventListener('click', function () { editando = x; nome.value = x.nome; valor.value = String(x.valor).replace('.', ','); area.value = x.area_id || ''; add.textContent = 'Salvar'; nome.focus(); });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar o serviço "' + x.nome + '"? As entradas já lançadas não mudam.')) return;
          C.from('fin_servicos').delete().eq('id', x.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        caixa.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
          el('div', {}, [el('span', { class: 'portal-item-titulo', text: x.nome }),
            el('span', { class: 'portal-item-data', text: moeda(x.valor) + (x.area_id && porArea[x.area_id] ? ' · ' + porArea[x.area_id].nome : '') })]),
          el('div', { class: 'portal-acoes' }, [editar, apagar])])]));
      });
      if (!servicosCad.length) caixa.appendChild(el('p', { text: 'Nenhum serviço cadastrado ainda.' }));
      var nome = el('input', { type: 'text', placeholder: 'Nome do serviço' });
      var valor = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Valor (0,00)' });
      var area = el('select');
      area.appendChild(el('option', { value: '', text: 'Sem área' }));
      areas.forEach(function (a) { area.appendChild(el('option', { value: a.id, text: a.nome })); });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      /* traz de uma vez os serviços do site (os que ainda não estão cadastrados), na área Astrologia */
      var trazer = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trazer os serviços do site' });
      trazer.addEventListener('click', function () {
        var astro = areas.filter(function (a) { return /astrolog/i.test(a.nome); })[0];
        var site = todosServicos().filter(function (x) { return !servicosCad.some(function (c) { return c.nome.toLowerCase() === x.nome.toLowerCase(); }); });
        if (!site.length) { P.mensagem(msg, 'Os serviços do site já estão na sua lista.', 'ok'); return; }
        C.from('fin_servicos').insert(site.map(function (x) { return { nome: x.nome, valor: x.valor, area_id: astro ? astro.id : null }; })).then(function (r) { if (aviso(r)) carregarFin(); });
      });
      var f = el('form', { style: 'margin-top:14px' }, [el('label', { text: 'Nome' }), nome, el('label', { text: 'Valor (R$)' }), valor, el('label', { text: 'Área' }), area,
        msg, el('div', { class: 'portal-acoes' }, [add, trazer])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var v = lerValor(valor.value);
        if (!nome.value.trim()) { P.mensagem(msg, 'Escreva o nome do serviço.', 'erro'); return; }
        if (v == null) { P.mensagem(msg, 'Digite o valor (por exemplo 135,00).', 'erro'); return; }
        var reg = { nome: nome.value.trim(), valor: v, area_id: area.value || null };
        var req = editando ? C.from('fin_servicos').update(reg).eq('id', editando.id) : C.from('fin_servicos').insert(reg);
        req.then(function (r) { if (aviso(r)) carregarFin(); });
      });
      caixa.appendChild(f);
      destino.appendChild(caixa);
    }

    function formAreas(destino) {
      destino.textContent = '';
      destino.appendChild(el('h2', { text: 'Áreas' }));
      var caixa = el('div', [
        el('p', { text: 'Astrologia, Psicanálise... Cada entrada pode ficar numa área, e o total do mês mostra quanto veio de cada uma.' })]);
      var msg = el('p', { class: 'portal-msg' });
      function aviso(r) { if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return false; } return true; }
      areas.forEach(function (a) {
        var renomear = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Renomear' });
        var apagar = P.botaoApagar('Apagar');
        renomear.addEventListener('click', function () {
          var n = window.prompt('Novo nome da área:', a.nome);
          if (n == null || !n.trim()) return;
          C.from('fin_areas').update({ nome: n.trim() }).eq('id', a.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar a área "' + a.nome + '"? As entradas dela ficam sem área.')) return;
          C.from('fin_areas').delete().eq('id', a.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        caixa.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [el('span', { text: a.nome }), el('div', { class: 'portal-acoes' }, [renomear, apagar])])]));
      });
      var nome = el('input', { type: 'text', placeholder: 'Nome da área nova' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      var f = el('form', { style: 'margin-top:14px' }, [nome, msg, el('div', { class: 'portal-acoes' }, [add])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!nome.value.trim()) return;
        C.from('fin_areas').insert({ nome: nome.value.trim(), ordem: areas.length }).then(function (r) { if (aviso(r)) carregarFin(); });
      });
      caixa.appendChild(f);
      destino.appendChild(caixa);
    }


    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Foto da página Sobre' })]);
      var foto = el('img', { alt: 'Foto atual', src: 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' }); /* a foto do arquivo só entra se não houver outra */
      foto.style.cssText = 'display:block;width:180px;height:180px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:1px solid #1F5FA3';
      var msg = el('p', { class: 'portal-msg' });
      var acoes = el('div', { class: 'portal-acoes', style: 'justify-content:center' });
      var previaAtiva = false, atual = null; /* endereço da foto guardada no Supabase */
      C.from('site_config').select('valor').eq('chave', 'foto_sobre').maybeSingle().then(function (r) {
        if (r.data && r.data.valor) { atual = r.data.valor; foto.src = atual; } else if (!previaAtiva) foto.src = 'foto-perfil.jpg?v=3';
      });

      var escolher = el('input', { type: 'file', accept: 'image/*' }); escolher.style.display = 'none';
      var botEscolher = el('button', { type: 'button', class: 'portal-btn', text: 'Escolher uma foto nova' });
      botEscolher.addEventListener('click', function () { escolher.click(); });
      acoes.appendChild(botEscolher); acoes.appendChild(escolher);

      escolher.addEventListener('change', function () {
        var arq = escolher.files && escolher.files[0]; escolher.value = '';
        if (!arq) return;
        P.mensagem(msg, 'Preparando a foto...');
        prepararFoto(arq).then(function (blob) {
          /* mostra como vai ficar e só troca quando você confirmar */
          var previa = URL.createObjectURL(blob); previaAtiva = true; foto.src = previa;
          acoes.textContent = '';
          var usar = el('button', { type: 'button', class: 'portal-btn', text: 'Usar esta foto' });
          var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
          cancelar.addEventListener('click', function () { URL.revokeObjectURL(previa); tela(); });
          usar.addEventListener('click', function () {
            usar.disabled = cancelar.disabled = true; P.mensagem(msg, 'Enviando...');
            var caminho = 'foto-sobre-' + Date.now() + '.jpg';
            C.storage.from('site').upload(caminho, blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
              if (r.error) throw r.error;
              var url = C.storage.from('site').getPublicUrl(caminho).data.publicUrl;
              return C.from('site_config').upsert({ chave: 'foto_sobre', valor: url, atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r2) {
                if (r2.error) throw r2.error;
                var velha = caminhoDe(atual);
                if (velha) C.storage.from('site').remove([velha]);
                URL.revokeObjectURL(previa);
                tela(); P.mensagem(document.querySelector('.portal-msg'), 'Foto trocada! Já aparece na página Sobre.', 'ok');
              });
            }).catch(function (e) { usar.disabled = cancelar.disabled = false; P.mensagem(msg, P.traduzErro(e.message), 'erro'); });
          });
          acoes.appendChild(usar); acoes.appendChild(cancelar);
          P.mensagem(msg, 'É assim que vai ficar. Se gostou, toque em "Usar esta foto".');
        }).catch(function () { P.mensagem(msg, 'Não consegui ler essa imagem. Tente outra (JPEG ou PNG).', 'erro'); });
      });

      cartao.appendChild(foto); cartao.appendChild(msg); cartao.appendChild(acoes);
      cartao.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:14px', text: 'A foto é cortada em quadrado, pelo centro, e aparece redonda na página Sobre. Escolha uma em que o rosto fique no meio.' }));
      app.appendChild(cartao);
      /* o que antes ficava no Painel dos Alunos e em Clientes: pasta de cada um no Drive, conexão com o Google e avisos no celular */
      app.appendChild(P.cartaoPastaBase('alunos'));
      app.appendChild(P.cartaoPastaBase('clientes'));
      var conexaoDrive = P.cartaoConexaoDrive();
      if (conexaoDrive) app.appendChild(conexaoDrive);
      app.appendChild(P.avisos.cartao('admin')); /* avisos no celular quando um aluno enviar uma atividade */
      app.appendChild(cartaoLugar());
      app.appendChild(cartaoAgendas());
      app.appendChild(cartaoImportarClientes());
      app.appendChild(cartaoAreas); app.appendChild(cartaoServicos);
      carregarFin();
      /* no fim da lista: Trocar senha e, abaixo, o Sair (botão cheio, terracota) */
      var areaSenha = el('div', { style: 'width:100%' });
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () {
        if (areaSenha.firstChild) { areaSenha.textContent = ''; return; }
        P.montarNovaSenha(areaSenha, function () { areaSenha.textContent = ''; areaSenha.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha trocada.' })); }, 'Trocar senha');
        areaSenha.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      var saindo = el('button', { type: 'button', class: 'portal-btn', text: 'Sair' });
      saindo.addEventListener('click', sair);
      app.appendChild(el('div', { class: 'portal-cartao', style: 'display:flex;flex-direction:column;align-items:center;gap:14px' }, [trocar, areaSenha, saindo]));
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
</html>
