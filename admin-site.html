<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">

  <title>Site - Falando de Astrologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Configurações</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="carrinho.js?v=6"></script>
  <script src="portal.js?v=63"></script>
  <script src="menu.js?v=31" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var TAMANHO = 720; /* lado da foto em pixels (quadrada); na página ela aparece com 180 px, então dá de sobra até em tela retina */

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('site', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          tela();
        });
      });
    }

    /* corta a foto num quadrado (pelo centro) e reduz: o arquivo fica leve e sempre do mesmo formato */
    function prepararFoto(arquivo) {
      return new Promise(function (ok, erro) {
        var url = URL.createObjectURL(arquivo), img = new Image();
        img.onload = function () {
          var lado = Math.min(img.naturalWidth, img.naturalHeight);
          var c = document.createElement('canvas'); c.width = c.height = TAMANHO;
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, TAMANHO, TAMANHO);
          g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, TAMANHO, TAMANHO);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) { blob ? ok(blob) : erro(new Error('foto')); }, 'image/jpeg', 0.9);
        };
        img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('foto')); };
        img.src = url;
      });
    }
    var caminhoDe = function (url) { var i = String(url || '').indexOf('/object/public/site/'); return i >= 0 ? decodeURIComponent(String(url).slice(i + '/object/public/site/'.length).split('?')[0]) : null; };


    /* áreas e serviços do Financeiro (o cadastro mora aqui; o Financeiro só lança entradas e usa estas listas) */
    var areas = [], servicosCad = [], cartaoAreas = el('div', { class: 'portal-cartao' }), cartaoServicos = el('div', { class: 'portal-cartao' });
    function moeda(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function lerValor(txt) {
      var s = String(txt || '').replace(/[R$\s]/g, '');
      if (!s) return null;
      if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
    }
    function todosServicos() {
      var lista = servicosCad.map(function (x) { return { nome: x.nome, valor: x.valor, area_id: x.area_id }; });
      var tem = {}; lista.forEach(function (x) { tem[x.nome.toLowerCase()] = true; });
      var site = window.Carrinho.servicos;
      /* serviço do site que ainda não está na sua lista entra na área Astrologia */
      var astro = areas.filter(function (a) { return /astrolog/i.test(a.nome); })[0];
      Object.keys(site).filter(function (k) { return !/teste/i.test(k); }).forEach(function (k) {
        if (!tem[site[k].titulo.toLowerCase()]) lista.push({ nome: site[k].titulo, valor: site[k].centavos / 100, area_id: astro ? astro.id : null });
      });
      return lista;
    }
    function carregarFin() {
      return Promise.all([C.from('fin_areas').select('*').order('ordem').order('nome'), C.from('fin_servicos').select('*').order('nome')]).then(function (r) {
        areas = (r[0] && !r[0].error && r[0].data) || []; servicosCad = (r[1] && !r[1].error && r[1].data) || [];
        formAreas(cartaoAreas); formServicos(cartaoServicos);
      });
    }

    /* cadastro de serviços: nome, valor e área. Ao lançar uma entrada, escolher o serviço já preenche o valor e a área */
    function formServicos(destino) {
      destino.textContent = '';
      destino.appendChild(el('h2', { text: 'Serviços' }));
      var porArea = {}; areas.forEach(function (a) { porArea[a.id] = a; });
      var caixa = el('div', [
        el('p', { text: 'Cadastre cada serviço com o valor e a área. Na hora de lançar uma entrada, ao escolher o serviço, o valor e a área já vêm preenchidos.' })]);
      var msg = el('p', { class: 'portal-msg' });
      function aviso(r) { if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return false; } return true; }
      var editando = null;
      servicosCad.forEach(function (x) {
        var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
        var apagar = P.botaoApagar('Apagar');
        editar.addEventListener('click', function () { editando = x; nome.value = x.nome; valor.value = String(x.valor).replace('.', ','); area.value = x.area_id || ''; add.textContent = 'Salvar'; nome.focus(); });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar o serviço "' + x.nome + '"? As entradas já lançadas não mudam.')) return;
          C.from('fin_servicos').delete().eq('id', x.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        caixa.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
          el('div', {}, [el('span', { class: 'portal-item-titulo', text: x.nome }),
            el('span', { class: 'portal-item-data', text: moeda(x.valor) + (x.area_id && porArea[x.area_id] ? ' · ' + porArea[x.area_id].nome : '') })]),
          el('div', { class: 'portal-acoes' }, [editar, apagar])])]));
      });
      if (!servicosCad.length) caixa.appendChild(el('p', { text: 'Nenhum serviço cadastrado ainda.' }));
      var nome = el('input', { type: 'text', placeholder: 'Nome do serviço' });
      var valor = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Valor (0,00)' });
      var area = el('select');
      area.appendChild(el('option', { value: '', text: 'Sem área' }));
      areas.forEach(function (a) { area.appendChild(el('option', { value: a.id, text: a.nome })); });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      /* traz de uma vez os serviços do site (os que ainda não estão cadastrados), na área Astrologia */
      var trazer = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trazer os serviços do site' });
      trazer.addEventListener('click', function () {
        var astro = areas.filter(function (a) { return /astrolog/i.test(a.nome); })[0];
        var site = todosServicos().filter(function (x) { return !servicosCad.some(function (c) { return c.nome.toLowerCase() === x.nome.toLowerCase(); }); });
        if (!site.length) { P.mensagem(msg, 'Os serviços do site já estão na sua lista.', 'ok'); return; }
        C.from('fin_servicos').insert(site.map(function (x) { return { nome: x.nome, valor: x.valor, area_id: astro ? astro.id : null }; })).then(function (r) { if (aviso(r)) carregarFin(); });
      });
      var f = el('form', { style: 'margin-top:14px' }, [el('label', { text: 'Nome' }), nome, el('label', { text: 'Valor (R$)' }), valor, el('label', { text: 'Área' }), area,
        msg, el('div', { class: 'portal-acoes' }, [add, trazer])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var v = lerValor(valor.value);
        if (!nome.value.trim()) { P.mensagem(msg, 'Escreva o nome do serviço.', 'erro'); return; }
        if (v == null) { P.mensagem(msg, 'Digite o valor (por exemplo 135,00).', 'erro'); return; }
        var reg = { nome: nome.value.trim(), valor: v, area_id: area.value || null };
        var req = editando ? C.from('fin_servicos').update(reg).eq('id', editando.id) : C.from('fin_servicos').insert(reg);
        req.then(function (r) { if (aviso(r)) carregarFin(); });
      });
      caixa.appendChild(f);
      destino.appendChild(caixa);
    }

    function formAreas(destino) {
      destino.textContent = '';
      destino.appendChild(el('h2', { text: 'Áreas' }));
      var caixa = el('div', [
        el('p', { text: 'Astrologia, Psicanálise... Cada entrada pode ficar numa área, e o total do mês mostra quanto veio de cada uma.' })]);
      var msg = el('p', { class: 'portal-msg' });
      function aviso(r) { if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return false; } return true; }
      areas.forEach(function (a) {
        var renomear = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Renomear' });
        var apagar = P.botaoApagar('Apagar');
        renomear.addEventListener('click', function () {
          var n = window.prompt('Novo nome da área:', a.nome);
          if (n == null || !n.trim()) return;
          C.from('fin_areas').update({ nome: n.trim() }).eq('id', a.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar a área "' + a.nome + '"? As entradas dela ficam sem área.')) return;
          C.from('fin_areas').delete().eq('id', a.id).then(function (r) { if (aviso(r)) carregarFin(); });
        });
        caixa.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [el('span', { text: a.nome }), el('div', { class: 'portal-acoes' }, [renomear, apagar])])]));
      });
      var nome = el('input', { type: 'text', placeholder: 'Nome da área nova' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      var f = el('form', { style: 'margin-top:14px' }, [nome, msg, el('div', { class: 'portal-acoes' }, [add])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!nome.value.trim()) return;
        C.from('fin_areas').insert({ nome: nome.value.trim(), ordem: areas.length }).then(function (r) { if (aviso(r)) carregarFin(); });
      });
      caixa.appendChild(f);
      destino.appendChild(caixa);
    }


    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Foto da página Sobre' })]);
      var foto = el('img', { alt: 'Foto atual', src: 'foto-perfil.jpg?v=3' });
      foto.style.cssText = 'display:block;width:180px;height:180px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:1px solid #1F5FA3';
      var msg = el('p', { class: 'portal-msg' });
      var acoes = el('div', { class: 'portal-acoes', style: 'justify-content:center' });
      var atual = null; /* endereço da foto guardada no Supabase */
      C.from('site_config').select('valor').eq('chave', 'foto_sobre').maybeSingle().then(function (r) {
        if (r.data && r.data.valor) { atual = r.data.valor; foto.src = atual; }
      });

      var escolher = el('input', { type: 'file', accept: 'image/*' }); escolher.style.display = 'none';
      var botEscolher = el('button', { type: 'button', class: 'portal-btn', text: 'Escolher uma foto nova' });
      botEscolher.addEventListener('click', function () { escolher.click(); });
      acoes.appendChild(botEscolher); acoes.appendChild(escolher);

      escolher.addEventListener('change', function () {
        var arq = escolher.files && escolher.files[0]; escolher.value = '';
        if (!arq) return;
        P.mensagem(msg, 'Preparando a foto...');
        prepararFoto(arq).then(function (blob) {
          /* mostra como vai ficar e só troca quando você confirmar */
          var previa = URL.createObjectURL(blob); foto.src = previa;
          acoes.textContent = '';
          var usar = el('button', { type: 'button', class: 'portal-btn', text: 'Usar esta foto' });
          var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
          cancelar.addEventListener('click', function () { URL.revokeObjectURL(previa); tela(); });
          usar.addEventListener('click', function () {
            usar.disabled = cancelar.disabled = true; P.mensagem(msg, 'Enviando...');
            var caminho = 'foto-sobre-' + Date.now() + '.jpg';
            C.storage.from('site').upload(caminho, blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
              if (r.error) throw r.error;
              var url = C.storage.from('site').getPublicUrl(caminho).data.publicUrl;
              return C.from('site_config').upsert({ chave: 'foto_sobre', valor: url, atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r2) {
                if (r2.error) throw r2.error;
                var velha = caminhoDe(atual);
                if (velha) C.storage.from('site').remove([velha]);
                URL.revokeObjectURL(previa);
                tela(); P.mensagem(document.querySelector('.portal-msg'), 'Foto trocada! Já aparece na página Sobre.', 'ok');
              });
            }).catch(function (e) { usar.disabled = cancelar.disabled = false; P.mensagem(msg, P.traduzErro(e.message), 'erro'); });
          });
          acoes.appendChild(usar); acoes.appendChild(cancelar);
          P.mensagem(msg, 'É assim que vai ficar. Se gostou, toque em "Usar esta foto".');
        }).catch(function () { P.mensagem(msg, 'Não consegui ler essa imagem. Tente outra (JPEG ou PNG).', 'erro'); });
      });

      cartao.appendChild(foto); cartao.appendChild(msg); cartao.appendChild(acoes);
      cartao.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:14px', text: 'A foto é cortada em quadrado, pelo centro, e aparece redonda na página Sobre. Escolha uma em que o rosto fique no meio.' }));
      app.appendChild(cartao);
      /* o que antes ficava no Painel dos Alunos e em Clientes: pasta de cada um no Drive, conexão com o Google e avisos no celular */
      app.appendChild(P.cartaoPastaBase('alunos'));
      app.appendChild(P.cartaoPastaBase('clientes'));
      var conexaoDrive = P.cartaoConexaoDrive();
      if (conexaoDrive) app.appendChild(conexaoDrive);
      app.appendChild(P.avisos.cartao('admin')); /* avisos no celular quando um aluno enviar uma atividade */
      app.appendChild(cartaoAreas); app.appendChild(cartaoServicos);
      carregarFin();
      /* no fim da lista: Trocar senha e, abaixo, o Sair (botão cheio, terracota) */
      var areaSenha = el('div', { style: 'width:100%' });
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () {
        if (areaSenha.firstChild) { areaSenha.textContent = ''; return; }
        P.montarNovaSenha(areaSenha, function () { areaSenha.textContent = ''; areaSenha.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha trocada.' })); }, 'Trocar senha');
        areaSenha.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      var saindo = el('button', { type: 'button', class: 'portal-btn', text: 'Sair' });
      saindo.addEventListener('click', sair);
      app.appendChild(el('div', { class: 'portal-cartao', style: 'display:flex;flex-direction:column;align-items:center;gap:14px' }, [trocar, areaSenha, saindo]));
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
