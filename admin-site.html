      html.fda-caderno,html.fda-caderno body{height:100%;overflow:hidden}

    @media (max-width:899px){

      .cfg-nav::-webkit-scrollbar{display:none}
      .cfg-aba{width:auto;flex:0 0 auto;white-space:nowrap;padding:6px 0;border-left:0;border-bottom:3px solid transparent}
      .cfg-aba.ativa{border-bottom-color:var(--ocre,#B5852F)}
    }

  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var TAMANHO = 720; /* lado da foto em pixels (quadrada); na página ela aparece com 180 px, então dá de sobra até em tela retina */

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('site', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          tela();
        });
      });
    }

    /* corta a foto num quadrado (pelo centro) e reduz: o arquivo fica leve e sempre do mesmo formato */
    function prepararFoto(arquivo) {
      return new Promise(function (ok, erro) {
        var url = URL.createObjectURL(arquivo), img = new Image();
        img.onload = function () {
          var lado = Math.min(img.naturalWidth, img.naturalHeight);
          var c = document.createElement('canvas'); c.width = c.height = TAMANHO;
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, TAMANHO, TAMANHO);
          g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, TAMANHO, TAMANHO);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) { blob ? ok(blob) : erro(new Error('foto')); }, 'image/jpeg', 0.9);
        };
        img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('foto')); };
        img.src = url;
      });
    }
    var caminhoDe = function (url) { var i = String(url || '').indexOf('/object/public/site/'); return i >= 0 ? decodeURIComponent(String(url).slice(i + '/object/public/site/'.length).split('?')[0]) : null; };


    /* lugar usado nas horas planetárias da Produção e da Agenda (guardado em site_config.prod_local_horas, vale em qualquer aparelho) */
    var LOCAIS = [
      ['Jacareí', -23.3053, -45.9658, -3], ['São Paulo', -23.5505, -46.6333, -3], ['Guarulhos', -23.4543, -46.5333, -3], ['São José dos Campos', -23.1896, -45.8841, -3],
      ['Campinas', -22.9099, -47.0626, -3], ['Santos', -23.9608, -46.3336, -3], ['Rio de Janeiro', -22.9068, -43.1729, -3], ['Belo Horizonte', -19.9167, -43.9345, -3],
      ['Brasília', -15.7939, -47.8828, -3], ['Curitiba', -25.4284, -49.2733, -3], ['Porto Alegre', -30.0346, -51.2177, -3], ['Florianópolis', -27.5954, -48.548, -3],
      ['Vitória', -20.3155, -40.3128, -3], ['Goiânia', -16.6869, -49.2648, -3], ['Salvador', -12.9777, -38.5016, -3], ['Recife', -8.0476, -34.877, -3],
      ['Fortaleza', -3.7319, -38.5267, -3], ['Natal', -5.7945, -35.211, -3], ['Belém', -1.4558, -48.4902, -3], ['Manaus', -3.119, -60.0217, -4],
      ['Cuiabá', -15.6014, -56.0979, -4], ['Campo Grande', -20.4697, -54.6201, -4], ['Porto Velho', -8.7612, -63.9004, -4]
    ];
    /* texto que vem em todo vídeo, em cima da linha e dos Capítulos (a Produção lê daqui; sem nada salvo vale o texto de sempre) */
    var TEXTO_FIXO_PADRAO = '✨ Atendimentos e Consultas Astrológicas\nEstude comigo ou agende Mapa Natal Clássico, Revolução Solar, Previsões Astrológicas em https://falandodeastrologia.com.br\n\n💎 Apoie o Canal\n• Contribuição via Pix: cassiofalandodeastrologia@gmail.com\n• Torne-se Membro do Canal: confira os níveis e benefícios 👉 https://youtu.be/pNtRwLHb1us?is=r-XY9_GwyXppsACF\n';
    /* Tema do app (por aparelho; cada app com o seu): Papiro, Claro, Escuro, Sulfite */
    function cartaoTema(app) {
      var NOMES = { papiro: 'Papiro', claro: 'Claro', escuro: 'Escuro', sulfite: 'Sulfite', automatico: 'Autom\u00e1tico' };
      var cartao = el('div', { class: 'portal-cartao' }), linha = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px' });
      cartao.appendChild(el('h2', { text: 'Tema' }));
      function desenhar() {
        linha.textContent = '';
        var atual = window.FdaTema.ler(app);
        window.FdaTema.TEMAS.forEach(function (t) {
          var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: (t === atual ? '\u2713 ' : '') + NOMES[t] });
          if (t === atual) b.style.setProperty('color', 'var(--terracota)', 'important');
          b.setAttribute('aria-pressed', t === atual ? 'true' : 'false');
          b.addEventListener('click', function () { window.FdaTema.gravar(app, t); desenhar(); });
          linha.appendChild(b);
        });
      }
      desenhar(); cartao.appendChild(linha);
      return cartao;
    }

    function cartaoVisaoAgenda() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Visualização da agenda' })]), linha = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px' });
      var OPCOES = [['caderno', 'Visualização de agenda'], ['padrao', 'Visualização padrão']], atual = 'caderno', msg = el('p', { class: 'portal-msg' });
      function desenhar() {
        linha.textContent = '';
        OPCOES.forEach(function (o) {
          var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: (o[0] === atual ? '\u2713 ' : '') + o[1] });
          if (o[0] === atual) b.style.setProperty('color', 'var(--terracota)', 'important');
          b.addEventListener('click', function () {
            atual = o[0]; desenhar(); P.guardarModoDaily(atual);
            C.from('site_config').upsert({ chave: 'daily_visual', valor: JSON.stringify(atual), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) { if (r.error) P.mensagem(msg, 'Não salvou.', 'erro'); else P.mensagem(msg, ''); });
          });
          linha.appendChild(b);
        });
      }
      desenhar(); cartao.appendChild(linha); cartao.appendChild(msg);
      C.from('site_config').select('valor').eq('chave', 'daily_visual').maybeSingle().then(function (r) { try { var v = r.data && r.data.valor ? JSON.parse(r.data.valor) : null; if (v === 'padrao' || v === 'caderno') { atual = v; desenhar(); P.guardarModoDaily(v); } } catch (e) { /* padrão */ } });
      return cartao;
    }

    function cartaoCapa() {
      var CAPAS = [['A03E25', 'Terracota'], ['B5852F', 'Ocre'], ['1F5FA3', 'Azul egípcio claro'], ['16233F', 'Azul-noite'], ['6B4A2B', 'Marrom'], ['4A7C59', 'Verde'], ['1A1410', 'Preto de tinta'], ['papiro', 'Papiro']];
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Cor da capa' })]), linha = el('div', { style: 'display:flex;flex-wrap:wrap;gap:12px;margin:8px 0' }), atual = 'A03E25';
      function desenhar() {
        linha.textContent = '';
        CAPAS.forEach(function (x) {
          var b = el('button', { type: 'button', title: x[1], 'aria-label': x[1] });
          b.style.cssText = 'width:40px;height:40px;border-radius:50%;padding:0;border:3px solid ' + 'transparent;background:' + (x[0] === 'papiro' ? 'var(--papiro-fundo-simples);outline:2px solid #1034A6;outline-offset:-5px' : '#' + x[0]);
          if (x[0] === atual) { var n = x[0] === 'papiro' ? 255 * 65793 : parseInt(x[0], 16), lum = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255); b.style.boxShadow = 'inset 0 0 0 4px ' + (lum > 140 ? '#1A1410' : '#FFFDF5'); } /* o anel de marcação é claro sobre cor escura e escuro sobre cor clara */
          b.addEventListener('click', function () {
            atual = x[0]; desenhar();
            try { localStorage.setItem('fda_caderno_capa', atual); } catch (e) { /* o caderno aberto na outra janela troca a capa na hora */ }
            try { if (window.parent !== window && window.parent.fdaPintarCapa) window.parent.fdaPintarCapa(atual); } catch (e) { /* fora do caderno */ }
          });
          linha.appendChild(b);
        });
      }
      desenhar(); cartao.appendChild(linha);
      try { var guardada = localStorage.getItem('fda_caderno_capa'); if (guardada && CAPAS.some(function (x) { return x[0] === guardada; })) { atual = guardada; desenhar(); } } catch (e) { /* padrão */ } /* a cor da capa é do APARELHO, não da conta */
      return cartao;
    }
    /* Personalização: tudo o que é aparência num cartão só (tema, visualização da agenda, cor da capa) */
    function cartaoPersonalizacao() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Personalização' })]);
      [['tema', cartaoTema('daily')], ['visualização da agenda', cartaoVisaoAgenda()], ['cor da capa', cartaoCapa()]].forEach(function (x, i) {
        cartao.appendChild(el('div', { class: 'rotulo-fixo', style: 'margin:' + (i ? '18px' : '6px') + ' 0 2px', text: x[0] }));
        [].slice.call(x[1].children, 1).forEach(function (f) { cartao.appendChild(f); });
      });
      return cartao;
    }

    /* de qual planeta é a hora que aparece na Produção (vídeos e cortes) e nos lembretes dela; padrão Júpiter. Guardado em site_config.prod_planeta_horas */
    function cartaoPlanetaProducao() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Hora planetária da Produção' })]), linha = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px' }), msg = el('p', { class: 'portal-msg' });
      function desenhar() {
        linha.textContent = '';
        P.PLANETAS_HORAS.forEach(function (x) {
          var on = x[0] === P.planetaHoras.en, b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: (on ? '\u2713 ' : '') + x[1] });
          if (on) b.style.setProperty('color', 'var(--terracota)', 'important');
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
          b.addEventListener('click', function () {
            P.definirPlanetaHoras(x[0]); desenhar();
            C.from('site_config').upsert({ chave: 'prod_planeta_horas', valor: JSON.stringify(x[0]), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) { if (r.error) P.mensagem(msg, 'Não salvou: ' + P.traduzErro(r.error.message), 'erro'); else P.mensagem(msg, ''); });
          });
          linha.appendChild(b);
        });
      }
      desenhar(); cartao.appendChild(linha); cartao.appendChild(msg);
      P.carregarPlanetaHoras().then(desenhar);
      return cartao;
    }

    function cartaoTextoFixo() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Texto fixo dos vídeos' })]);
      var area = el('textarea', { rows: '10' }), msg = el('p', { class: 'portal-msg' }), salvo = false, t = null;
      area.value = TEXTO_FIXO_PADRAO;
      C.from('site_config').select('valor').eq('chave', 'prod_texto_fixo').maybeSingle().then(function (r) { if (r.data && typeof r.data.valor === 'string') area.value = r.data.valor; });
      area.addEventListener('input', function () {
        P.mensagem(msg, 'Digitando...'); clearTimeout(t);
        t = setTimeout(function () {
          C.from('site_config').upsert({ chave: 'prod_texto_fixo', valor: area.value, atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) { P.mensagem(msg, r.error ? 'Não salvou.' : 'Salvo.', r.error ? 'erro' : 'ok'); });
        }, 1200);
      });
      cartao.appendChild(area); cartao.appendChild(msg);
      return cartao;
    }
    function cartaoLugar() {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Lugar das horas planetárias' })]);
      var corpo = el('div'); cartao.appendChild(corpo);
      var atual = { nome: 'Jacareí', lat: -23.3053, lon: -45.9658, fuso: -3 };
      var campo = function (r, c) { return [el('label', { text: r }), c]; };
      function desenhar() {
        corpo.textContent = '';
        var lista = el('select');
        LOCAIS.forEach(function (l, i) { var o = el('option', { value: String(i), text: l[0] }); if (l[0] === atual.nome) o.selected = true; lista.appendChild(o); });
        var outro = el('option', { value: 'outro', text: 'Outro lugar (digitar)' }); if (!LOCAIS.some(function (l) { return l[0] === atual.nome; })) outro.selected = true; lista.appendChild(outro);
        var nomeC = el('input', { type: 'text', placeholder: 'Nome do lugar', value: atual.nome });
        var latC = el('input', { type: 'number', step: 'any', placeholder: 'Latitude (sul é negativo)', value: atual.lat });
        var lonC = el('input', { type: 'number', step: 'any', placeholder: 'Longitude (oeste é negativo)', value: atual.lon });
        var fusoC = el('input', { type: 'number', step: 'any', placeholder: 'Fuso (Brasília é -3)', value: atual.fuso });
        var manual = el('div', { style: 'display:none' }, [].concat(campo('Nome', nomeC), campo('Latitude', latC), campo('Longitude', lonC), campo('Fuso (horas em relação a Greenwich)', fusoC)));
        var mostrar = function () { manual.style.display = lista.value === 'outro' ? 'block' : 'none'; };
        lista.addEventListener('change', mostrar); mostrar();
        var msg = el('p', { class: 'portal-msg' });
        var aqui = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Usar a localização deste aparelho agora' });
        aqui.addEventListener('click', function () {
          if (!navigator.geolocation) { P.mensagem(msg, 'Este aparelho não informa a localização.', 'erro'); return; }
          P.mensagem(msg, 'Pedindo a localização...');
          navigator.geolocation.getCurrentPosition(function (pos) {
            lista.value = 'outro'; mostrar();
            nomeC.value = 'localização do aparelho'; latC.value = pos.coords.latitude.toFixed(4); lonC.value = pos.coords.longitude.toFixed(4); fusoC.value = String(-new Date().getTimezoneOffset() / 60);
            salvar.click();
          }, function () { P.mensagem(msg, 'Não consegui a localização. Escolha na lista ou digite.', 'erro'); }, { timeout: 10000 });
        });
        var salvar = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar o lugar' });
        salvar.addEventListener('click', function () {
          var novo;
          if (lista.value === 'outro') {
            novo = { nome: nomeC.value.trim() || 'outro lugar', lat: parseFloat(latC.value), lon: parseFloat(lonC.value), fuso: parseFloat(fusoC.value) };
            if (!isFinite(novo.lat) || !isFinite(novo.lon) || !isFinite(novo.fuso) || Math.abs(novo.lat) > 66 || Math.abs(novo.lon) > 180 || Math.abs(novo.fuso) > 14) { P.mensagem(msg, 'Confira a latitude, a longitude e o fuso. Perto dos polos o sol pode não nascer e a conta não funciona.', 'erro'); return; }
          } else { var l = LOCAIS[+lista.value]; novo = { nome: l[0], lat: l[1], lon: l[2], fuso: l[3] }; }
          C.from('site_config').upsert({ chave: 'prod_local_horas', valor: JSON.stringify(novo), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) {
            if (r.error) { P.mensagem(msg, 'Não consegui salvar (' + r.error.message + ')', 'erro'); return; }
            atual = novo; desenhar(); P.mensagem(msg, 'Lugar salvo.', 'ok');
          });
        });
        [].concat(campo('Lugar', lista)).forEach(function (n) { corpo.appendChild(n); });
        corpo.appendChild(manual);
        corpo.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:12px' }, [salvar, aqui])); corpo.appendChild(msg); P.salvarSozinho(salvar);
      }
      desenhar();
      C.from('site_config').select('valor').eq('chave', 'prod_local_horas').maybeSingle().then(function (r) {
        try { var v = r.data && r.data.valor ? JSON.parse(r.data.valor) : null; if (v && isFinite(v.lat) && isFinite(v.lon) && isFinite(v.fuso)) { atual = { nome: String(v.nome || 'outro lugar'), lat: +v.lat, lon: +v.lon, fuso: +v.fuso }; desenhar(); } } catch (e) { /* fica em Jacareí */ }
      });
      return cartao;
    }

    /* quais agendas do Google aparecem na aba Agenda (guardado em site_config.agenda_ocultas = as que ele DESMARCOU; agenda nova aparece sozinha) */

    /* clientes do Astro Hellenic: arquivo CSV (codigo, nome, email, whatsapp, nascimento). Cria o cadastro de quem ainda não existe aqui (mesmo sem e-mail)

    function cartaoImportarClientes() {

      var botao = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Importar arquivo' });
      botao.addEventListener('click', function () { arq.click(); });
      var iso = function (t) { var x = String(t || '').replace(/\s+/g, ''), m = x.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) || x.match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; return x.indexOf('/') > 0 ? m[3] + '-' + m[2] + '-' + m[1] : m[1] + '-' + m[2] + '-' + m[3]; };
      var campos = function (l) { var r = [], c = '', q = false; for (var i = 0; i < l.length; i++) { var ch = l[i]; if (ch === '"') q = !q; else if ((ch === ',' || ch === ';') && !q) { r.push(c); c = ''; } else c += ch; } r.push(c); return r.map(function (x) { x = x.trim(); return /^null$/i.test(x) ? '' : x; }); };

          var linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter(function (l) { return l.trim(); }), cab = campos(linhas[0] || '').map(function (x) { return x.toLowerCase(); });
          var col = function (re) { return cab.findIndex(function (x) { return re.test(x); }); };
          var ic = col(/c[oó]d/), inome = col(/nome/), ie = col(/e-?mail/), iw = col(/whats|fone|tel/), inn = col(/nasc/);
          if (inome < 0) throw new Error('o arquivo precisa da coluna nome');
          var pessoas = linhas.slice(1).map(function (l) {
            var c = campos(l), em = (ie >= 0 ? c[ie] : '').toLowerCase();
            return { codigo: ic >= 0 ? c[ic].replace(/\s+[AB]$/i, '').trim() : '', nome: c[inome] || '', email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em) ? em : '', whatsapp: iw >= 0 ? c[iw] : '', nascimento: inn >= 0 ? iso(c[inn]) : '' };

            (rs[2].data || []).forEach(function (x) { if (x.email) alunosPorEmail[x.email.toLowerCase()] = x; });

        var arq = escolher.files && escolher.files[0]; escolher.value = '';
        if (!arq) return;
        P.mensagem(msg, 'Preparando a foto...');
        prepararFoto(arq).then(function (blob) {
          /* mostra como vai ficar e só troca quando você confirmar */
          var previa = URL.createObjectURL(blob); previaAtiva = true; foto.src = previa;
          acoes.textContent = '';
          var usar = el('button', { type: 'button', class: 'portal-btn', text: 'Usar esta foto' });
          var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
          cancelar.addEventListener('click', function () { URL.revokeObjectURL(previa); tela(); });
          usar.addEventListener('click', function () {
            usar.disabled = cancelar.disabled = true; P.mensagem(msg, 'Enviando...');
            var caminho = 'foto-sobre-' + Date.now() + '.jpg';
            C.storage.from('site').upload(caminho, blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
              if (r.error) throw r.error;
              var url = C.storage.from('site').getPublicUrl(caminho).data.publicUrl;
              return C.from('site_config').upsert({ chave: 'foto_sobre', valor: url, atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r2) {
                if (r2.error) throw r2.error;
                var velha = caminhoDe(atual);
                if (velha) C.storage.from('site').remove([velha]);
                URL.revokeObjectURL(previa);
                tela(); P.mensagem(document.querySelector('.portal-msg'), 'Foto trocada! Já aparece na página Sobre.', 'ok');
              });
            }).catch(function (e) { usar.disabled = cancelar.disabled = false; P.mensagem(msg, P.traduzErro(e.message), 'erro'); });
          });
          acoes.appendChild(usar); acoes.appendChild(cancelar);
          P.mensagem(msg, 'É assim que vai ficar. Se gostou, toque em "Usar esta foto".');
        }).catch(function () { P.mensagem(msg, 'Não consegui ler essa imagem. Tente outra (JPEG ou PNG).', 'erro'); });
      });

      cartao.appendChild(foto); cartao.appendChild(msg); cartao.appendChild(acoes);
      cartao.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:14px', text: 'A foto é cortada em quadrado, pelo centro, e aparece redonda na página Sobre. Escolha uma em que o rosto fique no meio.' }));
      /* dois apps: cada um mostra só as configurações dele (sem abas). Avisos no celular existem nos dois: cada app instalado cadastra o próprio aparelho. */
      var daily = P.appDaPagina() === 'daily', pagina = el('div');
      if (!daily) {
        /* Falando de Astrologia: foto do Sobre, pasta dos alunos e clientes, avisos, importar clientes */
        pagina.appendChild(cartaoTema('falando'));
        pagina.appendChild(cartao);
        pagina.appendChild(P.cartaoPastaBase('alunos'));
        pagina.appendChild(P.cartaoPastaBase('clientes'));
        pagina.appendChild(P.avisos.cartao('admin')); /* avisos no celular quando um aluno enviar uma atividade */
        pagina.appendChild(cartaoImportarClientes());
      } else {
        /* Hellenic Daily: abas à esquerda, a tela da aba aberta à direita. Aba nova = uma entrada em ABAS; configuração nova = um cartão dentro de uma aba. */
        var conexaoDrive = P.cartaoConexaoDrive(), areaSenha = el('div', { style: 'width:100%' });
        var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
        trocar.addEventListener('click', function () {
          if (areaSenha.firstChild) { areaSenha.textContent = ''; return; }
          P.montarNovaSenha(areaSenha, function () { areaSenha.textContent = ''; areaSenha.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha trocada.' })); }, 'Trocar senha');
        });
        var saindo = el('button', { type: 'button', class: 'portal-btn', text: 'Sair' });
        saindo.addEventListener('click', sair);
        var ABAS = [
          ['personalizacao', 'Personalização', [cartaoPersonalizacao()]],
          ['agenda', 'Agenda', [cartaoAgendas()]],
          ['horas', 'Horas', [cartaoLugar()]],
          ['producao', 'Produção', [cartaoPlanetaProducao(), cartaoTextoFixo()]],
          ['financeiro', 'Financeiro', [cartaoAreas, cartaoServicos]],
          ['conta', 'Conta', [conexaoDrive, window.hellenicPonte.cartao(), P.avisos.cartao('admin'), el('div', { class: 'portal-cartao', style: 'display:flex;flex-direction:column;align-items:center;gap:14px' }, [trocar, areaSenha, saindo])]]
        ];
        var nav = el('div', { class: 'cfg-nav' }), telaAba = el('div', { class: 'cfg-tela' }), aberta = '';
        try { aberta = (location.hash.match(/aba=([a-z]+)/) || [])[1] || sessionStorage.getItem('fda_cfg_aba') || localStorage.getItem('fda_cfg_aba') || ''; } catch (e) { /* abre na primeira */ }
        if (!ABAS.some(function (x) { return x[0] === aberta; })) aberta = ABAS[0][0];
        function abrirAba(id) {
          aberta = id;
          try { sessionStorage.setItem('fda_cfg_aba', id); localStorage.setItem('fda_cfg_aba', id); history.replaceState(null, '', location.pathname + location.search + '#aba=' + id); } catch (e) { /* só não lembra */ }
          ABAS.forEach(function (x) {
            x[3].classList.toggle('ativa', x[0] === id); x[3].setAttribute('aria-pressed', x[0] === id ? 'true' : 'false');
            var primeiro = true;
            if (x[0] === id) requestAnimationFrame(function () { if (nav.scrollWidth > nav.clientWidth) nav.scrollLeft += x[3].getBoundingClientRect().left - nav.getBoundingClientRect().left - 20; }); /* no celular a aba aberta fica à vista na fileira */
            x[2].forEach(function (c) { if (!c) return; c.hidden = x[0] !== id; c.classList.toggle('cfg-primeiro', x[0] === id && primeiro); if (x[0] === id) primeiro = false; });
          });
        }
        ABAS.forEach(function (x) {
          x[3] = el('button', { type: 'button', class: 'cfg-aba botao-fixo', text: x[1] });
          x[3].addEventListener('click', function () { abrirAba(x[0]); x[3].blur(); });
          nav.appendChild(x[3]);
          x[2].forEach(function (c) { if (c) telaAba.appendChild(c); });
        });
        pagina.className = 'cfg-layout'; pagina.appendChild(nav); pagina.appendChild(telaAba);
        abrirAba(aberta);
      }
      app.appendChild(pagina);
      carregarFin();
      if (daily) return;
      /* no fim da lista: Trocar senha e, abaixo, o Sair (botão cheio, terracota) */
      var areaSenha = el('div', { style: 'width:100%' });
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () {
        if (areaSenha.firstChild) { areaSenha.textContent = ''; return; }
        P.montarNovaSenha(areaSenha, function () { areaSenha.textContent = ''; areaSenha.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha trocada.' })); }, 'Trocar senha');
        areaSenha.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      var saindo = el('button', { type: 'button', class: 'portal-btn', text: 'Sair' });
      saindo.addEventListener('click', sair);
      app.appendChild(el('div', { class: 'portal-cartao', style: 'display:flex;flex-direction:column;align-items:center;gap:14px' }, [trocar, areaSenha, saindo]));
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
</html>
