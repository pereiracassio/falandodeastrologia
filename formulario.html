<script>
(function () {
  /* O formulário do Astro Hellenic, embutido aqui. Os dados caem no Astro Hellenic como sempre. Todo parâmetro do endereço (u, servico, nome, email...) passa adiante;
     sem u/servico valem os do Acompanhamento. A página de dentro avisa a altura por postMessage. */
  var q = new URLSearchParams(location.search);
  if (!q.get('u')) q.set('u', '87101e7e-657c-4ca6-ab73-495e00af149f');
  if (!q.get('servico')) q.set('servico', 'Acompanhamento Prático de Astrologia');
  var quadro = document.getElementById('quadro');
  window.addEventListener('message', function (ev) {
    if (ev.source !== quadro.contentWindow || !ev.data || ev.data.tipo !== 'astrohellenic-altura') return;
    var h = Number(ev.data.altura);
    if (h > 100 && h < 8000) quadro.style.height = h + 'px';
  });
  quadro.src = 'https://astrohellenic.com/formulario.html?' + q.toString();
})();
</script>
