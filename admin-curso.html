    .proj-passo{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--azul-egipcio-claro,#1F5FA3)}
    .proj-passo:last-child{border-bottom:0}
    .proj-passo input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--azul-egipcio-claro,#1F5FA3);background:transparent;border-radius:0;padding:0;cursor:pointer;position:relative}
    .proj-passo input[type=checkbox]:checked::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--terracota,#A03E25);font-size:20px;font-weight:700;font-family:Arial,sans-serif}

    .proj-mini{background:transparent;border:0;border-radius:0;padding:2px 4px;min-height:0;font-size:13px;color:var(--preto-tinta,#16233F);opacity:.6;cursor:pointer;text-decoration:underline}

    .prod-seg{display:flex;flex-wrap:nowrap;border:1px solid var(--azul-egipcio-claro,#1F5FA3);margin:6px 0 6px;overflow-x:auto}
    .prod-seg .prod-chip{flex:1 1 auto;white-space:nowrap;border:0;border-left:1px solid var(--azul-egipcio-claro,#1F5FA3);padding:6px 3px;font-size:9px;letter-spacing:0;text-align:center;color:var(--terracota,#A03E25)}
    .prod-seg .prod-chip:first-child{border-left:0}
    .prod-seg .prod-chip.on{background:var(--azul-egipcio-claro,#1F5FA3);color:var(--vazado,#F3E3B8);font-weight:400}
    .pc-aula{padding:12px 0;border-bottom:1px solid var(--azul-egipcio-claro,#1F5FA3)}
    .pc-aula:last-child{border-bottom:0}
    .selo-construcao{display:inline-block;margin-left:10px;font-size:12px;white-space:nowrap}
  </style>

<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">

  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="portal.js?v=172"></script>
  <script src="curso.js?v=8"></script>
  <script src="menu.js?v=68" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var ETAPAS = [['gravacao', 'Gravação'], ['edicao_grossa', 'Edição grossa'], ['edicao_fina', 'Edição fina'], ['capa', 'Capa'], ['upload', 'Upload']];
    var PASSOS_IDEIA = ['Definir o tema e o público', 'Definir a quantidade de módulos'];
    var PASSOS_FINAL = ['Escolher onde as aulas ficam hospedadas', 'Definir os preços', 'Definir como vender', 'Encaixar o curso na estrutura do site'];
    var SELO = '🚧 Under construction';

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('curso', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function campo(rotulo, controle) { return [el('label', { text: rotulo }), controle]; }
    function texto(t) { var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: t }); if (t.length === 1) b.style.fontSize = '20px'; return b; }
    function msgErro(caixa, e) { P.mensagem(caixa, P.traduzErro((e && e.message) || ''), 'erro'); }
    function voltarAcima(fn) { app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(fn)])); P.voltarNoFim(app, fn); }
    function falhou(r, recarregar) { if (r && r.error) { alert('Não foi possível salvar (' + P.traduzErro(r.error.message) + ').'); if (recarregar) recarregar(); return true; } return false; }
    function grupo(t) { return el('p', { class: 'proj-grupo', text: t }); }
    function minilink(t, aoClicar) { var b = el('button', { type: 'button', class: 'proj-mini', text: t }); b.addEventListener('click', aoClicar); return b; }
    function selo() { return el('span', { class: 'rotulo-fixo selo-construcao', text: SELO }); }

    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          var ent = P.estado.ler();
          if (ent.aula) abrirAula(ent.aula);
          else if (ent.modulo) abrirModulo(ent.modulo);
          else if (ent.curso) abrirCurso(ent.curso);
          else lista();
        });
      });
    }

    /* ---------- contas da construção ---------- */
    function etapasDe(c) { var chaves = ETAPAS.map(function (e) { return e[0]; }); var l = c && Array.isArray(c.etapas) ? c.etapas : null; return (l && l.length ? l : chaves).filter(function (k) { return chaves.indexOf(k) >= 0; }); }
    /* Upload não se marca à mão: está feito quando a aula tem vídeo */
    function etapaFeita(a, k) { return k === 'upload' ? !!a.video_codigo : !!a[k]; }
    function aulasDoModulo(D, mid) { return D.aulas.filter(function (a) { return a.modulo_id === mid; }); }
    /* módulo = apostila + "definir as aulas" (conta quando existe ao menos uma) + as etapas de cada aula + passos soltos do módulo */
    function contModulo(D, m) {
      var et = etapasDe(D.curso), as = aulasDoModulo(D, m.id).filter(function (a) { return a.tipo !== 'ao_vivo'; }), ps = D.passos.filter(function (p) { return p.modulo_id === m.id; });
      var intro = m.ordem === 0; /* a Introdução é só a aula ao vivo: sem apostila nem aulas gravadas para construir */
      var t = (intro ? 0 : 2) + as.length * et.length + ps.length;
      var f = (!intro && m.apostila_ok ? 1 : 0) + (!intro && as.length ? 1 : 0) + as.reduce(function (n, a) { return n + et.filter(function (k) { return etapaFeita(a, k); }).length; }, 0) + ps.filter(function (p) { return p.feito; }).length;
      return { t: t, f: f };
    }
    function contCurso(D) {
      var ps = D.passos.filter(function (p) { return !p.modulo_id; }), t = ps.length, f = ps.filter(function (p) { return p.feito; }).length;
      D.mods.forEach(function (m) { var k = contModulo(D, m); t += k.t; f += k.f; });
      return { t: t, f: f };
    }
    function barra(k) { return P.barraLinha(k.t ? Math.floor(k.f * 100 / k.t) : 0, null, k.f + '/' + k.t); }
    function dadosCurso(id) {
      return Promise.all([
        C.from('cursos').select('*').eq('id', id).maybeSingle(),
        C.from('curso_modulos').select('*').eq('curso_id', id).order('ordem'),
        C.from('curso_passos').select('*').eq('curso_id', id).order('ordem')
      ]).then(function (rs) {
        var erro = rs[0].error || rs[1].error || rs[2].error;
        if (erro) throw erro;
        if (!rs[0].data) throw { message: 'Curso não encontrado.' };
        var mods = rs[1].data || [], D = { curso: rs[0].data, mods: mods, aulas: [], passos: rs[2].data || [] };
        if (!mods.length) return D;
        return C.from('curso_aulas').select('*').in('modulo_id', mods.map(function (m) { return m.id; })).order('ordem').then(function (ra) { if (ra.error) throw ra.error; D.aulas = ra.data || []; return D; });
      });
    }

    /* ---------- peças de passos e etapas ---------- */
    function linhaPasso(p, aoEditar, recarregar) {
      var cb = el('input', { type: 'checkbox', 'aria-label': 'Marcar como feito' }); cb.checked = !!p.feito;
      cb.addEventListener('change', function () {
        C.from('curso_passos').update({ feito: cb.checked, feito_em: cb.checked ? new Date().toISOString() : null }).eq('id', p.id).then(function (r) { if (!falhou(r, recarregar)) recarregar(); });
      });
      var textos = [el('span', { class: 'proj-titulo', text: p.titulo })];
      if (p.data_prevista) textos.push(el('span', { class: 'portal-item-data', text: p.data_prevista.split('-').reverse().join('/') }));
      if (p.nota) textos.push(el('span', { class: 'portal-item-data', style: 'color:var(--preto-tinta,#16233F);opacity:.75', text: p.nota }));
      var acoes = el('div', { class: 'proj-acoes' }, [minilink('Editar', function () { aoEditar(p); })]);
      var ap = P.botaoApagar('Apagar');
      ap.addEventListener('click', function () { if (!confirm('Apagar o passo "' + p.titulo + '"?')) return; C.from('curso_passos').delete().eq('id', p.id).then(function (r) { if (!falhou(r, recarregar)) recarregar(); }); });
      acoes.appendChild(ap); textos.push(acoes);
      return el('div', { class: 'proj-passo' + (p.feito ? ' feito' : '') }, [cb, el('div', { style: 'flex:1;min-width:0' }, textos)]);
    }
    function formPasso(D, recarregar, area, fase, mid, item) {
      area.textContent = '';
      var msg = el('p', { class: 'portal-msg' }), titulo = el('input', { type: 'text', id: 'pcTitulo', required: '' }), nota = el('textarea', { rows: '2', placeholder: 'Anotação (opcional)' });
      var dataP = el('input', { type: 'date' }); if (item) { titulo.value = item.titulo; nota.value = item.nota || ''; dataP.value = item.data_prevista || ''; }
      var salvar = el('button', { type: 'submit', class: 'portal-btn', text: item ? 'Salvar alterações' : 'Adicionar passo' }), cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelar.addEventListener('click', function () { area.textContent = ''; });
      var f = el('form', { class: 'portal-cartao' }, [el('label', { for: 'pcTitulo', text: 'Passo' }), titulo, nota, P.colunaData(dataP, 'Data para fazer (opcional)'), msg, el('div', { class: 'portal-acoes' }, [salvar, cancelar])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var t = titulo.value.trim(); if (!t) { P.mensagem(msg, 'Escreva o passo.', 'erro'); return; }
        salvar.disabled = true;
        var ordem = D.passos.reduce(function (m, p) { return Math.max(m, p.ordem || 0); }, 0) + 1;
        var pedido = item ? C.from('curso_passos').update({ titulo: t, nota: nota.value.trim() || null, data_prevista: dataP.value || null }).eq('id', item.id) : C.from('curso_passos').insert({ curso_id: D.curso.id, modulo_id: mid || null, fase: mid ? 'modulo' : fase, titulo: t, nota: nota.value.trim() || null, data_prevista: dataP.value || null, ordem: ordem });
        pedido.then(function (r) { if (r.error) { salvar.disabled = false; P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); } else recarregar(); });
      });
      area.appendChild(f); titulo.focus({ preventScroll: true });
    }
    function passosDe(D, fase, mid) { return D.passos.filter(function (p) { return mid ? p.modulo_id === mid : (!p.modulo_id && p.fase === fase); }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); }); }
    function blocoPassos(D, recarregar, fase, mid) {
      var caixa = el('div'), lista = el('div', { style: 'border-top:1px solid var(--azul-egipcio-claro,#1F5FA3)' }), area = el('div', { class: 'barra-ocre' });
      var itens = passosDe(D, fase, mid).filter(function (p) { return !p.feito; });
      itens.forEach(function (p) { lista.appendChild(linhaPasso(p, function (x) { formPasso(D, recarregar, area, fase, mid, x); }, recarregar)); });
      if (itens.length) caixa.appendChild(lista);
      caixa.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:8px' }, [minilink('+ Adicionar passo', function () { if (!area.firstChild) formPasso(D, recarregar, area, fase, mid, null); })]));
      caixa.appendChild(area);
      return caixa;
    }
    function listaFeitos(D, recarregar, mid) {
      var itens = D.passos.filter(function (p) { return p.feito && (mid ? p.modulo_id === mid : !p.modulo_id); }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
      var caixa = el('div'), area = el('div', { class: 'barra-ocre' });
      if (!itens.length) return caixa;
      caixa.appendChild(grupo('Feitos'));
      var lista = el('div', { style: 'border-top:1px solid var(--azul-egipcio-claro,#1F5FA3)' });
      itens.forEach(function (p) { lista.appendChild(linhaPasso(p, function (x) { formPasso(D, recarregar, area, x.fase, mid, x); }, recarregar)); });
      caixa.appendChild(lista); caixa.appendChild(area);
      return caixa;
    }
    /* barra de etapas da aula (como na Produção); o Upload se marca sozinho quando a aula tem vídeo */
    function etapasDaAula(a, curso, aoMudar, aoTocarUpload) {
      var et = etapasDe(curso);
      var lista = ETAPAS.filter(function (e) { return et.indexOf(e[0]) >= 0; });
      var botoes = lista.map(function (e) {
        var b = el('button', { type: 'button', class: 'prod-chip prod-fixo' + (etapaFeita(a, e[0]) ? ' on' : ''), text: e[1], 'aria-pressed': etapaFeita(a, e[0]) ? 'true' : 'false' });
        b.addEventListener('click', function () {
          if (e[0] === 'upload') { if (aoTocarUpload) aoTocarUpload(); return; }
          a[e[0]] = !a[e[0]]; b.classList.toggle('on', !!a[e[0]]); b.setAttribute('aria-pressed', a[e[0]] ? 'true' : 'false');
          var o = {}; o[e[0]] = a[e[0]]; C.from('curso_aulas').update(o).eq('id', a.id).then(function (r) { if (!falhou(r)) { if (aoMudar) aoMudar(); } });
        });
        return b;
      });
      return P.barraComDatas(botoes, lista.map(function (x) { return x[0]; }), a.datas_etapas, function (o) { a.datas_etapas = o; C.from('curso_aulas').update({ datas_etapas: o }).eq('id', a.id); });
    }

    /* ---------- cursos ---------- */
    function lista() {
      limpar(); P.estado.gravar({});
      app.appendChild(topo(nomeAdmin));
      var msg = el('p', { class: 'portal-msg' });
      var novo = el('button', { type: 'button', class: 'portal-btn', text: '+ Curso' });
      novo.addEventListener('click', function () {
        var t = (window.prompt('Nome do curso') || '').trim();
        if (!t) return;
        C.from('cursos').insert({ titulo: t, data_inicio: new Date().toLocaleDateString('sv-SE') }).select().single().then(function (r) {
          if (r.error) { msgErro(msg, r.error); return; }
          var id = r.data.id, n = 0;
          var lote = PASSOS_IDEIA.map(function (x) { return { curso_id: id, fase: 'ideia', titulo: x, ordem: ++n }; }).concat(PASSOS_FINAL.map(function (x) { return { curso_id: id, fase: 'final', titulo: x, ordem: ++n }; }));
          C.from('curso_passos').insert(lote).then(function () { window.scrollTo(0, 0); abrirCurso(id); });
        });
      });
      app.appendChild(el('div', { class: 'portal-acoes' }, [novo])); app.appendChild(msg);
      var caixa = el('div', { class: 'portal-cartao' }, [el('p', { text: 'Carregando...' })]); app.appendChild(caixa);
      Promise.all([C.from('cursos').select('*').order('criado_em'), C.from('curso_modulos').select('*').order('ordem'), C.from('curso_aulas').select('*'), C.from('curso_passos').select('*')]).then(function (rs) {
        caixa.textContent = '';
        var erro = rs.filter(function (x) { return x.error; })[0];
        if (erro) { caixa.appendChild(el('p', { text: P.traduzErro(erro.error.message) })); return; }
        var cursos = rs[0].data || [];
        if (!cursos.length) { caixa.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhum curso ainda.' })); return; }
        cursos.forEach(function (c) {
          var nome = el('span', { class: 'prod-titulo', style: 'display:block', text: c.titulo });
          if (c.construindo !== false) nome.appendChild(selo());
          var l = el('div', { class: 'prod-linha', style: 'cursor:pointer' }, [nome]);
          if (c.construindo !== false) {
            var mods = (rs[1].data || []).filter(function (m) { return m.curso_id === c.id; }), ids = mods.map(function (m) { return m.id; });
            var D = { curso: c, mods: mods, aulas: (rs[2].data || []).filter(function (a) { return ids.indexOf(a.modulo_id) >= 0; }), passos: (rs[3].data || []).filter(function (p) { return p.curso_id === c.id; }) };
            l.appendChild(barra(contCurso(D)));
            if (c.data_fim) { var t = P.barraTempoDias(c.data_inicio, c.data_fim); if (t) l.appendChild(t); }
          }
          l.addEventListener('click', function () { abrirCurso(c.id); });
          caixa.appendChild(l);
        });
      });
    }

    /* ---------- um curso: construção, módulos e matrículas ---------- */
    function trocar(tabela, a, b) {
      return Promise.all([C.from(tabela).update({ ordem: b.ordem }).eq('id', a.id), C.from(tabela).update({ ordem: a.ordem }).eq('id', b.id)]);
    }
    function abrirCurso(id) {
      limpar(); P.estado.gravar({ curso: id });
      app.appendChild(topo(nomeAdmin));
      voltarAcima(lista);
      var recarregar = function () { abrirCurso(id); };
      var corpo = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]); app.appendChild(corpo);
      Promise.all([dadosCurso(id), C.from('curso_matriculas').select('id,email,nome,modulo_liberado').eq('curso_id', id).order('criado_em')]).then(function (rs) {
        corpo.textContent = '';
        if (rs[1].error) throw rs[1].error;
        var D = rs[0], curso = D.curso, mods = D.mods, mats = rs[1].data || [], construindo = curso.construindo !== false;
        var tit = el('input', { type: 'text', value: curso.titulo });
        var msgT = el('p', { class: 'portal-msg', style: 'margin:0' });
        var salvarT = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar nome' });
        salvarT.addEventListener('click', function () {
          if (!tit.value.trim()) return;
          C.from('cursos').update({ titulo: tit.value.trim() }).eq('id', id).then(function (r) { if (r.error) msgErro(msgT, r.error); else P.mensagem(msgT, 'Salvo.', 'ok'); });
        });
        var cab = el('div', { class: 'portal-cartao', style: 'padding-bottom:0!important;margin-bottom:0!important' }, [].concat(campo('Nome do curso', tit), [msgT, el('div', { class: 'portal-acoes', style: 'display:none' }, [salvarT])]));
        if (construindo) {
          cab.insertBefore(el('div', {}, [selo()]), cab.firstChild);
          cab.appendChild(barra(contCurso(D)));
          if (curso.data_fim) { var tt = P.barraTempoDias(curso.data_inicio, curso.data_fim); if (tt) cab.appendChild(tt); }
        }
        corpo.appendChild(cab); P.salvarSozinho(salvarT); /* o botão fica escondido (salva sozinho) */

        /* ----- só enquanto está em construção: datas, ideia e planejamento ----- */
        if (construindo) {
          var ini = el('input', { type: 'date', style: 'width:auto' }), fim = el('input', { type: 'date', style: 'width:auto' }), sujo = false;

            }).then(function (n) { if (n > 0) criou += n; else if (n === -1) achou = false; }, function (e) { erroM = (e && e.message) || 'erro'; });
          }, Promise.resolve()).then(function () {
            if (criou) recarregar();
            else if (erroM) P.mensagem(msgM, 'Não consegui ler a apostila (' + erroM + ').', 'erro');

    /* ---------- aula ao vivo -> compromisso no Google Agenda (agenda principal), achado pelo marcador da aula ---------- */
    function gcal(caminho, opc) {
      return P.tokenGoogle().then(function (token) {
        opc = opc || {}; opc.headers = Object.assign({ Authorization: 'Bearer ' + token }, opc.headers || {});
        return fetch('https://www.googleapis.com/calendar/v3' + caminho, opc);
      }).then(function (r) { if (r.status === 204) return {}; return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || 'Google ' + r.status); return j; }); });
    }
    function eventoDaAula(aulaId) {
      return gcal('/calendars/primary/events?showDeleted=false&privateExtendedProperty=' + encodeURIComponent('fda_aula=' + aulaId)).then(function (j) { return (j.items || [])[0] || null; });
    }
    function somaMin(hhmm, m) { var p = hhmm.split(':'), t = (+p[0]) * 60 + (+p[1]) + m; t = Math.max(0, Math.min(23 * 60 + 59, t)); return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2); }
    /* devolve o link do Meet (o que ele colou, ou o que o Google criou) */
    function sincronizarAula(aulaId, titulo, dia, ini, fim, link) {
      return eventoDaAula(aulaId).then(function (ev) {
        if (!dia || !ini) return ev ? gcal('/calendars/primary/events/' + encodeURIComponent(ev.id), { method: 'DELETE' }).then(function () { return link; }) : link;
        if (fim <= ini) fim = somaMin(ini, 60);
        var corpo = { summary: 'Aula ao vivo: ' + titulo, start: { dateTime: dia + 'T' + ini + ':00', timeZone: 'America/Sao_Paulo' }, end: { dateTime: dia + 'T' + fim + ':00', timeZone: 'America/Sao_Paulo' },
          extendedProperties: { private: { fda_aula: aulaId } } };
        var params = '?conferenceDataVersion=1';
        if (link) { corpo.location = link; corpo.description = 'Link da aula: ' + link; }
        else if (!ev || !ev.hangoutLink) corpo.conferenceData = { createRequest: { requestId: 'fda-aula-' + Date.now(), conferenceSolutionKey: { type: 'hangoutsMeet' } } };
        var pedido = ev ? gcal('/calendars/primary/events/' + encodeURIComponent(ev.id) + params, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) })
          : gcal('/calendars/primary/events' + params, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
        return pedido.then(function (e) { return link || e.hangoutLink || ''; });
      });
    }

    /* sem marcadores no PDF: lê o índice impresso nas primeiras páginas ("1. Título ........ 3") e, para os títulos que o PDF
       estragou (ti e fi viram símbolo), pega as letras certas do título em maiúsculas de cada capítulo */
    function indiceImpresso(pdf) {
      var achados = [], cabecas = {}, p = 1;
      function linhasDe(pg) {
        return pg.getTextContent().then(function (tc) {
          var linhas = {};
          tc.items.forEach(function (i) { var y = Math.round(i.transform[5]); (linhas[y] = linhas[y] || []).push(i); });
          return Object.keys(linhas).map(Number).sort(function (a, b) { return b - a; }).map(function (y) {
            return linhas[y].sort(function (a, b) { return a.transform[4] - b.transform[4]; }).map(function (i) { return i.str; }).join('');
          });
        });
      }
      function varrer() {
        if (p > pdf.numPages) return;
        return pdf.getPage(p++).then(linhasDe).then(function (ls) {
          ls.forEach(function (txt) {
            var m = /^\s*(\d{1,2})[.)]\s*(.+?)\s*[.·…]{4,}\s*\d+\s*$/.exec(txt);
            if (m && p <= 9) { achados.push({ n: +m[1], t: m[2].replace(/\s+/g, ' ').trim() }); return; }
            var h = /^\s*(\d{1,2})[.)]\s+(\S.{1,78}?)\s*$/.exec(txt);
            if (h && !/[.;]$|\.{3}/.test(h[2]) && !cabecas[+h[1]] && achados.length) cabecas[+h[1]] = h[2].replace(/\s+/g, ' ').trim();
          });
          return varrer();
        });
      }
      function consertar(t, cab) {
        if (!/[^A-Za-zÀ-ÿ0-9 ,:;'’\-]|[a-zà-ú][0-9]+[a-zà-ú]/.test(t) || !cab) return t;
        var pt = t.split(' '), pc = cab.split(' ');
        if (pt.length !== pc.length) return t;
        return pt.map(function (w, k) {
          if (!/[^A-Za-zÀ-ÿ'’\-]/.test(w)) return w;
          var c = pc[k] === pc[k].toUpperCase() ? pc[k].toLowerCase() : pc[k]; return w.charAt(0) === w.charAt(0).toUpperCase() && /[A-ZÀ-Ú]/.test(w.charAt(0)) ? c.charAt(0).toUpperCase() + c.slice(1) : c.charAt(0).toLowerCase() + c.slice(1);
        }).join(' ');
      }
      return Promise.resolve(varrer()).then(function () { return achados.map(function (a) { return consertar(a.t, cabecas[a.n]); }); });
    }

    /* capítulos = itens do primeiro nível do índice (marcadores) do PDF */
    function capitulosDoPdf(driveId) {
      if (!window.pdfjsLib) return Promise.reject(new Error('pdfjs'));
      if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      return P.tokenGoogle().then(function (token) {
        return fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(driveId) + '?alt=media&supportsAllDrives=true', { headers: { Authorization: 'Bearer ' + token } });
      }).then(function (r) { if (!r.ok) throw new Error('drive'); return r.arrayBuffer(); })
        .then(function (dados) { return pdfjsLib.getDocument({ data: dados }).promise; })
        .then(function (pdf) {
          return pdf.getOutline().then(function (itens) {
            var t = (itens || []).map(function (x) { return String(x.title || '').replace(/\s+/g, ' ').trim(); }).filter(Boolean);
            return t.length ? t : indiceImpresso(pdf);
          });
        });
    }

    /* módulo sem apostila ligada: procura no Drive o PDF "Módulo N - ..." e liga (o mais recente, se houver mais de um) */
    function acharApostila(ordem) {
      return P.tokenGoogle().then(function (token) {
        var q = "name contains 'Módulo " + ordem + "' and mimeType='application/pdf' and trashed=false";
        return fetch('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=50&fields=files(id,name,createdTime,parents)&q=' + encodeURIComponent(q), { headers: { Authorization: 'Bearer ' + token } });
      }).then(function (r) { if (!r.ok) throw new Error('drive ' + r.status); return r.json(); }).then(function (j) {
        var re = new RegExp('^\\s*M[óo]dulo\\s*' + ordem + '(\\D|$)', 'i');
        var f = (j.files || []).filter(function (x) { return re.test(x.name); }).sort(function (a, b) { return String(b.createdTime).localeCompare(String(a.createdTime)); })[0];
        return f || null;
      });
    }

    /* uma aula por capítulo da apostila (os que já têm aula com o mesmo nome ficam como estão); devolve quantas criou */
    function puxarCapitulos(moduloId, driveId, aulas) {
      return capitulosDoPdf(driveId).then(function (lista) {
        var ja = aulas.map(function (x) { return x.titulo.trim().toLowerCase(); });
        var novas = lista.filter(function (t) { return ja.indexOf(t.trim().toLowerCase()) < 0; });
        if (!novas.length) return lista.length ? 0 : -1;
        var prox = aulas.length ? aulas[aulas.length - 1].ordem : 0;
        return C.from('curso_aulas').insert(novas.map(function (t, k) { return { modulo_id: moduloId, ordem: prox + k + 1, titulo: t }; })).then(function (r) { if (r.error) throw r.error; return novas.length; });
      });
    }

    /* ---------- um módulo: nome, apostila e aulas ---------- */
    function abrirModulo(id) {
      limpar(); P.estado.gravar({ modulo: id });
      app.appendChild(topo(nomeAdmin));
      var corpo = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]); app.appendChild(corpo);
      var recarregar = function () { abrirModulo(id); };
      C.from('curso_modulos').select('curso_id').eq('id', id).maybeSingle().then(function (rm) {
        if (rm.error || !rm.data) throw rm.error || { message: 'Módulo não encontrado.' };
        return dadosCurso(rm.data.curso_id);
      }).then(function (D) {
        corpo.textContent = '';
        var m = D.mods.filter(function (x) { return x.id === id; })[0];
        if (!m) { corpo.appendChild(el('p', { class: 'portal-msg erro', text: 'Módulo não encontrado.' })); return; }
        var curso = D.curso, construindo = curso.construindo !== false;
        var aulas = aulasDoModulo(D, id).sort(function (x, y) { return x.ordem - y.ordem; });
        var voltar = function () { abrirCurso(m.curso_id); };
        var vt = el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(voltar)]); corpo.parentNode.insertBefore(vt, corpo);
        P.voltarNoFim(app, voltar);
        var tit = el('input', { type: 'text', value: m.titulo });
        var dApostila = el('input', { type: 'date', style: 'width:auto' }); dApostila.value = m.data_apostila || '';
        var apNome = m.apostila_nome, apId = m.apostila_drive_id, apOk = !!m.apostila_ok;
        var apTxt = el('span', { text: apNome || 'Nenhuma' });
        var escolher = texto('Escolher');
        var msgAp = el('p', { class: 'portal-msg' });
        escolher.addEventListener('click', function () {
          P.escolherDoDrive(function (url, fid, token) {
            fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fid) + '?fields=name,mimeType,parents,createdTime&supportsAllDrives=true', { headers: { Authorization: 'Bearer ' + token } })
              .then(function (r) { if (!r.ok) throw new Error('drive'); return r.json(); })
              .then(function (f) {
                if (f.mimeType !== 'application/pdf') { P.mensagem(msgAp, 'Esse arquivo não é um PDF.', 'erro'); return; }
                if (f.parents && f.parents[0]) C.from('drive_pastas').upsert({ chave: 'base_curso', pasta_id: f.parents[0] }, { onConflict: 'chave' }).then(function () { }); /* a próxima busca já abre nessa pasta */
                dApostila.value = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }); /* o dia em que a apostila ficou pronta */
                apId = fid; apNome = String(f.name).replace(/\.pdf$/i, ''); apOk = true; apTxt.textContent = apNome; salvar.click();
                P.mensagem(msgAp, 'Lendo o índice...', 'ok');
                puxarCapitulos(id, fid, aulas).then(function (n) { if (n === -1) P.mensagem(msgAp, 'Não achei o índice dessa apostila.', 'erro'); else setTimeout(recarregar, 400); }, function (e) { P.mensagem(msgAp, 'Não consegui ler a apostila: ' + P.traduzErro((e && e.message) || ''), 'erro'); });
              }).catch(function () { P.mensagem(msgAp, 'Não consegui ler esse arquivo no Drive.', 'erro'); });
          }, function (t) { P.mensagem(msgAp, t, 'erro'); }, false, 'base_curso');
        });
        var tirarAp = P.botaoApagar('Tirar'); tirarAp.addEventListener('click', function () { apId = null; apNome = null; apOk = false; apTxt.textContent = 'Nenhuma'; salvar.click(); setTimeout(recarregar, 600); });
        var msg = el('p', { class: 'portal-msg' });
        var salvar = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar' });
        salvar.addEventListener('click', function () {
          if (!tit.value.trim()) { P.mensagem(msg, 'Escreva o nome do módulo.', 'erro'); return; }
          C.from('curso_modulos').update({ titulo: tit.value.trim(), apostila_drive_id: apId || null, apostila_nome: apNome || null, apostila_ok: apOk, data_apostila: dApostila.value || null }).eq('id', id).then(function (r) { if (r.error) msgErro(msg, r.error); else P.mensagem(msg, 'Salvo.', 'ok'); });
        });
        var intro = m.ordem === 0;
        var cartao = el('div', { class: 'portal-cartao' }, [].concat(
          [el('h2', { text: intro ? 'Introdução' : 'Módulo ' + m.ordem })], campo('Nome', tit),
          intro ? [msgAp, msg, el('div', { style: 'display:none' }, [salvar])] : [el('label', { text: 'Apostila (PDF)' }), el('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px' }, [apTxt, escolher, tirarAp]), msgAp, msg, el('div', { style: 'display:none' }, [salvar])]));
        if (construindo && !intro) {
          cartao.insertBefore(barra(contModulo(D, m)), cartao.children[1]);
          var cb = el('input', { type: 'checkbox', 'aria-label': 'Apostila pronta' }); cb.checked = apOk;
          cb.addEventListener('change', function () { apOk = cb.checked; salvar.click(); setTimeout(recarregar, 600); });
          cartao.insertBefore(P.colunaData(dApostila, 'Data: apostila pronta'), cartao.children[2]);
          cartao.insertBefore(el('div', { class: 'proj-passo' + (apOk ? ' feito' : ''), style: 'border-top:1px solid var(--azul-egipcio-claro,#1F5FA3)' }, [cb, el('div', { style: 'flex:1' }, [el('span', { class: 'proj-titulo', text: 'Apostila pronta' })])]), msgAp);
        }
        corpo.appendChild(cartao); P.salvarSozinho(salvar);
        /* apostila já escolhida antes, sem data: usa o dia em que ela foi para o Drive */
        if (apId && !dApostila.value && !intro) {
          P.tokenGoogle().then(function (token) { return fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(apId) + '?fields=createdTime&supportsAllDrives=true', { headers: { Authorization: 'Bearer ' + token } }); })
            .then(function (r) { return r.ok ? r.json() : null; }).then(function (f) {
              if (!f || !f.createdTime || dApostila.value) return;
              dApostila.value = new Date(f.createdTime).toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }); salvar.click();
            }).then(null, function () { });
        }

        var caixaA = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Aulas' })]);
        if (!aulas.length) caixaA.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhuma aula ainda.' }));
        aulas.forEach(function (a, i) {
          var abrir = el('div', { style: 'flex:1;min-width:0;cursor:pointer' }, [
            el('span', { class: 'prod-titulo', style: 'display:block', text: a.ordem + '. ' + (a.tipo === 'ao_vivo' ? 'Aula ao vivo' : a.titulo) }),
            el('span', { class: 'prod-sub', style: 'display:block', text: (a.tipo === 'ao_vivo' ? 'ao vivo' + (a.data_hora ? ' · ' + new Date(a.data_hora).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '') + ' · ' : '') + (!a.video_codigo ? 'sem vídeo' : 'vídeo') })
          ]);
          abrir.addEventListener('click', function () { abrirAula(a.id); });
          var linha = el('div', { class: 'prod-linha', style: 'display:flex;align-items:center;gap:6px;margin:0 0 10px' }, [abrir]);
          if (i > 0) { var sobe = texto('↑'); sobe.addEventListener('click', function () { trocar('curso_aulas', a, aulas[i - 1]).then(recarregar); }); linha.appendChild(sobe); }
          if (i < aulas.length - 1) { var desce = texto('↓'); desce.addEventListener('click', function () { trocar('curso_aulas', a, aulas[i + 1]).then(recarregar); }); linha.appendChild(desce); }
          var bloco = el('div', { style: 'margin:0 0 10px' }, [linha]);
          if (construindo && a.tipo !== 'ao_vivo') { var seg = etapasDaAula(a, curso, recarregar, function () { abrirAula(a.id); }); seg.style.marginTop = '-4px'; bloco.appendChild(seg); }
          caixaA.appendChild(bloco);
        });
        var msgN = el('p', { class: 'portal-msg' });
        var nova = el('button', { type: 'button', class: 'portal-btn', text: '+ Aula' });
        nova.addEventListener('click', function () {
          var t = (window.prompt('Nome da aula') || '').trim(); if (!t) return;
          var ordem = aulas.length ? aulas[aulas.length - 1].ordem + 1 : 1;
          C.from('curso_aulas').insert({ modulo_id: id, ordem: ordem, titulo: t }).select().single().then(function (r) { if (r.error) msgErro(msgN, r.error); else abrirAula(r.data.id); });
        });
        var aoVivo = el('button', { type: 'button', class: 'portal-btn', text: '+ Ao vivo' });
        aoVivo.addEventListener('click', function () {
          var ordem = aulas.length ? aulas[aulas.length - 1].ordem + 1 : 1;
          C.from('curso_aulas').insert({ modulo_id: id, ordem: ordem, titulo: 'Aula ao vivo', tipo: 'ao_vivo' }).select().single().then(function (r) { if (r.error) msgErro(msgN, r.error); else abrirAula(r.data.id); });
        });
        var acoesN = intro ? [aoVivo] : [nova, aoVivo];
        caixaA.appendChild(msgN); caixaA.appendChild(el('div', { class: 'portal-acoes' }, acoesN));
        corpo.appendChild(caixaA);
        if (apId && !intro && !aulas.some(function (x) { return x.tipo !== 'ao_vivo'; }) && window.__puxado !== id) { window.__puxado = id; puxarCapitulos(id, apId, aulas).then(function (n) { if (n > 0) recarregar(); else if (n === -1) P.mensagem(msgN, 'Não achei o índice dessa apostila.', 'erro'); }, function (e) { P.mensagem(msgN, 'Não consegui ler a apostila: ' + P.traduzErro((e && e.message) || ''), 'erro'); }); }

        if (construindo && !intro) {
          var cx = el('div', { class: 'portal-cartao' });
          cx.appendChild(grupo('Outros passos')); cx.appendChild(blocoPassos(D, recarregar, 'modulo', id));
          cx.appendChild(listaFeitos(D, recarregar, id));
          corpo.appendChild(cx);
        }

        var apagar = P.botaoApagar('Apagar este módulo');
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar o módulo "' + m.titulo + '" com todas as aulas? Não dá para desfazer.')) return;
          C.from('curso_modulos').delete().eq('id', id).then(function (r) { if (r.error) msgErro(msgN, r.error); else voltar(); });
        });
        P.apagarNoFim(app, apagar);
      }).then(null, function (e) { corpo.textContent = ''; corpo.appendChild(el('p', { class: 'portal-msg erro', text: P.traduzErro((e && e.message) || '') })); });
    }

    /* ---------- uma aula ---------- */
    function abrirAula(id) {
      limpar(); P.estado.gravar({ aula: id });
      app.appendChild(topo(nomeAdmin));
      var corpo = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]); app.appendChild(corpo);
      C.from('curso_aulas').select('*, curso_modulos(curso_id, cursos(construindo, etapas))').eq('id', id).maybeSingle().then(function (r) {
        corpo.textContent = '';
        if (r.error || !r.data) { corpo.appendChild(el('p', { class: 'portal-msg erro', text: r.error ? P.traduzErro(r.error.message) : 'Aula não encontrada.' })); return; }
        var a = r.data, voltar = function () { abrirModulo(a.modulo_id); };
        var curso = a.curso_modulos && a.curso_modulos.cursos ? a.curso_modulos.cursos : { construindo: false };
        corpo.parentNode.insertBefore(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(voltar)]), corpo);
        P.voltarNoFim(app, voltar);
        var tit = el('input', { type: 'text', value: a.titulo });
        /* sem escolha de onde está: é o Google Drive, salvo vídeo antigo que já era um link do YouTube */
        var origemDe = function (txt) { return /youtu/i.test(txt) ? 'youtube' : 'drive'; };
        var cod = el('input', { type: 'text', value: a.video_codigo || '', placeholder: '', autocomplete: 'off' });
        var aoVivoA = a.tipo === 'ao_vivo';
        var dataV = el('input', { type: 'date', style: 'width:auto' }), horaV = el('input', { type: 'time', style: 'width:auto;min-height:36px;min-width:120px' });
        if (a.data_hora) {
          var dh = new Date(a.data_hora).toLocaleString('sv-SE', { timeZone: 'America/Sao_Paulo' }); /* AAAA-MM-DD HH:MM:SS */
          dataV.value = dh.slice(0, 10); horaV.value = dh.slice(11, 16);
        }
        var fimV = el('input', { type: 'time', style: 'width:auto;min-height:36px;min-width:120px' });
        if (aoVivoA) eventoDaAula(a.id).then(function (ev) { if (ev && ev.end && ev.end.dateTime) fimV.value = new Date(ev.end.dateTime).toLocaleTimeString('sv-SE', { timeZone: 'America/Sao_Paulo' }).slice(0, 5); }, function () { });
        var meet = el('input', { type: 'text', value: a.link_meet || '', placeholder: '', autocomplete: 'off' });
        var vivoBloco = el('div', {}, [].concat([P.linhaDatas([P.colunaData(dataV, 'Dia'), el('div', {}, [el('label', { text: 'Começa às' }), horaV]), el('div', {}, [el('label', { text: 'Termina às' }), fimV])])], campo('Link do Meet', meet)));
        var prev = el('div', { style: 'margin:0 0 12px' });
        function previa() {
          prev.textContent = '';
          var u = window.curso.enderecoDoVideo(origemDe(cod.value), cod.value);
          if (!u) return;
          var caixa = el('div', { style: 'position:relative;width:100%;aspect-ratio:16/9;background:#000' });
          var f = el('iframe', { src: u, allowfullscreen: '', allow: 'encrypted-media; picture-in-picture' }); f.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;border:0';
          caixa.appendChild(f); prev.appendChild(caixa);
        }
        cod.addEventListener('change', previa); previa();
        var msg = el('p', { class: 'portal-msg' });
        var salvar = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar' });
        salvar.addEventListener('click', function () {
          if (!tit.value.trim()) { P.mensagem(msg, 'Escreva o nome da aula.', 'erro'); return; }
          C.from('curso_aulas').update({ titulo: tit.value.trim(), video_origem: origemDe(cod.value), video_codigo: cod.value.trim() || null, video_teste: false, datas_etapas: datasEt, data_hora: aoVivoA && dataV.value && horaV.value ? new Date(dataV.value + 'T' + horaV.value + ':00-03:00').toISOString() : null, link_meet: aoVivoA ? (meet.value.trim() || null) : null }).eq('id', id)
            .then(function (x) {
              if (x.error) { msgErro(msg, x.error); return; }
              if (!aoVivoA) { P.mensagem(msg, 'Salvo.', 'ok'); return; }
              sincronizarAula(id, aoVivoA ? 'Aula ao vivo' : tit.value.trim(), dataV.value, horaV.value, fimV.value || (horaV.value ? somaMin(horaV.value, 60) : ''), meet.value.trim()).then(function (lk) {
                if (lk && lk !== meet.value.trim()) { meet.value = lk; C.from('curso_aulas').update({ link_meet: lk }).eq('id', id).then(function () { }); }
                P.mensagem(msg, dataV.value && horaV.value ? 'Salvo e na sua agenda do Google.' : 'Salvo.', 'ok');
              }, function (e) { P.mensagem(msg, 'Salvo, mas não consegui colocar na agenda do Google (' + ((e && e.message) || 'erro') + ').', 'erro'); });
            });
        });
        var partes = [].concat([el('h2', { text: (aoVivoA ? 'Aula ao vivo ' : 'Aula ') + a.ordem })]);
        if (curso.construindo !== false && !aoVivoA) partes.push(etapasDaAula(a, curso, null, null));
        var datasEt = Object.assign({}, a.datas_etapas || {}), camposEt = [];
        if (curso.construindo !== false && !aoVivoA) etapasDe(curso).filter(function (k) { return k !== 'upload'; }).forEach(function (k) {
          var di = el('input', { type: 'date', style: 'width:auto' }); di.value = datasEt[k] || '';
          di.addEventListener('change', function () { datasEt[k] = di.value || null; });
          camposEt.push(P.colunaData(di, 'Data: ' + ETAPAS.filter(function (e) { return e[0] === k; })[0][1].toLowerCase()));
        });
        corpo.appendChild(el('div', { class: 'portal-cartao' }, [].concat(
          partes, aoVivoA ? [] : campo('Nome', tit), aoVivoA ? [vivoBloco] : [], camposEt.length ? [P.linhaDatas(camposEt)] : [], campo(aoVivoA ? 'Link da gravação' : 'Link do vídeo', cod), [prev, msg, el('div', { style: 'display:none' }, [salvar])]))); P.salvarSozinho(salvar);
        var apagar = P.botaoApagar('Apagar esta aula');
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar a aula "' + a.titulo + '"? Não dá para desfazer.')) return;
          var apaga = function () { C.from('curso_aulas').delete().eq('id', id).then(function (x) { if (x.error) msgErro(msg, x.error); else voltar(); }); };
          if (aoVivoA) sincronizarAula(id, '', '', '', '', '').then(apaga, apaga); else apaga();
        });
        P.apagarNoFim(app, apagar);
      });
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { limpar(); P.montarNovaSenha(app, iniciar); } });
    if (P.emRecuperacao) { limpar(); P.montarNovaSenha(app, iniciar); return; }
    C.auth.getSession().then(function (r) {
      var u = r.data && r.data.session && r.data.session.user;
      if (u) iniciar(u); else mostrarLogin();
    });
  })();
