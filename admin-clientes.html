<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6d3a0">
  <title>Painel dos Clientes - Falando de Astrologia</title>
  
  <!-- Importação da fonte Cinzel do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="papiro.css?v=4">
  <link rel="stylesheet" href="home.css?v=18">
  <link rel="stylesheet" href="page.css?v=48">
  <link rel="stylesheet" href="portal.css?v=12">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/aluno.html">Alunos</a><a href="/index.html#servicos">Serviços</a><a href="/blog.html">Blog</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Painel dos Clientes</h1>
    <p class="portal-sub">Acesso restrito ao administrador</p>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=35"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    var nomeAdmin = '';

    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('clientes', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }

    function iniciar(user) {
      limpar();
      P.client.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        P.client.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          restaurar(user);
        });
      });
    }

    /* depois de recarregar: volta pro cliente em que você estava (endereço #cliente=ID) */
    function restaurar(user) {
      var h = P.estado.ler();
      if (!h.cliente) { listaDeClientes(user); return; }
      Promise.all([P.client.from('clientes').select('id,nome,email,whatsapp').eq('id', h.cliente).maybeSingle(),
                   P.client.from('cliente_codigos').select('codigo').eq('cliente_id', h.cliente).maybeSingle()]).then(function (r) {
        if (r[0].error || !r[0].data) { listaDeClientes(user); return; }
        var c = r[0].data; c.codigo = (r[1].data && r[1].data.codigo) || '';
        paginaDoCliente(user, c);
      }, function () { listaDeClientes(user); });
    }

    function listaDeClientes(user) {
      var h = P.estado.ler();
      var abertas = (!h.cliente && h.abertas != null) ? String(h.abertas).split(',').filter(function (x) { return x && x !== '-'; }) : ['clientes'];
      P.estado.gravar({ abertas: abertas.join(',') || '-' });
      limpar();
      app.appendChild(topo(nomeAdmin));
      /* ordem: Clientes (sanfona, com o botão de adicionar no topo e a busca), pasta dos clientes, login com o Google */
      var novoCliente = el('button', { type: 'button', class: 'portal-btn', text: 'Adicionar novo cliente' });
      var areaForm = el('div');
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Clientes' }), el('div', { class: 'portal-acoes', style: 'margin-bottom:14px' }, [novoCliente]), areaForm]);
      app.appendChild(P.sanfona(abertas, 'clientes', 'Clientes', [cartao]));

      var msg = el('p', { class: 'portal-msg' });
      var nome = el('input', { type: 'text', id: 'novoNome', required: '' });
      var email = el('input', { type: 'email', id: 'novoEmail', required: '' });
      var codigo = el('input', { type: 'text', id: 'novoCodigo', placeholder: 'Ex.: 0147' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar cliente' });
      var cancelarNovo = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelarNovo.addEventListener('click', function () { areaForm.textContent = ''; });
      var form = el('form', { class: 'portal-item', style: 'margin-bottom:14px' }, [
        el('p', { class: 'portal-item-titulo', text: 'Novo cliente' }),
        el('p', { text: 'Cadastre o nome e o Gmail que o cliente usou na contratação. O acesso dele é criado aqui, ao adicionar. Ele entra na página de Pós-atendimento com o Google, sem senha.' }),
        el('label', { for: 'novoCodigo', text: 'Código do cliente' }), codigo,
        el('label', { for: 'novoNome', text: 'Nome' }), nome,
        el('label', { for: 'novoEmail', text: 'E-mail (Gmail do cliente)' }), email, msg, el('div', { class: 'portal-acoes' }, [add, cancelarNovo])
      ]);
      form.addEventListener('submit', function (ev) {
        var avisoAcesso = '';
        var terminar = function () {
          if (!avisoAcesso) { listaDeClientes(user); return; }
          P.mensagem(msg, 'Cadastrado. Mas o acesso não foi criado agora (' + avisoAcesso + ').', 'erro');
          setTimeout(function () { listaDeClientes(user); }, 7000);
        };
        ev.preventDefault(); add.disabled = true; P.mensagem(msg, 'Criando o acesso...');
        /* primeiro o acesso (login) do cliente, criado pelo servidor; só depois a ficha dele aqui */
        P.client.auth.getSession().then(function (sessao) {
          var jwt = sessao.data && sessao.data.session ? sessao.data.session.access_token : '';
          return fetch('https://falandodeastrologia.vercel.app/api/criar-acesso', { method: 'POST', headers: { Authorization: 'Bearer ' + jwt, 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nome.value.trim(), email: email.value.trim() }) })
            .then(function (resp) { return resp.json().catch(function () { return {}; }).then(function (d) { if (!resp.ok) throw new Error(d.detalhe || d.erro || 'erro'); }); });
        }).then(function () {
          P.mensagem(msg, '');
          return P.client.from('clientes').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase() }).select('id').single();
        }).catch(function (e) {
          return { error: { message: e.message, acesso: true } };
        }).then(function (r) {
          if (r.error && r.error.acesso) { add.disabled = false; P.mensagem(msg, 'Não consegui criar o acesso agora (' + r.error.message + '). Tente de novo em instantes.', 'erro'); return; }
          if (r.error) { add.disabled = false; P.mensagem(msg, /duplicate|unique/i.test(r.error.message) ? 'Já existe um cliente com esse e-mail.' : P.traduzErro(r.error.message), 'erro'); return; }
          var cod = codigo.value.trim();
          if (!cod) { add.disabled = false; terminar(); return; }
          // o código fica numa tabela só do administrador: o cliente nunca consegue lê-lo
          P.client.from('cliente_codigos').insert({ cliente_id: r.data.id, codigo: cod }).then(function (rc) {
            add.disabled = false;
            if (rc.error) { P.mensagem(msg, /duplicate|unique/i.test(rc.error.message) ? 'Cliente criado, mas esse código já é de outro cliente. Abra o cliente e corrija o código.' : 'Cliente criado, mas não foi possível salvar o código.', 'erro'); setTimeout(function () { listaDeClientes(user); }, 6000); return; }
            terminar();
          });
        });
      });
      /* o cadastro só aparece quando você toca no botão (e tocar de novo não apaga o que já foi escrito) */
      novoCliente.addEventListener('click', function () {
        if (areaForm.firstChild) return;
        areaForm.appendChild(form); form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      app.appendChild(P.cartaoPastaBase('clientes'));
      var conexaoDrive = P.cartaoConexaoDrive();
      if (conexaoDrive) app.appendChild(conexaoDrive);

      Promise.all([
        P.client.from('clientes').select('id,nome,email,whatsapp').order('nome'),
        P.client.from('cliente_codigos').select('cliente_id,codigo')
      ]).then(function (res) {
        var r = res[0], rc = res[1];
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a lista.' })); return; }
        var codigos = {};
        (rc.data || []).forEach(function (c) { codigos[c.cliente_id] = c.codigo; });
        var clientes = P.ordenarPorCodigo(r.data.map(function (c) { c.codigo = codigos[c.id] || ''; return c; }));
        if (!clientes.length) { cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum cliente ainda.' })); return; }
        var busca = el('input', { type: 'search', id: 'buscaCliente', placeholder: 'Buscar por código, nome ou e-mail' });
        var lista = el('div');
        cartao.appendChild(busca);
        cartao.appendChild(lista);
        function desenhar() {
          var t = busca.value.trim().toLowerCase();
          lista.textContent = '';
          var achados = clientes.filter(function (c) { return !t || (c.codigo + ' ' + c.nome + ' ' + c.email).toLowerCase().indexOf(t) >= 0; });
          if (!achados.length) lista.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum cliente encontrado.' }));
          achados.forEach(function (c) {
            var abrir = el('button', { type: 'button', class: 'portal-btn', text: 'Abrir' });
            abrir.addEventListener('click', function () { paginaDoCliente(user, c); });
            lista.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: (c.codigo ? c.codigo + ' · ' : '') + c.nome }), el('span', { class: 'portal-item-data', text: c.email })]), abrir
            ])]));
          });
        }
        busca.addEventListener('input', desenhar);
        desenhar();
      });
    }

    function paginaDoCliente(user, cliente) {
      P.estado.gravar({ cliente: cliente.id });
      limpar();
      app.appendChild(topo(nomeAdmin));
      var voltar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '← Todos os clientes' });
      voltar.addEventListener('click', function () { listaDeClientes(user); });
      var verComoCliente = el('a', { class: 'portal-btn', href: 'cliente.html?ver=' + encodeURIComponent(cliente.id), target: '_blank', rel: 'noopener', text: 'Ver como cliente' });
      app.appendChild(el('div', { class: 'portal-topo' }, [voltar, verComoCliente]));

      /* dados do cliente: código, nome e pasta no Drive (o código só o administrador vê) */
      var msgCod = el('p', { class: 'portal-msg' });
      var codInput = el('input', { type: 'text', id: 'clienteCodigo', placeholder: 'Ex.: 0147' });
      codInput.value = cliente.codigo || '';
      var nomeInput = el('input', { type: 'text', id: 'clienteNome', required: '' });
      nomeInput.value = cliente.nome || '';
      var whatsInput = el('input', { type: 'tel', id: 'clienteWhats', placeholder: 'Ex.: 11 91234-5678' });
      whatsInput.value = cliente.whatsapp || '';
      var salvarCod = el('button', { type: 'submit', class: 'portal-btn', text: 'Salvar dados' });
      var pastaDrive = P.cartaoPastaDrive({ plural: 'clientes', tipo: 'cliente', id: cliente.id, email: cliente.email, dentroDeOutroBloco: true,
        codigo: function () { return cliente.codigo; },
        nome: function () { return (cliente.codigo ? cliente.codigo + ' - ' : '') + cliente.nome; } });
      var formCod = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: 'Dados do cliente' }),
        el('label', { for: 'clienteCodigo', text: 'Código' }), codInput,
        el('label', { for: 'clienteNome', text: 'Nome' }), nomeInput,
        el('label', { for: 'clienteWhats', text: 'WhatsApp' }), whatsInput,
        pastaDrive, msgCod, salvarCod
      ]);
      formCod.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var valor = codInput.value.trim();
        var novoNome = nomeInput.value.trim();
        if (!novoNome) { P.mensagem(msgCod, 'Escreva o nome.', 'erro'); return; }
        salvarCod.disabled = true;
        P.client.from('clientes').update({ nome: novoNome, whatsapp: whatsInput.value.trim() || null }).eq('id', cliente.id).then(function (r1) {
          if (r1.error) { salvarCod.disabled = false; P.mensagem(msgCod, P.traduzErro(r1.error.message), 'erro'); return; }
          var pedido = valor
            ? P.client.from('cliente_codigos').upsert({ cliente_id: cliente.id, codigo: valor }, { onConflict: 'cliente_id' })
            : P.client.from('cliente_codigos').delete().eq('cliente_id', cliente.id);
          pedido.then(function (r) {
            salvarCod.disabled = false;
            if (r.error) { P.mensagem(msgCod, /duplicate|unique/i.test(r.error.message) ? 'Nome salvo, mas esse código já é de outro cliente.' : P.traduzErro(r.error.message), 'erro'); return; }
            cliente.nome = novoNome; cliente.codigo = valor; cliente.whatsapp = whatsInput.value.trim() || null;
            paginaDoCliente(user, cliente);
          });
        });
      });
      app.appendChild(formCod);

      var msg = el('p', { class: 'portal-msg' });
      var servico = el('input', { type: 'text', id: 'entServico', required: '', placeholder: 'Escreva o que quiser, ou toque num atalho abaixo' });
      var atalhos = el('div', { class: 'portal-acoes', style: 'margin:-6px 0 14px' }, ['Mapa Natal Clássico', 'Revolução Solar', 'Previsões Astrológicas', 'Sinastria Clássica', 'Retificação de Mapa', 'Atendimento semanal'].map(function (nome) {
        var b2 = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: nome });
        b2.style.padding = '6px 10px'; b2.style.fontSize = '13px';
        b2.addEventListener('click', function () { servico.value = nome; servico.focus(); });
        return b2;
      }));
      var data = el('input', { type: 'date', id: 'entData' });
      var pdf = el('input', { type: 'url', id: 'entPdf', placeholder: 'https://drive.google.com/...' });
      var gravacao = el('input', { type: 'url', id: 'entGravacao', placeholder: 'https://drive.google.com/...' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar edição' });
      cancelar.style.display = 'none';
      var editandoId = null;
      var form = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: (cliente.codigo ? cliente.codigo + ' · ' : '') + cliente.nome }),
        el('p', { text: 'Escolha os arquivos no Drive: o link entra sozinho e o arquivo já é compartilhado com o e-mail do cliente (' + cliente.email + '). Se colar o link à mão, compartilhe no próprio Drive.' }),
        el('label', { for: 'entServico', text: 'Serviço' }), servico, atalhos,
        el('label', { for: 'entData', text: 'Data do serviço (opcional)' }), data,
        el('label', { for: 'entPdf', text: 'Link do PDF (opcional)' }), pdf, P.botaoDrive(pdf, function (t, tipo) { P.mensagem(msg, t, tipo); }, cliente.email, 'cliente:' + cliente.id),
        el('label', { for: 'entGravacao', text: 'Link da gravação (opcional)' }), gravacao, P.botaoDrive(gravacao, function (t, tipo) { P.mensagem(msg, t, tipo); }, cliente.email, 'cliente:' + cliente.id), msg,
        el('div', { class: 'portal-acoes' }, [add, cancelar])
      ]);
      function sairDaEdicao() { editandoId = null; form.reset(); add.textContent = 'Adicionar'; cancelar.style.display = 'none'; P.mensagem(msg, ''); }
      cancelar.addEventListener('click', sairDaEdicao);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var seguroPdf = pdf.value.trim() ? P.linkSeguro(pdf.value) : null;
        var seguroGrav = gravacao.value.trim() ? P.linkSeguro(gravacao.value) : null;
        if ((pdf.value.trim() && !seguroPdf) || (gravacao.value.trim() && !seguroGrav)) { P.mensagem(msg, 'Os links precisam começar com https://', 'erro'); return; }
        add.disabled = true;
        var campos = { servico: servico.value.trim(), data: data.value || null, pdf_link: seguroPdf, gravacao_link: seguroGrav };
        var pedido = editandoId
          ? P.client.from('entregas').update(campos).eq('id', editandoId)
          : P.client.from('entregas').insert(Object.assign({ cliente_id: cliente.id }, campos));
        pedido.then(function (r) {
          add.disabled = false;
          if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
          paginaDoCliente(user, cliente);
        });
      });
      app.appendChild(form);

      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'O que ' + cliente.nome + ' vê' })]);
      app.appendChild(cartao);
      P.client.from('entregas').select('id,servico,data,pdf_link,gravacao_link').eq('cliente_id', cliente.id)
        .order('data', { ascending: false, nullsFirst: false }).then(function (r) {
          if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar.' })); return; }
          if (!r.data.length) cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nada cadastrado ainda.' }));
          r.data.forEach(function (e) {
            var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
            editar.style.padding = '6px 12px'; editar.style.fontSize = '13px';
            editar.addEventListener('click', function () {
              editandoId = e.id; servico.value = e.servico; data.value = e.data || ''; pdf.value = e.pdf_link || ''; gravacao.value = e.gravacao_link || '';
              add.textContent = 'Salvar alterações'; cancelar.style.display = ''; P.mensagem(msg, 'Editando: ' + e.servico, 'ok');
              form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            var apagar = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Apagar' });
            apagar.addEventListener('click', function () {
              if (!confirm('Apagar "' + e.servico + '"? (Os arquivos no Drive não são apagados.)')) return;
              P.client.from('entregas').delete().eq('id', e.id).then(function (d) {
                if (d.error) alert('Não foi possível apagar.'); else paginaDoCliente(user, cliente);
              });
            });
            /* abre a conversa do WhatsApp com a mensagem pronta; quem envia (e pode editar antes) é o administrador, nada sai sozinho */
            var dig = String(cliente.whatsapp || '').replace(/\D/g, '');
            if (dig && (dig.length === 10 || dig.length === 11)) dig = '55' + dig;
            var primeiro = String(cliente.nome || '').trim().split(/\s+/)[0];
            var itens = [e.gravacao_link ? 'a gravação da sua sessão' : '', e.pdf_link ? 'o PDF' : ''].filter(Boolean);
            var texto = 'Oi ' + primeiro + '. Tudo bem?\n\n' +
              (itens.length ? 'Na página de Pós-atendimento do site você encontra ' + itens.join(' e ') + ', do serviço ' + e.servico + '.' : 'O material do serviço ' + e.servico + ' está na página de Pós-atendimento do site.') + '\n' +
              'Entre com o Gmail ' + cliente.email + ' (o mesmo da contratação):\n' +
              'https://falandodeastrologia.com.br/cliente.html\n\n' +
              'Você pode salvar com você, pra que sempre tenha acesso.' +
              (e.gravacao_link ? ' Não consigo garantir que vou ter a gravação sempre lá, porque às vezes preciso liberar espaço. Por isso recomendo baixar e guardar contigo.' : '') + '\n\n' +
              'Qualquer dúvida, estou à disposição.';
            var enviar = el('a', { class: 'portal-btn portal-btn-sec', href: 'https://wa.me/' + dig + '?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener', text: 'Enviar' });
            enviar.style.cssText = 'color:#4A7C59;border-color:#4A7C59';
            var tem = [e.pdf_link ? 'PDF' : '', e.gravacao_link ? 'gravação' : ''].filter(Boolean).join(' + ');
            cartao.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: e.servico }),
                el('span', { class: 'portal-item-data', text: (e.data ? P.dataBR(e.data) + ' · ' : '') + (tem || 'sem arquivos') })]),
              el('div', { class: 'portal-acoes' }, [enviar, editar, apagar])
            ])]));
          });
        });

      var remover = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Remover este cliente' });
      remover.addEventListener('click', function () {
        if (!confirm('Remover ' + cliente.nome + '? Os serviços dele também somem daqui (os arquivos do Drive ficam).')) return;
        P.client.from('clientes').delete().eq('id', cliente.id).then(function (d) {
          if (d.error) alert('Não foi possível remover.'); else listaDeClientes(user);
        });
      });
      app.appendChild(remover);
    }

    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
  <script src="menu.js?v=26" defer></script>
</body>
