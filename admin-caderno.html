<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('fda_admin'))document.documentElement.className+=' fda-admin-tela'}catch(e){}</script>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Caderno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="temas.css?v=5">
  <script src="moldura.js?v=20261109a"></script>
  <link rel="stylesheet" href="papiro.css?v=5">
  <link rel="stylesheet" href="home.css?v=21">
  <link rel="stylesheet" href="page.css?v=90">
  <link rel="stylesheet" href="portal.css?v=33">
  <link rel="stylesheet" href="tema-paginas.css?v=42">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="tipografia.css?v=37">
  <link rel="stylesheet" href="caderno-financeiro.css?v=1">
  <link rel="stylesheet" href="caderno-producao.css?v=1">
  <link rel="stylesheet" href="caderno-projetos.css?v=1">
  <style>
    /* CADERNO do Hellenic Daily: uma folha aberta (duas páginas) dentro de uma capa de cor escolhida, com marcadores dos dois lados.
       Só desenho: os dados são os mesmos da Agenda (Google, To do, horas planetárias). */
    .cad{position:fixed;inset:0;z-index:1000;background:var(--capa,#A03E25);--moldura-m:.22;display:none}
    .cad.on{display:block}
    .cad::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--capa-fio,#e6d3a0);pointer-events:none}
    .cad .miolo{position:absolute;inset:22px 104px 22px 76px}
    .cad .folha :where(*:not(canvas):not(.lp):not(.lp *)){touch-action:pan-y} /* as listas que rolam não engolem o gesto de virar a página */
    .cad .folha{touch-action:pan-y;position:relative;height:100%;background:var(--papiro-fundo);display:flex}
    .cad .folha::after{z-index:3}
    .cad .pag{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
      padding:calc(130px*var(--moldura-m) + 14px) 46px calc(130px*var(--moldura-m) + 12px) calc(80px*var(--moldura-m) + 22px)}
    .cad .pag.dir{padding-left:46px;padding-right:calc(80px*var(--moldura-m) + 22px)}
    .cad .dobra{flex:none;position:relative;z-index:4;width:0;margin:0;pointer-events:none}
    /* costura do caderno: sombra da lombada dos dois lados, vinco no meio e fio com pontos */
    .cad .dobra::before{content:"";position:absolute;top:0;bottom:0;left:-34px;width:68px;
      background:linear-gradient(90deg,rgba(60,35,10,0) 0,rgba(60,35,10,.07) 30%,rgba(60,35,10,.2) 47%,rgba(40,22,6,.34) 50%,rgba(60,35,10,.2) 53%,rgba(60,35,10,.07) 70%,rgba(60,35,10,0) 100%)}
    .cad .dobra::after{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;
      background:repeating-linear-gradient(180deg,var(--terracota) 0 9px,transparent 9px 17px);opacity:.9}
    .cad button{cursor:pointer}
    .cad .rolagem{flex:1;min-height:0;overflow-y:auto}

    /* marcadores presos na capa */
    .cad .abas{position:absolute;top:56px;bottom:56px;width:56px;display:flex;flex-direction:column;gap:3px;z-index:2}
    .cad .abas.esq{left:20px}.cad .abas.dir{right:20px;width:84px}
    .cad .aba{flex:1;min-height:0;border:0;border-radius:0;padding:0;background:var(--papiro-fundo-simples);display:flex;align-items:center;justify-content:center;color:var(--azul-egipcio-escuro);font-size:14px;font-weight:700;text-decoration:none!important}
    .cad .abas.esq .aba{clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 calc(100% - 12px),0 12px)}
    .cad .abas.dir .aba{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 14px) 100%,0 100%)}
    .cad .aba span{writing-mode:vertical-rl;transform:rotate(180deg)}
    .cad .abas.dir .aba span{writing-mode:horizontal-tb;transform:none;white-space:nowrap}
    .cad .aba.aberta{color:var(--ocre)}
    .cad .abas.esq .aba.aberta{margin-right:-8px}.cad .abas.dir .aba.aberta{margin-left:-8px}
    .cad .abas.dir .aba.peq{flex:.55}
    .cad .abas.dir .aba.peq span{writing-mode:horizontal-tb;transform:none}
    .cad .abas.dir .vao{flex:.4}
    .cad .ano{position:absolute;left:20px;width:56px;text-align:center;color:var(--capa-fio,#e6d3a0);font-size:13px;background:none;border:0;padding:0;z-index:2}
    .cad .ano.cima{top:20px}.cad .ano.baixo{bottom:20px}

    /* página da esquerda */
    .cad .topo{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-start}
    .cad .hoje{flex:1 1 210px;min-width:0;text-align:center}
    .cad .logo-daily{display:block;width:210px;height:auto;margin:0 auto 6px}
    .cad .cal{flex:0 1 auto;max-width:100%;margin:0 auto}
    .cad .mes{display:flex;justify-content:center;align-items:center;gap:6px;white-space:nowrap;color:var(--terracota);font-size:16px;margin-top:8px}
    .cad .seta{background:none;border:0;color:var(--terracota);font-size:26px;line-height:1;padding:0 8px}
    .cad .num-linha{display:flex;justify-content:center;align-items:center;gap:6px}
    .cad .num{font-size:84px;line-height:1;color:var(--terracota);margin:4px 0 2px;font-weight:700}
    .cad .sem{font-size:16px;margin:0}
    .cad .reg{margin-top:8px;display:flex;justify-content:center;gap:18px;align-items:center;font-size:15px;flex-wrap:wrap}
    .cad .ic{font-family:AstroIcones;line-height:1;display:inline-block;font-size:26px;vertical-align:middle}
    .cad .mini{flex:none;border-collapse:collapse;font-size:14px}
    .cad .mini th{font-size:11px;color:var(--ocre);padding:2px 3px 5px}
    .cad .mini td{text-align:center;padding:0}
    .cad .mini td button{background:none;border:0;padding:4px 4px;color:var(--preto-tinta);font-family:inherit;font-size:14px;text-transform:none}
    .cad .mini td.fds button{color:var(--azul-egipcio-claro)}
    .cad .mini td.h button{color:var(--terracota);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
    .cad .mini td.ns{font-size:10px;color:var(--ocre);padding-right:4px}
    .cad .tarefa{display:flex;gap:14px;align-items:flex-start;padding:11px 0 10px;border-bottom:1px solid var(--azul-egipcio-claro)}
    .cad .cx{flex:none;width:22px;height:22px;border:1.5px solid var(--azul-egipcio-claro);margin-top:3px;background:transparent;padding:0;border-radius:0;color:var(--terracota);font-size:18px;line-height:1}
    .cad .tarefa .nome{text-transform:uppercase;font-size:18px;letter-spacing:.3px;overflow-wrap:anywhere}
    .cad .tarefa .det{font-size:13px;margin-top:2px;color:var(--terracota)}
    .cad .vazio{opacity:.7;margin:14px 0}
    .cad .pauta{flex:none;height:140px;background:repeating-linear-gradient(180deg,transparent 0,transparent 53px,var(--azul-egipcio-claro) 53px,var(--azul-egipcio-claro) 54px)}

    /* página da direita: o dia em horas planetárias */
    .cad .diatodo{display:flex;align-items:center;gap:10px;padding:0 0 8px 76px;min-height:34px;flex-wrap:wrap}
    .cad .bloco{background:var(--ocre);color:#16233F;padding:3px 10px;font-size:15px}
    .cad .linha{position:relative;flex:1;min-height:0}
    .cad .hp{position:absolute;left:0;right:0;border-top:1px solid var(--azul-egipcio-claro);display:flex;align-items:flex-start}
    .cad .hp .r{width:76px;display:flex;align-items:center;gap:7px;padding-top:2px;font-size:13px}
    .cad .hp .r .ic{font-size:20px;width:22px;text-align:center}
    .cad .ev{position:absolute;left:84px;right:4px;padding:0 10px;line-height:1.25;min-height:22px;font-size:15px;overflow:hidden;display:flex;gap:10px;align-items:baseline;text-decoration:none;cursor:pointer}
    .cad .ev small{font-size:12px}
    .cad .agora{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--terracota);z-index:2}
    .cad .agora i{position:absolute;right:0;top:-11px;background:var(--terracota);color:#F3E3B8;font-style:normal;font-weight:700;font-size:12px;padding:2px 8px}
    .cad .falha{color:var(--terracota);font-size:13px;margin:0 0 6px 76px}

    /* folha pequena (cor da capa, nova tarefa) */
    .cad-fundo{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
    .cad-fundo .cx-folha{background:var(--papiro-fundo);padding:22px 24px;max-width:420px;width:100%;border:1.5px solid var(--azul-egipcio-escuro)}
    .cad-fundo h2{margin:0 0 12px}
    .cad-cores{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 16px}
    .cad-cores button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0}
    .cad-cores button.sel{border-color:var(--preto-tinta);box-shadow:0 0 0 2px var(--papiro-meio) inset}
    .cad-fundo input[type=text],.cad-fundo select{width:100%;box-sizing:border-box}
    .cad-fundo .cx-folha.larga{max-width:520px;max-height:90vh;overflow-y:auto}
    .cad-fundo .det-enc{font-size:13px;margin:0 0 4px}
    .cad-fundo .tarefa{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--azul-egipcio-claro)}
    .cad-fundo .cx{flex:none;width:22px;height:22px;border:1.5px solid var(--azul-egipcio-claro);background:transparent;padding:0;border-radius:0;color:var(--terracota);font-size:18px;line-height:1}
    .cad .hora-linha{padding:5px 0 6px;border-bottom:1px solid var(--azul-egipcio-claro);cursor:pointer}
    .cad .hora-linha.ativa{border-left:3px solid var(--terracota);padding-left:6px}

    /* celular: uma página por vez; marcadores em cima (rolam) e as duas páginas embaixo */
    @media (max-width:820px){
      .cad{--moldura-m:.16}
      .cad::before{inset:5px}
      .cad .miolo{inset:58px 12px 64px}
      .cad .abas.esq,.cad .ano{display:none}
      .cad .abas.dir{flex-direction:row;height:44px;width:auto;top:10px;bottom:auto;left:14px;right:14px;overflow-x:auto;overflow-y:hidden;gap:3px}
      .cad .abas.dir .aba{flex:0 0 auto;min-width:74px;padding:0 10px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);font-size:12px}
      .cad .abas.dir .aba span{writing-mode:horizontal-tb;transform:none}
      .cad .abas.dir .aba.aberta{margin:0 0 -6px}
      .cad .abas.dir .vao,.cad .abas.dir .aba.peq{display:none}
      .cad .dobra{display:none}
      .cad .pag,.cad .pag.dir{padding:calc(130px*var(--moldura-m) + 12px) calc(80px*var(--moldura-m) + 12px)}
      .cad.p1 .pag.dir,.cad.p2 .pag.esq{display:none}
      .cad .topo{gap:6px}
      .cad .logo-daily{width:165px}
      .cad .num{font-size:72px}.cad .mes{font-size:14px;margin-top:4px}.cad .sem{font-size:13px}
      .cad .reg{flex-direction:column;gap:4px;font-size:13px}
      .cad .mini{font-size:13px}.cad .mini td button{padding:4px 5px;font-size:13px}.cad .mini th{padding:2px 5px 4px;font-size:10px}
      .cad .mini .ns{display:none}
      .cad .tarefa .nome{font-size:15px}
      .cad .hp .r{width:64px;font-size:12px}.cad .ev{left:70px;font-size:13px}.cad .diatodo{padding-left:64px}.cad .falha{margin-left:64px}
    }

    /* as outras visões (semana, mês, ano, lista) e as telas de antes dentro da folha */
    .cad .vdia,.cad .vout{flex:1;min-height:0;display:flex;flex-direction:column}
    .cad .vout{display:none}
    .cad.v-outra .vdia{display:none}.cad.v-outra .vout{display:flex}
    .cad .logo-topo{display:block;width:250px;height:auto;margin:0 auto 4px}
    .cad .cab-vista{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--terracota);font-size:19px;margin:2px 0 8px}
    .cad .cab-vista .t{text-align:center;min-width:0}
    .cad .dsem{flex:1;min-height:0;border-bottom:1px solid var(--azul-egipcio-claro);padding:6px 0 4px;display:flex;flex-direction:column;overflow:hidden}
    .cad .dsem:last-child{border-bottom:0}
    .cad .dsem-cab{align-self:flex-start;background:none;border:0;padding:0;color:var(--terracota);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;text-transform:lowercase}
    .cad .dsem-cab.eh-hoje{text-decoration:underline;text-decoration-color:var(--ocre);text-decoration-thickness:2px;text-underline-offset:4px}
    .cad .dsem-cab .ic{font-size:20px}
    .cad .lev{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.3;text-decoration:none;color:var(--preto-tinta);margin-top:2px}
    .cad .lev small{font-size:12px;color:var(--terracota);flex:none;min-width:38px}
    .cad .lev i{flex:none;width:8px;height:8px;border-radius:50%;align-self:center}
    .cad .lev span{min-width:0;overflow-wrap:anywhere}
    .cad .rola{flex:1;min-height:0;overflow-y:auto}
    .cad .grade-mes{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(6,minmax(0,1fr));border-top:1px solid var(--azul-egipcio-claro);border-left:1px solid var(--azul-egipcio-claro)}
    .cad .grade-mes>*{border-right:1px solid var(--azul-egipcio-claro);border-bottom:1px solid var(--azul-egipcio-claro);min-width:0;min-height:0;overflow:hidden}
    .cad .grade-mes .sem-cab{text-align:center;font-size:12px;color:var(--ocre);padding:3px 0}
    .cad .cel{padding:2px 3px;display:flex;flex-direction:column;gap:1px}
    .cad .cel.fora{opacity:.45}
    .cad .cel .n{align-self:flex-start;background:none;border:0;padding:0 2px;font-family:inherit;font-size:14px;color:var(--preto-tinta);text-transform:none}
    .cad .cel.fds .n{color:var(--azul-egipcio-claro)}
    .cad .cel.eh-hoje .n{color:var(--terracota);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
    .cad .chip{display:block;font-size:11px;line-height:1.2;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
    .cad .mais{font-size:11px;color:var(--terracota);padding:0 4px}
    .cad .dia-lista{padding:6px 0 4px;border-bottom:1px solid var(--azul-egipcio-claro)}
    .cad .dia-lista:last-child{border-bottom:0}
    .cad .anos{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px 22px}
    .cad .mm{display:flex;flex-direction:column;min-height:0}
    .cad .mm .nm{align-self:flex-start;background:none;border:0;padding:0;color:var(--azul-egipcio-escuro);font-size:15px;margin-bottom:2px}
    .cad .mm .nm.atual{color:var(--terracota)}
    .cad .mm .g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);align-content:start}
    .cad .mm .g b{font-weight:400;text-align:center;font-size:10px;color:var(--ocre)}
    .cad .mm .g button{background:none;border:0;padding:3px 0 6px;font-family:inherit;font-size:13px;color:var(--preto-tinta);position:relative;text-transform:none}
    .cad .mm .g button.fds{color:var(--azul-egipcio-claro)}
    .cad .mm .g button.eh-hoje{color:var(--terracota);font-weight:700}
    .cad .mm .g button.tem::after{content:"";position:absolute;left:50%;bottom:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ocre)}
    .cad .embed{display:none;position:absolute;z-index:2;border:0;background:transparent;
      left:calc(80px*var(--moldura-m) + 14px);right:calc(80px*var(--moldura-m) + 14px);top:calc(130px*var(--moldura-m) + 8px);bottom:calc(130px*var(--moldura-m) + 8px);
      width:calc(100% - 2*(80px*var(--moldura-m) + 14px));height:calc(100% - 2*(130px*var(--moldura-m) + 8px))}
    .cad.v-embed .embed{display:block}
    .cad.v-embed .pag,.cad.v-embed .dobra{visibility:hidden}
    .cad.v-config .dobra{visibility:visible}
    .cad .abas.dir .aba:not(.peq){font-size:12px}
    @media (max-width:820px){.cad .logo-topo{width:165px}.cad .grade-mes .cel .chip{font-size:9px}.cad .cel .n{font-size:12px}.cad .anos{gap:6px 10px}.cad .mm .g button{font-size:11px;padding:2px 0 5px}}
    .cad .folha.vf .pag.dir{animation:entraDir .32s ease-out}.cad .folha.vf .pag.esq{animation:entraFade .24s ease-out}
    .cad .folha.vt .pag.esq{animation:entraEsq .32s ease-out}.cad .folha.vt .pag.dir{animation:entraFade .24s ease-out}
    @keyframes entraDir{from{transform:translateX(46px);opacity:0}to{transform:none;opacity:1}}
    @keyframes entraEsq{from{transform:translateX(-46px);opacity:0}to{transform:none;opacity:1}}
    @keyframes entraFade{from{opacity:.35}to{opacity:1}}
    .cad-aviso{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:1200;background:var(--papiro-fundo-simples);border:1.5px solid var(--terracota);color:var(--terracota);padding:10px 18px;max-width:86vw;text-align:center}
    .cad .leitor-barra{display:none;position:absolute;left:76px;right:104px;bottom:calc(130px*var(--moldura-m) + 4px);z-index:4;justify-content:center;align-items:center;gap:2px;flex-wrap:nowrap}
    .cad.v-livro .leitor-barra{display:flex}
    .cad .lp,.cad .lp *{touch-action:pan-y!important}
    .cad.leitor-zoom .lp,.cad.leitor-zoom .lp *{touch-action:pan-x pan-y!important}
    .cad .leitor-barra.topo{bottom:auto;top:calc(22px + 130px*var(--moldura-m) + 8px)}
    .cad .leitor-barra .lb-g{box-sizing:border-box;flex:1 1 50%;min-width:0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px;padding:0 40px}
    .cad.v-livro .pag,.cad.v-livro .pag.dir{padding-bottom:calc(130px*var(--moldura-m) + 46px);padding-top:calc(130px*var(--moldura-m) + 48px)}
    .cad.v-livro .logo-topo{display:none}
    .cad .portal-cartao{border-top:0!important;padding-top:4px!important}
    .cad .rola.portal{padding:0 2px;overflow-x:hidden;margin:0!important;width:100%!important;max-width:100%!important}
    .cad .rola .portal-cartao{width:100%;max-width:100%;box-sizing:border-box;min-width:0;overflow-x:clip}
    .cad .rola .portal-cartao>div,.cad .rola .portal-cartao>form{min-width:0;max-width:100%}
    .cad .troca{display:none}
    @media (max-width:820px){
      .cad .troca{display:flex;position:absolute;left:14px;right:14px;bottom:10px;height:44px;gap:3px}
      .cad .troca .aba{clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px));font-size:13px}
      .cad .troca .aba.aberta{margin-top:-6px}
    }
  </style>
</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Caderno</h1>
    <div id="app"></div>
  </div></div>

  <div class="cad" id="cad">
    <button type="button" class="ano cima botao-fixo" id="anoMenos"></button>
    <div class="abas esq" id="meses"></div>
    <button type="button" class="ano baixo botao-fixo" id="anoMais"></button>
    <div class="miolo"><div class="folha papiro-moldura">
      <section class="pag esq"><div class="vdia" id="diaEsq">
        <div class="topo">
          <div class="hoje">
            <img class="logo-daily" src="img/logo-menu-daily-linha.svg?v=1" alt="Hellenic Daily" width="1100" height="190">
            <div class="num-linha"><button type="button" class="seta" id="diaAnt" aria-label="Dia anterior">‹</button><div class="num botao-fixo" id="numDia"></div><button type="button" class="seta" id="diaProx" aria-label="Próximo dia">›</button></div>
            <p class="sem" id="semana"></p>
            <div class="reg"><span><span class="rotulo-fixo">dia de</span> <span class="ic" id="icDia" style="color:var(--terracota)"></span></span><span><span class="rotulo-fixo">hora de</span> <span class="ic" id="icHora"></span> <span id="ateHora"></span></span></div>
          </div>
          <div class="cal"><table class="mini" id="mini"></table>

        voltar: function () { leitorAtual = null; leitorLivro = null; empurrar(); mostrarVisao(); virar('tras'); }, /* sai do PDF e volta para a estante, para escolher outro */
        aoMudar: function (e, d) { document.getElementById('t1').textContent = e ? 'pág. ' + e : 'capa'; document.getElementById('t2').textContent = d ? 'pág. ' + d : 'fim'; },
        obterPdf: function (progresso) {
          return P.tokenGoogle().then(function (token) { return fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(livro.drive_id) + '?alt=media&supportsAllDrives=true', { headers: { Authorization: 'Bearer ' + token } }); }).then(function (r) {
            if (!r.ok) throw new Error(r.status === 404 ? 'sumiu' : 'drive');
            var total = Number(r.headers.get('Content-Length')) || 0; if (!r.body || !r.body.getReader) return r.arrayBuffer();
            var leitor = r.body.getReader(), partes = [], lido = 0;
            return (function passo() { return leitor.read().then(function (x) { if (x.done) { var tudo = new Uint8Array(lido), p0 = 0; partes.forEach(function (p) { tudo.set(p, p0); p0 += p.length; }); return tudo.buffer; } partes.push(x.value); lido += x.value.length; progresso(total ? Math.round(lido / total * 100) + '%' : Math.round(lido / 1048576) + ' MB'); return passo(); }); })();
          });
        },
        carregarTracos: function (pg) { return C.from('leitor_tracos').select('tracos').eq('livro_id', livro.id).eq('pagina', pg).maybeSingle().then(function (x) { return x.data ? (x.data.tracos || []) : null; }); },
        salvarTracos: function (pg, tracos) {
          var q = tracos.length ? C.from('leitor_tracos').upsert({ livro_id: livro.id, pagina: pg, tracos: tracos, atualizado_em: new Date().toISOString() }, { onConflict: 'livro_id,pagina' }) : C.from('leitor_tracos').delete().eq('livro_id', livro.id).eq('pagina', pg);
          return q.then(function (x) { if (x.error) throw x.error; });
        },
        salvarPagina: function (pg, total) { livro.pagina = pg; livro.total = total; C.from('leitor_livros').update({ pagina: pg, total: total, atualizado_em: new Date().toISOString() }).eq('id', livro.id).then(function () {}); }
      });
    }

    /* ---------- começo ---------- */
    function mostrar() {
      app.textContent = ''; document.querySelector('.portal-titulo').style.display = 'none';
      cad.classList.add('on', pagCel);
      document.getElementById('t' + (pagCel === 'p1' ? 1 : 2)).classList.add('aberta');
      var h = /#v=(\w+)&d=(\d{4}-\d{2}-\d{2})/.exec(location.hash); if (h && ABAS.some(function (y) { return y[0] === h[1]; })) { visao = h[1]; ancora = h[2]; }
      irPara(visao);
    }
    function iniciar(user) {
      app.textContent = '';
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) { app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })])); return; }
        mostrar();
        valorSite('daily_visual').then(function (v) { if (v === 'padrao' && !/[?&]caderno=1/.test(location.search)) location.replace('admin-agenda.html' + location.hash); });
        valorSite('daily_capa').then(function (c) { if (c && CAPAS.some(function (x) { return x[0] === c; })) pintarCapa(c); });
      });
    }
    try { var guardada = localStorage.getItem('fda_caderno_capa'); if (guardada && CAPAS.some(function (x) { return x[0] === guardada; })) capa = guardada; } catch (e) { /* sem armazenamento */ }
    pintarCapa(capa);
    ancora = isoDia(Date.now());
    montarMarcadores();
    document.getElementById('mesAnt').addEventListener('click', function () { ancora = mudaMes(ancora, -1); desenhar(); });
    document.getElementById('mesProx').addEventListener('click', function () { ancora = mudaMes(ancora, 1); desenhar(); });
    document.getElementById('diaAnt').addEventListener('click', function () { ancora = somaDias(ancora, -1); desenhar(); });
    document.getElementById('diaProx').addEventListener('click', function () { ancora = somaDias(ancora, 1); desenhar(); });
    document.getElementById('anoMenos').addEventListener('click', function () { ancora = mudaMes(ancora, -12); desenhar(); });
    document.getElementById('anoMais').addEventListener('click', function () { ancora = mudaMes(ancora, 12); desenhar(); });
    function paginaCel(p) { pagCel = p; cad.classList.remove('p1', 'p2'); cad.classList.add(p); document.getElementById('t1').classList.toggle('aberta', p === 'p1'); document.getElementById('t2').classList.toggle('aberta', p === 'p2'); }
    window.addEventListener('resize', function () { if (leitorAtual && leitorAtual.aoRedimensionar) leitorAtual.aoRedimensionar(); });
    document.getElementById('t1').addEventListener('click', function () { paginaCel('p1'); });
    document.getElementById('t2').addEventListener('click', function () { paginaCel('p2'); });
    document.getElementById('tMais').addEventListener('click', function () { if (visao === 'todo') novaTarefa(); else modAgenda().novo({ dia: ancora }); });
    (function () { /* o dedo vira a página: para a direita volta, para a esquerda avança */
      var folha = cad.querySelector('.folha'), x0 = 0, y0 = 0, t0 = 0, ativo = false, id = 0;
      folha.addEventListener('pointerdown', function (ev) { var t = ev; if (ev.pointerType !== 'touch' || (ev.target.closest && (ev.target.closest('input,textarea,select,[style*="overflow-x"]') || (ev.target.closest('canvas') && !ev.target.closest('.lp'))))) { ativo = false; return; } if (ativo) { ativo = false; return; } id = ev.pointerId; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); ativo = true; });
      folha.addEventListener('pointercancel', function () { ativo = false; });
      folha.addEventListener('pointerup', function (ev) { if (!ativo || ev.pointerId !== id) return; ativo = false; var t = ev, dx = t.clientX - x0, dy = t.clientY - y0; if (Date.now() - t0 > 1500 || Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.8) return; if (visao === 'leitor' && leitorLivro && leitorAtual) { if (leitorAtual.zoom() === 1) { virar(dx > 0 ? 'tras' : 'frente'); leitorAtual.virar(dx > 0 ? -1 : 1); } return; } if (visao === 'financeiro' && !cad.classList.contains('v-embed')) { finMudarMes(dx > 0 ? -1 : 1); return; } if (dx > 0) { if (!voltarPagina()) periodo(-1); } else { if (!avancarPagina()) periodo(1); }});
    })();
    C.auth.getSession().then(function (r) { if (r.data && r.data.session) iniciar(r.data.session.user); else P.montarLogin(app, iniciar); });
  })();
  </script>
</body>
