  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('quadro', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        lerLista().then(function () {
          var ab = P.estado.ler().quadro, qual = lista.filter(function (x) { return x.id === ab; })[0];
          tela(); if (qual) abrir(qual);
        });
      });
    }
    /* as apresentações (uma para cada cliente, aula, live...): linha "::lista" da tabela quadros. A primeira de todas é a "principal". */
    var lista = [{ id: 'principal', nome: 'Quadro' }], linhas = {};
    function primeiraTela(q) {
      var pfx = q.id === 'principal' ? '' : q.id + ':', ind = linhas[pfx + 'indice'], ordem = (ind && ind.ordem) || [];
      return { dados: linhas[ordem[0]] || linhas[pfx + 'principal'] || {}, total: Math.max(1, ordem.length) };
    }
    function lerLista() {
      /* lê tudo de uma vez: a lista e a primeira tela de cada apresentação (para a miniatura) */
      return C.from('quadros').select('id,dados').then(function (r) {
        linhas = {};
        (r.data || []).forEach(function (x) { linhas[x.id] = x.dados || {}; });
        var l = linhas['::lista'] && linhas['::lista'].lista;
        if (Array.isArray(l) && l.length) lista = l;
      });
    }
    function guardarLista(msg) {
      return C.from('quadros').upsert({ id: '::lista', dados: { lista: lista }, atualizado_em: new Date().toISOString() }).then(function (r) { if (r.error && msg) msg.textContent = P.traduzErro(r.error.message); });
    }
    function abrir(q) {
      P.estado.mesclar({ quadro: q.id });
      window.Quadro.abrir({ id: q.id, voltar: function () { P.estado.mesclar({ quadro: '' }); setTimeout(function () { lerLista().then(tela); }, 400); } });
    }
    function apagar(q, msg) {
      var filtro = q.id === 'principal' ? C.from('quadros').select('id,dados').not('id', 'like', '%:%') : C.from('quadros').select('id,dados').like('id', q.id + ':%');
      filtro.then(function (r) {
        if (r.error) { msg.textContent = P.traduzErro(r.error.message); return; }
        var ids = [], arquivos = [];
        (r.data || []).forEach(function (l) { ids.push(l.id); ((l.dados && l.dados.itens) || []).forEach(function (x) { if (x.tipo === 'img' && x.arq) arquivos.push(x.arq); }); });
        if (arquivos.length) C.storage.from('site').remove(arquivos);
        (ids.length ? C.from('quadros').delete().in('id', ids) : Promise.resolve({})).then(function () {
          lista = lista.filter(function (x) { return x !== q; });
          guardarLista(msg).then(tela);
        });
      });
    }
    function tela() {
      limpar();
      app.appendChild(topo(''));
      var msg = el('p', { class: 'portal-aviso' });
      var nova = el('button', { type: 'button', class: 'portal-btn', text: '+ Apresentação' });
      nova.addEventListener('click', function () {
        var nome = (prompt('Nome da apresentação') || '').trim(); if (!nome) return;
        var q = { id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nome: nome };
        lista.unshift(q); guardarLista(msg).then(function () { tela(); abrir(q); });
      });
      app.appendChild(el('div', { class: 'portal-acoes' }, [nova])); app.appendChild(msg);
      var caixa = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:20px 16px;margin:18px 0 0' });
      if (!lista.length) caixa.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhuma apresentação ainda.' }));
      lista.forEach(function (q) {
        var pt = primeiraTela(q);
        var cel = el('div', { style: 'cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent', role: 'button', tabindex: '0' }, [
          window.Quadro.miniatura(pt.dados),
          el('div', { class: 'portal-item-titulo', text: q.nome, style: 'margin-top:6px;overflow-wrap:anywhere;font-size:12px;line-height:1.25' }),
          el('div', { class: 'portal-item-data', text: pt.total + (pt.total === 1 ? ' tela' : ' telas'), style: 'font-size:12px' })
        ]);
        var ren = P.botaoApagar('Renomear'), rem = P.botaoApagar('Apagar');
        [ren, rem].forEach(function (b) { [['padding', '0'], ['margin', '0'], ['min-height', '0'], ['font-size', '11px'], ['line-height', '1.5']].forEach(function (x) { b.style.setProperty(x[0], x[1], 'important'); }); });
        ren.addEventListener('click', function (e) {
          e.stopPropagation();
          var nome = (prompt('Nome da apresentação', q.nome) || '').trim(); if (!nome || nome === q.nome) return;
          q.nome = nome; guardarLista(msg).then(tela);
        });
        rem.addEventListener('click', function (e) {
          e.stopPropagation();
          if (!confirm('Apagar a apresentação "' + q.nome + '" inteira, com todas as telas? Não dá para desfazer.')) return;
          apagar(q, msg);
        });
        cel.appendChild(el('div', { style: 'display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px' }, [ren, rem]));
        cel.addEventListener('click', function () { abrir(q); });
        caixa.appendChild(cel);
      });
      app.appendChild(caixa);
    }
    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
