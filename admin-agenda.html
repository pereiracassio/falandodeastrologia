</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=71"></script>
  <script src="menu.js?v=36" defer></script>
  <script src="hora-planetaria.js?v=1"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app'), HP = window.horaPlanetaria;
    var LAT = -23.3053, LON = -45.9658; /* lugar das horas planetárias: vem de Configurações (site_config.prod_local_horas); padrão Jacareí */
    var lugarNome = 'Jacareí';
    var CAL = 'https://www.googleapis.com/calendar/v3';
    var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
    /* o que fazer -> em qual hora planetária (mude aqui se quiser outra combinação) */
    var TAREFAS = [['Estudar', 'Mercúrio'], ['Produzir vídeo (roteiro, edição)', 'Mercúrio'], ['Gravar vídeo', 'Sol'], ['Mentoria e atendimento', 'Júpiter'], ['Rotina e organização', 'Saturno'], ['Outra coisa', 'Mercúrio']];
    var nomeAdmin = '', calendarios = [], eventos = [], DIAS_BUSCA = 7;
    var DIA = 86400000, HORA_PX = 48, ATIVA = null;
    var SEM_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    var VISOES = [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano']];
    var visao = 'semana', ancora = '', areaForm = null, atualizar = function () {};

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('agenda', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function p2(n) { return String(n).padStart(2, '0'); }
    /* tudo em horário de Brasília: "local" = ms deslocado, lido com os métodos UTC */
    function loc(ms) { return new Date(ms + HP.FUSO); }
    function hhmm(ms) { var d = loc(ms); return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); }
    function isoDia(ms) { var d = loc(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
    function doIso(dia, hora) { var a = dia.split('-'), h = (hora || '00:00').split(':'); return Date.UTC(+a[0], +a[1] - 1, +a[2], +h[0], +h[1]) - HP.FUSO; }
    function meiaNoiteDe(ms) { return doIso(isoDia(ms), '00:00'); }
    function rotuloDia(iso) {
      var a = iso.split('-'), d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]));
      var hoje = isoDia(Date.now()), amanha = isoDia(Date.now() + 86400000);
      var nome = iso === hoje ? 'Hoje' : iso === amanha ? 'Amanhã' : SEMANA[d.getUTCDay()].replace(/^./, function (c) { return c.toUpperCase(); });
      return nome + ', ' + (+a[2]) + ' de ' + MESES[+a[1] - 1];
    }
    function duracaoTxt(min) { return min < 60 ? min + ' min' : (min % 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : min / 60 + ' h'); }

    /* ---------- Google Agenda (a mesma conexão permanente do Drive) ---------- */
    function gapi(caminho, opcoes, jaTentou) {
      return P.tokenGoogle().then(function (token) {
        opcoes = opcoes || {};
        opcoes.headers = Object.assign({ Authorization: 'Bearer ' + token }, opcoes.headers || {});
        return fetch(CAL + caminho, opcoes);
      }).then(function (r) {
        if (r.status === 401 && !jaTentou) { try { sessionStorage.removeItem('fda_drive_token'); } catch (e) { /* sem armazenamento */ } return gapi(caminho, opcoes, true); }
        if (r.status === 403) return r.json().then(function (j) { var e = new Error('permissao'); e.detalhe = JSON.stringify(j).slice(0, 200); throw e; }, function () { throw new Error('permissao'); });
        if (r.status === 204) return null;
        if (!r.ok) return r.text().then(function (t) { throw new Error('Google ' + r.status + ': ' + t.slice(0, 160)); });
        return r.json();
      });
    }
    function cartaoConectar(texto, botao) {
      var msg = el('p', { class: 'portal-msg' });
      var b = el('button', { type: 'button', class: 'portal-btn', text: botao });
      b.addEventListener('click', function () {
        b.disabled = true;
        C.auth.getSession().then(function (r) {
          return fetch('https://falandodeastrologia.vercel.app/api/drive?acao=iniciar&volta=' + encodeURIComponent('/admin-agenda.html'), { headers: { Authorization: 'Bearer ' + r.data.session.access_token } });
        }).then(function (r) { if (!r.ok) throw new Error('iniciar'); return r.json(); })
          .then(function (d) { location.href = d.url; })
          .catch(function () { b.disabled = false; P.mensagem(msg, 'Não foi possível iniciar. Tente de novo.', 'erro'); });
      });
      return el('div', { class: 'portal-cartao' }, [el('p', { text: texto }), el('div', { class: 'portal-acoes' }, [b]), msg]);
    }

    function normalizar(e, cal) {
      if (e.status === 'cancelled') return null;
      var diaTodo = !!(e.start && e.start.date);
      var ini = diaTodo ? doIso(e.start.date, '00:00') : Date.parse(e.start.dateTime);
      var fim = diaTodo ? doIso(e.end.date, '00:00') : Date.parse(e.end.dateTime);
      var recusou = (e.attendees || []).some(function (a) { return a.self && a.responseStatus === 'declined'; });
      return { id: e.id, calId: cal.id, calNome: cal.summary, titulo: e.summary || '(sem título)', ini: ini, fim: fim, diaTodo: diaTodo, link: e.htmlLink, meet: e.hangoutLink || ((e.conferenceData && e.conferenceData.entryPoints || []).filter(function (p) { return p.entryPointType === 'video'; })[0] || {}).uri || '', local: e.location || '', descricao: e.description || '',
        ocupa: !diaTodo && e.transparency !== 'transparent' && !recusou, editavel: (cal.accessRole === 'owner' || cal.accessRole === 'writer') };
    }
    /* lugar das horas planetárias e lista de agendas: uma vez só */
    var prontoP = null;
    function preparar() {
      if (prontoP) return prontoP;
      prontoP = C.from('site_config').select('valor').eq('chave', 'prod_local_horas').maybeSingle().then(function (r) {
        try { var v = r.data && r.data.valor ? JSON.parse(r.data.valor) : null; if (v && isFinite(v.lat) && isFinite(v.lon)) { LAT = +v.lat; LON = +v.lon; lugarNome = String(v.nome || 'outro lugar'); } } catch (e) { /* fica o padrão */ }
      }, function () {}).then(function () { return gapi('/users/me/calendarList?minAccessRole=reader'); }).then(function (l) {
        return C.from('site_config').select('valor').eq('chave', 'agenda_ocultas').maybeSingle().then(function (r) {
          var ocultas = []; try { ocultas = r.data && r.data.valor ? JSON.parse(r.data.valor) : []; } catch (e) { /* mostra todas */ }
          calendarios = (l.items || []).filter(function (c) { return ocultas.indexOf(c.id) < 0; }); /* o que ele desmarcou em Configurações fica de fora (nem aparece nem bloqueia horário) */
        }, function () { calendarios = l.items || []; });
      });
      prontoP.catch(function () { prontoP = null; });
      return prontoP;
    }
    /* compromissos de todas as agendas marcadas, entre dois instantes (ms) */
    function eventosEntre(de, ate) {
      return preparar().then(function () {
        return Promise.all(calendarios.map(function (c) {
          return gapi('/calendars/' + encodeURIComponent(c.id) + '/events?' + new URLSearchParams({ timeMin: new Date(de).toISOString(), timeMax: new Date(ate).toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '2500', timeZone: 'America/Sao_Paulo' }))
            .then(function (r) { return (r.items || []).map(function (e) { return normalizar(e, c); }); }, function () { return []; });
        }));
      }).then(function (listas) { return [].concat.apply([], listas).filter(Boolean).sort(function (a, b) { return a.ini - b.ini; }); });
    }

    /* ---------- tela ---------- */
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          if (/[?&]drive=ok/.test(location.search)) { try { sessionStorage.removeItem('fda_drive_token'); history.replaceState(null, '', location.pathname); } catch (e) { /* sem armazenamento */ } }
          tela();
        });
      });
    }

    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var corpo = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]);
      app.appendChild(corpo);
      preparar().then(function () { corpo.textContent = ''; montar(corpo); }, function (e) {
        corpo.textContent = '';
        if (e.message === 'desconectado') corpo.appendChild(cartaoConectar('Para ver a sua agenda, conecte o Google uma vez. Depois disso não pede mais.', 'Conectar o Google'));
        else if (e.message === 'permissao') corpo.appendChild(cartaoConectar('O Google ainda não deixou o site ver a sua agenda. É só dar essa permissão uma vez.', 'Permitir o Google Agenda'));
        else corpo.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível abrir a agenda agora (' + e.message + ').' }));
      });
    }

    /* ---------- datas (texto "AAAA-MM-DD", sempre no horário de Brasília) ---------- */
    function somaDias(iso, n) { var a = iso.split('-'), d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2] + n)); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
    function somaMeses(iso, n) {
      var a = iso.split('-'), d = new Date(Date.UTC(+a[0], +a[1] - 1 + n, 1)), dim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
      return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(Math.min(+a[2], dim));
    }
    function diaSem(iso) { var a = iso.split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])).getUTCDay(); }
    function diasNoMes(a, m) { return new Date(Date.UTC(a, m, 0)).getUTCDate(); }
    function intervalo() { /* [de, ate) em ms do que a tela atual mostra */
      var a = ancora.split('-'), ini;
      if (visao === 'dia') return [doIso(ancora), doIso(somaDias(ancora, 1))];
      if (visao === 'semana') { ini = somaDias(ancora, -diaSem(ancora)); return [doIso(ini), doIso(somaDias(ini, 7))]; }
      if (visao === 'mes') { var pri = a[0] + '-' + a[1] + '-01'; ini = somaDias(pri, -diaSem(pri)); return [doIso(ini), doIso(somaDias(ini, 42))]; }
      return [doIso(a[0] + '-01-01'), doIso((+a[0] + 1) + '-01-01')];
    }
    function curto(iso) { var a = iso.split('-'); return (+a[2]) + ' de ' + MES_CURTO[+a[1] - 1]; }
    function tituloPeriodo() {
      var a = ancora.split('-');
      if (visao === 'dia') return rotuloDia(ancora);
      if (visao === 'semana') { var ini = somaDias(ancora, -diaSem(ancora)), fim = somaDias(ini, 6); return curto(ini) + ' a ' + curto(fim) + ' de ' + fim.slice(0, 4); }
      if (visao === 'mes') return MESES[+a[1] - 1] + ' de ' + a[0];
      return a[0];
    }
    function abrirEvento(e) {
      detalhe(areaForm, e);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    /* tocar num compromisso só MOSTRA (título, quando, onde, Meet, anotações); o lápis abre a edição, se a agenda deixar */
    function detalhe(destino, e) {
      destino.textContent = '';
      var ultimo = isoDia(Math.max(e.ini, e.fim - 1)), quando = e.diaTodo ? (isoDia(e.ini) === ultimo ? 'o dia todo' : 'de ' + curto(isoDia(e.ini)) + ' a ' + curto(ultimo)) : hhmm(e.ini) + ' às ' + hhmm(e.fim);
      var fechar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Fechar' });
      fechar.addEventListener('click', function () { destino.textContent = ''; });
      var acoes = [];
      if (e.meet) acoes.push(el('a', { class: 'portal-btn portal-btn-meet portal-meet', href: P.linkSeguro(e.meet) || e.meet, target: '_blank', rel: 'noopener', title: 'Entrar no Meet', 'aria-label': 'Entrar no Meet' }, [el('img', { src: 'img/rede-meet.svg', alt: '', width: '40', height: '40' })]));
      acoes.push(fechar);
      var topo = el('div', { style: 'display:flex;align-items:flex-start;justify-content:space-between;gap:10px' }, [el('h2', { text: e.titulo, style: 'margin:0;flex:1' })]);
      if (e.editavel) {
        var lapis = el('button', { type: 'button', title: 'Editar', 'aria-label': 'Editar', text: '✎', style: 'flex:none;width:44px;height:44px;padding:0;background:transparent;border:2px solid #1F5FA3;border-radius:0;color:#1034A6;font-size:24px;line-height:1;cursor:pointer' });
        lapis.addEventListener('click', function () { formulario(destino, e, {}); });
        topo.appendChild(lapis);
      }
      var filhos = [topo, el('p', { text: rotuloDia(isoDia(e.ini)) + ' · ' + quando, style: 'margin:10px 0 0' })];
      if (e.local) filhos.push(el('p', { text: e.local, style: 'margin:6px 0 0' }));
      var nota = String(e.descricao || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '').trim();
      if (nota) filhos.push(el('p', { text: nota.length > 600 ? nota.slice(0, 600) + '…' : nota, style: 'white-space:pre-line;margin:10px 0 0' }));
      filhos.push(el('p', { class: 'portal-item-data', text: 'Agenda "' + e.calNome + '"' + (e.editavel ? '' : ', só de leitura') + '.' }));
      filhos.push(el('div', { class: 'portal-acoes', style: 'margin-top:12px' }, acoes));
      destino.appendChild(el('div', { class: 'portal-cartao' }, filhos));
    }
    function doDia(iso, evs) { var d0 = doIso(iso), d1 = d0 + DIA; return evs.filter(function (e) { return e.ini < d1 && e.fim > d0 && (e.diaTodo || e.fim > e.ini || e.ini >= d0); }); }
    var linhaFina = '1px solid rgba(31,95,163,.35)';
    /* o ícone ocre do Meet (o mesmo da página do aluno), pequeno, na frente do título */
    function marcaMeet(px) { return el('img', { src: 'img/rede-meet.svg', alt: 'Meet', width: String(px), height: String(px), style: 'vertical-align:middle;margin-right:3px' }); }
    function bloco(texto, estilo) { var d = el('div', { text: texto }); d.style.cssText = estilo; return d; }

    /* ---------- tela com as quatro visões ---------- */
    function montar(corpo) {
      var ent = P.estado.ler();
      ancora = /^\d{4}-\d{2}-\d{2}$/.test(ent.d || '') ? ent.d : isoDia(Date.now());
      if (['dia', 'semana', 'mes', 'ano'].indexOf(ent.v) >= 0) visao = ent.v;
      areaForm = el('div');
      var vista = el('div'), titulo = el('h2', { style: 'margin:0;text-align:center;flex:1;font-size:16px' }), encaixe = el('div');
      var novo = el('button', { type: 'button', class: 'portal-btn', text: '+ Compromisso' });
      novo.addEventListener('click', function () { formulario(areaForm, null, { dia: visao === 'dia' ? ancora : undefined }); });
      var abas = el('div', { class: 'portal-abas', role: 'tablist', style: 'margin-top:14px' }), botoes = {};
      VISOES.forEach(function (v) {
        var b = el('button', { type: 'button', class: 'portal-aba', text: v[1] });
        b.addEventListener('click', function () { visao = v[0]; mudou(); });
        botoes[v[0]] = b; abas.appendChild(b);
      });
      var passo = function (n) { ancora = visao === 'dia' ? somaDias(ancora, n) : visao === 'semana' ? somaDias(ancora, 7 * n) : visao === 'mes' ? somaMeses(ancora, n) : somaMeses(ancora, 12 * n); mudou(); };
      var ant = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '‹', 'aria-label': 'Anterior' }), prox = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '›', 'aria-label': 'Próximo' });
      var hoje = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Hoje' });
      ant.addEventListener('click', function () { passo(-1); }); prox.addEventListener('click', function () { passo(1); });
      hoje.addEventListener('click', function () { ancora = isoDia(Date.now()); mudou(); });
      var nav = el('div', { style: 'display:flex;align-items:center;gap:8px;margin:6px 0 12px' }, [ant, titulo, prox, hoje]);
      corpo.appendChild(el('div', { class: 'portal-acoes' }, [novo]));
      corpo.appendChild(areaForm); corpo.appendChild(abas); corpo.appendChild(nav); corpo.appendChild(vista);
      encaixe.appendChild(painelEncaixe(areaForm)); corpo.appendChild(encaixe);

      var pedido = 0;
      function mudou() {
        VISOES.forEach(function (v) { botoes[v[0]].className = 'portal-aba' + (v[0] === visao ? ' ativa' : ''); botoes[v[0]].setAttribute('aria-selected', v[0] === visao ? 'true' : 'false'); });
        P.estado.gravar({ v: visao, d: ancora });
        titulo.textContent = tituloPeriodo();
        vista.textContent = ''; vista.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
        var meu = ++pedido, iv = intervalo();
        eventosEntre(iv[0], iv[1]).then(function (evs) {
          if (meu !== pedido) return;
          eventos = evs; vista.textContent = '';
          if (visao === 'dia' || visao === 'semana') vistaGrade(vista, visao === 'dia' ? [ancora] : [0, 1, 2, 3, 4, 5, 6].map(function (k) { return somaDias(somaDias(ancora, -diaSem(ancora)), k); }), evs);
          else if (visao === 'mes') vistaMes(vista, evs); else vistaAno(vista, evs);
        }, function (e) { if (meu === pedido) { vista.textContent = ''; vista.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar (' + e.message + ').' })); } });
      }
      atualizar = mudou;
      mudou();
    }

    /* coloca os compromissos lado a lado quando se sobrepõem */
    function colunas(lista) {
      var res = [], grupo = [], fimGrupo = 0;
      function fechar() { var n = 0; grupo.forEach(function (g) { n = Math.max(n, g.col + 1); }); grupo.forEach(function (g) { g.cols = n; }); res = res.concat(grupo); grupo = []; fimGrupo = 0; }
      lista.forEach(function (x) {
        if (grupo.length && x.i >= fimGrupo) fechar();
        var usados = {}; grupo.forEach(function (g) { if (g.f > x.i) usados[g.col] = 1; });
        var c = 0; while (usados[c]) c++;
        x.col = c; grupo.push(x); fimGrupo = Math.max(fimGrupo, x.f);
      });
      fechar(); return res;
    }

    /* ícone do planeta: a fonte AstroIcones do site (a mesma do blog e das atividades; Sol U+E000, Lua, Mercúrio, Vênus, Marte, Júpiter, Saturno em seguida) */
    var ORDEM_ICONES = ['Sol', 'Lua', 'Mercúrio', 'Vênus', 'Marte', 'Júpiter', 'Saturno'];
    function iconePlaneta(nome, px, cor) {
      return el('span', { text: String.fromCharCode(0xE000 + ORDEM_ICONES.indexOf(nome)), title: nome, 'aria-label': nome,
        style: 'display:inline-block;font-family:AstroIcones,sans-serif!important;font-size:' + px + 'px;line-height:1;color:' + (cor || '#1F5FA3') + ';vertical-align:middle;flex:none' });
    }
    /* as horas planetárias de um dia civil, cortadas na meia-noite: cada uma vira uma linha da grade */
    function segmentosDoDia(iso) {
      var d0 = doIso(iso), d1 = d0 + DIA;
      return HP.horasEntre(d0, d1, LAT, LON).map(function (h) { return { ini: Math.max(h.ini, d0), fim: Math.min(h.fim, d1), planeta: h.planeta, noite: h.noite }; }).filter(function (s) { return s.fim > s.ini; });
    }
    function yDe(segs, t, H) { /* onde, na coluna, fica um instante: dentro da linha da hora planetária em que ele cai */
      for (var k = 0; k < segs.length; k++) if (t < segs[k].fim) return k * H + Math.max(0, (t - segs[k].ini)) / (segs[k].fim - segs[k].ini) * H;
      return segs.length * H;
    }

    /* Dia e Semana: as linhas são as HORAS PLANETÁRIAS (não as horas do relógio); em cada linha o ícone do planeta e a hora em que ela começa */
    function vistaGrade(vista, isos, evs) {
      var unico = isos.length === 1, hoje = isoDia(Date.now()), H = unico ? 56 : 50;
      var todos = isos.map(segmentosDoDia), linhasMax = Math.max.apply(null, todos.map(function (s) { return s.length; }));
      var altura = linhasMax * H, modelo = (unico ? '78px ' : '') + 'repeat(' + isos.length + ', minmax(0, 1fr))';
      var caixa = el('div');
      var cab = el('div', { style: 'display:grid;grid-template-columns:' + modelo }); if (unico) cab.appendChild(el('div'));
      isos.forEach(function (iso) {
        var b = el('button', { type: 'button', style: 'background:transparent;border:0;border-radius:0;cursor:pointer;padding:6px 0;font-family:var(--fonte-mao);color:#16233F;text-align:center' });
        b.appendChild(el('div', { text: SEM_CURTO[diaSem(iso)], style: 'font-size:11px' }));
        var n = el('div', { text: String(+iso.slice(8)), style: 'font-size:16px;font-weight:700;display:inline-block;min-width:26px;line-height:26px' });
        if (iso === hoje) n.style.cssText += ';border:2px solid #1F5FA3;color:#A03E25';
        b.appendChild(n);
        if (!unico) b.addEventListener('click', function () { visao = 'dia'; ancora = iso; atualizar(); });
        cab.appendChild(b);
      });
      caixa.appendChild(cab);
      if (evs.some(function (e) { return e.diaTodo; })) {
        var linhaTodo = el('div', { style: 'display:grid;grid-template-columns:' + modelo + ';border-top:' + linhaFina }); if (unico) linhaTodo.appendChild(el('div'));
        isos.forEach(function (iso) {
          var c = el('div', { style: 'padding:2px;min-width:0' });
          doDia(iso, evs).filter(function (e) { return e.diaTodo; }).forEach(function (e) {
            var t = bloco(e.titulo, 'font-size:10px;line-height:1.3;border:1px solid #1F5FA3;padding:1px 3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#16233F');
            t.addEventListener('click', function () { abrirEvento(e); }); c.appendChild(t);
          });
          linhaTodo.appendChild(c);
        });
        caixa.appendChild(linhaTodo);
      }
      var corpo = el('div', { style: 'display:grid;grid-template-columns:' + modelo + ';border-top:' + linhaFina });
      if (unico) { /* a régua do lado: ícone do planeta e hora em que a hora planetária começa */
        var gut = el('div', { style: 'position:relative;height:' + altura + 'px' });
        todos[0].forEach(function (s, k) {
          var l = el('div', { style: 'position:absolute;left:0;right:4px;top:' + (k * H) + 'px;height:' + H + 'px;box-sizing:border-box;display:flex;align-items:center;justify-content:flex-end;gap:5px;border-top:' + linhaFina + ';font-size:11px;color:#16233F' });
          l.appendChild(el('span', { text: hhmm(s.ini), style: 'opacity:.75' })); l.appendChild(iconePlaneta(s.planeta, 22, s.noite ? '#16233F' : '#1F5FA3'));
          gut.appendChild(l);
        });
        corpo.appendChild(gut);
      }
      isos.forEach(function (iso, di) {
        var d0 = doIso(iso), d1 = d0 + DIA, segs = todos[di];
        var col = el('div', { style: 'position:relative;height:' + altura + 'px;border-left:' + linhaFina + ';cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ' + (H - 1) + 'px,rgba(31,95,163,.3) ' + (H - 1) + 'px,rgba(31,95,163,.3) ' + H + 'px)' });
        if (!unico) segs.forEach(function (s, k) { /* na semana cada coluna tem o seu ícone e hora, no cantinho da linha */
          var m = el('div', { style: 'position:absolute;left:2px;top:' + (k * H + 2) + 'px;display:flex;align-items:center;gap:2px;font-size:9px;color:#16233F;opacity:.7;pointer-events:none' });
          m.appendChild(iconePlaneta(s.planeta, 13, s.noite ? '#16233F' : '#1F5FA3')); m.appendChild(el('span', { text: hhmm(s.ini) }));
          col.appendChild(m);
        });
        col.addEventListener('click', function (ev) {
          var y = ev.clientY - col.getBoundingClientRect().top, k = Math.min(segs.length - 1, Math.max(0, Math.floor(y / H)));
          if (!segs.length) return;
          var t0 = segs[k].ini + (y / H - k) * (segs[k].fim - segs[k].ini); t0 = Math.floor(t0 / 300000) * 300000;
          var t1 = Math.min(t0 + 3600000, d1 - 60000);
          formulario(areaForm, null, { dia: iso, ini: hhmm(t0), fim: hhmm(t1) });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        var itens = doDia(iso, evs).filter(function (e) { return !e.diaTodo; }).map(function (e) { return { e: e, i: Math.max(e.ini, d0), f: Math.min(e.fim, d1) }; }).sort(function (p, q) { return p.i - q.i; });
        colunas(itens).forEach(function (x) {
          var top = yDe(segs, x.i, H), alt = Math.max(16, yDe(segs, x.f, H) - top - 1);
          var b = el('div', { style: 'position:absolute;box-sizing:border-box;overflow:hidden;border:1px solid #1F5FA3;border-left:3px solid #B5852F;padding:1px 3px;font-size:' + (unico ? 13 : 10) + 'px;line-height:1.25;color:#16233F;cursor:pointer;top:' + top + 'px;height:' + alt + 'px;left:' + (x.col / x.cols * 100) + '%;width:' + (100 / x.cols) + '%' });
          var tt = el('div', { style: 'font-weight:700' }); if (x.e.meet) tt.appendChild(marcaMeet(unico ? 16 : 12)); tt.appendChild(document.createTextNode(x.e.titulo)); b.appendChild(tt);
          if (alt >= 34) b.appendChild(el('div', { text: unico ? hhmm(x.e.ini) + ' às ' + hhmm(x.e.fim) : hhmm(x.e.ini), style: 'font-size:' + (unico ? 11 : 9) + 'px;color:#A03E25' }));
          b.addEventListener('click', function (ev) { ev.stopPropagation(); abrirEvento(x.e); });
          col.appendChild(b);
        });
        if (iso === hoje && segs.length) { var agora = yDe(segs, Date.now(), H); if (agora > 0 && agora < segs.length * H) col.appendChild(bloco('', 'position:absolute;left:0;right:0;top:' + agora + 'px;border-top:2px solid #A03E25;pointer-events:none')); }
        corpo.appendChild(col);
      });
      caixa.appendChild(corpo);
      if (unico && !evs.length) caixa.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:10px', text: 'Nada marcado neste dia. Toque numa hora planetária para marcar.' }));
      vista.appendChild(caixa);
    }

    /* Mês */
    function vistaMes(vista, evs) {
      var a = ancora.split('-'), pri = a[0] + '-' + a[1] + '-01', ini = somaDias(pri, -diaSem(pri)), hoje = isoDia(Date.now());
      var linhas = Math.ceil((diaSem(pri) + diasNoMes(+a[0], +a[1])) / 7);
      var g = el('div', { style: 'display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:' + linhaFina + ';border-left:' + linhaFina });
      SEM_CURTO.forEach(function (s) { g.appendChild(bloco(s, 'font-size:11px;text-align:center;padding:4px 0;border-right:' + linhaFina + ';border-bottom:' + linhaFina)); });
      for (var k = 0; k < linhas * 7; k++) {
        (function (iso) {
          var fora = iso.slice(0, 7) !== a[0] + '-' + a[1];
          var c = el('div', { style: 'min-height:84px;padding:2px;min-width:0;cursor:pointer;border-right:' + linhaFina + ';border-bottom:' + linhaFina + ';' + (fora ? 'opacity:.45' : '') });
          var n = el('div', { text: String(+iso.slice(8)), style: 'font-size:12px;font-weight:700;display:inline-block;min-width:20px;line-height:20px;text-align:center' });
          if (iso === hoje) n.style.cssText += ';border:2px solid #1F5FA3;color:#A03E25';
          c.appendChild(n);
          var lista = doDia(iso, evs);
          lista.slice(0, 3).forEach(function (e) { var ch = bloco((e.diaTodo ? '' : hhmm(e.ini) + ' ') + e.titulo, 'font-size:10px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:2px solid #B5852F;padding-left:2px;margin-top:2px;color:#16233F'); if (e.meet) ch.insertBefore(marcaMeet(10), ch.firstChild); c.appendChild(ch); });
          if (lista.length > 3) c.appendChild(bloco('+' + (lista.length - 3), 'font-size:10px;color:#A03E25;margin-top:2px'));
          c.addEventListener('click', function () { visao = 'dia'; ancora = iso; atualizar(); });
          g.appendChild(c);
        })(somaDias(ini, k));
      }
      vista.appendChild(g);
    }

    /* Ano: os 12 meses de uma vez; dia com compromisso ganha uma barrinha ocre (mais grossa quando tem mais) */
    function vistaAno(vista, evs) {
      var ano = +ancora.split('-')[0], hoje = isoDia(Date.now()), conta = {};
      evs.forEach(function (e) {
        var d = isoDia(e.ini), ultimo = isoDia(Math.max(e.ini, e.fim - 1));
        for (var n = 0; d <= ultimo && n < 40; n++) { conta[d] = (conta[d] || 0) + 1; d = somaDias(d, 1); }
      });
      var g = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:18px 14px' });
      for (var m = 1; m <= 12; m++) {
        (function (m) {
          var pri = ano + '-' + p2(m) + '-01', cx = el('div');
          var nome = el('button', { type: 'button', text: MESES[m - 1], style: 'background:transparent;border:0;border-radius:0;cursor:pointer;padding:2px 0;margin-bottom:4px;font-family:Cinzel,serif;font-size:13px;font-weight:700;color:#A03E25;text-transform:lowercase' });
          nome.addEventListener('click', function () { visao = 'mes'; ancora = pri; atualizar(); });
          cx.appendChild(nome);
          var t = el('div', { style: 'display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px' });
          ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(function (s) { t.appendChild(bloco(s, 'opacity:.6;padding:1px 0')); });
          for (var v = 0; v < diaSem(pri); v++) t.appendChild(el('div'));
          for (var d = 1; d <= diasNoMes(ano, m); d++) {
            var iso = ano + '-' + p2(m) + '-' + p2(d), n = conta[iso] || 0;
            var c = el('div', { text: String(d), style: 'cursor:pointer;line-height:20px;box-sizing:border-box;color:#16233F;' + (n ? 'font-weight:700;border-bottom:' + (n >= 3 ? 4 : 2) + 'px solid #B5852F;' : '') + (iso === hoje ? 'outline:2px solid #1F5FA3;outline-offset:-2px;color:#A03E25;' : '') });
            (function (iso) { c.addEventListener('click', function () { visao = 'dia'; ancora = iso; atualizar(); }); })(iso);
            t.appendChild(c);
          }
          cx.appendChild(t); g.appendChild(cx);
        })(m);
      }
      vista.appendChild(g);
    }

    /* criar / editar um compromisso (novo vai para a agenda principal) */
    function formulario(destino, e, pre) {
      destino.textContent = '';
      var todo = e ? e.diaTodo : !!pre.todo;
      var titulo = el('input', { type: 'text', placeholder: 'O que é', value: e ? e.titulo : (pre.titulo || '') });
      var dia = el('input', { type: 'date', value: e ? isoDia(e.ini) : (pre.dia || isoDia(Date.now())) });
      var ate = el('input', { type: 'date', value: e && e.diaTodo ? isoDia(Math.max(e.ini, e.fim - 1)) : (pre.dia || isoDia(Date.now())) });
      var ini = el('input', { type: 'time', value: e && !e.diaTodo ? hhmm(e.ini) : (pre.ini || '09:00') });
      var fim = el('input', { type: 'time', value: e && !e.diaTodo ? hhmm(e.fim) : (pre.fim || '10:00') });
      var msg = el('p', { class: 'portal-msg' });
      /* "o dia todo": caixinha só com contorno, como no resto do painel */
      var cx = el('button', { type: 'button', role: 'checkbox', style: 'flex:none;width:26px;height:26px;padding:0;margin:0;background:transparent;border:2px solid #1F5FA3;border-radius:0;color:#A03E25;font-size:18px;line-height:20px;font-weight:700;cursor:pointer;text-align:center' });
      var blocoHora = el('div'), blocoAte = el('div');
      var pinta = function () { cx.textContent = todo ? '✓' : ''; cx.setAttribute('aria-checked', todo ? 'true' : 'false'); blocoHora.style.display = todo ? 'none' : ''; blocoAte.style.display = todo ? '' : 'none'; };
      cx.addEventListener('click', function () { todo = !todo; pinta(); });
      var nomeCx = el('span', { text: 'O dia todo', style: 'cursor:pointer' }); nomeCx.addEventListener('click', function () { todo = !todo; pinta(); });
      var linhaTodo = el('div', { style: 'display:flex;align-items:center;gap:12px;margin:14px 0 10px' }, [cx, nomeCx]);
      var campo = function (r, c) { return [el('label', { text: r }), c]; };
      campo('Início', ini).concat(campo('Fim', fim)).forEach(function (n) { blocoHora.appendChild(n); });
      campo('Até o dia', ate).forEach(function (n) { blocoAte.appendChild(n); });
      pinta();
      var salvar = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar' });
      var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelar.addEventListener('click', function () { destino.textContent = ''; });
      salvar.addEventListener('click', function () {
        var t = titulo.value.trim(), corpo;
        if (!t || !dia.value) { P.mensagem(msg, 'Preencha o nome e o dia.', 'erro'); return; }
        if (todo) {
          if (!ate.value || ate.value < dia.value) { P.mensagem(msg, 'O "até o dia" precisa ser o mesmo dia ou depois.', 'erro'); return; }
          corpo = { summary: t, start: { date: dia.value, dateTime: null }, end: { date: somaDias(ate.value, 1), dateTime: null } };
        } else {
          if (!ini.value || !fim.value) { P.mensagem(msg, 'Preencha os dois horários.', 'erro'); return; }
          var a = doIso(dia.value, ini.value), b = doIso(dia.value, fim.value);
          if (b <= a) { P.mensagem(msg, 'O fim precisa ser depois do início.', 'erro'); return; }
          corpo = { summary: t, start: { dateTime: new Date(a).toISOString(), date: null, timeZone: 'America/Sao_Paulo' }, end: { dateTime: new Date(b).toISOString(), date: null, timeZone: 'America/Sao_Paulo' } };
        }
        salvar.disabled = true;
        var cham = e ? gapi('/calendars/' + encodeURIComponent(e.calId) + '/events/' + encodeURIComponent(e.id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) })
          : gapi('/calendars/primary/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
        cham.then(function () { destino.textContent = ''; atualizar(); }, function (er) { salvar.disabled = false; P.mensagem(msg, 'Não foi possível salvar (' + er.message + ').', 'erro'); });
      });
      var filhos = [el('h2', { text: e ? 'Editar compromisso' : 'Novo compromisso' })].concat(campo('Nome', titulo), campo('Dia', dia), [linhaTodo, blocoHora, blocoAte, el('div', { class: 'portal-acoes', style: 'margin-top:12px' }, [salvar, cancelar]), msg]);
      if (e) {
        var ap = P.botaoApagar('Apagar');
        ap.addEventListener('click', function () {
          if (!confirm('Apagar "' + e.titulo + '"? Não dá para desfazer.')) return;
          gapi('/calendars/' + encodeURIComponent(e.calId) + '/events/' + encodeURIComponent(e.id), { method: 'DELETE' }).then(function () { destino.textContent = ''; atualizar(); }, function (er) { P.mensagem(msg, 'Não foi possível apagar (' + er.message + ').', 'erro'); });
        });
        filhos.push(el('div', { style: 'margin:28px 0 4px;text-align:center' }, [ap]));
      }
      destino.appendChild(el('div', { class: 'portal-cartao' }, filhos));
    }

    /* ---------- encaixar uma tarefa pela hora planetária ---------- */
    function painelEncaixe(area) {
      var o = el('select'); TAREFAS.forEach(function (t, i) { o.appendChild(el('option', { value: String(i), text: t[0] })); });
      var planeta = el('select'); HP.CALDEIA.forEach(function (n) { planeta.appendChild(el('option', { value: n, text: n })); });
      planeta.value = TAREFAS[0][1];
      o.addEventListener('change', function () { planeta.value = TAREFAS[+o.value][1]; });
      var dur = el('select'); [30, 45, 60, 90, 120, 180].forEach(function (m) { dur.appendChild(el('option', { value: String(m), text: duracaoTxt(m) })); }); dur.value = '60';
      var de = el('input', { type: 'time', value: '06:00' }), ate = el('input', { type: 'time', value: '22:00' });
      var botao = el('button', { type: 'button', class: 'portal-btn', text: 'Ver horários' });
      var res = el('div');
      botao.addEventListener('click', function () { sugerir(res, area, TAREFAS[+o.value][0], planeta.value, +dur.value, de.value, ate.value); });
      var campo = function (r, c) { return [el('label', { text: r }), c]; };
      return el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Onde encaixar uma tarefa' })].concat(
        campo('O que você vai fazer', o), campo('Na hora de', planeta), campo('Quanto tempo', dur), campo('Não antes de', de), campo('Não depois de', ate),
        [el('div', { class: 'portal-acoes', style: 'margin-top:12px' }, [botao]), res, el('p', { class: 'portal-item-data', style: 'margin-top:12px', text: 'Horas planetárias de ' + lugarNome + '. O lugar se troca em Configurações.' })]));
    }

    function sugerir(res, area, tarefa, planeta, minutos, deHora, ateHora) {
      res.textContent = '';
      var primeiro = meiaNoiteDe(Date.now());
      res.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:12px', text: 'Procurando...' }));
      eventosEntre(primeiro, primeiro + DIAS_BUSCA * DIA).then(function (evs) { res.textContent = ''; acharHorarios(res, area, evs, tarefa, planeta, minutos, deHora, ateHora); }, function (e) { res.textContent = ''; res.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível consultar a agenda (' + e.message + ').' })); });
    }
    function acharHorarios(res, area, eventos, tarefa, planeta, minutos, deHora, ateHora) {
      var agora = Math.ceil(Date.now() / 300000) * 300000, primeiro = meiaNoiteDe(Date.now()), achados = [], dias = DIAS_BUSCA;
      for (var i = 0; i < dias && achados.length < 8; i++) {
        var dia = isoDia(primeiro + i * 86400000 + 12 * 3600000);
        var ja = Math.max(doIso(dia, deHora), agora), fimJ = doIso(dia, ateHora);
        if (fimJ <= ja) continue;
        /* o que está ocupado nesse dia, com os trechos juntados */
        var ocupado = eventos.filter(function (e) { return e.ocupa && e.fim > ja && e.ini < fimJ; }).map(function (e) { return [Math.max(e.ini, ja), Math.min(e.fim, fimJ)]; });
        var livres = [], cursor = ja;
        ocupado.sort(function (a, b) { return a[0] - b[0]; }).forEach(function (b) { if (b[0] > cursor) livres.push([cursor, b[0]]); cursor = Math.max(cursor, b[1]); });
        if (cursor < fimJ) livres.push([cursor, fimJ]);
        HP.horasEntre(ja, fimJ, LAT, LON).filter(function (h) { return h.planeta === planeta; }).forEach(function (h) {
          livres.forEach(function (l) {
            var a = Math.max(l[0], h.ini), b = Math.min(l[1], h.fim);
            if (b - a >= minutos * 60000) achados.push({ dia: dia, ini: a, limite: b, hora: h });
          });
        });
      }
      achados.sort(function (a, b) { return a.ini - b.ini; });
      achados = achados.slice(0, 8);
      if (!achados.length) { res.appendChild(el('p', { class: 'portal-vazio', style: 'margin-top:12px', text: 'Nenhuma hora de ' + planeta + ' livre com ' + duracaoTxt(minutos) + ' nos próximos ' + dias + ' dias. Experimente um tempo menor ou uma janela maior.' })); return; }
      res.appendChild(el('p', { class: 'portal-item-data', style: 'margin:14px 0 4px', text: 'Livres, na hora de ' + planeta + ':' }));
      achados.forEach(function (a) {
        var fimSug = a.ini + minutos * 60000;
        var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Colocar na agenda' });
        b.addEventListener('click', function () { formulario(area, null, { titulo: tarefa === 'Outra coisa' ? '' : tarefa, dia: a.dia, ini: hhmm(a.ini), fim: hhmm(fimSug) }); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        var detalhe = el('div', { class: 'portal-item-data' }, [iconePlaneta(planeta, 14, '#A03E25'), el('span', { text: ' livre até ' + hhmm(a.limite) + ' · hora de ' + planeta + ' das ' + hhmm(a.hora.ini) + ' às ' + hhmm(a.hora.fim) })]);
        var l = el('div', { class: 'portal-item' }, [el('div', {}, [el('strong', { text: rotuloDia(a.dia) + ', ' + hhmm(a.ini) + ' às ' + hhmm(fimSug) }), detalhe]), b]);
        l.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(31,95,163,.7)';
        res.appendChild(l);
      });
    }

    C.auth.getSession().then(function (r) {
      var u = r.data && r.data.session && r.data.session.user;
      if (u) iniciar(u); else mostrarLogin();
    });
  })();
