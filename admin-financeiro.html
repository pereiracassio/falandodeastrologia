<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6d3a0">
  <title>Financeiro - Falando de Astrologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="papiro.css?v=4">
  <link rel="stylesheet" href="home.css?v=18">
  <link rel="stylesheet" href="page.css?v=49">
  <link rel="stylesheet" href="portal.css?v=12">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="tipografia.css?v=17">
  <style>
    /* tela do Financeiro: mesma ideia do Astro Hellenic (total em destaque, áreas com porcentagem, lista de linhas), nas regras do site:
       sem fundo nem canto redondo, contorno azul egípcio, Cinzel no que é fixo e letra à mão no que a pessoa escreve */
    .fin-fixo{font-family:var(--fonte-titulo)!important;text-transform:lowercase!important}
    .fin-divisa{border:0;border-top:1px solid #1F5FA3;margin:14px 0}
    .fin-mes{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .fin-mes-nome{font-size:18px;font-weight:700;color:#A03E25;text-align:center}
    .fin-rotulo{font-size:13px;color:#16233F;letter-spacing:.04em}
    .fin-total{font-size:30px;font-weight:700;color:#A03E25;margin:2px 0 10px}
    .fin-area{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:6px 0;border-bottom:1px solid rgba(31,95,163,.5);color:#16233F}
    .fin-area:last-of-type{border-bottom:0}
    .fin-pct{opacity:.75}
    .fin-area strong{color:#1034A6;font-size:14px}
    .fin-linha{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(31,95,163,.5);cursor:pointer}
    .fin-linha:hover .fin-nome{color:#A03E25}
    .fin-data{font-size:12px;opacity:.85}
    .fin-nome{font-size:16px;font-weight:700;color:#1034A6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fin-det{font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fin-valor{font-size:14px;font-weight:700;white-space:nowrap;color:#16233F}
  </style>
</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/aluno.html">Alunos</a><a href="/index.html#servicos">Serviços</a><a href="/blog.html">Blog</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Financeiro</h1>
    <p class="portal-sub">Acesso restrito ao administrador</p>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=39"></script>
  <script src="carrinho.js?v=3"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    var FORMAS = ['Pix', 'Cartão de crédito', 'Cartão de débito', 'Dinheiro', 'Transferência', 'Outro'];
    var nomeAdmin = '', userId = '', areas = [], entradas = [], clientes = [], mes = null;

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('financeiro', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      userId = user.id;
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          var h = new Date();
          mes = { ano: h.getFullYear(), mes: h.getMonth() };
          carregar();
        });
      });
    }

    function hojeISO() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function moeda(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function dataBR(iso) { var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); }
    /* "275", "275,50", "1.275,50", "R$ 275,00" -> número (ou null) */
    function lerValor(txt) {
      var s = String(txt || '').replace(/[R$\s]/g, '');
      if (!s) return null;
      if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
    }
    function intervalo() {
      var ini = mes.ano + '-' + String(mes.mes + 1).padStart(2, '0') + '-01';
      var a = mes.mes === 11 ? mes.ano + 1 : mes.ano, m = mes.mes === 11 ? 1 : mes.mes + 2;
      return { ini: ini, fim: a + '-' + String(m).padStart(2, '0') + '-01' };
    }

    function carregar() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var iv = intervalo();
      Promise.all([
        C.from('fin_areas').select('*').order('ordem').order('nome'),
        C.from('fin_entradas').select('*').gte('data', iv.ini).lt('data', iv.fim).order('data').order('criado_em'),
        C.from('clientes').select('id,nome').order('nome')
      ]).then(function (r) {
        if (r[0].error || r[1].error) {
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Não consegui abrir o Financeiro (as tabelas ainda não foram criadas no Supabase).' })]));
          return;
        }
        areas = r[0].data || []; entradas = r[1].data || []; clientes = (r[2] && r[2].data) || [];
        tela();
      });
    }

    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var porArea = {}; areas.forEach(function (a) { porArea[a.id] = a; });
      var total = entradas.reduce(function (s, e) { return s + Number(e.valor || 0); }, 0);
      function divisa() { return el('hr', { class: 'fin-divisa' }); }

      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Entradas' })]);

      var novo = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '+ Entrada' });
      var gerir = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Áreas' });
      var areaForm = el('div');
      novo.addEventListener('click', function () { formEntrada(areaForm, null); });
      gerir.addEventListener('click', function () { formAreas(areaForm); });
      cartao.appendChild(el('div', { class: 'portal-acoes' }, [gerir, novo]));
      cartao.appendChild(areaForm);

      /* mês: setas dos lados e o nome no meio */
      var ant = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '‹', 'aria-label': 'Mês anterior' });
      var prox = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '›', 'aria-label': 'Próximo mês' });
      function mover(d) { mes.mes += d; if (mes.mes < 0) { mes.mes = 11; mes.ano--; } if (mes.mes > 11) { mes.mes = 0; mes.ano++; } carregar(); }
      ant.addEventListener('click', function () { mover(-1); });
      prox.addEventListener('click', function () { mover(1); });
      cartao.appendChild(divisa());
      cartao.appendChild(el('div', { class: 'fin-mes' }, [ant, el('span', { class: 'fin-fixo fin-mes-nome', text: MESES[mes.mes] + ' ' + mes.ano }), prox]));
      cartao.appendChild(divisa());

      /* total do mês em destaque e, embaixo, cada área com a sua porcentagem */
      var pdfMes = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'PDF deste mês' });
      var pdfTudo = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'PDF de todos os meses' });
      var msgPdf = el('p', { class: 'portal-msg' });
      function baixar(todos) {
        pdfMes.disabled = pdfTudo.disabled = true;
        gerarPdf(todos, function (t, tipo) { P.mensagem(msgPdf, t, tipo); }).then(function () { pdfMes.disabled = pdfTudo.disabled = false; });
      }
      pdfMes.addEventListener('click', function () { baixar(false); });
      pdfTudo.addEventListener('click', function () { baixar(true); });
      cartao.appendChild(el('div', { class: 'fin-rotulo fin-fixo', text: 'Total do mês' }));
      cartao.appendChild(el('div', { class: 'fin-total fin-fixo', text: moeda(total) }));
      var sub = {};
      entradas.forEach(function (e) { var k = e.area_id && porArea[e.area_id] ? e.area_id : '_sem'; sub[k] = (sub[k] || 0) + Number(e.valor || 0); });
      Object.keys(sub).forEach(function (k) {
        var nome = k === '_sem' ? 'Sem área' : porArea[k].nome, pct = total > 0 ? Math.round(sub[k] / total * 100) : 0;
        cartao.appendChild(el('div', { class: 'fin-area' }, [
          el('span', {}, [document.createTextNode(nome + ' '), el('span', { class: 'fin-pct', text: '(' + pct + '%)' })]),
          el('strong', { class: 'fin-fixo', text: moeda(sub[k]) })]));
      });
      cartao.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:14px' }, [pdfMes, pdfTudo]));
      cartao.appendChild(msgPdf);
      cartao.appendChild(divisa());

      /* lista: data, cliente com o detalhe embaixo e valor; tocar na linha abre a entrada */
      if (!entradas.length) cartao.appendChild(el('p', { text: 'Nenhuma entrada em ' + MESES[mes.mes] + ' de ' + mes.ano + '.' }));
      entradas.forEach(function (e) {
        var area = e.area_id && porArea[e.area_id] ? porArea[e.area_id].nome : '';
        var det = [area, [e.produto, e.observacao].filter(Boolean).join(' — '), e.forma_pagamento].filter(Boolean).join(' · ');
        var linha = el('div', { class: 'fin-linha', role: 'button', tabindex: '0' }, [
          el('div', { class: 'fin-data fin-fixo', text: dataBR(e.data) }),
          el('div', { style: 'min-width:0' }, [el('div', { class: 'fin-nome', text: e.cliente_nome || 'Sem cliente' }), el('div', { class: 'fin-det', text: det })]),
          el('div', { class: 'fin-valor fin-fixo', text: moeda(e.valor) })]);
        function abrir() { formEntrada(areaForm, e); areaForm.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        linha.addEventListener('click', abrir);
        linha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
        cartao.appendChild(linha);
      });
      app.appendChild(cartao);
    }

    /* ---------- PDF (texto de verdade, A4, fundo branco, no padrão do caderno do aluno) ---------- */
    var COR = { terracota: [160, 62, 37], azul: [31, 95, 163], texto: [22, 35, 63] };
    var A4 = { w: 595.28, h: 841.89 }, M = 56.7, LARGURA = A4.w - 2 * M, LIMITE = A4.h - 70;
    var FONTES = [['Cinzel-Regular.ttf', 'Cinzel', 'normal'], ['Cinzel-Bold.ttf', 'Cinzel', 'bold'], ['Carlito-Regular.ttf', 'Carlito', 'normal'], ['Carlito-Bold.ttf', 'Carlito', 'bold']];
    function carregarScript(url, pronto) {
      if (pronto()) return Promise.resolve();
      return new Promise(function (ok, erro) {
        var sc = document.createElement('script');
        sc.src = url; sc.onload = function () { pronto() ? ok() : erro(new Error('script')); }; sc.onerror = function () { erro(new Error('script')); };
        document.head.appendChild(sc);
      });
    }
    function paraBase64(buf) {
      var b = new Uint8Array(buf), t = '';
      for (var i = 0; i < b.length; i += 0x8000) t += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      return btoa(t);
    }
    function baixarFontes() {
      return Promise.all(FONTES.map(function (f) {
        return fetch('fonts/' + f[0]).then(function (r) { if (!r.ok) throw new Error('fonte'); return r.arrayBuffer(); }).then(paraBase64);
      }));
    }

    /* a capa é desenho (papiro), então vira uma imagem; é a mesma folha das outras capas do site (capa.js) */
    function capaComoImagem(subtitulo, nome) {
      var F = window.capaFormato('a4');
      var palco = el('div'); palco.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + F.w + 'px;height:' + F.h + 'px';
      palco.appendChild(window.capaFolha({ titulo: 'Financeiro', subtitulo: subtitulo, nome: nome, tamanho: 'm', powered: false, formato: 'a4' }));
      document.body.appendChild(palco);
      var pronto = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      var imagens = Array.prototype.map.call(palco.querySelectorAll('img'), function (i) { return i.complete ? 1 : new Promise(function (ok) { i.onload = i.onerror = ok; }); });
      return Promise.all([pronto].concat(imagens)).then(function () {
        return document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 48px Cinzel'), document.fonts.load('700 26px Cinzel')]) : null;
      }).then(function () {
        return window.html2canvas(palco.firstChild, { scale: 2, useCORS: true, backgroundColor: null, width: F.w, height: F.h, windowWidth: F.w });
      }).then(function (c) { palco.remove(); return c.toDataURL('image/jpeg', 0.92); }, function (e) { palco.remove(); throw e; });
    }

    function montarPdf(doc, grupos, titulo, sub, totalGeral, capaImg) {
      var y = M, porArea = {}; areas.forEach(function (a) { porArea[a.id] = a; });
      function nova() { doc.addPage(); y = M; }
      function cabe(h) { if (y + h > LIMITE) nova(); }
      function cor(c) { doc.setTextColor(c[0], c[1], c[2]); }
      function soma(lista) { return lista.reduce(function (s, e) { return s + Number(e.valor || 0); }, 0); }
      function subtotais(lista) {
        var t = {}; lista.forEach(function (e) { var k = e.area_id && porArea[e.area_id] ? porArea[e.area_id].nome : 'Sem área'; t[k] = (t[k] || 0) + Number(e.valor || 0); });
        return t;
      }
      function linhaValor(rotulo, valor, o) {
        o = o || {};
        cabe(18); doc.setFont('Carlito', o.negrito ? 'bold' : 'normal'); doc.setFontSize(o.tam || 12); cor(o.cor || COR.texto);
        doc.text(rotulo, M, y + 12); doc.text(valor, M + LARGURA, y + 12, { align: 'right' }); y += 18;
      }
      /* capa (só no PDF de todos os meses): fica fora da contagem, a página 1 é a primeira depois dela */
      if (capaImg) { doc.addImage(capaImg, 'JPEG', 0, 0, A4.w, A4.h); nova(); }
      /* título do documento */
      doc.setFont('Cinzel', 'bold'); doc.setFontSize(22); cor(COR.terracota);
      doc.text(titulo.toUpperCase(), M, y + 18); y += 28;
      doc.setFont('Carlito', 'normal'); doc.setFontSize(13); cor(COR.texto);
      doc.text(sub, M, y + 12); y += 20;
      doc.setDrawColor(COR.azul[0], COR.azul[1], COR.azul[2]); doc.setLineWidth(1.4); doc.line(M, y, M + LARGURA, y); y += 18;

      grupos.forEach(function (g) {
        cabe(110);
        doc.setFont('Cinzel', 'bold'); doc.setFontSize(15); cor(COR.terracota);
        doc.text((MESES[g.mes] + ' ' + g.ano).toUpperCase(), M, y + 14); y += 24;
        linhaValor('Total do mês', moeda(soma(g.lista)), { negrito: true, tam: 13 });
        var st = subtotais(g.lista), total = soma(g.lista);
        Object.keys(st).forEach(function (k) {
          linhaValor(k + ' (' + (total > 0 ? Math.round(st[k] / total * 100) : 0) + '%)', moeda(st[k]), { tam: 11 });
        });
        y += 6;
        g.lista.forEach(function (e) {
          var area = e.area_id && porArea[e.area_id] ? porArea[e.area_id].nome : '';
          var det = [area, [e.produto, e.observacao].filter(Boolean).join(' — '), e.forma_pagamento].filter(Boolean).join(' · ');
          doc.setFont('Carlito', 'bold'); doc.setFontSize(12);
          var nomeL = doc.splitTextToSize(e.cliente_nome || 'Sem cliente', LARGURA - 130);
          doc.setFont('Carlito', 'normal'); doc.setFontSize(10.5);
          var detL = det ? doc.splitTextToSize(det, LARGURA - 130) : [];
          var alt = nomeL.length * 15 + detL.length * 13 + 8;
          cabe(alt);
          doc.setDrawColor(COR.azul[0], COR.azul[1], COR.azul[2]); doc.setLineWidth(0.4); doc.line(M, y, M + LARGURA, y);
          doc.setFont('Carlito', 'normal'); doc.setFontSize(11); cor(COR.texto); doc.text(dataBR(e.data), M, y + 14);
          doc.setFont('Carlito', 'bold'); doc.setFontSize(12);
          nomeL.forEach(function (l, i) { doc.text(l, M + 62, y + 14 + i * 15); });
          doc.setFont('Carlito', 'bold'); doc.text(moeda(e.valor), M + LARGURA, y + 14, { align: 'right' });
          doc.setFont('Carlito', 'normal'); doc.setFontSize(10.5);
          detL.forEach(function (l, i) { doc.text(l, M + 62, y + 14 + nomeL.length * 15 - 2 + i * 13); });
          y += alt;
        });
        y += 22;
      });

      if (totalGeral) {
        cabe(120);
        doc.setDrawColor(COR.azul[0], COR.azul[1], COR.azul[2]); doc.setLineWidth(1.4); doc.line(M, y, M + LARGURA, y); y += 16;
        doc.setFont('Cinzel', 'bold'); doc.setFontSize(15); cor(COR.terracota); doc.text('TOTAL GERAL', M, y + 14); y += 26;
        var todas = []; grupos.forEach(function (g) { todas = todas.concat(g.lista); });
        linhaValor('Todos os meses', moeda(soma(todas)), { negrito: true, tam: 14 });
        var sg = subtotais(todas), tg = soma(todas);
        Object.keys(sg).forEach(function (k) { linhaValor(k + ' (' + (tg > 0 ? Math.round(sg[k] / tg * 100) : 0) + '%)', moeda(sg[k]), { tam: 11 }); });
      }

      /* rodapé em todas as páginas: o nome do site + o número da página */
      var n = doc.getNumberOfPages(), primeira = capaImg ? 2 : 1;
      for (var i = primeira; i <= n; i++) {
        doc.setPage(i); doc.setFont('Carlito', 'normal'); doc.setFontSize(9.5); cor(COR.azul);
        doc.text('Falando de Astrologia Helenística', M, A4.h - 34);
        doc.text(String(i - primeira + 1), M + LARGURA, A4.h - 34, { align: 'right' });
      }
    }

    function gerarPdf(todos, aviso) {
      aviso('Montando o PDF...', 'ok');
      var busca = todos
        ? C.from('fin_entradas').select('*').order('data').order('criado_em').range(0, 9999)
        : Promise.resolve({ data: entradas });
      return busca.then(function (r) {
        if (r.error) throw new Error(r.error.message);
        var lista = r.data || [];
        if (!lista.length) { aviso(todos ? 'Ainda não há nenhuma entrada.' : 'Não há entradas em ' + MESES[mes.mes] + ' de ' + mes.ano + '.', 'erro'); return; }
        var porMes = {}, ordem = [];
        lista.forEach(function (e) {
          var k = String(e.data).slice(0, 7);
          if (!porMes[k]) { porMes[k] = { ano: Number(k.slice(0, 4)), mes: Number(k.slice(5, 7)) - 1, lista: [] }; ordem.push(k); }
          porMes[k].lista.push(e);
        });
        ordem.sort();
        var grupos = ordem.map(function (k) { return porMes[k]; });
        var t0 = grupos[0], t1 = grupos[grupos.length - 1];
        var periodo = grupos.length === 1 ? MESES[t0.mes] + ' de ' + t0.ano
          : t0.ano === t1.ano ? MESES[t0.mes] + ' a ' + MESES[t1.mes] + ' de ' + t0.ano
          : MESES[t0.mes] + ' de ' + t0.ano + ' a ' + MESES[t1.mes] + ' de ' + t1.ano;
        var comCapa = todos;
        return Promise.all([
          carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', function () { return !!(window.jspdf && window.jspdf.jsPDF); }),
          baixarFontes(),
          comCapa ? carregarScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', function () { return !!window.html2canvas; }) : null,
          comCapa ? carregarScript('capa.js?v=7', function () { return !!window.capaFolha; }) : null
        ]).then(function (x) {
          return (comCapa ? capaComoImagem('Registro de entradas', periodo) : Promise.resolve(null)).then(function (capa) { return [x, capa]; });
        }).then(function (xc) {
          var x = xc[0], capa = xc[1];
          var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
          FONTES.forEach(function (f, i) { doc.addFileToVFS(f[0], x[1][i]); doc.addFont(f[0], f[1], f[2]); });
          var sub = todos ? (grupos.length === 1 ? MESES[t0.mes] + ' ' + t0.ano : MESES[t0.mes] + ' ' + t0.ano + ' a ' + MESES[t1.mes] + ' ' + t1.ano) : MESES[mes.mes] + ' ' + mes.ano;
          montarPdf(doc, grupos, 'Financeiro', sub, todos && grupos.length > 1, capa);
          doc.save(todos ? 'financeiro-todos-os-meses.pdf' : 'financeiro-' + mes.ano + '-' + String(mes.mes + 1).padStart(2, '0') + '.pdf');
          aviso('Pronto! O PDF foi baixado. Procure em Arquivos (Downloads).', 'ok');
        });
      }).catch(function (e) {
        console.error('financeiro pdf:', e);
        aviso('Não foi possível montar o PDF agora. Tente de novo em instantes.', 'erro');
      });
    }

    function campo(rotulo, controle) { return [el('label', { text: rotulo }), controle]; }

    function formEntrada(destino, e) {
      destino.textContent = '';
      var data = el('input', { type: 'date', value: e ? String(e.data).slice(0, 10) : hojeISO() });
      var cliente = el('input', { type: 'text', list: 'finClientes', autocomplete: 'off', value: e ? (e.cliente_nome || '') : '' });
      var lista = el('datalist', { id: 'finClientes' });
      clientes.forEach(function (c) { lista.appendChild(el('option', { value: c.nome })); });
      var produto = el('input', { type: 'text', list: 'finServicos', autocomplete: 'off', value: e ? (e.produto || '') : '' });
      var servicos = window.Carrinho.servicos, listaS = el('datalist', { id: 'finServicos' });
      Object.keys(servicos).filter(function (k) { return !/^teste/.test(k); }).forEach(function (k) { listaS.appendChild(el('option', { value: servicos[k].titulo })); });
      var valor = el('input', { type: 'text', inputmode: 'decimal', placeholder: '0,00', value: e ? String(e.valor).replace('.', ',') : '' });
      /* escolher um serviço do carrinho já sugere o valor dele (só se o valor ainda está vazio) */
      produto.addEventListener('change', function () {
        if (valor.value.trim()) return;
        Object.keys(servicos).forEach(function (k) { if (servicos[k].titulo === produto.value) valor.value = String(servicos[k].centavos / 100).replace('.', ','); });
      });
      var area = el('select');
      area.appendChild(el('option', { value: '', text: 'Sem área' }));
      areas.forEach(function (a) { var o = el('option', { value: a.id, text: a.nome }); if (e && e.area_id === a.id) o.selected = true; area.appendChild(o); });
      var forma = el('select');
      forma.appendChild(el('option', { value: '', text: 'Não informada' }));
      FORMAS.forEach(function (f) { var o = el('option', { value: f, text: f }); if (e && e.forma_pagamento === f) o.selected = true; forma.appendChild(o); });
      var obs = el('textarea'); obs.value = e ? (e.observacao || '') : '';
      var msg = el('p', { class: 'portal-msg' });
      var salvar = el('button', { type: 'submit', class: 'portal-btn', text: 'Salvar' });
      var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelar.addEventListener('click', function () { destino.textContent = ''; });
      var acoes = [salvar, cancelar];
      if (e) {
        var apagar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Apagar' });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar esta entrada?')) return;
          C.from('fin_entradas').delete().eq('id', e.id).then(function (r) {
            if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
            carregar();
          });
        });
        acoes.push(apagar);
      }
      var form = el('form', { style: 'margin-top:18px' }, [el('p', { class: 'portal-item-titulo', text: e ? 'Entrada' : 'Nova entrada' })]
        .concat(campo('Data do recebimento', data), campo('Cliente', cliente), [lista], campo('Serviço', produto), [listaS],
          campo('Valor (R$)', valor), campo('Área', area), campo('Forma de pagamento', forma), campo('Observação', obs),
          [msg, el('div', { class: 'portal-acoes' }, acoes)]));
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var v = lerValor(valor.value);
        if (v == null) { P.mensagem(msg, 'Digite o valor (por exemplo 335,00).', 'erro'); return; }
        if (!data.value) { P.mensagem(msg, 'Escolha a data.', 'erro'); return; }
        var nomeCli = cliente.value.trim();
        var achado = clientes.filter(function (c) { return c.nome === nomeCli; })[0];
        var reg = { data: data.value, cliente_nome: nomeCli || null, cliente_id: achado ? achado.id : null, produto: produto.value.trim() || null,
          valor: v, area_id: area.value || null, forma_pagamento: forma.value || null, observacao: obs.value.trim() || null };
        salvar.disabled = true;
        var req = e ? C.from('fin_entradas').update(reg).eq('id', e.id) : C.from('fin_entradas').insert(reg);
        req.then(function (r) {
          salvar.disabled = false;
          if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
          var d = reg.data.split('-'); mes = { ano: Number(d[0]), mes: Number(d[1]) - 1 };
          carregar();
        });
      });
      destino.appendChild(form);
    }

    function formAreas(destino) {
      destino.textContent = '';
      var caixa = el('div', { style: 'margin-top:18px' }, [el('p', { class: 'portal-item-titulo', text: 'Áreas' }),
        el('p', { text: 'Astrologia, Psicanálise... Cada entrada pode ficar numa área, e o total do mês mostra quanto veio de cada uma.' })]);
      var msg = el('p', { class: 'portal-msg' });
      function aviso(r) { if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return false; } return true; }
      areas.forEach(function (a) {
        var renomear = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Renomear' });
        var apagar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Apagar' });
        renomear.addEventListener('click', function () {
          var n = window.prompt('Novo nome da área:', a.nome);
          if (n == null || !n.trim()) return;
          C.from('fin_areas').update({ nome: n.trim() }).eq('id', a.id).then(function (r) { if (aviso(r)) carregar(); });
        });
        apagar.addEventListener('click', function () {
          if (!window.confirm('Apagar a área "' + a.nome + '"? As entradas dela ficam sem área.')) return;
          C.from('fin_areas').delete().eq('id', a.id).then(function (r) { if (aviso(r)) carregar(); });
        });
        caixa.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [el('span', { text: a.nome }), el('div', { class: 'portal-acoes' }, [renomear, apagar])])]));
      });
      var nome = el('input', { type: 'text', placeholder: 'Nome da área nova' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      var fechar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Fechar' });
      fechar.addEventListener('click', function () { destino.textContent = ''; });
      var f = el('form', { style: 'margin-top:14px' }, [nome, msg, el('div', { class: 'portal-acoes' }, [add, fechar])]);
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!nome.value.trim()) return;
        C.from('fin_areas').insert({ nome: nome.value.trim(), ordem: areas.length }).then(function (r) { if (aviso(r)) carregar(); });
      });
      caixa.appendChild(f);
      destino.appendChild(caixa);
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
</html>
