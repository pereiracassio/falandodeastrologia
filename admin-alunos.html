<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel dos Alunos - Falando de Astrologia</title>
  
  <!-- Importação da fonte Cinzel do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="papiro.css?v=4">
  <link rel="stylesheet" href="home.css?v=18">
  <link rel="stylesheet" href="page.css?v=17">
  <link rel="stylesheet" href="portal.css?v=12">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:14px 10px; max-width:700px; margin:0 auto 20px auto; border-bottom:1px solid #B5852F; font-family:'Cinzel', serif;">
    <a href="index.html" class="marca"><img src="favicon.svg?v=2" alt="" width="40" height="40"><span>Falando de Astrologia</span></a>
    <nav style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="index.html#servicos" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Serviços</a>
      <a href="mentoria.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Mentoria</a>
      <a href="sobre.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Sobre</a>
    </nav>
  </header>
<div class="pagina pagina-servico"><div class="folha-pagina">
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Painel dos Alunos</h1>
    <p class="portal-sub">Acesso restrito ao administrador</p>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=25"></script>
  <script src="atividades.js?v=17"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    var BLOCOS = { gravacoes: 'Gravação do encontro', materiais: 'Material', caderno: 'Atividades (documento do Drive)' }; // o primeiro é o que já vem marcado
    var alunoAberto = null, nomeAdmin = '';

    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }
    function topo(texto) {
      var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' });
      b.addEventListener('click', sair);
      var clientes = el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-clientes.html', text: 'Clientes' });
      return el('div', { class: 'portal-topo' }, [el('span', { text: texto }), el('div', {}, [el('a', { class: 'portal-btn portal-btn-sec', href: 'capa.html', text: 'Capa' }), clientes, b])]);
    }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }

    function iniciar(user) {
      limpar();
      P.client.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        P.client.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          listaDeAlunos(user);
        });
      });
    }

    function listaDeAlunos(user) {
      limpar();
      app.appendChild(topo(nomeAdmin));
      /* ordem: alunos, novo aluno, pasta dos alunos, login com o Google */
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Alunos' })]);
      app.appendChild(cartao);

      /* novo aluno */
      var msg = el('p', { class: 'portal-msg' });
      var nome = el('input', { type: 'text', id: 'novoNome', required: '' });
      var email = el('input', { type: 'email', id: 'novoEmail', required: '' });
      var codigo = el('input', { type: 'text', id: 'novoCodigo', placeholder: 'Ex.: 0147' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar aluno' });
      var form = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: 'Novo aluno' }),
        el('p', { text: 'Antes, crie o acesso dele no Supabase: Authentication → Users → Add user (e-mail + senha, marcando "Auto Confirm User"). Depois, cadastre aqui o mesmo e-mail.' }),
        el('label', { for: 'novoNome', text: 'Nome' }), nome,
        el('label', { for: 'novoEmail', text: 'E-mail (o mesmo do acesso)' }), email,
        el('label', { for: 'novoCodigo', text: 'Código do aluno (o mesmo do Astro Hellenic, opcional). Só você vê.' }), codigo, msg, add
      ]);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault(); add.disabled = true;
        P.client.from('alunos').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase() }).select('id').single().then(function (r) {
          if (r.error) { add.disabled = false; P.mensagem(msg, /duplicate|unique/i.test(r.error.message) ? 'Já existe um aluno com esse e-mail.' : P.traduzErro(r.error.message), 'erro'); return; }
          var cod = codigo.value.trim();
          if (!cod) { add.disabled = false; listaDeAlunos(user); return; }
          P.client.from('aluno_codigos').insert({ aluno_id: r.data.id, codigo: cod }).then(function (rc) {
            add.disabled = false;
            if (rc.error) { P.mensagem(msg, /duplicate|unique/i.test(rc.error.message) ? 'Aluno criado, mas esse código já é de outro aluno. Abra o aluno e corrija o código.' : 'Aluno criado, mas não foi possível salvar o código.', 'erro'); return; }
            listaDeAlunos(user);
          });
        });
      });
      app.appendChild(form);
      app.appendChild(P.cartaoPastaBase('alunos'));
      var conexaoDrive = P.cartaoConexaoDrive();
      if (conexaoDrive) app.appendChild(conexaoDrive);

      /* lista */
      Promise.all([
        P.client.from('alunos').select('id,nome,email,meet_link,whatsapp').order('nome'),
        P.client.from('aluno_codigos').select('aluno_id,codigo'),
        /* atividades que o aluno já enviou e que ainda esperam a sua correção */
        P.client.from('atividades').select('aluno_id').not('enviada_em', 'is', null).is('corrigida_em', null).eq('antiga', false)
      ]).then(function (res) {
        var r = res[0], rc = res[1];
        var paraCorrigir = {}, totalParaCorrigir = 0;
        ((res[2] && res[2].data) || []).forEach(function (x) { paraCorrigir[x.aluno_id] = (paraCorrigir[x.aluno_id] || 0) + 1; totalParaCorrigir++; });
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a lista.' })); return; }
        var codigos = {};
        (rc.data || []).forEach(function (c) { codigos[c.aluno_id] = c.codigo; });
        r.data.forEach(function (a) { a.codigo = codigos[a.id] || ''; });
        var alunos = P.ordenarPorCodigo(r.data);
        if (!alunos.length) { cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno ainda.' })); return; }
        var busca = el('input', { type: 'search', id: 'buscaAluno', placeholder: 'Buscar por código, nome ou e-mail' });
        var lista = el('div');
        if (totalParaCorrigir) cartao.appendChild(el('p', { class: 'portal-item-data', style: 'font-weight:700;font-size:15px;margin:0 0 12px', text: totalParaCorrigir === 1 ? '1 atividade esperando a sua correção' : totalParaCorrigir + ' atividades esperando a sua correção' }));
        cartao.appendChild(busca);
        cartao.appendChild(lista);
        function desenhar() {
          var t = busca.value.trim().toLowerCase();
          lista.textContent = '';
          var achados = alunos.filter(function (a) { return !t || (a.codigo + ' ' + a.nome + ' ' + a.email).toLowerCase().indexOf(t) >= 0; });
          if (!achados.length) lista.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno encontrado.' }));
          achados.forEach(function (a) {
            var abrir = el('button', { type: 'button', class: 'portal-btn', text: 'Abrir' });
            abrir.addEventListener('click', function () { alunoAberto = a; paginaDoAluno(user, a); });
            lista.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: (a.codigo ? a.codigo + ' · ' : '') + a.nome }), el('span', { class: 'portal-item-data', text: a.email })].concat(
                paraCorrigir[a.id] ? [el('span', { class: 'portal-item-data', style: 'font-weight:700', text: paraCorrigir[a.id] === 1 ? '1 atividade para corrigir' : paraCorrigir[a.id] + ' atividades para corrigir' })] : [])), abrir
            ])]));
          });
        }
        busca.addEventListener('input', desenhar);
        desenhar();
      });
    }

    function paginaDoAluno(user, aluno) {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var voltar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '← Todos os alunos' });
      voltar.addEventListener('click', function () { listaDeAlunos(user); });
      var verComoAluno = el('a', { class: 'portal-btn', href: 'aluno.html?ver=' + encodeURIComponent(aluno.id), target: '_blank', rel: 'noopener', text: 'Ver como aluno' });
      app.appendChild(el('div', { class: 'portal-topo' }, [voltar, verComoAluno]));

      /* dados do aluno: código, nome, WhatsApp, link do Meet e pasta no Drive (o código só o administrador vê) */
      var msgDados = el('p', { class: 'portal-msg' });
      var codInput = el('input', { type: 'text', id: 'alunoCodigo', placeholder: 'Ex.: 0147' });
      codInput.value = aluno.codigo || '';
      var nomeInput = el('input', { type: 'text', id: 'alunoNome', required: '' });
      nomeInput.value = aluno.nome || '';
      var whatsInput = el('input', { type: 'tel', id: 'alunoWhats', placeholder: 'Ex.: 11 91234-5678' });
      whatsInput.value = aluno.whatsapp || '';
      var meet = el('input', { type: 'url', id: 'alunoMeet', placeholder: 'https://meet.google.com/...' });
      meet.value = aluno.meet_link || '';
      var salvarDados = el('button', { type: 'submit', class: 'portal-btn', text: 'Salvar dados' });
      var pastaDrive = P.cartaoPastaDrive({ plural: 'alunos', tipo: 'aluno', id: aluno.id, email: aluno.email, dentroDeOutroBloco: true,
        codigo: function () { return aluno.codigo; },
        nome: function () { return (aluno.codigo ? aluno.codigo + ' - ' : '') + aluno.nome; } });
      var formDados = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: 'Dados do aluno' }),
        el('label', { for: 'alunoCodigo', text: 'Código' }), codInput,
        el('label', { for: 'alunoNome', text: 'Nome' }), nomeInput,
        el('label', { for: 'alunoWhats', text: 'WhatsApp' }), whatsInput,
        el('label', { for: 'alunoMeet', text: 'Link do Meet' }), meet,
        pastaDrive, msgDados, salvarDados
      ]);
      formDados.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var novoNome = nomeInput.value.trim();
        var valor = codInput.value.trim();
        var linkMeet = meet.value.trim();
        var seguro = linkMeet ? P.linkSeguro(linkMeet) : null;
        if (!novoNome) { P.mensagem(msgDados, 'Escreva o nome.', 'erro'); return; }
        if (linkMeet && !seguro) { P.mensagem(msgDados, 'O link do Meet precisa começar com https://', 'erro'); return; }
        salvarDados.disabled = true;
        P.client.from('alunos').update({ nome: novoNome, whatsapp: whatsInput.value.trim() || null, meet_link: seguro }).eq('id', aluno.id).then(function (r1) {
          if (r1.error) { salvarDados.disabled = false; P.mensagem(msgDados, P.traduzErro(r1.error.message), 'erro'); return; }
          var pedido = valor
            ? P.client.from('aluno_codigos').upsert({ aluno_id: aluno.id, codigo: valor }, { onConflict: 'aluno_id' })
            : P.client.from('aluno_codigos').delete().eq('aluno_id', aluno.id);
          pedido.then(function (r2) {
            salvarDados.disabled = false;
            if (r2.error) { P.mensagem(msgDados, /duplicate|unique/i.test(r2.error.message) ? 'Nome salvo, mas esse código já é de outro aluno.' : P.traduzErro(r2.error.message), 'erro'); return; }
            aluno.nome = novoNome; aluno.codigo = valor; aluno.whatsapp = whatsInput.value.trim() || null; aluno.meet_link = seguro;
            paginaDoAluno(user, aluno);
          });
        });
      });
      app.appendChild(formDados);
      app.appendChild(window.atividades.painelAdmin(aluno));

      /* novo item */
      var msg = el('p', { class: 'portal-msg' });
      var bloco = el('select', { id: 'itemBloco' }, Object.keys(BLOCOS).map(function (k) { return el('option', { value: k, text: BLOCOS[k] }); }));
      var titulo = el('input', { type: 'text', id: 'itemTitulo', required: '' });
      var data = el('input', { type: 'date', id: 'itemData' });
      var descricao = el('textarea', { id: 'itemDescricao', rows: '4', placeholder: 'Ex.: neste encontro falamos de...' });
      var link = el('input', { type: 'url', id: 'itemLink', placeholder: 'https://drive.google.com/...', required: '' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar' });
      var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar edição' });
      cancelar.style.display = 'none';
      var editandoId = null;
      var form = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: (aluno.codigo ? aluno.codigo + ' · ' : '') + aluno.nome }),
        el('p', { text: 'Escolha o arquivo no Drive: o link entra sozinho e o arquivo (ou a pasta) já é compartilhado com o e-mail do aluno. Se colar o link à mão, compartilhe no próprio Drive.' }),
        el('label', { for: 'itemBloco', text: 'Onde aparece' }), bloco,
        el('label', { for: 'itemTitulo', text: 'Título' }), titulo,
        el('label', { for: 'itemData', text: 'Data (opcional)' }), data,
        el('label', { for: 'itemDescricao', text: 'Descrição (opcional)' }), descricao,
        el('label', { for: 'itemLink', text: 'Link do Drive' }), link, P.botaoDrive(link, function (t, tipo) { P.mensagem(msg, t, tipo); }, aluno.email, 'aluno:' + aluno.id), msg,
        el('div', { class: 'portal-acoes' }, [add, cancelar])
      ]);
      function sairDaEdicao() {
        editandoId = null; form.reset(); add.textContent = 'Adicionar'; cancelar.style.display = 'none'; P.mensagem(msg, '');
      }
      cancelar.addEventListener('click', sairDaEdicao);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var seguro = P.linkSeguro(link.value);
        if (!seguro) { P.mensagem(msg, 'O link precisa começar com https://', 'erro'); return; }
        add.disabled = true;
        var campos = { bloco: bloco.value, titulo: titulo.value.trim(), link: seguro, data: data.value || null, descricao: descricao.value.trim() || null };
        var pedido = editandoId
          ? P.client.from('itens').update(campos).eq('id', editandoId)
          : P.client.from('itens').insert(Object.assign({ aluno_id: aluno.id }, campos));
        pedido.then(function (r) {
          add.disabled = false;
          if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
          paginaDoAluno(user, aluno);
        });
      });
      app.appendChild(form);

      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'O que ' + aluno.nome + ' vê' })]);
      app.appendChild(cartao);
      P.client.from('itens').select('id,bloco,titulo,descricao,link,data').eq('aluno_id', aluno.id)
        .order('bloco').order('data', { ascending: false, nullsFirst: false }).then(function (r) {
          if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar.' })); return; }
          if (!r.data.length) cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nada cadastrado ainda.' }));
          r.data.forEach(function (i) {
            var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
            editar.style.padding = '6px 12px'; editar.style.fontSize = '13px';
            editar.addEventListener('click', function () {
              editandoId = i.id; bloco.value = i.bloco; titulo.value = i.titulo; data.value = i.data || ''; descricao.value = i.descricao || ''; link.value = i.link;
              add.textContent = 'Salvar alterações'; cancelar.style.display = ''; P.mensagem(msg, 'Editando: ' + i.titulo, 'ok');
              form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            var apagar = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Apagar' });
            apagar.addEventListener('click', function () {
              if (!confirm('Apagar "' + i.titulo + '"? (O arquivo no Drive não é apagado.)')) return;
              P.client.from('itens').delete().eq('id', i.id).then(function (d) {
                if (d.error) alert('Não foi possível apagar.'); else paginaDoAluno(user, aluno);
              });
            });
            cartao.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: i.titulo }),
                el('span', { class: 'portal-item-data', text: BLOCOS[i.bloco] + (i.data ? ' · ' + P.dataBR(i.data) : '') })]),
              el('div', { class: 'portal-acoes' }, [editar, apagar])
            ])]));
          });
        });

      var remover = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Remover este aluno do portal' });
      remover.addEventListener('click', function () {
        if (!confirm('Remover ' + aluno.nome + ' do portal? Os itens dele também somem daqui (os arquivos do Drive ficam).')) return;
        P.client.from('alunos').delete().eq('id', aluno.id).then(function (d) {
          if (d.error) alert('Não foi possível remover.'); else listaDeAlunos(user);
        });
      });
      app.appendChild(remover);
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { limpar(); P.montarNovaSenha(app, iniciar); } });
    if (P.emRecuperacao) { limpar(); P.montarNovaSenha(app, iniciar); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
  <script src="menu.js?v=17" defer></script>
</body>
</html>
