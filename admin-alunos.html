<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6d3a0">
  <title>Painel dos Alunos - Falando de Astrologia</title>
  
  <!-- Importação da fonte Cinzel do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="papiro.css?v=4">
  <link rel="stylesheet" href="home.css?v=20">
  <link rel="stylesheet" href="page.css?v=67">
  <link rel="stylesheet" href="portal.css?v=18">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="tipografia.css?v=18">
</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Painel dos Alunos</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=68"></script>
  <script src="atividades.js?v=28"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    var BLOCOS = { gravacoes: 'Gravação do encontro', materiais: 'Material', caderno: 'Atividades (documento do Drive)' }; // o primeiro é o que já vem marcado
    var alunoAberto = null, nomeAdmin = '';

    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('alunos', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }

    function iniciar(user) {
      limpar();
      P.client.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        P.client.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          restaurar(user);
        });
      });
    }

    /* depois de recarregar: volta pro aluno em que você estava (endereço #aluno=ID) */
    function restaurar(user) {
      var h = P.estado.ler();
      if (!h.aluno) { listaDeAlunos(user); return; }
      Promise.all([P.client.from('alunos').select('id,nome,email,meet_link,whatsapp').eq('id', h.aluno).maybeSingle(),
                   P.client.from('aluno_codigos').select('codigo').eq('aluno_id', h.aluno).maybeSingle()]).then(function (r) {
        if (r[0].error || !r[0].data) { listaDeAlunos(user); return; }
        var a = r[0].data; a.codigo = (r[1].data && r[1].data.codigo) || '';
        alunoAberto = a; paginaDoAluno(user, a);
      }, function () { listaDeAlunos(user); });
    }

    function listaDeAlunos(user) {
      var h = P.estado.ler();
      P.estado.gravar({});
      limpar();
      app.appendChild(topo(nomeAdmin));
      /* só o conteúdo dos alunos (botão de adicionar no topo, busca e lista); pasta, Google Drive e avisos ficam em ⚙ (admin-site.html) */
      var novoAluno = el('button', { type: 'button', class: 'portal-btn', text: 'Adicionar novo aluno' });
      var areaForm = el('div');
      var cartao = el('div', { class: 'portal-cartao' }, [el('div', { class: 'portal-acoes', style: 'margin-bottom:14px' }, [novoAluno]), areaForm]);
      app.appendChild(cartao);

      /* novo aluno */
      var msg = el('p', { class: 'portal-msg' });
      var nome = el('input', { type: 'text', id: 'novoNome', required: '' });
      var email = el('input', { type: 'email', id: 'novoEmail', required: '' });
      var codigo = el('input', { type: 'text', id: 'novoCodigo', placeholder: 'Ex.: 0147' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar aluno' });
      var cancelarNovo = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelarNovo.addEventListener('click', function () { areaForm.textContent = ''; });
      var form = el('form', { class: 'portal-item', style: 'margin-bottom:14px' }, [
        el('p', { class: 'portal-item-titulo', text: 'Novo aluno' }),
        el('p', { text: 'O acesso dele é criado aqui, ao adicionar. Ele entra com o Google (o mesmo Gmail) ou toca em "Esqueci minha senha" na tela de entrada.' }),
        el('label', { for: 'novoNome', text: 'Nome' }), nome,
        el('label', { for: 'novoEmail', text: 'E-mail (o mesmo do acesso)' }), email,
        el('label', { for: 'novoCodigo', text: 'Código do aluno' }), codigo, msg, el('div', { class: 'portal-acoes' }, [add, cancelarNovo])
      ]);
      form.addEventListener('submit', function (ev) {
        var avisoAcesso = '';
        var terminar = function () {
          if (!avisoAcesso) { listaDeAlunos(user); return; }
          P.mensagem(msg, 'Cadastrado. Mas o acesso não foi criado agora (' + avisoAcesso + ').', 'erro');
          setTimeout(function () { listaDeAlunos(user); }, 7000);
        };
        ev.preventDefault(); add.disabled = true; P.mensagem(msg, 'Criando o acesso...');
        /* primeiro o acesso (login) do aluno, criado pelo servidor; só depois a ficha dele aqui */
        P.client.auth.getSession().then(function (sessao) {
          var jwt = sessao.data && sessao.data.session ? sessao.data.session.access_token : '';
          return fetch('https://falandodeastrologia.vercel.app/api/criar-acesso', { method: 'POST', headers: { Authorization: 'Bearer ' + jwt, 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nome.value.trim(), email: email.value.trim() }) })
            .then(function (resp) { return resp.json().catch(function () { return {}; }).then(function (d) { if (!resp.ok) throw new Error(d.detalhe || d.erro || 'erro'); }); });
        }).then(function () {
          P.mensagem(msg, '');
          return P.client.from('alunos').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase() }).select('id').single();
        }).catch(function (e) {
          avisoAcesso = e.message; /* o acesso não travou: a ficha é criada mesmo assim e o motivo aparece */
          return P.client.from('alunos').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase() }).select('id').single();
        }).then(function (r) {
          if (r.error) { add.disabled = false; P.mensagem(msg, /duplicate|unique/i.test(r.error.message) ? 'Já existe um aluno com esse e-mail.' : P.traduzErro(r.error.message), 'erro'); return; }
          var cod = codigo.value.trim();
          if (!cod) { add.disabled = false; terminar(); return; }
          P.client.from('aluno_codigos').insert({ aluno_id: r.data.id, codigo: cod }).then(function (rc) {
            add.disabled = false;
            if (rc.error) { P.mensagem(msg, /duplicate|unique/i.test(rc.error.message) ? 'Aluno criado, mas esse código já é de outro aluno. Abra o aluno e corrija o código.' : 'Aluno criado, mas não foi possível salvar o código.', 'erro'); setTimeout(function () { listaDeAlunos(user); }, 6000); return; }
            terminar();
          });
        });
      });
      /* o cadastro só aparece quando você toca no botão (e tocar de novo não apaga o que já foi escrito) */
      novoAluno.addEventListener('click', function () {
        if (areaForm.firstChild) return;
        areaForm.appendChild(form); form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      /* lista */
      Promise.all([
        P.client.from('alunos').select('id,nome,email,meet_link,whatsapp').order('nome'),
        P.client.from('aluno_codigos').select('aluno_id,codigo'),
        /* atividades que o aluno já enviou e que ainda esperam a sua correção */
        P.client.from('atividades').select('aluno_id').not('enviada_em', 'is', null).is('corrigida_em', null).eq('antiga', false),
        P.client.from('aluno_pagamentos').select('aluno_id,ultimo_pagamento,proximo_pagamento')
      ]).then(function (res) {
        var r = res[0], rc = res[1];
        var paraCorrigir = {}, totalParaCorrigir = 0;
        ((res[2] && res[2].data) || []).forEach(function (x) { paraCorrigir[x.aluno_id] = (paraCorrigir[x.aluno_id] || 0) + 1; totalParaCorrigir++; });
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a lista.' })); return; }
        var pagamentos = {};
        ((res[3] && res[3].data) || []).forEach(function (x) { pagamentos[x.aluno_id] = x; });
        var codigos = {};
        (rc.data || []).forEach(function (c) { codigos[c.aluno_id] = c.codigo; });
        r.data.forEach(function (a) { a.codigo = codigos[a.id] || ''; });
        var alunos = P.ordenarPorCodigo(r.data);
        if (!alunos.length) { cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno ainda.' })); return; }
        var busca = el('input', { type: 'search', id: 'buscaAluno', placeholder: 'Buscar por código, nome ou e-mail' });
        var lista = el('div');
        if (totalParaCorrigir) cartao.appendChild(el('p', { class: 'portal-item-data', style: 'font-weight:700;font-size:15px;margin:0 0 12px', text: totalParaCorrigir === 1 ? '1 atividade esperando a sua correção' : totalParaCorrigir + ' atividades esperando a sua correção' }));
        cartao.appendChild(busca);
        cartao.appendChild(lista);
        function desenhar() {
          var t = busca.value.trim().toLowerCase();
          lista.textContent = '';
          var achados = alunos.filter(function (a) { return !t || (a.codigo + ' ' + a.nome + ' ' + a.email).toLowerCase().indexOf(t) >= 0; });
          if (!achados.length) lista.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno encontrado.' }));
          achados.forEach(function (a) {
            /* a linha inteira é o botão: tocar no aluno abre a página dele */
            var abrir = function () { alunoAberto = a; paginaDoAluno(user, a); };
            var linha = el('div', { class: 'portal-item portal-item-clicavel', role: 'button', tabindex: '0' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: (a.codigo ? a.codigo + ' · ' : '') + a.nome }), el('span', { class: 'portal-item-data', text: a.email })].concat(
                pagamentos[a.id] ? [el('span', { class: 'portal-item-data', text: textoPagamento(pagamentos[a.id].ultimo_pagamento, pagamentos[a.id].proximo_pagamento) })] : []).concat(
                paraCorrigir[a.id] ? [el('span', { class: 'portal-item-data', style: 'font-weight:700', text: paraCorrigir[a.id] === 1 ? '1 atividade para corrigir' : paraCorrigir[a.id] + ' atividades para corrigir' })] : []))
            ])]);
            linha.addEventListener('click', abrir);
            linha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
            lista.appendChild(linha);
          });
        }
        busca.addEventListener('input', desenhar);
        desenhar();
      });
    }

    function dataISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    /* "Pago até 24/11", "Vence hoje", "Atrasado há 5 dias"... a partir das duas datas (aaaa-mm-dd) */
    function textoPagamento(ultimo, proximo) {
      if (!proximo) return ultimo ? 'Último pagamento em ' + P.dataBR(ultimo) + '. Sem data do próximo.' : 'Nenhum pagamento registrado.';
      var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      var v = new Date(proximo + 'T00:00:00'), dias = Math.round((v - hoje) / 86400000);
      if (dias > 0) return 'Em dia. Próximo pagamento em ' + P.dataBR(proximo) + (dias === 1 ? ' (amanhã).' : ' (em ' + dias + ' dias).');
      if (dias === 0) return 'Vence hoje (' + P.dataBR(proximo) + ').';
      return 'Atrasado: venceu em ' + P.dataBR(proximo) + ' (há ' + (-dias) + (dias === -1 ? ' dia).' : ' dias).');
    }

    function paginaDoAluno(user, aluno) {
      var h = P.estado.ler(); /* se veio de um recarregamento, "atividade" diz qual atividade estava aberta */
      var atividadeAberta = h.aluno === aluno.id ? h.atividade : '';
      /* seções abertas: as que você deixou abertas (guardadas no endereço); na primeira vez, tudo fechado */
      var abertas = (h.aluno === aluno.id && h.abertas != null) ? String(h.abertas).split(',').filter(function (x) { return x && x !== '-'; }) : [];
      if (atividadeAberta && abertas.indexOf('atividades') < 0) abertas.push('atividades');
      P.estado.gravar({ aluno: aluno.id, abertas: abertas.join(',') || '-' });
      limpar();
      app.appendChild(topo(nomeAdmin));
      var voltar = P.botaoVoltar(function () { listaDeAlunos(user); });
      var verComoAluno = el('a', { class: 'portal-btn', href: 'aluno.html?ver=' + encodeURIComponent(aluno.id), target: '_blank', rel: 'noopener', text: 'Ver como aluno' });
      app.appendChild(el('div', { class: 'portal-topo' }, [voltar, verComoAluno]));
      P.voltarNoFim(app, function () { listaDeAlunos(user); });

      /* entrar no encontro e dia do próximo, sem procurar o link */
      var meetAdmin = P.linkSeguro(aluno.meet_link);
      var lugarEncontro = el('p', { class: 'portal-proximo', style: 'display:none' });
      if (meetAdmin) app.appendChild(el('a', { class: 'portal-btn portal-btn-meet portal-meet', href: meetAdmin, target: '_blank', rel: 'noopener' }, [el('img', { src: 'img/rede-meet.svg', alt: '', width: '40', height: '40' }), el('span', { text: 'Entrar no encontro' })]));
      app.appendChild(lugarEncontro);
      P.proximoEncontro(aluno.id).then(function (e) { /* puxado da Google Agenda */
        if (!e) return;
        if (e.motivo) { lugarEncontro.textContent = 'Próximo encontro não encontrado: ' + e.motivo + '.'; lugarEncontro.style.display = ''; return; }
        lugarEncontro.textContent = P.textoEncontro(e); lugarEncontro.style.display = '';
        if (!meetAdmin && e.meet) lugarEncontro.parentNode.insertBefore(el('a', { class: 'portal-btn portal-btn-meet portal-meet', href: e.meet, target: '_blank', rel: 'noopener' }, [el('img', { src: 'img/rede-meet.svg', alt: '', width: '40', height: '40' }), el('span', { text: 'Entrar no encontro' })]), lugarEncontro);
      });

      /* dados do aluno: código, nome, WhatsApp, link do Meet e pasta no Drive (o código só o administrador vê) */
      var msgDados = el('p', { class: 'portal-msg' });
      var codInput = el('input', { type: 'text', id: 'alunoCodigo', placeholder: 'Ex.: 0147' });
      codInput.value = aluno.codigo || '';
      var nomeInput = el('input', { type: 'text', id: 'alunoNome', required: '' });
      nomeInput.value = aluno.nome || '';
      var whatsInput = el('input', { type: 'tel', id: 'alunoWhats', placeholder: 'Ex.: 11 91234-5678' });
      whatsInput.value = aluno.whatsapp || '';
      var meet = el('input', { type: 'url', id: 'alunoMeet', placeholder: 'https://meet.google.com/...' });
      meet.value = aluno.meet_link || '';
      var salvarDados = el('button', { type: 'submit', class: 'portal-btn', text: 'Salvar dados' });
      var pastaDrive = P.cartaoPastaDrive({ plural: 'alunos', tipo: 'aluno', id: aluno.id, email: aluno.email, dentroDeOutroBloco: true,
        codigo: function () { return aluno.codigo; },
        nome: function () { return (aluno.codigo ? aluno.codigo + ' - ' : '') + aluno.nome; } });
      var formDados = el('form', { class: 'portal-cartao' }, [
        el('h2', { text: 'Dados do aluno' }),
        el('label', { for: 'alunoCodigo', text: 'Código' }), codInput,
        el('label', { for: 'alunoNome', text: 'Nome' }), nomeInput,
        el('label', { for: 'alunoWhats', text: 'WhatsApp' }), whatsInput,
        el('label', { for: 'alunoMeet', text: 'Link do Meet' }), meet,
        pastaDrive, msgDados, salvarDados
      ]);
      formDados.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var novoNome = nomeInput.value.trim();
        var valor = codInput.value.trim();
        var linkMeet = meet.value.trim();
        var seguro = linkMeet ? P.linkSeguro(linkMeet) : null;
        if (!novoNome) { P.mensagem(msgDados, 'Escreva o nome.', 'erro'); return; }
        if (linkMeet && !seguro) { P.mensagem(msgDados, 'O link do Meet precisa começar com https://', 'erro'); return; }
        salvarDados.disabled = true;
        P.client.from('alunos').update({ nome: novoNome, whatsapp: whatsInput.value.trim() || null, meet_link: seguro }).eq('id', aluno.id).then(function (r1) {
          if (r1.error) { salvarDados.disabled = false; P.mensagem(msgDados, P.traduzErro(r1.error.message), 'erro'); return; }
          var pedido = valor
            ? P.client.from('aluno_codigos').upsert({ aluno_id: aluno.id, codigo: valor }, { onConflict: 'aluno_id' })
            : P.client.from('aluno_codigos').delete().eq('aluno_id', aluno.id);
          pedido.then(function (r2) {
            salvarDados.disabled = false;
            if (r2.error) { P.mensagem(msgDados, /duplicate|unique/i.test(r2.error.message) ? 'Nome salvo, mas esse código já é de outro aluno.' : P.traduzErro(r2.error.message), 'erro'); return; }
            aluno.nome = novoNome; aluno.codigo = valor; aluno.whatsapp = whatsInput.value.trim() || null; aluno.meet_link = seguro;
            paginaDoAluno(user, aluno);
          });
        });
      });
      app.appendChild(P.sanfona(abertas, 'dados', 'Dados do aluno', [formDados]));
      var secAtividades = P.sanfona(abertas, 'atividades', 'Atividades', [window.atividades.painelAdmin(aluno, atividadeAberta)]); /* entra na tela logo depois de "Novo material" */

      /* seção de itens (materiais ou gravações): botão "Adicionar" no topo, que abre o cadastro (fecha ao salvar); embaixo, a lista dos que já estão cadastrados */
      function secaoDeItens(o) {
        var lista = el('div'), areaForm = el('div');
        var novo = el('button', { type: 'button', class: 'portal-btn', text: o.rotuloNovo });
        var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: o.titulo }), el('div', { class: 'portal-acoes', style: 'margin-bottom:14px' }, [novo]), areaForm, lista]);

        function abrirForm(item) {
          if (areaForm.firstChild && !item) return; /* já está aberto: tocar de novo não pode apagar o que você escreveu */
          areaForm.textContent = '';
          var msg = el('p', { class: 'portal-msg' });
          var id = o.bloco + (item ? 'e' : 'n');
          var titulo = el('input', { type: 'text', id: 'it' + id + 'T', required: '' });
          var data = el('input', { type: 'date', id: 'it' + id + 'D' });
          var descricao = el('textarea', { id: 'it' + id + 'S', rows: '4', placeholder: o.placeholder });
          var link = el('input', { type: 'url', id: 'it' + id + 'L', placeholder: 'https://drive.google.com/... ou https://archive.org/...', required: '' });
          if (item) { titulo.value = item.titulo; data.value = item.data || ''; descricao.value = item.descricao || ''; link.value = item.link; }
          var salvar = el('button', { type: 'submit', class: 'portal-btn', text: item ? 'Salvar alterações' : 'Salvar' });
          var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
          cancelar.addEventListener('click', function () { areaForm.textContent = ''; });
          var form = el('form', { class: 'portal-cartao' }, [
            el('p', { class: 'portal-item-titulo', text: item ? 'Editando: ' + item.titulo : o.rotuloNovo }),
            el('p', { text: 'Escolha o arquivo no Drive: o link entra sozinho e o arquivo (ou a pasta) já é compartilhado com o e-mail do aluno. Se colar o link à mão, compartilhe no próprio Drive.' }),
            el('label', { for: 'it' + id + 'T', text: 'Título' }), titulo,
            el('label', { for: 'it' + id + 'D', text: 'Data (opcional)' }), data,
            el('label', { for: 'it' + id + 'S', text: 'Descrição (opcional)' }), descricao,
            el('label', { for: 'it' + id + 'L', text: o.bloco === 'materiais' ? 'Link (do Drive ou de outro site, como o Archive.org)' : 'Link do Drive' }), link, P.botaoDrive(link, function (t, tipo) { P.mensagem(msg, t, tipo); }, aluno.email, 'aluno:' + aluno.id), msg,
            el('div', { class: 'portal-acoes' }, [salvar, cancelar])
          ]);
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var seguro = P.linkSeguro(link.value);
            if (!seguro) { P.mensagem(msg, 'O link precisa começar com https://', 'erro'); return; }
            salvar.disabled = true;
            var campos = { bloco: item ? item.bloco : o.bloco, titulo: titulo.value.trim(), link: seguro, data: data.value || null, descricao: descricao.value.trim() || null };
            var pedido = item ? P.client.from('itens').update(campos).eq('id', item.id) : P.client.from('itens').insert(Object.assign({ aluno_id: aluno.id }, campos));
            pedido.then(function (r) {
              salvar.disabled = false;
              if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
              areaForm.textContent = ''; carregar(); /* salvou: o cadastro se fecha e a lista atualiza */
            });
          });
          areaForm.appendChild(form);
          form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        novo.addEventListener('click', function () { abrirForm(null); });

        var aberturas = {};
        function carregar() {
          lista.textContent = '';
          /* quando o aluno abriu cada item (tabela item_aberturas); se falhar, a lista aparece sem essa informação */
          P.client.from('item_aberturas').select('item_id,criado_em').eq('aluno_id', aluno.id).then(function (ra) {
            aberturas = {};
            ((ra && ra.data) || []).forEach(function (x) {
              var e = aberturas[x.item_id] || (aberturas[x.item_id] = { n: 0, ultima: x.criado_em });
              e.n++; if (x.criado_em > e.ultima) e.ultima = x.criado_em;
            });
            listar();
          }, function () { aberturas = {}; listar(); });
        }
        function listar() {
          P.client.from('itens').select('id,bloco,titulo,descricao,link,data').eq('aluno_id', aluno.id).in('bloco', o.blocos)
            .order('data', { ascending: false, nullsFirst: false }).order('criado_em', { ascending: false }).then(function (r) {
              if (r.error) { lista.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar.' })); return; }
              if (!r.data.length) lista.appendChild(el('p', { class: 'portal-vazio', text: o.vazio }));
              r.data.forEach(function (i) {
                var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
                editar.style.padding = '6px 12px'; editar.style.fontSize = '13px';
                editar.addEventListener('click', function () { abrirForm(i); });
                var apagar = P.botaoApagar('Apagar');
                apagar.addEventListener('click', function () {
                  if (!confirm('Apagar "' + i.titulo + '"? (O arquivo no Drive não é apagado.)')) return;
                  P.client.from('itens').delete().eq('id', i.id).then(function (d) { if (d.error) alert('Não foi possível apagar.'); else carregar(); });
                });
                var ab = aberturas[i.id];
                var quando = ab ? 'Aberto ' + (ab.n === 1 ? '1 vez' : ab.n + ' vezes') + ', a última em ' + new Date(ab.ultima).toLocaleDateString('pt-BR') + ' às ' + new Date(ab.ultima).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Ainda não abriu';
                var legenda = (i.bloco === 'caderno' ? BLOCOS.caderno : '') + (i.data ? (i.bloco === 'caderno' ? ' · ' : '') + P.dataBR(i.data) : '');
                lista.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
                  el('div', {}, [el('span', { class: 'portal-item-titulo', text: i.titulo })].concat(legenda ? [el('span', { class: 'portal-item-data', text: legenda })] : []).concat([el('span', { class: 'portal-item-data', text: quando })])),
                  el('div', { class: 'portal-acoes' }, [editar, apagar])
                ])]));
              });
            });
        }
        carregar();
        return P.sanfona(abertas, o.chave, o.titulo, [cartao]);
      }

      /* pagamento: só o administrador vê (tabela própria, o aluno não lê) */
      var msgPag = el('p', { class: 'portal-msg' });
      var statusPag = el('p', { class: 'portal-item-titulo', style: 'display:block;margin:0 0 14px' });
      var ultimoIn = el('input', { type: 'date', id: 'pagUltimo' });
      var proximoIn = el('input', { type: 'date', id: 'pagProximo' });
      /* pagamento recorrente por cartão: o site não sabe sozinho quem ativou, então você marca aqui; o cancelamento também é você que faz (o aluno avisa) */
      var recorrenteSel = el('select', { id: 'pagRecorrente' }, [el('option', { value: 'nao', text: 'Não ativo' }), el('option', { value: 'sim', text: 'Ativo' })]);
      var linkRecIn = el('input', { type: 'url', id: 'pagLinkRec', placeholder: 'Em branco = link novo do site' });
      var salvarPag = el('button', { type: 'button', class: 'portal-btn', text: 'Salvar pagamento' });
      var pagouHoje = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Pagou (próximo vencimento 1 mês depois)' });
      function mostrarStatus() { statusPag.textContent = textoPagamento(ultimoIn.value, proximoIn.value); }
      ultimoIn.addEventListener('input', mostrarStatus); proximoIn.addEventListener('input', mostrarStatus);
      function gravarPag() {
        salvarPag.disabled = pagouHoje.disabled = true;
        P.client.from('aluno_pagamentos').upsert({ aluno_id: aluno.id, ultimo_pagamento: ultimoIn.value || null, proximo_pagamento: proximoIn.value || null, recorrente_ativo: recorrenteSel.value === 'sim', link_recorrente: linkRecIn.value.trim() || null }, { onConflict: 'aluno_id' }).then(function (r) {
          salvarPag.disabled = pagouHoje.disabled = false;
          if (r.error) P.mensagem(msgPag, P.traduzErro(r.error.message), 'erro'); else { P.mensagem(msgPag, 'Pagamento salvo.', 'ok'); mostrarStatus(); }
        });
      }
      salvarPag.addEventListener('click', gravarPag);
      /* o dia do vencimento é fixo: o próximo é sempre 1 mês depois do vencimento anterior (pagar atrasado não muda o dia); sem vencimento ainda, 1 mês depois de hoje */
      pagouHoje.addEventListener('click', function () {
        var hoje = new Date(), base = proximoIn.value ? new Date(proximoIn.value + 'T00:00:00') : hoje;
        var prox = new Date(base.getFullYear(), base.getMonth() + 1, base.getDate());
        if (prox.getDate() !== base.getDate()) prox = new Date(base.getFullYear(), base.getMonth() + 2, 0);
        ultimoIn.value = dataISO(hoje); proximoIn.value = dataISO(prox); gravarPag();
      });
      P.client.from('aluno_pagamentos').select('ultimo_pagamento,proximo_pagamento,recorrente_ativo,link_recorrente').eq('aluno_id', aluno.id).maybeSingle().then(function (r) {
        if (r.data) { ultimoIn.value = r.data.ultimo_pagamento || ''; proximoIn.value = r.data.proximo_pagamento || ''; recorrenteSel.value = r.data.recorrente_ativo ? 'sim' : 'nao'; linkRecIn.value = r.data.link_recorrente || ''; }
        mostrarStatus();
      });
      app.appendChild(P.sanfona(abertas, 'pagamento', 'Pagamento', [el('div', { class: 'portal-cartao' }, [
        el('h2', { text: 'Pagamento' }), statusPag,
        el('label', { for: 'pagUltimo', text: 'Último pagamento' }), ultimoIn,
        el('label', { for: 'pagProximo', text: 'Próximo pagamento' }), proximoIn,
        el('label', { for: 'pagRecorrente', text: 'Pagamento recorrente por cartão' }), recorrenteSel,
        el('label', { for: 'pagLinkRec', text: 'Link do pagamento recorrente deste aluno' }), linkRecIn,
        msgPag, el('div', { class: 'portal-acoes' }, [salvarPag, pagouHoje])
      ])]));

      /* ordem na tela: Dados do aluno, Pagamento, Atividades, Materiais, Gravações dos encontros */
      app.appendChild(secAtividades);
      app.appendChild(secaoDeItens({ chave: 'materiais', titulo: 'Materiais', bloco: 'materiais', blocos: ['materiais', 'caderno'], rotuloNovo: 'Adicionar novo material',
        placeholder: 'Ex.: texto de apoio da aula', vazio: 'Nenhum material adicionado ainda.' }));
      app.appendChild(secaoDeItens({ chave: 'gravacoes', titulo: 'Gravações dos encontros', bloco: 'gravacoes', blocos: ['gravacoes'], rotuloNovo: 'Adicionar nova gravação',
        placeholder: 'Ex.: neste encontro falamos de...', vazio: 'Nenhuma gravação adicionada ainda.' }));

      /* cada vez que o aluno baixou o caderno em PDF (só você vê isso) */
      var cartaoBaixas = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Caderno baixado pelo aluno' })]);
      app.appendChild(cartaoBaixas);
      P.client.from('caderno_baixas').select('criado_em').eq('aluno_id', aluno.id).order('criado_em', { ascending: false }).then(function (rb) {
        if (rb.error) { cartaoBaixas.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar.' })); return; }
        if (!rb.data.length) { cartaoBaixas.appendChild(el('p', { class: 'portal-vazio', text: 'Ainda não baixou o caderno.' })); return; }
        cartaoBaixas.appendChild(el('p', { text: 'Baixou ' + rb.data.length + (rb.data.length === 1 ? ' vez.' : ' vezes.') }));
        rb.data.forEach(function (b) {
          var d = new Date(b.criado_em);
          cartaoBaixas.appendChild(el('p', { class: 'portal-item-data', text: d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) }));
        });
      });

      var remover = P.botaoApagar('Remover este aluno do portal');
      remover.addEventListener('click', function () {
        if (!confirm('Remover ' + aluno.nome + ' do portal? Os itens dele também somem daqui (os arquivos do Drive ficam).')) return;
        P.client.from('alunos').delete().eq('id', aluno.id).then(function (d) {
          if (d.error) alert('Não foi possível remover.'); else listaDeAlunos(user);
        });
      });
      P.apagarNoFim(app, remover); /* discreto, no fim da tela */
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { limpar(); P.montarNovaSenha(app, iniciar); } });
    if (P.emRecuperacao) { limpar(); P.montarNovaSenha(app, iniciar); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
