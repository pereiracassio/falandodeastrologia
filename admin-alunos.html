<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">

    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>

  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=118"></script>
  <script src="atividades.js?v=36"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    var BLOCOS = { gravacoes: 'Gravação do encontro', materiais: 'Material', caderno: 'Atividades (documento do Drive)' }; // o primeiro é o que já vem marcado
    var alunoAberto = null, nomeAdmin = '';

    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('alunos', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }

    function iniciar(user) {
      limpar();
      P.client.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        P.client.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          restaurar(user);
        });
      });
    }

    /* depois de recarregar: volta pro aluno em que você estava (endereço #aluno=ID) */
    function restaurar(user) {
      var h = P.estado.ler(), doAviso = new URLSearchParams(location.search).get('aluno');   /* ?aluno=ID: veio de um aviso */
      if (doAviso) h.aluno = doAviso;
      if (!h.aluno) { listaDeAlunos(user); return; }
      Promise.all([P.client.from('alunos').select('id,nome,email,nascimento,meet_link,whatsapp').eq('id', h.aluno).maybeSingle(),
                   P.client.from('aluno_codigos').select('codigo').eq('aluno_id', h.aluno).maybeSingle()]).then(function (r) {
        if (r[0].error || !r[0].data) { listaDeAlunos(user); return; }
        var a = r[0].data; a.codigo = (r[1].data && r[1].data.codigo) || '';
        alunoAberto = a; paginaDoAluno(user, a);
      }, function () { listaDeAlunos(user); });
    }

    function listaDeAlunos(user) {
      var h = P.estado.ler();
      P.estado.gravar({});
      limpar();
      app.appendChild(topo(nomeAdmin));
      /* só o conteúdo dos alunos (botão de adicionar no topo, busca e lista); pasta, Google Drive e avisos ficam em ⚙ (admin-site.html) */
      var novoAluno = el('button', { type: 'button', class: 'portal-btn', text: 'Adicionar novo aluno' });
      var areaForm = el('div', { class: 'barra-ocre' });
      var cartao = el('div', { class: 'portal-cartao' }, [el('div', { class: 'portal-acoes', style: 'margin-bottom:14px' }, [novoAluno]), areaForm]);
      app.appendChild(cartao);

      /* novo aluno */
      var msg = el('p', { class: 'portal-msg' });
      var nome = el('input', { type: 'text', id: 'novoNome', required: '' });
      var email = el('input', { type: 'email', id: 'novoEmail', required: '' });
      var nascNovo = el('input', { type: 'date', id: 'novoNasc' });
      var codigo = el('input', { type: 'text', id: 'novoCodigo', placeholder: 'Ex.: 0147' });
      var add = el('button', { type: 'submit', class: 'portal-btn', text: 'Adicionar aluno' });
      var cancelarNovo = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
      cancelarNovo.addEventListener('click', function () { areaForm.textContent = ''; });
      var form = el('form', { class: 'portal-item', style: 'margin-bottom:14px' }, [
        el('p', { class: 'portal-item-titulo', text: 'Novo aluno' }),
        el('p', { text: 'O acesso dele é criado aqui, ao adicionar. Ele entra com o Google (o mesmo Gmail) ou toca em "Esqueci minha senha" na tela de entrada.' }),
        el('label', { for: 'novoNome', text: 'Nome' }), nome,
        el('label', { for: 'novoEmail', text: 'E-mail (o mesmo do acesso)' }), email,
        el('label', { for: 'novoNasc', text: 'Aniversário' }), nascNovo,
        el('label', { for: 'novoCodigo', text: 'Código do aluno' }), codigo, msg, el('div', { class: 'portal-acoes' }, [add, cancelarNovo])
      ]);
      form.addEventListener('submit', function (ev) {
        var avisoAcesso = '';
        var terminar = function () {
          if (!avisoAcesso) { listaDeAlunos(user); return; }
          P.mensagem(msg, 'Cadastrado. Mas o acesso não foi criado agora (' + avisoAcesso + ').', 'erro');
          setTimeout(function () { listaDeAlunos(user); }, 7000);
        };
        ev.preventDefault(); add.disabled = true; P.mensagem(msg, 'Criando o acesso...');
        /* primeiro o acesso (login) do aluno, criado pelo servidor; só depois a ficha dele aqui */
        P.client.auth.getSession().then(function (sessao) {
          var jwt = sessao.data && sessao.data.session ? sessao.data.session.access_token : '';
          return fetch('https://falandodeastrologia.vercel.app/api/criar-acesso', { method: 'POST', headers: { Authorization: 'Bearer ' + jwt, 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nome.value.trim(), email: email.value.trim() }) })
            .then(function (resp) { return resp.json().catch(function () { return {}; }).then(function (d) { if (!resp.ok) throw new Error(d.detalhe || d.erro || 'erro'); }); });
        }).then(function () {
          P.mensagem(msg, '');
          return P.client.from('alunos').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase(), nascimento: nascNovo.value || null }).select('id').single();
        }).catch(function (e) {
          avisoAcesso = e.message; /* o acesso não travou: a ficha é criada mesmo assim e o motivo aparece */
          return P.client.from('alunos').insert({ nome: nome.value.trim(), email: email.value.trim().toLowerCase(), nascimento: nascNovo.value || null }).select('id').single();
        }).then(function (r) {
          if (r.error) { add.disabled = false; P.mensagem(msg, /duplicate|unique/i.test(r.error.message) ? 'Já existe um aluno com esse e-mail.' : P.traduzErro(r.error.message), 'erro'); return; }
          var cod = codigo.value.trim();
          if (!cod) { add.disabled = false; terminar(); return; }
          P.client.from('aluno_codigos').insert({ aluno_id: r.data.id, codigo: cod }).then(function (rc) {
            add.disabled = false;
            if (rc.error) { P.mensagem(msg, /duplicate|unique/i.test(rc.error.message) ? 'Aluno criado, mas esse código já é de outro aluno. Abra o aluno e corrija o código.' : 'Aluno criado, mas não foi possível salvar o código.', 'erro'); setTimeout(function () { listaDeAlunos(user); }, 6000); return; }
            terminar();
          });
        });
      });
      /* o cadastro só aparece quando você toca no botão (e tocar de novo não apaga o que já foi escrito) */
      novoAluno.addEventListener('click', function () {
        if (areaForm.firstChild) return;
        areaForm.appendChild(form); form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      /* lista */
      Promise.all([
        P.client.from('alunos').select('id,nome,email,nascimento,meet_link,whatsapp').order('nome'),
        P.client.from('aluno_codigos').select('aluno_id,codigo'),
        /* atividades que o aluno já enviou e que ainda esperam a sua correção */
        P.client.from('atividades').select('id,aluno_id,titulo,enviada_em').not('enviada_em', 'is', null).is('corrigida_em', null).eq('antiga', false),
        P.client.from('aluno_pagamentos').select('aluno_id,ultimo_pagamento,proximo_pagamento')
      ]).then(function (res) {
        var r = res[0], rc = res[1];
        var paraCorrigir = {}, totalParaCorrigir = 0, esperando = ((res[2] && res[2].data) || []).slice().sort(function (a, b) { return String(a.enviada_em) < String(b.enviada_em) ? -1 : 1; });
        esperando.forEach(function (x) { paraCorrigir[x.aluno_id] = (paraCorrigir[x.aluno_id] || 0) + 1; totalParaCorrigir++; });
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a lista.' })); return; }
        var pagamentos = {};
        ((res[3] && res[3].data) || []).forEach(function (x) { pagamentos[x.aluno_id] = x; });
        var codigos = {};
        (rc.data || []).forEach(function (c) { codigos[c.aluno_id] = c.codigo; });
        r.data.forEach(function (a) { a.codigo = codigos[a.id] || ''; });
        var alunos = P.ordenarPorCodigo(r.data);
        if (!alunos.length) { cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno ainda.' })); return; }
        var busca = el('input', { type: 'search', id: 'buscaAluno', placeholder: 'Buscar por código, nome ou e-mail' });
        var lista = el('div');
        /* o aviso diz QUAIS são: uma linha por atividade ("Fulano · título"), e tocar abre a atividade dele na hora */
        if (totalParaCorrigir) {
          cartao.appendChild(el('p', { class: 'portal-item-data', style: 'font-weight:700;font-size:15px;margin:0 0 6px', text: totalParaCorrigir === 1 ? '1 atividade esperando a sua correção' : totalParaCorrigir + ' atividades esperando a sua correção' }));
          esperando.forEach(function (x) {
            var aluno = r.data.filter(function (a) { return a.id === x.aluno_id; })[0];
            if (!aluno) return;
            var l = el('a', { href: '#', style: 'display:block;margin:0 0 6px;color:#A03E25;text-decoration:underline', text: aluno.nome + ' · ' + (x.titulo || 'atividade') });
            l.addEventListener('click', function (ev) { ev.preventDefault(); P.estado.gravar({ aluno: aluno.id, atividade: x.id }); alunoAberto = aluno; paginaDoAluno(user, aluno); });
            cartao.appendChild(l);
          });
          cartao.appendChild(el('div', { style: 'height:8px' }));
        }
        cartao.appendChild(busca);
        cartao.appendChild(lista);
        function desenhar() {
          var t = busca.value.trim().toLowerCase();
          lista.textContent = '';
          var achados = alunos.filter(function (a) { return !t || (a.codigo + ' ' + a.nome + ' ' + a.email).toLowerCase().indexOf(t) >= 0; });
          if (!achados.length) lista.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aluno encontrado.' }));
          achados.forEach(function (a) {
            /* a linha inteira é o botão: tocar no aluno abre a página dele */
            var abrir = function () { alunoAberto = a; paginaDoAluno(user, a); };
            var linha = el('div', { class: 'portal-item portal-item-clicavel', role: 'button', tabindex: '0' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: (a.codigo ? a.codigo + ' · ' : '') + a.nome }), el('span', { class: 'portal-item-data', text: a.email })].concat(
                pagamentos[a.id] ? [el('span', { class: 'portal-item-data', text: textoPagamento(pagamentos[a.id].ultimo_pagamento, pagamentos[a.id].proximo_pagamento) })] : []).concat(
                paraCorrigir[a.id] ? [el('span', { class: 'portal-item-data', style: 'font-weight:700', text: paraCorrigir[a.id] === 1 ? '1 atividade para corrigir' : paraCorrigir[a.id] + ' atividades para corrigir' })] : []))
            ])]);
            linha.addEventListener('click', abrir);
            linha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
            lista.appendChild(linha);
          });
        }
        busca.addEventListener('input', desenhar);
        desenhar();
      });
    }

    function dataISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    /* "Pago até 24/11", "Vence hoje", "Atrasado há 5 dias"... a partir das duas datas (aaaa-mm-dd) */
    function textoPagamento(ultimo, proximo) {
      if (!proximo) return ultimo ? 'Último pagamento em ' + P.dataBR(ultimo) + '. Sem data do próximo.' : 'Nenhum pagamento registrado.';
      var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      var v = new Date(proximo + 'T00:00:00'), dias = Math.round((v - hoje) / 86400000);
      if (dias > 0) return 'Em dia. Próximo pagamento em ' + P.dataBR(proximo) + (dias === 1 ? ' (amanhã).' : ' (em ' + dias + ' dias).');
      if (dias === 0) return 'Vence hoje (' + P.dataBR(proximo) + ').';
      return 'Atrasado: venceu em ' + P.dataBR(proximo) + ' (há ' + (-dias) + (dias === -1 ? ' dia).' : ' dias).');
    }

    /* trilhas do aluno: uma por assunto, com passos e barra de progresso (mesma ideia dos Projetos); trilha com todos os passos feitos vai para "Trilhas concluídas" */
    function painelTrilhas(aluno) {
      var raiz = el('div');
      var trilhas = [], passos = [], itensAluno = [], ativsAluno = [], abertaConcl = null;
      var barra = function (pct) { return el('div', { style: 'height:14px;border:1px solid #1F5FA3;margin:8px 0 6px' }, [el('i', { style: 'display:block;height:100%;background:#1F5FA3;width:' + pct + '%' })]); };
      var mini = function (txt, aoClicar, desligado) { var b = el('button', { type: 'button', text: txt, style: 'background:transparent;border:0;border-radius:0;padding:2px 4px;min-height:0;font-size:13px;color:#16233F;opacity:' + (desligado ? '.2' : '.6') + ';cursor:pointer;text-decoration:underline' }); b.disabled = !!desligado; b.addEventListener('click', aoClicar); return b; };
      var rotulo = function (t) { return el('p', { text: t, style: "font-family:Cinzel,serif;font-weight:700;font-size:14px;color:#A03E25;margin:20px 0 6px;text-transform:lowercase" }); };
      function carregar() {
        Promise.all([
          P.client.from('aluno_trilhas').select('id,nome,ordem,data_fim,criado_em,data_inicio,concluida_em').eq('aluno_id', aluno.id).order('ordem').order('criado_em'),
          P.client.from('aluno_trilha_passos').select('id,trilha_id,titulo,feito,feito_em,ordem,tipo,item_id,atividade_id,lido_em').order('ordem').order('criado_em'),
          P.client.from('itens').select('id,titulo,bloco').eq('aluno_id', aluno.id).in('bloco', ['materiais', 'caderno', 'gravacoes']).order('criado_em')
        ]).then(function (rs) {
          raiz.textContent = '';
          itensAluno = (rs[2] && rs[2].data) || [];
          if (rs[0].error || rs[1].error) { raiz.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar as trilhas.' })); return; }
          trilhas = rs[0].data; var ids = trilhas.map(function (t) { return t.id; });
          passos = rs[1].data.filter(function (x) { return ids.indexOf(x.trilha_id) >= 0; });
          /* atividades do aluno e o que cada uma já andou (disponível, enviada, corrigida) */
          /* a coluna somente_leitura pode não existir neste banco: se o pedido falhar por causa dela, pede de novo sem ela (era isso que deixava a lista vazia) */
          var pedirAtividades = function (colunas) { return P.client.from('atividades').select(colunas).eq('aluno_id', aluno.id).order('criado_em'); };
          pedirAtividades('id,titulo,enviada_em,corrigida_em,antiga,somente_leitura,data_atividade').then(function (r1) { return r1.error ? pedirAtividades('id,titulo,enviada_em,corrigida_em,antiga,data_atividade') : r1; }).then(function (ra) {
            ativsAluno = (ra && ra.data) || [];
            /* a data de conclusão se marca sozinha quando todos os passos ficam prontos (a última data conhecida, ou hoje) e sai se a trilha for reaberta; dá para ajustar à mão */
            trilhas.forEach(function (t) {
              var m = meus(t), pronta = m.length > 0 && m.every(function (x) { return pontos(x) >= 1; });
              if (pronta && !t.concluida_em) {
                var ult = m.reduce(function (a, x) { var at = ativDoPasso(x), d = x.feito_em || x.lido_em || (at && at.corrigida_em ? String(at.corrigida_em) : ''); return d && d > a ? d : a; }, '');
                t.concluida_em = ult ? ult.slice(0, 10) : new Date().toLocaleDateString('sv-SE');
                P.client.from('aluno_trilhas').update({ concluida_em: t.concluida_em }).eq('id', t.id).then(function () {});
              } else if (!pronta && t.concluida_em) { t.concluida_em = null; P.client.from('aluno_trilhas').update({ concluida_em: null }).eq('id', t.id).then(function () {}); }
            });
            desenhar();
          });
        });
      }
      /* azul no começo, ocre na metade, terracota no fim */
      function corDoTempo(f) {
        var A = [31, 95, 163], O = [181, 133, 47], T = [160, 62, 37], de = f < 0.5 ? A : O, para = f < 0.5 ? O : T, k = f < 0.5 ? f / 0.5 : (f - 0.5) / 0.5;
        return 'rgb(' + de.map(function (c, i) { return Math.round(c + (para[i] - c) * k); }).join(',') + ')';
      }
      var meus = function (t) { return passos.filter(function (x) { return x.trilha_id === t.id; }); };
      /* pontos de cada passo (a barra anda por etapas): comum 0 ou 1; material em preparação 0, ligado ½, lido pelo aluno 1 */
      var pontos = function (x) {
        if (x.tipo === 'material') return x.lido_em ? 1 : (x.item_id ? 0.5 : 0);
        if (x.tipo === 'gravacao') return tituloDoItem(x.item_id) ? 1 : 0; /* gravação ligada = aula já feita ao vivo: passo completo */
        if (x.tipo === 'atividade') { var a = ativDoPasso(x); if (a && (a.antiga || a.somente_leitura)) return 1; /* já feita antes, ou texto para leitura */ return !a ? 0 : (a.enviada_em ? (a.corrigida_em ? 1 : 2 / 3) : 1 / 3); }
        return x.feito ? 1 : 0;
      };
      var ativDoPasso = function (x) { return x.atividade_id ? ativsAluno.filter(function (a) { return a.id === x.atividade_id; })[0] : null; };
      var tituloDoItem = function (id) { var i = itensAluno.filter(function (y) { return y.id === id; })[0]; return i ? i.titulo : ''; };
      var completa = function (t) { var m = meus(t); return m.length > 0 && m.every(function (x) { return pontos(x) >= 1; }); };
      var inicioDe = function (t) { return t.data_inicio || new Date(t.criado_em).toLocaleDateString('sv-SE'); };
      /* campo de data da trilha: grava sozinho, e só redesenha quando perde o foco (para não fechar o calendário) */
      function campoDataTrilha(rotuloTxt, t, coluna, comPadrao) {
        var inp = el('input', { type: 'date', style: 'width:auto' }); inp.value = coluna === 'data_inicio' ? inicioDe(t) : (t[coluna] || '');
        var sujo = false;
        inp.addEventListener('change', function () {
          var campos = {}; campos[coluna] = inp.value || null;
          P.client.from('aluno_trilhas').update(campos).eq('id', t.id).then(function (r) { if (r.error) alert('Não foi possível salvar a data.'); else { t[coluna] = inp.value || null; sujo = true; } });
        });
        inp.addEventListener('blur', function () { setTimeout(function () { if (sujo) { sujo = false; carregar(); } }, 300); });
        return P.colunaData(inp, rotuloTxt);
      }
      function novaTrilha() {
        var nome = (prompt('Assunto da trilha (ex.: Liberação zodiacal)') || '').trim(); if (!nome) return;
        var ordem = trilhas.reduce(function (m, t) { return Math.max(m, t.ordem || 0); }, 0) + 1;
        P.client.from('aluno_trilhas').insert({ aluno_id: aluno.id, nome: nome, ordem: ordem }).then(function (r) { if (r.error) alert('Não foi possível criar.'); else carregar(); });
      }
      /* arquivo { "trilhas": [ { "nome", "inicio": "AAAA-MM-DD", "passos": [ { "titulo", "tipo": "comum"|"material"|"atividade"|"gravacao", "feito", "ligar": "título exato do material/atividade/gravação do aluno" } ] } ] }: trilha de mesmo nome só ganha os passos que faltam; "ligar" acha o item pelo título (se não achar, o passo fica em preparação) */
      function importarTrilhas(f) {
        f.text().then(function (txt) {
          var dados;
          try { dados = JSON.parse(txt); } catch (e) { alert('Esse arquivo não é válido.'); return; }
          var lista = (dados && dados.trilhas) || [];
          if (!lista.length) { alert('Não achei trilhas nesse arquivo.'); return; }

    function paginaDoAluno(user, aluno) {

      /* dados do aluno: código, nome, WhatsApp, link do Meet e pasta no Drive (o código só o administrador vê) */
      var msgDados = el('p', { class: 'portal-msg' });

      formDados.addEventListener('submit', function (ev) {

      /* seção de itens (materiais ou gravações): botão "Adicionar" no topo, que abre o cadastro (fecha ao salvar); embaixo, a lista dos que já estão cadastrados */
      function secaoDeItens(o) {

      var remover = P.botaoApagar('Remover este aluno do portal');
      remover.addEventListener('click', function () {
        if (!confirm('Remover ' + aluno.nome + ' do portal? Os itens dele também somem daqui (os arquivos do Drive ficam).')) return;
        P.client.from('alunos').delete().eq('id', aluno.id).then(function (d) {
          if (d.error) alert('Não foi possível remover.'); else listaDeAlunos(user);
        });
      });
      P.apagarNoFim(app, remover); /* discreto, no fim da tela */
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { limpar(); P.montarNovaSenha(app, iniciar); } });
    if (P.emRecuperacao) { limpar(); P.montarNovaSenha(app, iniciar); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>

</body>
</html>
