<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    .proj-barra{height:14px;border:1px solid #1F5FA3;margin:8px 0 6px}
    .proj-barra i{display:block;height:100%;background:#1F5FA3}
    .proj-passo{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid #1F5FA3}
    .proj-passo:last-child{border-bottom:0}
    .proj-passo input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid #1F5FA3;background:transparent;border-radius:0;padding:0;cursor:pointer;position:relative}
    .proj-passo input[type=checkbox]:checked::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A03E25;font-size:20px;font-weight:700;font-family:Arial,sans-serif}
    .proj-passo.feito .proj-titulo{text-decoration:line-through;opacity:.6}
    .proj-grupo{font-family:Cinzel,serif;font-weight:700;font-size:14px;color:#A03E25;margin:22px 0 6px;text-transform:lowercase}
    .proj-titulo{font-size:17px;line-height:1.4;color:#16233F;display:block;overflow-wrap:anywhere}
    .proj-acoes{display:flex;gap:18px;align-items:center;margin-top:6px}
    .proj-mini{background:transparent;border:0;border-radius:0;padding:2px 4px;min-height:0;font-size:13px;color:#16233F;opacity:.6;cursor:pointer;text-decoration:underline}
    .proj-mini:disabled{opacity:.2;cursor:default}
  </style>
</head>
<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Projetos</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=114"></script>
  <script src="menu.js?v=42" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '', projetos = [], passos = [], aberto = null, verConcluido = null;

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('projetos', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }

    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          aberto = P.estado.ler().projeto || null;
          carregar();
        });
      });
    }

    function carregar() {
      Promise.all([
        C.from('projetos').select('id,nome,ordem,data_fim,criado_em').order('ordem').order('criado_em'),
        C.from('projeto_passos').select('id,projeto_id,titulo,nota,feito,feito_em,ordem').order('ordem').order('criado_em')
      ]).then(function (res) {
        if (res[0].error || res[1].error) { limpar(); app.appendChild(topo(nomeAdmin)); app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os projetos.' })); return; }
        projetos = res[0].data; passos = res[1].data;
        desenhar();
      });
    }

    /* azul no começo, ocre na metade, terracota no fim (mistura aos poucos) */
    function corDoTempo(f) {
      var A = [31, 95, 163], O = [181, 133, 47], T = [160, 62, 37];
      var de = f < 0.5 ? A : O, para = f < 0.5 ? O : T, t = f < 0.5 ? f / 0.5 : (f - 0.5) / 0.5;
      return 'rgb(' + de.map(function (c, k) { return Math.round(c + (para[k] - c) * t); }).join(',') + ')';
    }
    function pctDe(lista) { return lista.length ? Math.floor(lista.filter(function (x) { return x.feito; }).length * 100 / lista.length) : 0; }

    function concluidoO(p) { var m = passos.filter(function (x) { return x.projeto_id === p.id; }); return m.length > 0 && m.every(function (x) { return x.feito; }); }

    /* projeto concluído (todos os passos feitos) sai das abas e vai para "Concluídos"; "Reabrir" desmarca o último passo feito e ele volta para as abas */
    function desenhar() {
      var ativos = projetos.filter(function (p) { return !concluidoO(p); }), concl = projetos.filter(concluidoO);
      if (aberto !== 'concluidos' && !ativos.some(function (p) { return p.id === aberto; })) aberto = concl.some(function (p) { return p.id === aberto; }) ? 'concluidos' : (ativos.length ? ativos[0].id : 'concluidos');
      if (verConcluido && !concl.some(function (p) { return p.id === verConcluido; })) verConcluido = null;
      var velha = app.querySelector('.portal-abas-rola'), rolagemBarra = velha ? velha.scrollLeft : null; /* a barra fica onde estava */
      limpar();
      app.appendChild(topo(nomeAdmin));
      if (aberto === 'concluidos' && verConcluido) { telaConcluido(concl.filter(function (p) { return p.id === verConcluido; })[0]); return; }
      var barraAbas = el('div', { class: 'portal-abas', role: 'tablist' });
      ativos.forEach(function (p) {
        var b = el('button', { type: 'button', role: 'tab', text: p.nome });
        b.className = 'portal-aba' + (p.id === aberto ? ' ativa' : '');
        b.addEventListener('click', function () { aberto = p.id; P.estado.gravar({ projeto: aberto }); desenhar(); });
        barraAbas.appendChild(b);
      });
      var novo = el('button', { type: 'button', role: 'tab', text: '+ Novo projeto' });
      novo.className = 'portal-aba';
      novo.addEventListener('click', novoProjeto);
      barraAbas.appendChild(novo);
      var abaConcl = el('button', { type: 'button', role: 'tab', text: 'Concluídos' + (concl.length ? ' (' + concl.length + ')' : '') });
      abaConcl.className = 'portal-aba' + (aberto === 'concluidos' ? ' ativa' : '');
      abaConcl.addEventListener('click', function () { aberto = 'concluidos'; P.estado.gravar({ projeto: aberto }); desenhar(); });
      barraAbas.appendChild(abaConcl);
      var rola = el('div', { class: 'portal-abas-rola' }, [barraAbas]);
      app.appendChild(P.comSetas(rola));
      var conteudo = el('div', { class: 'portal-cartao' });
      app.appendChild(conteudo);
      var ativaAba = barraAbas.querySelector('.ativa');
      if (rolagemBarra != null) rola.scrollLeft = rolagemBarra;
      /* só leva o projeto aberto para a frente se ele não estiver à vista (primeira vez, ou projeto recém-criado) */
      if (ativaAba && (rolagemBarra == null || ativaAba.offsetLeft < rola.scrollLeft || ativaAba.offsetLeft + ativaAba.offsetWidth > rola.scrollLeft + rola.clientWidth)) rola.scrollLeft = Math.max(0, ativaAba.offsetLeft - (rola.clientWidth - ativaAba.offsetWidth) / 2);
      var proj = aberto === 'concluidos' ? null : ativos.filter(function (p) { return p.id === aberto; })[0];
      if (aberto === 'concluidos') {
        if (!concl.length) conteudo.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum projeto concluído ainda.' }));
        concl.forEach(function (p) {
          var m = passos.filter(function (x) { return x.projeto_id === p.id; });
          var ultima = m.reduce(function (a, x) { return x.feito_em && x.feito_em > a ? x.feito_em : a; }, '');
          var abrir = function () { verConcluido = p.id; desenhar(); window.scrollTo(0, 0); };
          var linha = el('div', { class: 'portal-item portal-item-clicavel', role: 'button', tabindex: '0' }, [el('div', { class: 'portal-item-linha' }, [el('div', {}, [
            el('span', { class: 'portal-item-titulo', text: p.nome }),
            el('span', { class: 'portal-item-data', style: 'color:#B5852F', text: m.length + (m.length === 1 ? ' passo' : ' passos') + (ultima ? ' · concluído em ' + P.dataBR(ultima.slice(0, 10)) : '') })])])]);
          linha.addEventListener('click', abrir);
          linha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
          conteudo.appendChild(linha);
        });
      } else if (!proj) conteudo.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum projeto ainda.' })); else mostrarProjeto(conteudo, proj, false);
      var arquivo = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
      var importar = el('button', { type: 'button', class: 'portal-btn', text: 'Importar projetos' });
      importar.addEventListener('click', function () { arquivo.click(); });
      arquivo.addEventListener('change', function () { var f = arquivo.files && arquivo.files[0]; arquivo.value = ''; if (f) importarArquivo(f); });
      app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:18px 0 0' }, [importar, arquivo]));
      if (!proj) return;
      var apagar = P.botaoApagar('Apagar este projeto');
      apagar.addEventListener('click', function () {
        if (!confirm('Apagar o projeto "' + proj.nome + '" e todos os passos dele? Não dá para desfazer.')) return;
        C.from('projetos').delete().eq('id', proj.id).then(function (d) { if (d.error) alert('Não foi possível apagar.'); else { aberto = null; carregar(); } });
      });
      P.apagarNoFim(app, apagar);
    }

    /* arquivo { "projetos": [ { "nome", "passos": [ { "titulo", "nota", "feito" } ] } ] }: projeto que já existe (mesmo nome) só ganha os passos que faltam, sem mexer nos que já estão */
    function importarArquivo(f) {
      f.text().then(function (txt) {
        var dados;
        try { dados = JSON.parse(txt); } catch (e) { alert('Esse arquivo não é válido.'); return; }
        var lista = (dados && dados.projetos) || [];
        if (!lista.length) { alert('Não achei projetos nesse arquivo.'); return; }
        var ordemProj = projetos.reduce(function (m, p) { return Math.max(m, p.ordem || 0); }, 0);
        var passoAPasso = lista.reduce(function (cadeia, item) {
          return cadeia.then(function () {
            var nome = String(item.nome || '').trim(); if (!nome) return;
            var existente = projetos.filter(function (p) { return p.nome.toLowerCase() === nome.toLowerCase(); })[0];
            var pronto = existente ? Promise.resolve(existente.id) : C.from('projetos').insert({ nome: nome, ordem: ++ordemProj }).select('id').then(function (r) { if (r.error) throw r.error; return r.data[0].id; });
            return pronto.then(function (id) {
              var jaTem = passos.filter(function (x) { return x.projeto_id === id; });
              var ordem = jaTem.reduce(function (m, y) { return Math.max(m, y.ordem || 0); }, 0);
              var titulos = jaTem.map(function (x) { return x.titulo.toLowerCase(); });
              var novos = (item.passos || []).filter(function (x) { return x && String(x.titulo || '').trim() && titulos.indexOf(String(x.titulo).trim().toLowerCase()) < 0; }).map(function (x) {
                return { projeto_id: id, titulo: String(x.titulo).trim(), nota: x.nota ? String(x.nota).trim() : null, feito: !!x.feito, feito_em: x.feito ? new Date().toISOString() : null, ordem: ++ordem };
              });
              if (!novos.length) return;
              return C.from('projeto_passos').insert(novos).then(function (r) { if (r.error) throw r.error; });
            });
          });
        }, Promise.resolve());
        passoAPasso.then(function () { carregar(); }, function (e) { alert('Não foi possível importar: ' + P.traduzErro(e.message)); carregar(); });
      });
    }

    function telaConcluido(proj) {
      var voltar = function () { verConcluido = null; desenhar(); };
      app.appendChild(el('div', { class: 'portal-topo' }, [P.botaoVoltar(voltar)]));
      P.voltarNoFim(app, voltar);
      var conteudo = el('div', { class: 'portal-cartao' });
      app.appendChild(conteudo);
      mostrarProjeto(conteudo, proj, true);
      /* concluído por engano: desmarca o último passo feito e o projeto volta para as abas, em edição */
      var reabrir = el('button', { type: 'button', class: 'portal-btn', text: 'Reabrir este projeto' });
      reabrir.addEventListener('click', function () {
        var ultimo = passos.filter(function (x) { return x.projeto_id === proj.id; }).sort(function (a, b) { return String(b.feito_em || '') < String(a.feito_em || '') ? -1 : 1; })[0];
        if (!ultimo) return;
        reabrir.disabled = true;
        C.from('projeto_passos').update({ feito: false, feito_em: null }).eq('id', ultimo.id).then(function (r) {
          if (r.error) { reabrir.disabled = false; alert('Não foi possível reabrir.'); return; }
          aberto = proj.id; verConcluido = null; P.estado.gravar({ projeto: aberto }); carregar();
        });
      });
      conteudo.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:16px' }, [reabrir]));
    }

    function novoProjeto() {
      var nome = (prompt('Nome do projeto') || '').trim();
      if (!nome) return;
      var ordem = projetos.reduce(function (m, p) { return Math.max(m, p.ordem || 0); }, 0) + 1;
      C.from('projetos').insert({ nome: nome, ordem: ordem }).select('id').then(function (r) {
        if (r.error || !r.data || !r.data[0]) { alert('Não foi possível criar.'); return; }
        aberto = r.data[0].id; P.estado.gravar({ projeto: aberto }); carregar();
      });
    }

    function mostrarProjeto(conteudo, proj, leitura) {
      var meus = passos.filter(function (x) { return x.projeto_id === proj.id; });
      var pct = pctDe(meus), feitos = meus.filter(function (x) { return x.feito; }).length;
      var renomear = el('button', { type: 'button', class: 'proj-mini', text: 'Renomear', style: leitura ? 'display:none' : '' });
      renomear.addEventListener('click', function () {
        var n = (prompt('Nome do projeto', proj.nome) || '').trim();
        if (!n || n === proj.nome) return;
        C.from('projetos').update({ nome: n }).eq('id', proj.id).then(function (r) { if (r.error) alert('Não foi possível salvar.'); else carregar(); });
      });
      conteudo.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;gap:12px' }, [el('h2', { text: proj.nome, style: 'margin:0' }), renomear]));
      conteudo.appendChild(el('div', { class: 'proj-barra' }, [el('i', { style: 'width:' + pct + '%' })]));
      conteudo.appendChild(el('p', { class: 'portal-item-data', style: 'color:#16233F;font-size:15px', text: pct + '% concluído' + (meus.length ? ' · ' + feitos + ' de ' + meus.length + ' passos' : '') + (meus.length && feitos === meus.length ? ' · Projeto concluído' : '') }));
      /* prazo opcional: a segunda barra é o tempo que já passou, do dia em que o projeto foi criado até a data final; azul, ocre no meio e terracota no fim */
      if (proj.data_fim) {
        var fim = new Date(proj.data_fim + 'T23:59:59'), ini = new Date(proj.criado_em), agora = new Date();
        var fr = fim > ini ? Math.min(1, Math.max(0, (agora - ini) / (fim - ini))) : 1, pt = Math.floor(fr * 100);
        var dias = Math.ceil((fim - agora) / 86400000);
        conteudo.appendChild(el('div', { class: 'proj-barra', style: 'margin-top:14px' }, [el('i', { style: 'width:' + pt + '%;background:' + corDoTempo(fr) })]));
        conteudo.appendChild(el('p', { class: 'portal-item-data', style: 'color:#16233F;font-size:15px', text: pt + '% do tempo · ' + (dias > 1 ? 'faltam ' + dias + ' dias' : dias === 1 ? 'falta 1 dia' : dias === 0 ? 'o prazo termina hoje' : 'prazo encerrado') + ' (até ' + P.dataBR(proj.data_fim) + ')' }));
      }
      if (!leitura) {
        var dataFim = el('input', { type: 'date', id: 'projFim', style: 'width:auto' }); dataFim.value = proj.data_fim || '';
        dataFim.addEventListener('change', function () { C.from('projetos').update({ data_fim: dataFim.value || null }).eq('id', proj.id).then(function (r) { if (r.error) alert('Não foi possível salvar a data.'); else carregar(); }); });
        conteudo.appendChild(el('div', { style: 'display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap' }, [el('label', { for: 'projFim', text: 'Data final (opcional)', style: 'margin:0' }), dataFim]));
      }

      var lista = el('div', { style: 'margin-top:14px' });
      if (!meus.length) lista.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum passo ainda.' }));
      var areaForm = el('div', { class: 'barra-ocre' });
      function linhaDoPasso(x, grupo, i) {
        var cb = el('input', { type: 'checkbox', 'aria-label': 'Marcar como feito' });
        cb.checked = !!x.feito; cb.disabled = !!leitura;
        cb.addEventListener('change', function () {
          x.feito = cb.checked; desenhar();
          C.from('projeto_passos').update({ feito: x.feito, feito_em: x.feito ? new Date().toISOString() : null }).eq('id', x.id).then(function (r) { if (r.error) { alert('Não foi possível salvar.'); carregar(); } });
        });
        var textos = [el('span', { class: 'proj-titulo', text: x.titulo })];
        if (x.nota) textos.push(el('span', { class: 'portal-item-data', style: 'color:#16233F;opacity:.75', text: x.nota }));
        var acoes = el('div', { class: 'proj-acoes' });
        var sobe = el('button', { type: 'button', class: 'proj-mini', text: '↑', 'aria-label': 'Subir' }), desce = el('button', { type: 'button', class: 'proj-mini', text: '↓', 'aria-label': 'Descer' });
        sobe.disabled = i === 0; desce.disabled = i === grupo.length - 1;
        function trocar(com) {
          Promise.all([C.from('projeto_passos').update({ ordem: com.ordem }).eq('id', x.id), C.from('projeto_passos').update({ ordem: x.ordem }).eq('id', com.id)]).then(carregar);
        }
        sobe.addEventListener('click', function () { trocar(grupo[i - 1]); });
        desce.addEventListener('click', function () { trocar(grupo[i + 1]); });
        var editar = el('button', { type: 'button', class: 'proj-mini', text: 'Editar' });
        editar.addEventListener('click', function () { formPasso(x); });
        var apagar = P.botaoApagar('Apagar');
        apagar.addEventListener('click', function () {
          if (!confirm('Apagar o passo "' + x.titulo + '"?')) return;
          C.from('projeto_passos').delete().eq('id', x.id).then(function (d) { if (d.error) alert('Não foi possível apagar.'); else carregar(); });
        });
        [sobe, desce, editar, apagar].forEach(function (b) { acoes.appendChild(b); });
        if (!leitura) textos.push(acoes);
        return el('div', { class: 'proj-passo' + (x.feito ? ' feito' : '') }, [cb, el('div', { style: 'flex:1;min-width:0' }, textos)]);
      }
      /* o próximo passo no topo, os outros pendentes depois, e o que já foi feito embaixo */
      var pendentes = meus.filter(function (x) { return !x.feito; }), prontos = meus.filter(function (x) { return x.feito; });
      function grupoDe(titulo, itens, grande) {
        if (!itens.length) return;
        lista.appendChild(el('p', { class: 'proj-grupo', text: titulo }));
        var caixa = el('div', { style: 'border-top:1px solid #1F5FA3' + (grande ? ';border-top-width:3px' : '') });
        itens.forEach(function (x, k) { caixa.appendChild(linhaDoPasso(x, itens, k)); });
        lista.appendChild(caixa);
      }
      grupoDe('Próximo passo', pendentes.slice(0, 1), true);
      var depois = pendentes.slice(1);
      if (depois.length) {
        lista.appendChild(el('p', { class: 'proj-grupo', text: 'Depois' }));
        var cx = el('div', { style: 'border-top:1px solid #1F5FA3' });
        depois.forEach(function (x, k) { cx.appendChild(linhaDoPasso(x, pendentes, k + 1)); });
        lista.appendChild(cx);
      }
      grupoDe('Feitos', prontos, false);
      conteudo.appendChild(lista);

      function formPasso(item) {
        areaForm.textContent = '';
        var msg = el('p', { class: 'portal-msg' });
        var titulo = el('input', { type: 'text', id: 'pTitulo', required: '' });
        var nota = el('textarea', { id: 'pNota', rows: '2', placeholder: 'Anotação (opcional)' });
        if (item) { titulo.value = item.titulo; nota.value = item.nota || ''; }
        var salvar = el('button', { type: 'submit', class: 'portal-btn', text: item ? 'Salvar alterações' : 'Adicionar passo' });
        var cancelar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Cancelar' });
        cancelar.addEventListener('click', function () { areaForm.textContent = ''; });
        var form = el('form', { class: 'portal-cartao' }, [el('label', { for: 'pTitulo', text: 'Passo' }), titulo, nota, msg, el('div', { class: 'portal-acoes' }, [salvar, cancelar])]);
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var t = titulo.value.trim(); if (!t) { P.mensagem(msg, 'Escreva o passo.', 'erro'); return; }
          salvar.disabled = true;
          var campos = { titulo: t, nota: nota.value.trim() || null };
          var ordem = meus.reduce(function (m, y) { return Math.max(m, y.ordem || 0); }, 0) + 1;
          var pedido = item ? C.from('projeto_passos').update(campos).eq('id', item.id) : C.from('projeto_passos').insert(Object.assign({ projeto_id: proj.id, ordem: ordem }, campos));
          pedido.then(function (r) { if (r.error) { salvar.disabled = false; P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); } else carregar(); });
        });
        areaForm.appendChild(form);
        titulo.focus();
      }
      var add = el('button', { type: 'button', class: 'portal-btn', text: 'Adicionar passo' });
      add.addEventListener('click', function () { if (!areaForm.firstChild) formPasso(null); });
      if (!leitura) { conteudo.appendChild(el('div', { class: 'portal-acoes', style: 'margin-top:16px' }, [add])); conteudo.appendChild(areaForm); }
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
</html>
