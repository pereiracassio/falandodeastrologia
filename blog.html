<div class="pagina pagina-servico"><div class="folha-pagina">
  <div class="blog">
    <h1>Blog</h1>
    <div id="lista"><p class="blog-vazio">Carregando...</p></div>
  </div>
</div></div>
  <script src="blog.js?v=2"></script>
  <script>
  (function () {
    var B = window.blog, el = B.el, lista = document.getElementById('lista');
    B.buscar('publicado=eq.true&select=slug,titulo,resumo,corpo,imagem_url,publicado_em&order=publicado_em.desc').then(function (posts) {
      lista.textContent = '';
      if (!posts.length) { lista.appendChild(el('p', { class: 'blog-vazio', text: 'Em breve, os primeiros textos.' })); return; }
      posts.forEach(function (p) {
        var filhos = [];
        if (p.imagem_url) filhos.push(el('img', { src: p.imagem_url, alt: '', loading: 'lazy' }));
        if (p.publicado_em) filhos.push(el('p', { class: 'blog-data', text: B.dataExtenso(p.publicado_em) }));
        filhos.push(el('h2', { text: p.titulo }));
        filhos.push(el('p', { text: B.resumoDe(p) }));
        lista.appendChild(el('a', { class: 'blog-item', href: B.enderecoDe(p.slug) }, filhos));
      });
    }).catch(function () {
      lista.textContent = '';
      lista.appendChild(el('p', { class: 'blog-vazio', text: 'Não consegui carregar os textos agora. Tente de novo em instantes.' }));
    });
  })();
  </script>
  <script src="menu.js?v=18" defer></script>
</body>
