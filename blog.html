  <script src="blog.js?v=4"></script>
  <script>
  (function () {
    var B = window.blog, el = B.el, lista = document.getElementById('lista');
    B.buscar('publicado=eq.true&select=slug,titulo,resumo,corpo,imagem_url,publicado_em,assunto&order=publicado_em.desc').then(function (posts) {
      lista.textContent = '';
      if (!posts.length) { lista.appendChild(el('p', { class: 'blog-vazio', text: 'Em breve, os primeiros textos.' })); return; }
      /* os assuntos primeiro (cada um abre a lista das suas postagens); depois as postagens que não têm assunto */
      var assuntos = {}, ordem = [], soltas = [];
      posts.forEach(function (p) {
        var nome = String(p.assunto || '').trim(), chave = B.slugDe(nome);
        if (!chave) { soltas.push(p); return; }
        if (!assuntos[chave]) { assuntos[chave] = { nome: nome, qtd: 0, imagem: null }; ordem.push(chave); }
        assuntos[chave].qtd++;
        if (!assuntos[chave].imagem && p.imagem_url) assuntos[chave].imagem = p.imagem_url;
      });
      ordem.sort().forEach(function (chave) {
        var a = assuntos[chave], filhos = [];
        if (a.imagem) filhos.push(el('img', { src: a.imagem, alt: '', loading: 'lazy' }));
        filhos.push(el('h2', { text: a.nome }));
        filhos.push(el('p', { text: a.qtd === 1 ? '1 texto' : a.qtd + ' textos' }));
        lista.appendChild(el('a', { class: 'blog-card papiro-moldura', href: 'assunto/' + chave + '.html' }, filhos));
      });
      soltas.forEach(function (p) {
        var filhos = [];
        if (p.imagem_url) filhos.push(el('img', { src: p.imagem_url, alt: '', loading: 'lazy' }));
        if (p.publicado_em) filhos.push(el('p', { class: 'blog-data', text: B.dataExtenso(p.publicado_em) }));
        filhos.push(el('h2', { text: p.titulo }));
        filhos.push(el('p', { text: B.resumoDe(p) }));
        lista.appendChild(el('a', { class: 'blog-card papiro-moldura', href: B.enderecoDe(p.slug) }, filhos));
      });
    }).catch(function () {
      lista.textContent = '';
      lista.appendChild(el('p', { class: 'blog-vazio', text: 'Não consegui carregar os textos agora. Tente de novo em instantes.' }));
    });
  })();
  </script>
