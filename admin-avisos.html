<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">

  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Avisos</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="hora-planetaria.js"></script>
  <script src="portal.js?v=116"></script>
  <script src="menu.js?v=42" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function voltar() { if (history.length > 1) history.back(); else location.href = 'admin-agenda.html'; }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(P.navAdmin('avisos', user.email, sair));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        tela(user);
      });
    }
    /* os 50 avisos mais novos; o não lido fica em terracota e negrito; tocar marca como lido e abre o lugar do aviso */
    function tela(user) {
      limpar();
      app.appendChild(P.navAdmin('avisos', '', sair));
      app.appendChild(P.botaoVoltar(voltar));
      var cartao = el('div', { class: 'portal-cartao' });
      app.appendChild(cartao);
      /* aniversariantes de hoje: ficam fixos no topo, antes de qualquer outro aviso */
      var fixos = el('div', {});
      cartao.appendChild(fixos);
      P.aniversariosHoje().then(function (lista) {
        P.marcarAnivVisto();
        lista.forEach(function (p) {
          var dig = String(p.whatsapp || '').replace(/\D/g, ''), primeiro = p.nome.split(/\s+/)[0];
          var texto = 'Oi, ' + primeiro + '! Feliz aniversário! Que o seu novo ciclo seja leve e cheio de coisas boas! 🎈🎂\nDe presente, você tem 10% de desconto em qualquer um dos meus serviços disponíveis no site (https://falandodeastrologia.com.br), por 30 dias. É só usar o cupom aniversário no carrinho. Aproveite para fazer a sua Revolução Solar. Um abraço 🫂';
          var linha = el('a', { href: '#', class: 'portal-item-titulo', style: 'display:block;text-decoration:none;color:#A03E25;margin:0 0 14px', text: 'Aniversário de ' + p.nome });
          var detalhe = el('div', { style: 'display:none;margin:-6px 0 14px' });
          if (dig) detalhe.appendChild(el('a', { class: 'icone-whats', href: 'https://wa.me/' + (dig.length <= 11 ? '55' + dig : dig) + '?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener', title: 'Mandar parabéns', 'aria-label': 'Mandar parabéns no WhatsApp' }, [el('img', { src: 'img/rede-whatsapp.svg', alt: '', width: '44', height: '44' })]));
          else detalhe.appendChild(el('p', { text: 'Sem WhatsApp cadastrado.' }));
          linha.addEventListener('click', function (ev) { ev.preventDefault(); detalhe.style.display = detalhe.style.display === 'none' ? '' : 'none'; });
          fixos.appendChild(linha);
          fixos.appendChild(detalhe);
        });
        if (lista.length) fixos.appendChild(el('hr', { style: 'border:0;border-top:2px solid #1F5FA3;margin:16px 0 14px' }));
      });
      /* Produção: o que está chegando e ainda não foi concluído (cortes mostram a hora de Júpiter do dia) */
      var producao = el('div', {});
      cartao.appendChild(producao);
      C.from('site_config').select('valor').eq('chave', 'prod_local_horas').maybeSingle().then(function (r) { try { return JSON.parse(r.data.valor); } catch (e) { return null; } }, function () { return null; }).then(function (lugar) {
        var LAT = lugar && typeof lugar.lat === 'number' ? lugar.lat : -23.3053, LON = lugar && typeof lugar.lon === 'number' ? lugar.lon : -45.9658;
        var hh = function (ms) { var d = new Date(ms + window.horaPlanetaria.FUSO); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
        var jupiterDe = function (iso) {
          var p = iso.split('-').map(Number), ini = window.horaPlanetaria.meiaNoite(p[0], p[1], p[2]);
          return window.horaPlanetaria.horasEntre(ini, ini + 86400000, LAT, LON).filter(function (h) { return h.planeta === 'Júpiter'; }).map(function (h) { return hh(Math.max(h.ini, ini)) + ' a ' + hh(Math.min(h.fim, ini + 86400000)); });
        };
        var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
        P.lembretesProducao().then(function (lista) {
          lista.forEach(function (x) {
            var p = x.data.split('-'), dia = DIAS[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()] + ' ' + p[2] + '/' + p[1];
            var jup = x.tipo === 'corte' ? jupiterDe(x.data) : [];
            var linha = el('a', { href: x.url || 'admin-producao.html', style: 'display:block;text-decoration:none;color:inherit;margin:0 0 14px' }, [
              el('span', { class: 'portal-item-titulo', style: 'color:#A03E25', text: x.nome }),
              el('p', { style: 'margin:4px 0 0', text: 'Postar ' + dia + (jup.length ? ' · Júpiter ' + jup.join(' · ') : '') + (x.falta ? ' · falta: ' + x.falta.toLowerCase() : '') })
            ]);
            producao.appendChild(linha);
          });
          if (lista.length) producao.appendChild(el('hr', { style: 'border:0;border-top:2px solid #1F5FA3;margin:16px 0 14px' }));
        });
      });
      app.appendChild(P.botaoVoltar(voltar));
      C.from('avisos_recebidos').select('id,titulo,corpo,url,lido,criado_em').order('criado_em', { ascending: false }).limit(50).then(function (r) {
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os avisos agora.' })); return; }
        if (!r.data.length) { cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum aviso por enquanto.' })); P.sinoAdmin(0); return; }
        var naoLidos = r.data.filter(function (a) { return !a.lido; }).length;
        P.sinoAdmin(naoLidos);
        r.data.forEach(function (a) {
          var linha = el('a', { href: '#', style: 'display:block;text-decoration:none;color:inherit;margin:0 0 14px' }, [
            el('span', { class: 'portal-item-titulo', style: a.lido ? '' : 'color:#A03E25', text: a.titulo }),
            el('span', { class: 'portal-item-data', text: P.dataBR(String(a.criado_em).slice(0, 10)) }),
            el('p', { style: 'margin:4px 0 0' + (a.lido ? '' : ';font-weight:700'), text: a.corpo })
          ]);
          linha.addEventListener('click', function (ev) {
            ev.preventDefault();
            var ir = function () { location.href = /^\/admin-[a-z]+\.html/.test(a.url || '') ? a.url : 'admin-alunos.html'; };
            if (a.lido) { ir(); return; }
            C.from('avisos_recebidos').update({ lido: true }).eq('id', a.id).then(ir, ir);
          });
          cartao.appendChild(linha);
        });
      });
    }
    C.auth.getSession().then(function (r) {
      if (r.data && r.data.session) iniciar(r.data.session.user); else mostrarLogin();
    });
  })();
  </script>
</body>
