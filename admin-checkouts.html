  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=96"></script>
  <script src="menu.js?v=39" defer></script>
  <script src="carrinho.js?v=6"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var SITE = 'https://falandodeastrologia.com.br';

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('checkouts', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          tela();
        });
      });
    }

    /* copia o texto; se o aparelho não deixar, abre uma caixa pra copiar à mão */
    function copiar(texto, msg) {
      var ok = function () { P.mensagem(msg, 'Link copiado! É só colar no WhatsApp.', 'ok'); };
      var plano = function () { window.prompt('Copie o link:', texto); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, plano); else plano();
    }

    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Links de pagamento' }),
        el('p', { text: 'Copie o link do serviço e mande pro cliente no WhatsApp. Ele cai no carrinho do site, com o serviço já escolhido, e segue pro pagamento.' })]);
      var msg = el('p', { class: 'portal-msg' });
      var servicos = window.Carrinho.servicos;
      Object.keys(servicos).filter(function (k) { return !/^teste/.test(k); }).forEach(function (k) {
        var s = servicos[k], link = SITE + '/carrinho.html?add=' + k;
        var copia = el('button', { type: 'button', class: 'portal-btn', text: 'Copiar link' });
        copia.addEventListener('click', function () { copiar(link, msg); });
        var abre = el('a', { class: 'portal-btn portal-btn-sec', href: link, target: '_blank', rel: 'noopener', text: 'Abrir' });
        cartao.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
          el('div', {}, [el('span', { class: 'portal-item-titulo', text: s.titulo }),
            el('span', { class: 'portal-item-data', text: window.Carrinho.reais(s.centavos) + (s.restrito ? ' · só por este link (não aparece no site)' : '') })]),
          el('div', { class: 'portal-acoes' }, [copia, abre])
        ])]));
      });
      cartao.appendChild(msg);
      app.appendChild(cartao);

      /* links que não são do carrinho do site: ficam guardados no Supabase (site_config) e você troca quando precisar */
      var meus = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Outros links' }),
        el('p', { text: 'Links que você mesmo cria (InfinitePay, formulário do Astro Hellenic...). Cole o link uma vez e ele fica guardado aqui.' })]);
      var msg2 = el('p', { class: 'portal-msg' });
      var LINKS = [
        { chave: 'link_acompanhamento', nome: 'Acompanhamento Prático de Astrologia (cartão recorrente)', padrao: 'https://invoice.infinitepay.io/plans/cassiopereira_/TnbWjchMtJ', dica: 'Plano de assinatura criado no InfinitePay.' },
        { chave: 'link_formulario_mapa', nome: 'Dados do mapa + agendamento do Acompanhamento (Astro Hellenic)', padrao: 'https://astrohellenic.github.io/formulario.html?u=87101e7e-657c-4ca6-ab73-495e00af149f&servico=Acompanhamento%20Pr%C3%A1tico%20de%20Astrologia', dica: 'No Astro Hellenic: Configurações → Captação → link do formulário.' }
      ];
      C.from('site_config').select('chave,valor').in('chave', LINKS.map(function (l) { return l.chave; })).then(function (r) {
        var guardados = {};
        ((r && r.data) || []).forEach(function (x) { guardados[x.chave] = x.valor; });
        LINKS.forEach(function (l) {
          var caixa = el('div', { class: 'portal-item' });
          function desenhar() {
            caixa.textContent = '';
            var url = guardados[l.chave] != null ? guardados[l.chave] : l.padrao;
            var acoes = el('div', { class: 'portal-acoes' });
            if (url) {
              var copia = el('button', { type: 'button', class: 'portal-btn', text: 'Copiar link' });
              copia.addEventListener('click', function () { copiar(url, msg2); });
              acoes.appendChild(copia);
              acoes.appendChild(el('a', { class: 'portal-btn portal-btn-sec', href: url, target: '_blank', rel: 'noopener', text: 'Abrir' }));
            }
            var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: url ? 'Trocar o link' : 'Colar o link' });
            trocar.addEventListener('click', function () {
              var novo = window.prompt('Cole o link (https://...):', url || '');
              if (novo == null) return;
              novo = novo.trim();
              if (novo && !P.linkSeguro(novo)) { P.mensagem(msg2, 'O link precisa começar com https://', 'erro'); return; }
              C.from('site_config').upsert({ chave: l.chave, valor: novo, atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (rs) {
                if (rs.error) { P.mensagem(msg2, P.traduzErro(rs.error.message), 'erro'); return; }
                guardados[l.chave] = novo; desenhar(); P.mensagem(msg2, 'Link guardado.', 'ok');
              });
            });
            acoes.appendChild(trocar);
            caixa.appendChild(el('div', { class: 'portal-item-linha' }, [el('div', {}, [el('span', { class: 'portal-item-titulo', text: l.nome }),
              el('span', { class: 'portal-item-data', text: url ? url : 'Ainda sem link. ' + l.dica })]), acoes]));
          }
          desenhar(); meus.appendChild(caixa);
        });
        meus.appendChild(msg2);
        app.appendChild(meus);
      });
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
