  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');

    /* fora (login, sem ficha): "Alunos"; dentro da página do aluno: o nome do produto que ele tem */
    function titulos(dentro) {
      document.getElementById('portalTitulo').textContent = dentro ? 'Acompanhamento Prático de Astrologia' : 'Alunos';
      document.getElementById('portalSub').textContent = dentro ? 'Mentoria em Astrologia Clássica' : '';
      document.querySelector('.portal-caixa').classList.toggle('aluno-dentro', !!dentro);
      ajustarTitulos();
    }

    /* título e subtítulo numa linha só: a letra diminui até caber na largura (a fonte à mão chega depois, então refaz) */
    function ajustarTitulos() {
      ['portalTitulo', 'portalSub'].forEach(function (id) {
        var e = document.getElementById(id);
        e.style.fontSize = '';
        if (!e.parentNode.classList.contains('aluno-dentro')) return;
        var f = parseFloat(getComputedStyle(e).fontSize);
        while (e.scrollWidth > e.clientWidth + 1 && f > 9) { f -= .5; e.style.fontSize = f + 'px'; }
      });
    }

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ajustarTitulos(); });
    window.addEventListener('resize', ajustarTitulos);

    function limpar() { app.textContent = ''; titulos(false); }

    function sair() { P.client.auth.signOut().then(mostrarLogin); }

    var avisoSenha = false;

    /* topo: saudação + botões (Trocar senha, Sair e, se houver, extras como o Painel) */
    function topo(user, texto, extra, semTrocar) {
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () { trocarSenha(user); });
      var sairBtn = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' });
      sairBtn.addEventListener('click', sair);
      /* o administrador (com o botão Painel) troca a senha e sai pelo ⚙; aqui fica só o Painel */
      var botoes = extra ? [extra] : [semTrocar ? null : trocar, sairBtn].filter(Boolean);
      return el('div', { class: 'portal-topo' }, [el('span', { text: texto }), el('div', { class: 'portal-grupo' }, botoes)]);
    }

    function trocarSenha(user) {
      limpar();
      app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(function () { mostrarPortal(user); })]));
      P.montarNovaSenha(app, function () { avisoSenha = true; mostrarPortal(user); }, 'Trocar senha');
      P.voltarNoFim(app, function () { mostrarPortal(user); });
    }

    function avisoDeSenha() {
      if (!avisoSenha) return;
      avisoSenha = false;
      app.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha alterada.' }));
    }

    /* quem ainda não é aluno vê as três abas vazias e o caminho para se tornar aluno */
    function abasVazias() {
      var barraVazia = el('div', { class: 'portal-abas', role: 'tablist' }), msgVazia = el('div', { class: 'portal-cartao' }, [
        el('p', { class: 'portal-vazio', text: 'Você ainda não é aluno.' }),
        el('p', {}, [el('span', { text: 'Você pode se tornar aluno pela aplicação na página da ' }), el('a', { href: 'mentoria.html', text: 'Mentoria em Astrologia Clássica' }), el('span', { text: '.' })])
      ]);
      ABAS.filter(function (ab) { return ab.chave !== 'curso'; }).forEach(function (ab, i) {
        var b = el('button', { type: 'button', role: 'tab', class: 'portal-aba' + (i === 0 ? ' ativa' : ''), text: ab.nome });
        b.addEventListener('click', function () {
          [].forEach.call(barraVazia.children, function (x) { x.className = 'portal-aba' + (x === b ? ' ativa' : ''); });
        });
        barraVazia.appendChild(b);
      });
      app.appendChild(barraVazia); app.appendChild(msgVazia);
    }

    /* volta do login com o Google recusado: o endereço traz error / error_code (na pergunta ou depois do #) */
    function googleBarrou() {
      var txt = location.search + '&' + location.hash.replace(/^#/, '');
      var barrou = /error_code=signup_disabled|signups?(\+|%20|_|\s)not(\+|%20|_|\s)allowed|(^|&)error=(access_denied|server_error)/i.test(txt);
      if (barrou && window.history && history.replaceState) history.replaceState(null, '', location.pathname);
      return barrou;
    }

    function mostrarLogin() {
      limpar();
      var google = el('button', { type: 'button', class: 'portal-btn', text: 'Entrar com o Google' });
      google.addEventListener('click', function () { P.entrarComGoogle('/aluno.html'); });
      abasVazias();
      /* o Google barrou a pessoa (o cadastro aberto está desligado: só entra quem tem acesso criado) */
      if (googleBarrou()) {
        app.appendChild(el('div', { class: 'portal-cartao' }, [
          el('p', { style: 'font-weight:700', text: 'Esse e-mail ainda não é de aluno.' }),
          el('p', {}, [el('span', { text: 'Para se tornar aluno, faça a aplicação na página da ' }), el('a', { href: 'mentoria.html', text: 'Mentoria em Astrologia Clássica' }), el('span', { text: '.' })])
        ]));
      }
      app.appendChild(el('h2', { class: 'portal-subtitulo', text: 'Acesso dos alunos' }));
      app.appendChild(el('div', { class: 'portal-cartao' }, [
        el('p', { text: 'Entre com a conta Google (Gmail) que você informou na matrícula.' }),
        google,
        el('p', { class: 'portal-vazio', text: 'Ou, se você já tem senha, entre com e-mail e senha:' })
      ]));
      P.montarLogin(app, mostrarPortal);
    }

    function mostrarNovaSenha() {
      limpar();
      P.montarNovaSenha(app, mostrarPortal);
    }

    /* um item da lista: gravações têm player embutido do Drive (com botão de abrir no Drive de reserva); o resto abre no Drive. (Antes era sempre em outra aba: o player embutido do Drive não
       funcionava em arquivo restrito no Safari, que bloqueia o login do Google dentro da página — se isso voltar a acontecer, é por isso.) */
    var pdfsDoAluno = {}, aoSerPdf = {};   /* id do arquivo do Drive -> true, quando o servidor confirmou que é PDF dele */
    function descobrirPdfs(lista) {
      var ids = [];
      lista.forEach(function (it) { var id = it.bloco === 'gravacoes' ? null : P.idArquivoDrive(P.linkSeguro(it.link)); if (id && ids.indexOf(id) < 0) ids.push(id); });
      if (!ids.length) return;
      P.client.auth.getSession().then(function (r) {
        var sessao = r.data && r.data.session; if (!sessao) return;
        return fetch('https://falandodeastrologia.vercel.app/api/pdf?acao=tipos&ids=' + encodeURIComponent(ids.join(',')), { headers: { Authorization: 'Bearer ' + sessao.access_token } })
          .then(function (x) { return x.ok ? x.json() : null; })
          .then(function (d) { ((d && d.pdfs) || []).forEach(function (id) { pdfsDoAluno[id] = true; (aoSerPdf[id] || []).forEach(function (f) { f(); }); }); });
      }).catch(function () { /* sem a resposta, os links abrem no Drive como sempre */ });
    }
    function itemDaLista(item, bloco) {
      var seguro = P.linkSeguro(item.link);
      /* anota que o aluno abriu (só o administrador vê); se falhar, o link abre do mesmo jeito */
      function anotarAbertura() {
        try { P.client.from('item_aberturas').insert({ item_id: item.id, aluno_id: item.aluno_id }).then(function () {}, function () {}); } catch (e) { /* segue */ }
      }
      var titulo = el('div', {}, [el('span', { class: 'portal-item-titulo', text: item.titulo })]);
      if (item.data) titulo.appendChild(el('span', { class: 'portal-item-data', text: P.dataBR(item.data) }));
      var linha = el('div', { class: 'portal-item-linha' }, [titulo]);
      var player = bloco === 'gravacoes' && seguro ? P.playerGravacao(seguro, anotarAbertura) : null;
      /* material que mora em outro site (livro de acesso livre, por exemplo): não é arquivo do Drive, então o aluno vê onde ele está e vai até lá */
      var siteFora = '';
      if (bloco === 'materiais' && seguro) {
        try { var h = new URL(seguro).hostname.replace(/^www\./, ''); if (!/(^|\.)google\.com$/.test(h)) siteFora = h; } catch (e) { /* link inválido: abre normal */ }
      }
      /* arquivo do Drive que o servidor confirmou ser PDF (pdfsDoAluno): a linha inteira abre no leitor do site e um "Baixar" discreto, ao lado, leva ao Drive */
      var idDrive = bloco === 'gravacoes' ? null : P.idArquivoDrive(seguro);
      var abrir = null, baixar = null;
      function abrirPdfNoLeitor(ev) {
        if (!idDrive || !pdfsDoAluno[idDrive] || !window.Leitor || !window.pdfjsLib) return false;
        if (ev) ev.preventDefault();
        anotarAbertura();
        Leitor.abrirDoServidor({ nome: item.titulo, id: idDrive, baixar: seguro, voltar: function () {} });
        return true;
      }
      function virarPdf() {
        if (!abrir || baixar) return;
        abrir.style.display = 'none';
        baixar = el('a', { class: 'portal-baixar', href: seguro, target: '_blank', rel: 'noopener', text: 'Baixar' });
        baixar.addEventListener('click', anotarAbertura);
        linha.appendChild(baixar);
      }
      if (seguro && !player) {
        var texto = bloco === 'caderno' ? 'Abrir caderno' : bloco === 'gravacoes' ? 'Assistir' : siteFora ? 'Ir para a página' : 'Abrir';
        abrir = el('a', { class: 'portal-btn', href: seguro, target: '_blank', rel: 'noopener', text: texto });
        abrir.addEventListener('click', function (ev) { if (!abrirPdfNoLeitor(ev)) anotarAbertura(); });
        linha.appendChild(abrir);
        if (idDrive) { if (pdfsDoAluno[idDrive]) virarPdf(); else (aoSerPdf[idDrive] = aoSerPdf[idDrive] || []).push(virarPdf); }
      }
      var caixa = el('div', { class: 'portal-item' }, [linha]);
      /* a linha inteira abre o link (como o botão): só quando é "abrir" um link; gravação com player e botões de baixar seguem como estavam */
      if (seguro && !player) {
        caixa.className += ' portal-item-clicavel';
        caixa.setAttribute('role', 'link'); caixa.setAttribute('tabindex', '0');
        var abrirLinha = function () { if (abrirPdfNoLeitor()) return; anotarAbertura(); window.open(seguro, '_blank', 'noopener'); };
        caixa.addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('a')) return; abrirLinha(); });
        caixa.addEventListener('keydown', function (ev) { if (ev.target === caixa && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); abrirLinha(); } });
      }
      if (siteFora) caixa.appendChild(el('p', { class: 'portal-descricao', text: 'Material disponível em ' + siteFora + '.' }));
      if (player) caixa.appendChild(player);
      if (item.descricao) caixa.appendChild(el('p', { class: 'portal-descricao', text: item.descricao }));
      return caixa;
    }

    /* três abas na mesma página (Atividades, Gravações, Materiais); abre em Atividades, que é o que o aluno precisa fazer; as gravações são para rever quando tiver dúvida.
       A chave interna 'caderno' continua a mesma (é o que está salvo no banco); só o nome na tela mudou. */
    var ABAS = [
      { chave: 'trilha', nome: 'Trilha' },   /* por enquanto só aparece na prévia do administrador ("Ver como aluno"); liberar para os alunos quando ele mandar */
      { chave: 'caderno', nome: 'Atividades', vazio: 'Nenhuma atividade ainda.' },
      { chave: 'gravacoes', nome: 'Gravações', vazio: 'Nenhuma gravação ainda.' },
      { chave: 'materiais', nome: 'Materiais', vazio: 'Nenhum material ainda.' },
      { chave: 'mensalidade', nome: 'Mensalidade' },   /* datas, histórico e formas de pagamento (não vem da lista de itens) */
      { chave: 'curso', nome: 'Curso' }   /* só aparece para quem está matriculado no curso */
    ];
    var temCurso = null, abaAoVoltar = null;

    var CHAVE_PIX = '11970404508';
    var LINK_RECORRENTE_NOVO = 'https://invoice.infinitepay.io/plans/cassiopereira_/TnbWjchMtJ'; /* valor atual, para quem entra agora; quem já tinha o link antigo leva o seu na ficha (painel) */

    function dinheiro(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function rotuloMensalidade(texto) { return el('p', { class: 'impresso', style: 'margin:0 0 4px;font-weight:700;color:#A03E25;font-size:14px', text: texto }); }

    function copiarChavePix(botao) {
      var ok = function () { botao.textContent = 'Chave copiada'; setTimeout(function () { botao.textContent = 'Copiar chave'; }, 2500); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(CHAVE_PIX).then(ok, function () {}); return; }
      var t = document.createElement('textarea'); t.value = CHAVE_PIX; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) { /* sem cópia */ } document.body.removeChild(t);
    }

    /* aba Mensalidade: o aluno vê só os dados dele (a função minha_mensalidade devolve só os dele; o administrador pode pedir os de um aluno) */
    function telaMensalidade(aluno, previa) {
      var caixa = el('div', {}, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]);
      P.client.rpc('minha_mensalidade', { p_aluno: previa ? aluno.id : null }).then(function (r) {
        caixa.textContent = '';
        if (r.error || !r.data) { caixa.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar a mensalidade agora.' })); return; }
        var d = r.data;
        caixa.appendChild(rotuloMensalidade('Último pagamento'));
        caixa.appendChild(el('p', { style: 'margin:0 0 12px', text: d.ultimo ? P.dataBR(String(d.ultimo).slice(0, 10)) : 'Ainda não registrado.' }));
        caixa.appendChild(rotuloMensalidade('Próximo pagamento'));
        caixa.appendChild(el('p', { style: 'margin:0 0 12px', text: d.proximo ? P.dataBR(String(d.proximo).slice(0, 10)) : 'Ainda não definido.' }));
        caixa.appendChild(rotuloMensalidade('Histórico de pagamentos'));
        var hist = d.historico || [];
        if (!hist.length) caixa.appendChild(el('p', { style: 'margin:0 0 12px', text: 'Nenhum pagamento registrado ainda.' }));
        hist.forEach(function (h) {
          caixa.appendChild(el('p', { class: 'portal-item-data', style: 'margin:0 0 4px', text: P.dataBR(String(h.data).slice(0, 10)) + ' · ' + dinheiro(h.valor) + (h.forma ? ' · ' + h.forma : '') }));
        });
        caixa.appendChild(el('hr', { style: 'border:0;border-top:2px solid #1F5FA3;margin:16px 0 14px' }));
        caixa.appendChild(rotuloMensalidade('Formas de pagamento'));
        caixa.appendChild(el('p', { class: 'impresso', style: 'margin:8px 0 2px;font-weight:700;font-size:13px', text: 'Pix' }));
        caixa.appendChild(el('p', { style: 'margin:0 0 6px', text: 'Chave: ' + CHAVE_PIX + ' (celular)' }));
        var copiar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Copiar chave' });
        copiar.addEventListener('click', function () { copiarChavePix(copiar); });
        caixa.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 14px' }, [copiar]));
        caixa.appendChild(el('p', { class: 'impresso', style: 'margin:8px 0 2px;font-weight:700;font-size:13px', text: 'Cartão, pagamento recorrente' }));
        if (d.recorrente) {
          caixa.appendChild(el('p', { style: 'margin:0 0 8px', text: 'Seu pagamento recorrente por cartão está ativo. Para cancelar, é só me avisar.' }));
          caixa.appendChild(el('div', { class: 'portal-whats' }, [el('a', { href: 'https://wa.me/5511970404508?text=' + encodeURIComponent('Oi, Cássio! Quero cancelar o pagamento recorrente da mensalidade.'), target: '_blank', rel: 'noopener', title: 'WhatsApp', 'aria-label': 'Falar pelo WhatsApp' }, [el('img', { src: 'img/rede-whatsapp.svg', alt: 'WhatsApp', width: '44', height: '44' })])]));
        } else {
          caixa.appendChild(el('p', { style: 'margin:0 0 8px', text: 'A mensalidade é cobrada todo mês no seu cartão, sem você precisar lembrar.' }));
          var link = P.linkSeguro(d.link) || LINK_RECORRENTE_NOVO;
          caixa.appendChild(el('div', { class: 'portal-acoes' }, [el('a', { class: 'portal-btn', href: link, target: '_blank', rel: 'noopener', text: 'Ativar pagamento recorrente' })]));
        }
      });
      return caixa;
    }

    /* aviso fixo no topo, só no navegador: como instalar o app e ativar os avisos (dentro do app não aparece; os avisos ficam na aba Avisos) */
    function avisoDoApp() {
      var dentro = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (dentro) return document.createDocumentFragment();
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(navigator.userAgent);
      var instalar = ios ? 'No Safari, toque no botão Compartilhar (o quadradinho com a setinha para cima) e depois em Adicionar à Tela de Início.'
        : android ? 'No Chrome, toque nos três pontinhos do canto e depois em Instalar app (ou Adicionar à tela inicial).'
        : 'No celular ou no iPad, abra esta página pelo navegador, toque em Compartilhar ou no menu e escolha Adicionar à Tela de Início (ou Instalar app).';
      return el('div', { class: 'portal-cartao' }, [
        el('h2', { text: 'Instale o app' }),
        el('p', { text: 'Para entrar mais rápido e receber os avisos das atividades, instale o app da área do aluno no seu aparelho:' }),
        el('ol', { style: 'text-align:left;margin:8px 0 0;padding-left:22px' }, [
          el('li', { text: instalar }),
          el('li', { text: 'Abra o app pela tela inicial e entre com o seu acesso.' }),
          el('li', { text: 'Na aba Avisos, toque em Ativar avisos neste aparelho e escolha Permitir.' })
        ])
      ]);
    }
    /* lista dos avisos recebidos (os 10 mais novos); o não lido fica em destaque; tocar marca como lido e leva às atividades */
    var naoLidos = 0, irParaAvisos = function () {}, abrirAvisosNaEntrada = /[?&]aviso=1/.test(location.search);
    /* lembrete da mensalidade (vai vencer / venceu): fica FIXO no topo da aba Avisos, antes de qualquer outro, e conta no sino; some quando você marca "Pagou" */
    var fixoMensalidade = null, atualizarAvisos = function () {};
    var totalAvisos = function () { return naoLidos + (fixoMensalidade ? 1 : 0); };
    /* o carrinho do canto vira o sino dos avisos enquanto o aluno está logado (menu.js: fdaSinoAvisos) */
    function pintarSino() {
      var cfg = { n: totalAvisos(), aoTocar: function () { irParaAvisos(); } };
      P.numeroNoIcone(totalAvisos());
      if (window.fdaSinoAvisos) window.fdaSinoAvisos(cfg);
      else document.addEventListener('DOMContentLoaded', function () { if (window.fdaSinoAvisos) window.fdaSinoAvisos(cfg); });
    }
    /* tela própria dos avisos (aberta pelo sino): lembrete da mensalidade, avisos recebidos e o botão de ativar no celular */
    function telaDeAvisos(user, aluno, previa) {
      limpar();
      var voltar = function () { desenharPaginaDoAluno(user, aluno, previa); };
      app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(voltar)]));
      var lista = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Avisos' }),

            var atividadesEl = window.atividades.cartaoDoAluno(aluno, function (a) {
              a.alunoNome = aluno.nome;
              window.atividades.telaDaAtividadeAluno(app, a, function () { desenharPaginaDoAluno(user, aluno, previa); }, previa);
            }, { semMoldura: true, aoCarregar: function (qtd, paraResponder) {
              avisar(qtd); caixaCaderno.style.display = qtd ? '' : 'none';
              avisoResponder.textContent = paraResponder === 1 ? 'Você tem 1 atividade para responder.' : 'Você tem ' + paraResponder + ' atividades para responder.';
              avisoResponder.style.display = paraResponder ? '' : 'none';
            } });
            var avisoResponder = el('p', { class: 'impresso', style: 'display:none;margin:0 0 14px;color:#A03E25;font-weight:700;font-size:16px' });
            app.appendChild(avisoResponder);
            // "Baixar meu caderno": o PDF com a capa e tudo que o aluno já fez; só aparece quando há atividades, no topo da aba Materiais
            var caixaCaderno = window.caderno.botao(aluno);
            caixaCaderno.style.display = 'none';
            app.appendChild(avisoDoApp());
            window.curso.buscar(aluno.email).then(function (mat) {
              temCurso = mat;
              abasDaTela(lista, atividadesEl, function (fn) { avisar = fn; }, aluno, previa, caixaCaderno).forEach(function (e) { app.appendChild(e); });
              /* veio do aviso no celular sem uma atividade específica: abre a tela de Avisos */
              if (abrirAvisosNaEntrada) { abrirAvisosNaEntrada = false; irParaAvisos(); }
              // só o ícone do WhatsApp (o mesmo da home), no fim da página, em qualquer aba
              var whats = el('a', { href: 'https://wa.me/5511970404508?text=Oi%20C%C3%A1ssio!%20Estou%20na%20%C3%A1rea%20do%20aluno%20e%20queria%20tirar%20uma%20d%C3%BAvida.', target: '_blank', rel: 'noopener', title: 'WhatsApp', 'aria-label': 'Falar pelo WhatsApp' }, [
                el('img', { src: 'img/rede-whatsapp.svg', alt: 'WhatsApp', width: '44', height: '44' })
              ]);
              app.appendChild(el('div', { class: 'portal-whats' }, [whats]));

            });
          });
    }

    /* administrador abrindo a página de um aluno (aluno.html?ver=ID): vê o que o aluno vê */
    function mostrarComoAluno(user, alunoId) {
      limpar();
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      P.client.rpc('sou_admin').then(function (ra) {
        if (ra.error || ra.data !== true) { mostrarPortal(user); return; }
        P.client.from('alunos').select('id,nome,email,meet_link').eq('id', alunoId).maybeSingle().then(function (r) {
          if (r.error || !r.data) { limpar(); app.appendChild(el('p', { class: 'portal-msg erro', text: 'Aluno não encontrado.' })); return; }
          desenharPaginaDoAluno(user, r.data, true);
        });
      });
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') mostrarNovaSenha(); });
    if (P.emRecuperacao) { mostrarNovaSenha(); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      var ver = new URLSearchParams(location.search).get('ver');
      if (sessao && ver) mostrarComoAluno(sessao.user, ver);
      else if (sessao) mostrarPortal(sessao.user); else mostrarLogin();
    });
  })();
  </script>
