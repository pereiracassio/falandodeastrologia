<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Aluno - Falando de Astrologia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="papiro.css?v=4">
  <link rel="stylesheet" href="home.css?v=18">
  <link rel="stylesheet" href="page.css?v=17">
  <link rel="stylesheet" href="portal.css?v=12">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:14px 10px; max-width:700px; margin:0 auto 20px auto; border-bottom:1px solid #B5852F; font-family:'Cinzel', serif;">
    <a href="index.html" class="marca"><img src="favicon.svg?v=2" alt="" width="40" height="40"><span>Falando de Astrologia</span></a>
    <nav style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="index.html#servicos" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Serviços</a>
      <a href="mentoria.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Mentoria</a>
      <a href="sobre.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Sobre</a>
    </nav>
  </header>
<div class="pagina pagina-servico"><div class="folha-pagina">
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo" id="portalTitulo">Portal do Aluno</h1>
    <p class="portal-sub" id="portalSub">Falando de Astrologia</p>
    <div id="app"></div>
    <p class="portal-sala" id="salaClassroom">Ainda usa o Google Classroom? <a href="https://classroom.google.com" rel="nofollow" target="_blank">Acesse a sala de aula virtual</a>.</p>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=25"></script>
  <script src="atividades.js?v=10"></script>
  <script src="caderno.js?v=3"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');

    /* fora (login, sem ficha): "Portal do Aluno"; dentro da página do aluno: o nome do produto que ele tem */
    function titulos(dentro) {
      document.getElementById('portalTitulo').textContent = dentro ? 'Acompanhamento Prático de Astrologia' : 'Portal do Aluno';
      document.getElementById('portalSub').textContent = dentro ? 'Mentoria em Astrologia Clássica' : 'Falando de Astrologia';
    }

    function limpar() { app.textContent = ''; titulos(false); }

    function sair() { P.client.auth.signOut().then(mostrarLogin); }

    var avisoSenha = false;

    /* topo: saudação + botões (Trocar senha, Sair e, se houver, extras como o Painel) */
    function topo(user, texto, extra) {
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () { trocarSenha(user); });
      var sairBtn = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' });
      sairBtn.addEventListener('click', sair);
      return el('div', { class: 'portal-topo' }, [el('span', { text: texto }), el('div', {}, [extra, trocar, sairBtn].filter(Boolean))]);
    }

    function trocarSenha(user) {
      limpar();
      P.montarNovaSenha(app, function () { avisoSenha = true; mostrarPortal(user); }, 'Trocar senha');
      var voltar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Voltar' });
      voltar.addEventListener('click', function () { mostrarPortal(user); });
      app.appendChild(voltar);
    }

    function avisoDeSenha() {
      if (!avisoSenha) return;
      avisoSenha = false;
      app.appendChild(el('p', { class: 'portal-msg ok', text: 'Senha alterada.' }));
    }

    function mostrarLogin() {
      limpar();
      document.getElementById('salaClassroom').style.display = '';
      var google = el('button', { type: 'button', class: 'portal-btn', text: 'Entrar com o Google' });
      google.addEventListener('click', function () { P.entrarComGoogle('/aluno.html'); });
      app.appendChild(el('div', { class: 'portal-cartao' }, [
        el('p', { text: 'Entre com a conta Google (Gmail) que você informou na matrícula.' }),
        google,
        el('p', { class: 'portal-vazio', text: 'Ou, se você já tem senha, entre com e-mail e senha:' })
      ]));
      P.montarLogin(app, mostrarPortal);
    }

    function mostrarNovaSenha() {
      limpar();
      P.montarNovaSenha(app, mostrarPortal);
    }

    /* um item da lista: gravações têm player embutido do Drive (com botão de abrir no Drive de reserva); o resto abre no Drive. (Antes era sempre em outra aba: o player embutido do Drive não
       funcionava em arquivo restrito no Safari, que bloqueia o login do Google dentro da página — se isso voltar a acontecer, é por isso.) */
    function itemDaLista(item, bloco) {
      var seguro = P.linkSeguro(item.link);
      var titulo = el('div', {}, [el('span', { class: 'portal-item-titulo', text: item.titulo })]);
      if (item.data) titulo.appendChild(el('span', { class: 'portal-item-data', text: P.dataBR(item.data) }));
      var linha = el('div', { class: 'portal-item-linha' }, [titulo]);
      var player = bloco === 'gravacoes' && seguro ? P.playerGravacao(seguro) : null;
      if (seguro && !player) {
        var texto = bloco === 'caderno' ? 'Abrir caderno' : bloco === 'gravacoes' ? 'Assistir' : 'Abrir';
        linha.appendChild(el('a', { class: 'portal-btn', href: seguro, target: '_blank', rel: 'noopener', text: texto }));
      }
      var caixa = el('div', { class: 'portal-item' }, [linha]);
      if (player) caixa.appendChild(player);
      if (item.descricao) caixa.appendChild(el('p', { class: 'portal-descricao', text: item.descricao }));
      return caixa;
    }

    /* três abas na mesma página (Atividades, Gravações, Materiais); abre em Atividades, que é o que o aluno precisa fazer; as gravações são para rever quando tiver dúvida.
       A chave interna 'caderno' continua a mesma (é o que está salvo no banco); só o nome na tela mudou. */
    var ABAS = [
      { chave: 'caderno', nome: 'Atividades', vazio: 'Nenhuma atividade ainda.' },
      { chave: 'gravacoes', nome: 'Gravações', vazio: 'Nenhuma gravação ainda.' },
      { chave: 'materiais', nome: 'Materiais', vazio: 'Nenhum material ainda.' }
    ];

    function abasDaTela(lista, atividadesEl, avisarQuando) {
      var barra = el('div', { class: 'portal-abas', role: 'tablist' });
      var conteudo = el('div', { class: 'portal-cartao' });
      var botoes = {};
      function mostrar(chave) {
        ABAS.forEach(function (ab) {
          var ativa = ab.chave === chave;
          botoes[ab.chave].className = 'portal-aba' + (ativa ? ' ativa' : '');
          botoes[ab.chave].setAttribute('aria-selected', ativa ? 'true' : 'false');
        });
        conteudo.textContent = '';
        var itens = lista.filter(function (i) { return i.bloco === chave; });
        var aba = ABAS.filter(function (ab) { return ab.chave === chave; })[0];
        vazioP = el('p', { class: 'portal-vazio', text: aba.vazio });
        if (chave === 'caderno') conteudo.appendChild(atividadesEl);   /* as atividades do site ficam no começo da aba */
        if (!itens.length && !(chave === 'caderno' && qtdAtividades > 0)) conteudo.appendChild(vazioP);
        itens.forEach(function (i) { conteudo.appendChild(itemDaLista(i, chave)); });
      }
      var vazioP = null, qtdAtividades = 0, abaAtual = 'caderno';
      avisarQuando(function (qtd) {
        qtdAtividades = qtd;
        var ab = ABAS[0], itensAba = lista.filter(function (i) { return i.bloco === ab.chave; }).length;
        if (qtd) botoes[ab.chave].textContent = ab.nome + ' (' + (itensAba + qtd) + ')';
        if (qtd && vazioP && vazioP.parentNode) vazioP.parentNode.removeChild(vazioP);
      });
      ABAS.forEach(function (ab) {
        var qtd = lista.filter(function (i) { return i.bloco === ab.chave; }).length;
        var b = el('button', { type: 'button', role: 'tab', text: ab.nome + (qtd ? ' (' + qtd + ')' : '') });
        b.addEventListener('click', function () { abaAtual = ab.chave; mostrar(ab.chave); });
        botoes[ab.chave] = b;
        barra.appendChild(b);
      });
      mostrar('caderno');
      return [barra, conteudo];
    }

    function mostrarPortal(user) {
      limpar();
      document.getElementById('salaClassroom').style.display = 'none';
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      var email = String(user.email || '').toLowerCase();
      P.client.from('alunos').select('id,nome,meet_link').eq('email', email).maybeSingle().then(function (r) {
        limpar();
        if (r.error) {
          app.appendChild(topo(user, email));
          app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar agora. Tente de novo em instantes.' }));
          return;
        }
        if (!r.data) {
          // sem ficha de aluno: se for o administrador, mostra o nome dele (tabela admins) e o botão do Painel
          P.client.from('admins').select('nome').maybeSingle().then(function (ra) {
            var admin = ra.data ? el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-alunos.html', text: 'Painel' }) : null;
            var saudacao = ra.data && ra.data.nome ? 'Olá, ' + ra.data.nome + '!' : email;
            app.appendChild(topo(user, saudacao, admin));
            avisoDeSenha();
            app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: admin ? 'Este é o painel de quem administra. Os alunos veem uma página própria, com o nome deles.' : 'O seu acesso ainda não foi liberado. Entre em contato pelo WhatsApp ou e-mail para liberar.' })]));
          });
          return;
        }
        desenharPaginaDoAluno(user, r.data, false);
      });
    }

    /* a página do aluno em si. previa = o administrador vendo como o aluno vê (nada é salvo nem enviado) */
    function desenharPaginaDoAluno(user, aluno, previa) {
        limpar();
        document.getElementById('salaClassroom').style.display = 'none';
        titulos(true);
        if (previa) {
          var voltarPainel = el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-alunos.html', text: '← Voltar ao painel' });
          app.appendChild(el('div', { class: 'portal-topo' }, [el('span', { text: 'Você está vendo como ' + aluno.nome + ' vê (modo administrador)' }), el('div', {}, [voltarPainel])]));
        } else {
          app.appendChild(topo(user, 'Olá, ' + aluno.nome + '!'));
          avisoDeSenha();
        }
        // link fixo do encontro semanal (Google Meet), acima das abas
        var meetLink = P.linkSeguro(aluno.meet_link);
        if (meetLink) app.appendChild(el('a', { class: 'portal-btn portal-btn-meet portal-meet', href: meetLink, target: '_blank', rel: 'noopener', text: 'Entrar no encontro (Google Meet)' }));
        P.client.from('itens').select('bloco,titulo,descricao,link,data,criado_em').eq('aluno_id', aluno.id)
          .order('data', { ascending: false, nullsFirst: false }).order('criado_em', { ascending: false }).then(function (ri) {
            if (ri.error) { app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os seus materiais agora.' })); return; }
            var lista = ri.data || [];
            // atividades (perguntas pra responder): ficam dentro da aba "Atividades", antes dos documentos do Drive
            var avisar = function () {};
            var atividadesEl = window.atividades.cartaoDoAluno(aluno, function (a) {
              a.alunoNome = aluno.nome;
              window.atividades.telaDaAtividadeAluno(app, a, function () { desenharPaginaDoAluno(user, aluno, previa); }, previa);
            }, { semMoldura: true, aoCarregar: function (qtd, paraResponder) {
              avisar(qtd); caixaCaderno.style.display = qtd ? '' : 'none';
              avisoResponder.textContent = paraResponder === 1 ? 'Você tem 1 atividade para responder.' : 'Você tem ' + paraResponder + ' atividades para responder.';
              avisoResponder.style.display = paraResponder ? '' : 'none';
            } });
            var avisoResponder = el('p', { style: 'display:none;margin:0 0 14px;color:#A03E25;font-weight:700;font-size:16px' });
            app.appendChild(avisoResponder);
            abasDaTela(lista, atividadesEl, function (fn) { avisar = fn; }).forEach(function (e) { app.appendChild(e); });
            // "Baixar meu caderno": o PDF com a capa e tudo que o aluno já fez; só aparece quando há atividades
            var caixaCaderno = window.caderno.botao(aluno);
            caixaCaderno.style.display = 'none';
            app.appendChild(caixaCaderno);
            // só o ícone do WhatsApp (o mesmo da home), no fim da página, em qualquer aba
            var whats = el('a', { href: 'https://wa.me/5511970404508?text=Oi%20C%C3%A1ssio!%20Estou%20na%20%C3%A1rea%20do%20aluno%20e%20queria%20tirar%20uma%20d%C3%BAvida.', target: '_blank', rel: 'noopener', title: 'WhatsApp', 'aria-label': 'Falar pelo WhatsApp' }, [
              el('img', { src: 'img/rede-whatsapp.svg', alt: 'WhatsApp', width: '44', height: '44' })
            ]);
            app.appendChild(el('div', { class: 'portal-whats' }, [whats]));
          });
    }

    /* administrador abrindo a página de um aluno (aluno.html?ver=ID): vê o que o aluno vê */
    function mostrarComoAluno(user, alunoId) {
      limpar();
      document.getElementById('salaClassroom').style.display = 'none';
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      P.client.rpc('sou_admin').then(function (ra) {
        if (ra.error || ra.data !== true) { mostrarPortal(user); return; }
        P.client.from('alunos').select('id,nome,meet_link').eq('id', alunoId).maybeSingle().then(function (r) {
          if (r.error || !r.data) { limpar(); app.appendChild(el('p', { class: 'portal-msg erro', text: 'Aluno não encontrado.' })); return; }
          desenharPaginaDoAluno(user, r.data, true);
        });
      });
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') mostrarNovaSenha(); });
    if (P.emRecuperacao) { mostrarNovaSenha(); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      var ver = new URLSearchParams(location.search).get('ver');
      if (sessao && ver) mostrarComoAluno(sessao.user, ver);
      else if (sessao) mostrarPortal(sessao.user); else mostrarLogin();
    });
  })();
  </script>
  <script src="menu.js?v=17" defer></script>
</body>
