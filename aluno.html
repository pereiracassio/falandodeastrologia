</head>
<body>
  <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:14px 10px; max-width:700px; margin:0 auto 20px auto; border-bottom:1px solid #B5852F; font-family:'Cinzel', serif;">
    <a href="index.html" class="marca"><img src="favicon.svg?v=2" alt="" width="40" height="40"><span>Falando de Astrologia</span></a>
    <nav style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="index.html#servicos" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Serviços</a>
      <a href="mentoria.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Mentoria</a>
      <a href="sobre.html" style="color:#1F5FA3; text-decoration:none; font-weight:600; font-size:13px;">Sobre</a>
    </nav>
  </header>
<div class="pagina pagina-servico"><div class="folha-pagina">
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Portal do Aluno</h1>
    <p class="portal-sub">Falando de Astrologia</p>
    <div id="app"></div>
    <p class="portal-sala" id="salaClassroom">Ainda usa o Google Classroom? <a href="https://classroom.google.com" rel="nofollow" target="_blank">Acesse a sala de aula virtual</a>.</p>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=1"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');

    function limpar() { app.textContent = ''; }

    function sair() { P.client.auth.signOut().then(mostrarLogin); }

    function topo(texto, extra) {
      var botoes = [extra, el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' })];
      botoes[1].addEventListener('click', sair);
      return el('div', { class: 'portal-topo' }, [el('span', { text: texto }), el('div', {}, botoes.filter(Boolean))]);
    }

    function mostrarLogin() {
      limpar();
      document.getElementById('salaClassroom').style.display = '';
      P.montarLogin(app, mostrarPortal);
    }

    function mostrarNovaSenha() {
      limpar();
      P.montarNovaSenha(app, mostrarPortal);
    }

    /* um item da lista: gravação do Drive toca aqui dentro; o resto abre em outra aba */
    function itemDaLista(item, bloco) {
      var embed = bloco === 'gravacoes' ? P.embedDrive(item.link) : null;
      var seguro = P.linkSeguro(item.link);
      var titulo = el('div', {}, [el('span', { class: 'portal-item-titulo', text: item.titulo })]);
      if (item.data) titulo.appendChild(el('span', { class: 'portal-item-data', text: P.dataBR(item.data) }));
      var linha = el('div', { class: 'portal-item-linha' }, [titulo]);
      var caixa = el('div', { class: 'portal-item' }, [linha]);
      if (embed) {
        var botao = el('button', { type: 'button', class: 'portal-btn', text: 'Assistir' });
        var aberto = null;
        botao.addEventListener('click', function () {
          if (aberto) { aberto.remove(); aberto = null; botao.textContent = 'Assistir'; return; }
          var quadro = el('iframe', { src: embed, allow: 'autoplay; fullscreen', allowfullscreen: '', title: item.titulo });
          aberto = el('div', { class: 'portal-video' }, [quadro]);
          caixa.appendChild(aberto);
          botao.textContent = 'Fechar';
        });
        linha.appendChild(botao);
      } else if (seguro) {
        linha.appendChild(el('a', { class: 'portal-btn', href: seguro, target: '_blank', rel: 'noopener', text: bloco === 'caderno' ? 'Abrir caderno' : 'Abrir' }));
      }
      return caixa;
    }

    function blocoDaTela(titulo, itens, bloco, vazio) {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: titulo })]);
      if (!itens.length) cartao.appendChild(el('p', { class: 'portal-vazio', text: vazio }));
      itens.forEach(function (i) { cartao.appendChild(itemDaLista(i, bloco)); });
      return cartao;
    }

    function mostrarPortal(user) {
      limpar();
      document.getElementById('salaClassroom').style.display = 'none';
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      var email = String(user.email || '').toLowerCase();
      P.client.from('alunos').select('id,nome').eq('email', email).maybeSingle().then(function (r) {
        limpar();
        if (r.error) {
          app.appendChild(topo(email));
          app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar agora. Tente de novo em instantes.' }));
          return;
        }
        if (!r.data) {
          var admin = el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-alunos.html', text: 'Painel' });
          app.appendChild(topo(email, admin));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'O seu acesso ainda não foi liberado. Entre em contato pelo WhatsApp ou e-mail para liberar.' })]));
          return;
        }
        var aluno = r.data;
        app.appendChild(topo('Olá, ' + aluno.nome + '!'));
        P.client.from('itens').select('bloco,titulo,link,data,criado_em').eq('aluno_id', aluno.id)
          .order('data', { ascending: false, nullsFirst: false }).order('criado_em', { ascending: false }).then(function (ri) {
            if (ri.error) { app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os seus materiais agora.' })); return; }
            var lista = ri.data || [];
            function doBloco(b) { return lista.filter(function (i) { return i.bloco === b; }); }
            app.appendChild(blocoDaTela('Caderno do aluno', doBloco('caderno'), 'caderno', 'O seu caderno ainda não foi disponibilizado.'));
            app.appendChild(blocoDaTela('Gravações dos encontros', doBloco('gravacoes'), 'gravacoes', 'Nenhuma gravação ainda.'));
            app.appendChild(blocoDaTela('Materiais', doBloco('materiais'), 'materiais', 'Nenhum material ainda.'));
          });
      });
    }

    P.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') mostrarNovaSenha(); });
    if (P.emRecuperacao) { mostrarNovaSenha(); return; }
    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) mostrarPortal(sessao.user); else mostrarLogin();
    });
  })();
  </script>
  <script src="menu.js?v=14" defer></script>
</body>
</html>
