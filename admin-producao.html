    /* ---------- horas planetárias: sugestão dos horários de Júpiter ----------
       Mesmo cálculo da ferramenta Horas do Astro Hellenic (nascer e pôr do sol arredondados ao minuto, 12 horas de dia e 12 de noite,
       ordem caldaica a partir do regente do dia), copiado para cá. Lugar fixo: Jacareí, fuso -3 (sem pedir localização). */
    var LOCAL_HORAS = { nome: 'Jacareí', lat: -23.3053, lon: -45.9658, fuso: -3 };
    var LOCAIS = [
      ['Jacareí', -23.3053, -45.9658, -3], ['São Paulo', -23.5505, -46.6333, -3], ['Guarulhos', -23.4543, -46.5333, -3], ['São José dos Campos', -23.1896, -45.8841, -3],
      ['Campinas', -22.9099, -47.0626, -3], ['Santos', -23.9608, -46.3336, -3], ['Rio de Janeiro', -22.9068, -43.1729, -3], ['Belo Horizonte', -19.9167, -43.9345, -3],
      ['Brasília', -15.7939, -47.8828, -3], ['Curitiba', -25.4284, -49.2733, -3], ['Porto Alegre', -30.0346, -51.2177, -3], ['Florianópolis', -27.5954, -48.548, -3],
      ['Vitória', -20.3155, -40.3128, -3], ['Goiânia', -16.6869, -49.2648, -3], ['Salvador', -12.9777, -38.5016, -3], ['Recife', -8.0476, -34.877, -3],
      ['Fortaleza', -3.7319, -38.5267, -3], ['Natal', -5.7945, -35.211, -3], ['Belém', -1.4558, -48.4902, -3], ['Manaus', -3.119, -60.0217, -4],
      ['Cuiabá', -15.6014, -56.0979, -4], ['Campo Grande', -20.4697, -54.6201, -4], ['Porto Velho', -8.7612, -63.9004, -4]
    ];
    var CALDAICA = ['Saturn', 'Jupiter', 'Mars', 'Sun', 'Venus', 'Mercury', 'Moon'];
    var REGENTE_DO_DIA = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'];
    function solEmMinutos(ano, mes, dia) { /* minutos desde a meia-noite local: nascer e pôr do sol */
      var N = Math.floor(275 * mes / 9) - Math.floor((mes + 9) / 12) * (1 + Math.floor((ano - 4 * Math.floor(ano / 4) + 2) / 3)) + dia - 30;
      var lngHour = LOCAL_HORAS.lon / 15, rad = Math.PI / 180;
      function evento(nasce) {
        var t = nasce ? N + ((6 - lngHour) / 24) : N + ((18 - lngHour) / 24);
        var M = 0.9856 * t - 3.289;
        var L = (M + 1.916 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 282.634 + 360) % 360;
        var RA = (Math.atan(0.91764 * Math.tan(L * rad)) / rad + 360) % 360;
        RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
        var sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
        var cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(LOCAL_HORAS.lat * rad)) / (cosDec * Math.cos(LOCAL_HORAS.lat * rad));
        if (cosH > 1 || cosH < -1) return null;
        var H = (nasce ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad) / 15;
        var UT = (((H + RA - 0.06571 * t - 6.622) - lngHour) + 24) % 24;
        return Math.round((UT + LOCAL_HORAS.fuso) * 60);
      }
      return { nasce: evento(true), poe: evento(false) };
    }
    /* as horas de Júpiter que caem no dia civil isoD, como [início, fim] em minutos desde a meia-noite (cortadas em 0 e 1440);
       entram também as da noite do dia anterior que passam da meia-noite */
    function horasDeJupiter(isoD) {
      var achadas = [];
      [-1, 0].forEach(function (desl) {
        var d = deIso(somarDias(isoD, desl)), seg = deIso(somarDias(isoD, desl + 1));
        var hoje_ = solEmMinutos(d.getFullYear(), d.getMonth() + 1, d.getDate()), amanha = solEmMinutos(seg.getFullYear(), seg.getMonth() + 1, seg.getDate());
        if (hoje_.nasce == null || hoje_.poe == null || amanha.nasce == null) return;
        var base = desl * 1440, ini = CALDAICA.indexOf(REGENTE_DO_DIA[d.getDay()]);
        var durDia = (hoje_.poe - hoje_.nasce) / 12, durNoite = (amanha.nasce + 1440 - hoje_.poe) / 12;
        for (var i = 0; i < 24; i++) {
          var dia = i < 12, j = dia ? i : i - 12;
          if (CALDAICA[(ini + i) % 7] !== 'Jupiter') continue;
          var a = base + (dia ? hoje_.nasce + j * durDia : hoje_.poe + j * durNoite), b = a + (dia ? durDia : durNoite);
          if (b <= 0 || a >= 1440) continue;
          achadas.push([Math.max(0, Math.round(a)), Math.min(1440, Math.round(b))]);
        }
      });
      return achadas.sort(function (x, y) { return x[0] - y[0]; });
    }
    /* bloco azul "dd/mm/aa, horários de Júpiter" com um horário por linha; vazio se não há data */

    function hhmm(min) { var m = ((min % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

    /* ---------- datas (sempre texto aaaa-mm-dd, sem fuso) ---------- */
    function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function deIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function somarDias(s, n) { var d = deIso(s); d.setDate(d.getDate() + n); return iso(d); }
    function hoje() { return iso(new Date()); }
    function curta(s) { return s ? deIso(s).getDate() + '/' + String(deIso(s).getMonth() + 1).padStart(2, '0') : ''; }

    /* imagem da capa: mesma preparação do blog (largura máxima 1600, JPEG) e mesma pasta (bucket "site"), para o blog poder usar o mesmo endereço */

    /* copia para a área de transferência (com plano B para navegadores que não deixam) */

    /* roteiro em tela cheia para ler enquanto grava: letra grande e ajustável, rolagem automática, fundo claro ou escuro */
    function modoGravacao(titulo, itens) {
      var idx = 0, tam = 44, vel = 0, escuro = true, rodando = false, timer = null, acum = 0;
      var tela = el('div', { style: 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column' });

      var area = el('div', { style: 'flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:5vh 7vw 40vh' });
      var corpo = el('div', { style: 'white-space:pre-wrap;line-height:1.5;font-family:var(--fonte-mao)' });
      var nomeTxt = el('span', { text: '' });
      area.appendChild(corpo);
      function pintar() {
        tela.style.background = escuro ? '#0d1220' : '#F3E3B8'; tela.style.color = escuro ? '#F3E3B8' : '#16233F';
        barra.style.background = escuro ? '#0d1220' : '#F3E3B8';
        corpo.style.fontSize = tam + 'px';
        play.textContent = rodando ? 'Pausar' : 'Rolar sozinho';
        velTxt.textContent = 'velocidade ' + vel;
        [].forEach.call(barra.querySelectorAll('button'), function (b) { b.style.cssText = 'background:transparent;border:1px solid #1F5FA3;border-radius:0;padding:10px 14px;font-size:15px;cursor:pointer;color:' + (escuro ? '#F3E3B8' : '#1034A6') + ';font-family:var(--fonte-titulo);text-transform:lowercase'; });
        velTxt.style.cssText = 'font-size:14px;font-family:var(--fonte-titulo);text-transform:lowercase';
        nomeTxt.style.cssText = 'font-size:18px;font-weight:700;font-family:var(--fonte-titulo);text-transform:lowercase;color:' + (escuro ? '#E3B655' : '#A03E25');
      }
      function mostrar() {
        corpo.textContent = itens[idx].texto || (itens.length > 1 ? 'Este bloco está vazio.' : 'O roteiro está vazio.');
        nomeTxt.textContent = itens.length > 1 ? itens[idx].nome + ' (' + (idx + 1) + ' de ' + itens.length + ')' : '';
        area.scrollTop = 0; acum = 0;
      }
      function ir(d) { var n = Math.max(0, Math.min(itens.length - 1, idx + d)); if (n !== idx) { idx = n; mostrar(); } }
      function mexer(d) { return function () { tam = Math.max(20, Math.min(120, tam + d)); pintar(); }; }
      function ritmo(d) { return function () { vel = Math.max(0, Math.min(10, vel + d)); if (vel === 0) rodando = false; pintar(); }; }
      function btn(t, f) { var b = el('button', { type: 'button', text: t }); b.addEventListener('click', f); barra.appendChild(b); return b; }
      var velTxt = el('span', { text: '' });
      var fechar;
      if (itens.length > 1) { btn('Anterior', function () { ir(-1); }); barra.appendChild(nomeTxt); btn('Próximo', function () { ir(1); }); }
      btn('A−', mexer(-4)); btn('A+', mexer(4));
      btn('Devagar', ritmo(-1));
      barra.appendChild(velTxt);
      btn('Rápido', ritmo(1));
      var play = btn('Rolar sozinho', function () { if (vel === 0) vel = 3; rodando = !rodando; pintar(); });
      btn('Início', function () { area.scrollTop = 0; acum = 0; });
      btn('Claro/escuro', function () { escuro = !escuro; pintar(); });
      fechar = btn('Fechar', encerrar);
      tela.appendChild(barra); tela.appendChild(area);
      document.body.appendChild(tela);
      document.body.style.overflow = 'hidden';
      pintar(); mostrar();
      timer = setInterval(function () { if (rodando && vel > 0) { acum += vel * 0.6; if (acum >= 1) { area.scrollTop += Math.floor(acum); acum -= Math.floor(acum); } } }, 30);
      function tecla(e) { if (e.key === 'Escape') encerrar(); else if (e.key === 'ArrowRight') ir(1); else if (e.key === 'ArrowLeft') ir(-1); }
      document.addEventListener('keydown', tecla);
      if (tela.requestFullscreen) tela.requestFullscreen().catch(function () {});
      function encerrar() {
        clearInterval(timer); document.removeEventListener('keydown', tecla); document.body.style.overflow = '';
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
        if (tela.parentNode) tela.parentNode.removeChild(tela);
      }
      document.addEventListener('fullscreenchange', function aoSair() { if (!document.fullscreenElement) { document.removeEventListener('fullscreenchange', aoSair); if (tela.parentNode) encerrar(); } });
    }

    /* aviso fixo no pé da tela: aparece mesmo que a página esteja rolada para qualquer lugar */
    var tempoAviso = null;
    function avisoFlutuante(texto, erro) {
      var a = document.getElementById('prod-aviso');
      if (!a) { a = el('div', { id: 'prod-aviso' }); document.body.appendChild(a); }
      a.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99998;padding:12px 22px;border:3px solid #1F5FA3;border-radius:0;background:#F3E3B8;color:' + (erro ? '#A03E25' : '#16233F') + ';font-family:var(--fonte-titulo);text-transform:lowercase;font-size:16px;font-weight:700';
      a.textContent = texto; a.style.display = 'block';
      clearTimeout(tempoAviso); tempoAviso = setTimeout(function () { a.style.display = 'none'; }, 2200);
    }

    /* lugar das horas planetárias: texto pequeno no pé da tela; ao tocar abre a troca (lista de cidades, outro lugar ou a localização do aparelho, só quando você pedir) */
    function rodapeLocal() {
      var caixa = el('div', { style: 'margin:28px 0 6px;text-align:center' });
      var texto = el('span', { style: 'font-size:12px;color:#16233F;opacity:.7', text: 'Horas planetárias calculadas para ' + LOCAL_HORAS.nome + ' · ' });
      var trocar = el('button', { type: 'button', text: 'trocar lugar' });
      trocar.style.cssText = 'background:transparent;border:0;border-radius:0;padding:4px;font-size:12px;color:#16233F;opacity:.7;text-decoration:underline;cursor:pointer;font-family:var(--fonte-mao)';
      caixa.appendChild(texto); caixa.appendChild(trocar);
      var painel = el('div', { style: 'display:none;margin:12px auto 0;max-width:560px;text-align:left' });
      caixa.appendChild(painel);
      trocar.addEventListener('click', function () {
        if (painel.style.display === 'block') { painel.style.display = 'none'; return; }
        painel.style.display = 'block'; painel.textContent = '';
        var lista = el('select', {});
        LOCAIS.forEach(function (l, i) { var o = el('option', { value: String(i), text: l[0] }); if (l[0] === LOCAL_HORAS.nome) o.selected = true; lista.appendChild(o); });
        var outro = el('option', { value: 'outro', text: 'Outro lugar (digitar)' }); if (!LOCAIS.some(function (l) { return l[0] === LOCAL_HORAS.nome; })) outro.selected = true; lista.appendChild(outro);
        var nomeC = el('input', { type: 'text', placeholder: 'Nome do lugar' }); nomeC.value = LOCAL_HORAS.nome;
        var latC = el('input', { type: 'number', step: 'any', placeholder: 'Latitude (sul é negativo)' }); latC.value = LOCAL_HORAS.lat;
        var lonC = el('input', { type: 'number', step: 'any', placeholder: 'Longitude (oeste é negativo)' }); lonC.value = LOCAL_HORAS.lon;
        var fusoC = el('input', { type: 'number', step: 'any', placeholder: 'Fuso (Brasília é -3)' }); fusoC.value = LOCAL_HORAS.fuso;
        var manual = el('div', { style: 'display:none' }, [campo('Nome', nomeC), campo('Latitude', latC), campo('Longitude', lonC), campo('Fuso (horas em relação a Greenwich)', fusoC)]);
        function mostrarManual() { manual.style.display = lista.value === 'outro' ? 'block' : 'none'; }
        lista.addEventListener('change', mostrarManual); mostrarManual();
        var msgL = el('p', { class: 'portal-msg' });
        var aqui = botao('Usar a localização deste aparelho agora', function () {
          if (!navigator.geolocation) { P.mensagem(msgL, 'Este aparelho não informa a localização.', 'erro'); return; }
          P.mensagem(msgL, 'Pedindo a localização...');
          navigator.geolocation.getCurrentPosition(function (pos) {
            lista.value = 'outro'; mostrarManual();
            nomeC.value = 'localização do aparelho'; latC.value = pos.coords.latitude.toFixed(4); lonC.value = pos.coords.longitude.toFixed(4); fusoC.value = String(-new Date().getTimezoneOffset() / 60);
            P.mensagem(msgL, 'Pronto. Confira e toque em Salvar o lugar.', 'ok');
          }, function () { P.mensagem(msgL, 'Não consegui a localização. Escolha na lista ou digite.', 'erro'); }, { timeout: 10000 });
        });
        var gravarLocal = botao('Salvar o lugar', function () {
          var novo;
          if (lista.value === 'outro') {
            novo = { nome: nomeC.value.trim() || 'outro lugar', lat: parseFloat(latC.value), lon: parseFloat(lonC.value), fuso: parseFloat(fusoC.value) };
            if (!isFinite(novo.lat) || !isFinite(novo.lon) || !isFinite(novo.fuso) || Math.abs(novo.lat) > 66 || Math.abs(novo.lon) > 180 || Math.abs(novo.fuso) > 14) { P.mensagem(msgL, 'Confira a latitude, a longitude e o fuso. Perto dos polos o sol pode não nascer e a conta não funciona.', 'erro'); return; }
          } else { var l = LOCAIS[+lista.value]; novo = { nome: l[0], lat: l[1], lon: l[2], fuso: l[3] }; }
          C.from('site_config').upsert({ chave: 'prod_local_horas', valor: JSON.stringify(novo), atualizado_em: new Date().toISOString() }, { onConflict: 'chave' }).then(function (r) {
            if (r.error) { P.mensagem(msgL, 'Não consegui salvar (' + r.error.message + ')', 'erro'); return; }
            LOCAL_HORAS = novo; avisoFlutuante('Lugar salvo'); tela();
          });
        }, false);
        painel.appendChild(campo('Lugar', lista)); painel.appendChild(manual);
        painel.appendChild(el('div', { class: 'portal-acoes' }, [gravarLocal, aqui])); painel.appendChild(msgL);
      });
      return caixa;
    }

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('producao', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          var e = P.estado.ler();
          aba = e.aba || 'hoje'; serieAberta = e.serie || null; videoAberto = e.video || null;
          carregar();
        });
      });
    }
    function guardarEstado() { P.estado.gravar({ aba: aba, serie: serieAberta, video: videoAberto }); }

    function carregar() {
      Promise.all([
        C.from('prod_series').select('*').order('criado_em'),
        C.from('prod_videos').select('*').order('numero').order('criado_em'),
        C.from('prod_cortes').select('*').order('ordem').order('criado_em'),
        C.from('site_config').select('valor').eq('chave', 'prod_local_horas').maybeSingle()
      ]).then(function (r) {
        if (r[0].error || r[1].error || r[2].error) {
          limpar(); app.appendChild(topo(nomeAdmin));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Não consegui abrir a Produção (as tabelas ainda não foram criadas no Supabase).' })]));
          return;
        }
        series = r[0].data || []; videos = r[1].data || []; cortes = r[2].data || [];
        try { /* lugar usado nas horas planetárias (guardado no Supabase, vale em qualquer aparelho) */
          var salvo = r[3] && r[3].data && r[3].data.valor ? JSON.parse(r[3].data.valor) : null;
          if (salvo && isFinite(salvo.lat) && isFinite(salvo.lon) && isFinite(salvo.fuso)) LOCAL_HORAS = { nome: String(salvo.nome || 'outro lugar'), lat: +salvo.lat, lon: +salvo.lon, fuso: +salvo.fuso };
        } catch (e) { /* fica em Jacareí */ }
        tela();
      });
    }

    var achar = function (lista, id) { for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i]; return null; };
    var serieDe = function (v) { return v.serie_id ? achar(series, v.serie_id) : null; };
    var nomeVideo = function (v) { var s = serieDe(v); return (s ? s.nome + ' · ' : '') + (v.numero ? v.numero + '. ' : '') + (v.titulo || 'sem título'); };
    var cortesDe = function (vid) { return cortes.filter(function (c) { return c.video_id === vid; }); };
    var cortePendente = function (c) { return !(c.instagram && c.tiktok && c.shorts); };

    /* grava um campo ou vários e atualiza a cópia em memória */
    function gravar(tabela, lista, obj, campos) {
      Object.keys(campos).forEach(function (k) { obj[k] = campos[k]; });
      return C.from(tabela).update(campos).eq('id', obj.id).then(function (r) {
        if (r.error) window.alert('Não consegui salvar (' + r.error.message + ')');
        return r;
      });
    }

    function chip(texto, ligado, aoClicar, atributos) {
      var b = el('button', { type: 'button', class: 'prod-chip prod-fixo' + (ligado ? ' on' : ''), text: texto, 'aria-pressed': ligado ? 'true' : 'false' });
      Object.keys(atributos || {}).forEach(function (k) { b.setAttribute(k, atributos[k]); });
      b.addEventListener('click', function () { aoClicar(b); });
      return b;
    }
    function chipsDoCorte(c) {
      return el('div', { class: 'prod-chips' }, ETAPAS_CORTE.map(function (rd) {
        return chip(rd[1], !!c[rd[0]], function (b) {
          var novo = !c[rd[0]], campos = {}; campos[rd[0]] = novo;
          b.classList.toggle('on', novo); b.setAttribute('aria-pressed', novo ? 'true' : 'false');
          gravar('prod_cortes', cortes, c, campos);
        });
      }));
    }
    /* repinta todos os botões de etapa deste vídeo que estiverem na tela (o do roteiro lá embaixo e os de cima) */
    function pintarEtapas(v) {
      [].forEach.call(document.querySelectorAll('[data-video="' + v.id + '"][data-etapa]'), function (b) {
        var on = !!v[b.getAttribute('data-etapa')];
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    /* marcar "No YouTube" marca também o que vem antes (roteiro, gravado, as duas edições); desmarcar não mexe nos outros.
       "Cortes feitos" e "No blog" ficam de fora: cortes é você que marca, e o blog pode sair antes do vídeo. */
    var ANTES_DO_YOUTUBE = ['roteiro_ok', 'gravado', 'editado', 'edicao_fina'];
    function marcarEtapa(v, campo, valor) {
      var campos = {}; campos[campo] = valor;
      if (campo === 'no_ar' && valor) ANTES_DO_YOUTUBE.forEach(function (c) { if (!v[c]) campos[c] = true; });
      Object.keys(campos).forEach(function (k) { v[k] = campos[k]; });
      pintarEtapas(v);
      return gravar('prod_videos', videos, v, campos);
    }
    function chipsDaEtapa(v, aoMudar) {
      return el('div', { class: 'prod-chips' }, ETAPAS.map(function (et) {
        return chip(et[1], !!v[et[0]], function () {
          marcarEtapa(v, et[0], !v[et[0]]).then(function () { if (aoMudar) aoMudar(); });
        }, { 'data-video': v.id, 'data-etapa': et[0] });
      }));
    }
    function botao(texto, aoClicar, sec) {
      var b = el('button', { type: 'button', class: 'portal-btn' + (sec === false ? '' : ' portal-btn-sec'), text: texto });
      b.addEventListener('click', aoClicar); return b;
    }
    /* uma fileira de campos que nunca quebra para a linha de baixo (só no celular bem estreito): cols = largura relativa de cada um */
    function fila(cols, campos) {
      var f = el('div', { class: 'prod-fila' }, campos);
      f.style.gridTemplateColumns = cols.map(function (c) { return 'minmax(0,' + c + 'fr)'; }).join(' ');
      return f;
    }
    /* público ou de membros: dois botões de escolha única; guarda na hora que toca */
    var rotuloAcesso = function (v) { return (v && v.acesso) === 'membros' ? 'membros' : 'público'; };
    function escolhaAcesso(atual, aoEscolher) {
      var valor = atual === 'membros' ? 'membros' : 'publico', botoes = [];
      var caixa = el('div', { class: 'prod-chips', style: 'margin:0 0 14px' });
      [['publico', 'Público'], ['membros', 'Membros']].forEach(function (o) {
        var b = chip(o[1], valor === o[0], function () {
          valor = o[0];
          botoes.forEach(function (x) { var on = x.cod === valor; x.b.classList.toggle('on', on); x.b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          aoEscolher(valor);
        });
        botoes.push({ cod: o[0], b: b }); caixa.appendChild(b);
      });
      return caixa;
    }
    /* "← voltar" em terracota (em cima e embaixo da tela do vídeo): guarda o que estiver digitando e abre a lista no fim */
    function botaoVoltar(aoClicar) {
      var b = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: '← Voltar' });
      b.style.cssText = 'color:#A03E25!important;font-weight:700';
      b.addEventListener('click', function () { if (aoClicar) aoClicar(); else if (voltarDoVideo) voltarDoVideo(); });
      return b;
    }
    var voltarDoVideo = null;
    function campo(rotulo, entrada) { return el('div', {}, [el('span', { class: 'prod-rotulo prod-fixo', text: rotulo }), entrada]); }
    function irPara(a, s, v) { aba = a; serieAberta = s || null; videoAberto = v || null; guardarEstado(); tela(); window.scrollTo(0, 0); }

    /* ---------- estrutura: abas ---------- */
    function tela() {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var barra = el('div', { class: 'portal-abas', role: 'tablist' });
      [['hoje', 'Hoje'], ['series', 'Séries'], ['calendario', 'Calendário']].forEach(function (d) {
        var b = el('button', { type: 'button', role: 'tab', class: 'portal-aba' + (aba === d[0] ? ' ativa' : ''), text: d[1] });
        b.addEventListener('click', function () { irPara(d[0]); });
        barra.appendChild(b);
      });
      app.appendChild(barra);
      var area = el('div', {}); app.appendChild(area);
      app.appendChild(rodapeLocal());
      if (aba === 'series') {
        if (videoAberto && achar(videos, videoAberto)) telaVideo(area, achar(videos, videoAberto));
        else if (serieAberta) telaSerie(area, serieAberta);
        else telaSeries(area);
      } else if (aba === 'calendario') telaCalendario(area);
      else telaHoje(area);
    }

    /* ---------- HOJE ---------- */
    function linhaCorte(c, mostrarData) {
      var v = achar(videos, c.video_id);
      return el('div', { class: 'prod-linha' }, [
        el('div', {}, [
          el('span', { class: 'prod-titulo', text: c.titulo || 'Corte sem título' }),
          el('span', { class: 'prod-sub', text: (mostrarData ? comDia(c.data) + ' · ' : '') + (v ? nomeVideo(v) : '') }),
          c.data ? el('span', { class: 'prod-jup', style: 'margin:2px 0 0', text: textoJupiter(c.data) }) : null
        ]),
        chipsDoCorte(c)
      ]);
    }
    function telaHoje(area) {
      var h = hoje(), cartao = el('div', { class: 'portal-cartao' });
      area.appendChild(cartao);

      var atrasados = cortes.filter(function (c) { return c.data && c.data < h && cortePendente(c); }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
      var doDia = cortes.filter(function (c) { return c.data === h; });
      cartao.appendChild(el('h2', { text: 'Hoje, ' + comDia(h) }));
      if (!doDia.length) cartao.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhum corte marcado para hoje.' }));
      doDia.forEach(function (c) { cartao.appendChild(linhaCorte(c, false)); });
      if (atrasados.length) {
        cartao.appendChild(el('hr', { class: 'prod-divisa' }));
        cartao.appendChild(el('p', { class: 'prod-grupo', text: 'Ficaram para trás' }));
        atrasados.forEach(function (c) { cartao.appendChild(linhaCorte(c, true)); });
      }

      /* vídeos grandes que ainda não foram ao ar, com data até daqui a 14 dias (ou já passada) */
      var limite = somarDias(h, 14);
      var proxVideos = videos.filter(function (v) { return !v.no_ar && v.data_postar && v.data_postar <= limite; }).sort(function (a, b) { return a.data_postar < b.data_postar ? -1 : 1; });
      cartao.appendChild(el('hr', { class: 'prod-divisa' }));
      cartao.appendChild(el('p', { class: 'prod-grupo', text: 'Vídeos grandes que estão chegando' }));
      if (!proxVideos.length) cartao.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhum vídeo marcado para as próximas duas semanas.' }));
      proxVideos.forEach(function (v) {
        var falta = ETAPAS.slice(0, 5).filter(function (e) { return !v[e[0]]; })[0];
        var linha = el('div', { class: 'prod-linha' }, [
          el('div', {}, [
            el('span', { class: 'prod-titulo', text: nomeVideo(v) }),
            el('span', { class: 'prod-sub', text: comDia(v.data_postar) + ' · ' + rotuloAcesso(v) + (v.data_postar < h ? ' · atrasado' : '') + (falta ? ' · falta: ' + falta[1].toLowerCase() : '') })
          ])
        ]);
        linha.appendChild(botao('Abrir', function () { irPara('series', v.serie_id || 'soltos', v.id); }));
        cartao.appendChild(linha);
      });

      /* cortes dos próximos 7 dias */
      var proxCortes = cortes.filter(function (c) { return c.data && c.data > h && c.data <= somarDias(h, 7); }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
      cartao.appendChild(el('hr', { class: 'prod-divisa' }));
      cartao.appendChild(el('p', { class: 'prod-grupo', text: 'Cortes dos próximos 7 dias' }));
      if (!proxCortes.length) cartao.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhum corte marcado.' }));
      proxCortes.forEach(function (c) { cartao.appendChild(linhaCorte(c, true)); });

      /* fila do blog: já foi ao ar e ainda não virou postagem */
      var fila = videos.filter(function (v) { return v.no_ar && !v.blog_ok; });
      cartao.appendChild(el('hr', { class: 'prod-divisa' }));
      cartao.appendChild(el('p', { class: 'prod-grupo', text: 'Fila do blog' }));
      if (!fila.length) cartao.appendChild(el('p', { class: 'prod-vazio', text: 'Nada esperando para virar postagem.' }));
      var porSerie = {};
      fila.forEach(function (v) { var k = v.serie_id || 'soltos'; (porSerie[k] = porSerie[k] || []).push(v); });
      Object.keys(porSerie).forEach(function (k) {
        var s = achar(series, k);
        cartao.appendChild(el('span', { class: 'prod-sub', text: s ? s.nome + (s.assunto ? ' (assunto: ' + s.assunto + ')' : '') : 'Vídeos soltos' }));
        porSerie[k].forEach(function (v) {
          var linha = el('div', { class: 'prod-linha' }, [el('span', { class: 'prod-titulo', text: (v.numero ? v.numero + '. ' : '') + (v.titulo || 'sem título') })]);
          linha.appendChild(chip('Já está no blog', false, function () { gravar('prod_videos', videos, v, { blog_ok: true }).then(tela); }));
          cartao.appendChild(linha);
        });
      });
    }

    /* ---------- SÉRIES ---------- */
    function resumoSerie(lista) {
      var n = lista.length;
      var conta = function (campo) { return lista.filter(function (v) { return v[campo]; }).length; };
      return n ? conta('roteiro_ok') + ' roteiros · ' + conta('gravado') + ' gravados · ' + conta('no_ar') + ' no ar · ' + conta('blog_ok') + ' no blog' : 'Nenhum vídeo ainda';
    }
    function telaSeries(area) {
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Séries' })]);
      area.appendChild(cartao);
      cartao.appendChild(el('div', { class: 'prod-acoes-topo' }, [botao('Nova série', function () { novaSerie(); }, false)]));
      series.forEach(function (s) {
        var lista = videos.filter(function (v) { return v.serie_id === s.id; });
        var previstos = Math.max(s.total || 0, lista.length);
        var pct = previstos ? Math.round(100 * lista.filter(function (v) { return v.no_ar; }).length / previstos) : 0;
        var datasSerie = lista.map(function (v) { return v.data_postar; }).filter(Boolean).sort();
        var periodo = datasSerie.length ? P.dataBR(datasSerie[0]) + (datasSerie.length > 1 && datasSerie[datasSerie.length - 1] !== datasSerie[0] ? ' até ' + P.dataBR(datasSerie[datasSerie.length - 1]) : '') : '';
        var corpo = el('div', {}, [
          el('span', { class: 'prod-nome', text: s.nome }),
          periodo ? el('span', { class: 'prod-data', style: 'display:block', text: periodo }) : null,
          el('span', { class: 'prod-info', style: 'display:block', text: rotuloAcesso(s) + ' · ' + resumoSerie(lista) + (s.total ? ' (de ' + s.total + ' previstos)' : '') }),
          el('div', { class: 'prod-barra' }, [el('i', { style: 'width:' + pct + '%' })])
        ]);
        var linha = el('div', { class: 'prod-linha', style: 'cursor:pointer' }, [el('div', { style: 'flex:1;min-width:200px' }, [corpo]), botao('Abrir', function () { irPara('series', s.id); })]);
        linha.addEventListener('click', function (e) { if (e.target.tagName !== 'BUTTON') irPara('series', s.id); });
        cartao.appendChild(linha);

          });
        }
        subir.then(function () {
          campos.capa_url = capaUrl || null;
          return gravar('prod_videos', videos, v, campos);
        }).then(function (r) {
          if (r && !r.error) { P.mensagem(msg, 'Salvo.', 'ok'); mostrarCapa(); avisoFlutuante('Salvo'); }
          else avisoFlutuante('Não salvou', true);
          voltarAoPonto();
        }).catch(function (e) { var motivo = e && e.message ? e.message : String(e || 'erro desconhecido'); P.mensagem(msg, (capaNova ? 'Não consegui enviar a foto' : 'Não consegui salvar') + ' (' + motivo + ')', 'erro'); avisoFlutuante('Não salvou', true); voltarAoPonto(); });
      }, false);
      /* salva sozinho enquanto digita (só os textos; a foto da capa só guarda no botão Salvar) */
      var tempoSalvar = null;
      function salvarSozinho() {
        if (!titulo.value.trim()) return;
        var lk = link.value.trim(), okLink = !lk || /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(lk);
        var c = { titulo: titulo.value.trim(), capa_texto: capaTexto.value.trim() || null, roteiro: roteiro.value, texto_postagem: texto.value, tags: tags.value.trim() || null, cards: cardsTxt.value };
        if (okLink) c.link_youtube = lk || null;
        if (usaBlocos) c.roteiro_blocos = rb;
        estadoSalvo.textContent = 'Salvando...';
        gravar('prod_videos', videos, v, c).then(function (r) { estadoSalvo.textContent = r && r.error ? 'Não salvou' : 'Salvo automaticamente'; });
      }
      function agendarSalvar() { estadoSalvo.textContent = 'Digitando...'; clearTimeout(tempoSalvar); tempoSalvar = setTimeout(salvarSozinho, 1200); }
      /* link do YouTube preenchido = o vídeo já está no YouTube (e tudo o que vem antes está feito) */
      link.addEventListener('change', function () {
        var lk = link.value.trim();
        if (/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(lk) && !v.no_ar) {
          marcarEtapa(v, 'no_ar', true).then(function () { avisoFlutuante('Marcado: no YouTube'); });
        }
      });
      [titulo, capaTexto, link, roteiro, texto, tags, cardsTxt].forEach(function (c) {
        c.addEventListener('input', agendarSalvar);
      });
      cardsTxt.addEventListener('input', desenharCards); /* registrado depois do salvar sozinho, mas o salvar só roda 1,2 s depois, já com o limite aplicado */
      voltarDoVideo = function () { clearTimeout(tempoSalvar); salvarSozinho(); rolarParaFimDaLista = true; irPara('series', serieAberta); };
      salvar.addEventListener('pointerdown', function () { yAntes = window.scrollY; });
      salvar.addEventListener('touchstart', function () { yAntes = window.scrollY; }, { passive: true });
      var voltar = botaoVoltar();
      /* discreto de propósito: texto pequeno no fim da tela, longe dos outros botões */
      var apagar = P.botaoApagar('Excluir este vídeo');
      apagar.addEventListener('click', function () {
        if (!window.confirm('Excluir este vídeo e os cortes dele? Não dá para desfazer.')) return;
        C.from('prod_videos').delete().eq('id', v.id).then(function (r) {
          if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
          videos = videos.filter(function (x) { return x.id !== v.id; }); cortes = cortes.filter(function (c) { return c.video_id !== v.id; });
          irPara('series', serieAberta);
        });
      });
      var blogBtn = v.blog_post_id
        ? el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-blog.html#editar=' + encodeURIComponent(v.blog_post_id), text: 'Abrir a postagem no blog' })
        : el('a', { class: 'portal-btn portal-btn-sec', href: 'admin-blog.html#novo=' + encodeURIComponent(v.id), text: 'Criar postagem do blog' });
      cartao.appendChild(el('div', { class: 'portal-acoes' }, [salvar, blogBtn, voltar]));
      cartao.appendChild(el('p', { class: 'prod-vazio', text: v.blog_post_id ? 'Este vídeo já tem postagem no blog.' : 'Salve antes de criar a postagem: ela já vem com o título, o link do YouTube, a foto de capa, o assunto da série e o texto que vai junto.' }));
      cartao.appendChild(msg);

      /* cortes */
      var cc = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Cortes' })]);
      area.appendChild(cc);
      var lista = cortesDe(v.id);
      var inicioEsp = el('input', { type: 'date' }); inicioEsp.value = v.data_postar ? somarDias(v.data_postar, 1) : '';
      var msgC = el('p', { class: 'portal-msg' });
      cc.appendChild(el('div', { class: 'prod-acoes-topo' }, [botao('+ corte', function () {
        var ordem = lista.reduce(function (m, c) { return Math.max(m, c.ordem || 0); }, 0) + 1;
        C.from('prod_cortes').insert({ video_id: v.id, ordem: ordem, titulo: 'Corte ' + ordem }).select('*').single().then(function (r) {
          if (r.error) { P.mensagem(msgC, P.traduzErro(r.error.message), 'erro'); return; }
          cortes.push(r.data); tela();
        });
      }, false)]));
      if (!lista.length) cc.appendChild(el('p', { class: 'prod-vazio', text: 'Nenhum corte ainda. Toque em "+ corte" para cada trecho que você tirar do vídeo.' }));
      lista.forEach(function (c) {
        var t = el('input', { type: 'text', maxlength: '160', placeholder: 'Título ou ideia do corte' }); t.value = c.titulo || '';
        var d = el('input', { type: 'date' }); d.value = c.data || '';
        t.addEventListener('change', function () { gravar('prod_cortes', cortes, c, { titulo: t.value.trim() || null }); });
        d.addEventListener('change', function () { gravar('prod_cortes', cortes, c, { data: d.value || null }); });
        var tirar = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Excluir' });
        tirar.addEventListener('click', function () {
          if (!window.confirm('Excluir este corte?')) return;
          C.from('prod_cortes').delete().eq('id', c.id).then(function (r) {
            if (r.error) { P.mensagem(msgC, P.traduzErro(r.error.message), 'erro'); return; }
            cortes = cortes.filter(function (x) { return x.id !== c.id; }); tela();
          });
        });
        /* o corte não tem roteiro, mas tem o texto e as tags do YouTube Shorts; depois das tags, a data e os horários de Júpiter */
        var tx = el('textarea', { rows: '4', placeholder: 'Texto do corte (descrição, legenda)' }); tx.value = c.texto || '';
        var tg = el('input', { type: 'text', placeholder: 'tag1, tag2, tag3' }); tg.value = c.tags || '';
        var tempoC = null;
        function agendarCorte() { clearTimeout(tempoC); tempoC = setTimeout(function () { gravar('prod_cortes', cortes, c, { texto: tx.value, tags: tg.value.trim() || null }); }, 1000); }
        tx.addEventListener('input', agendarCorte); tg.addEventListener('input', agendarCorte);
        var jupC = el('div', { style: 'margin:6px 0 4px;color:#1034A6;font-size:16px;line-height:1.5' });
        jupiterAzul(jupC, c.data);
        d.addEventListener('change', function () { jupiterAzul(jupC, d.value); });
        cc.appendChild(el('div', { class: 'prod-corte' }, [
          el('div', { class: 'prod-corte-topo' }, [t, d]),
          el('div', { class: 'prod-linha', style: 'border:0;padding:0 0 10px' }, [chipsDoCorte(c), tirar]),
          campo('Texto do corte', tx),
          el('div', { class: 'portal-acoes', style: 'margin:0 0 12px' }, [botaoCopiar(function () { return tx.value; }, 'Copiar o texto')]),
          campo('Tags do YouTube Shorts', tg),
          el('div', { class: 'portal-acoes', style: 'margin:0 0 6px' }, [botaoCopiar(function () { return tg.value.trim(); }, 'Copiar as tags')]),
          jupC
        ]));
      });
      if (lista.length) {
        cc.appendChild(el('hr', { class: 'prod-divisa' }));
        cc.appendChild(campo('Espalhar os cortes de segunda a sexta, a partir de', inicioEsp));
        cc.appendChild(el('div', { class: 'portal-acoes' }, [botao('Espalhar as datas', function () {
          if (!inicioEsp.value) { P.mensagem(msgC, 'Escolha o dia em que o primeiro corte sai.', 'erro'); return; }
          var d = proximoDiaUtil(inicioEsp.value), ops = [];
          lista.slice().sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); }).forEach(function (c) {
            ops.push(gravar('prod_cortes', cortes, c, { data: d }));
            d = proximoDiaUtil(somarDias(d, 1));
          });
          Promise.all(ops).then(function () { tela(); });
        })]));
      }
      cc.appendChild(msgC);
      area.appendChild(el('div', { style: 'margin:56px 0 8px;text-align:center' }, [apagar]));
    }

    /* ---------- CALENDÁRIO ---------- */
    function telaCalendario(area) {
      var cartao = el('div', { class: 'portal-cartao' });
      area.appendChild(cartao);
      var ant = botao('Anterior', function () { mesCal.mes--; if (mesCal.mes < 0) { mesCal.mes = 11; mesCal.ano--; } tela(); });
      var prox = botao('Próximo', function () { mesCal.mes++; if (mesCal.mes > 11) { mesCal.mes = 0; mesCal.ano++; } tela(); });
      cartao.appendChild(el('div', { class: 'prod-linha', style: 'border:0' }, [ant, el('span', { class: 'prod-grupo', style: 'margin:0', text: MESES[mesCal.mes] + ' ' + mesCal.ano }), prox]));
      var grade = el('div', { class: 'prod-cal' });
      DIAS_CURTOS.forEach(function (d) { grade.appendChild(el('div', { class: 'cab prod-fixo', text: d })); });
      var primeiro = new Date(mesCal.ano, mesCal.mes, 1), nDias = new Date(mesCal.ano, mesCal.mes + 1, 0).getDate(), h = hoje();
      for (var i = 0; i < primeiro.getDay(); i++) grade.appendChild(el('div', {}));
      for (var n = 1; n <= nDias; n++) {
        (function (n) {
          var s = mesCal.ano + '-' + String(mesCal.mes + 1).padStart(2, '0') + '-' + String(n).padStart(2, '0');
          var vs = videos.filter(function (v) { return v.data_postar === s; }), cs = cortes.filter(function (c) { return c.data === s; });
          var cel = el('button', { type: 'button', class: 'dia' + (s === h ? ' hoje' : '') + (s === diaCal ? ' sel' : '') }, [el('b', { text: String(n) })]);
          vs.forEach(function (v) { cel.appendChild(el('span', { class: 'vid', text: (v.numero ? v.numero + '. ' : '') + (v.titulo || '') })); });
          if (cs.length) cel.appendChild(el('span', { class: 'cor', text: cs.length + (cs.length === 1 ? ' corte' : ' cortes') }));
          cel.addEventListener('click', function () { diaCal = s; tela(); });
          grade.appendChild(cel);
        })(n);
      }
      cartao.appendChild(grade);
      if (diaCal) {
        cartao.appendChild(el('hr', { class: 'prod-divisa' }));
        cartao.appendChild(el('p', { class: 'prod-grupo', text: comDia(diaCal) }));
        var vs = videos.filter(function (v) { return v.data_postar === diaCal; }), cs = cortes.filter(function (c) { return c.data === diaCal; });
        if (!vs.length && !cs.length) cartao.appendChild(el('p', { class: 'prod-vazio', text: 'Nada marcado neste dia.' }));
        vs.forEach(function (v) {
          cartao.appendChild(el('div', { class: 'prod-linha' }, [
            el('div', {}, [el('span', { class: 'prod-titulo', text: nomeVideo(v) }), el('span', { class: 'prod-sub', text: 'vídeo grande · ' + rotuloAcesso(v) + (v.no_ar ? ' · já está no ar' : '') })]),
            botao('Abrir', function () { irPara('series', v.serie_id || 'soltos', v.id); })
          ]));
        });
        cs.forEach(function (c) { cartao.appendChild(linhaCorte(c, false)); });
      }
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
</body>
