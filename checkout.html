<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Abrindo o carrinho...</title>
<script data-goatcounter="https://falandodeastrologia.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<!-- Os links antigos (checkout.html?servico=...) continuam funcionando: levam ao carrinho -->
<script>
  var chave = new URLSearchParams(window.location.search).get("servico");
  var destino = "carrinho.html";
  if (chave === "retificacao") destino += "?escolher=retificacao";
  else if (chave) destino += "?add=" + encodeURIComponent(chave);
  window.location.replace(destino);
</script>
<noscript><a href="carrinho.html">Abrir o carrinho</a></noscript>
</body>
</html>
