<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo cab-logo-menor"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Aplicações da Mentoria</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=80"></script>
  <script src="menu.js?v=38" defer></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    var SITUACOES = { nova: 'Nova', falei: 'Falei com ela', aprovada: 'Aprovada', recusada: 'Recusada' };
    var aba = 'novas';

    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('aplicacoes', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      P.client.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        P.client.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          var h = P.estado.ler(); /* depois de recarregar: volta pra mesma aba e pra mesma aplicação */
          if (h.aba) aba = h.aba;
          if (!h.aplicacao) { lista(); return; }
          P.client.from('aplicacoes_mentoria').select('*').eq('id', h.aplicacao).maybeSingle().then(function (ra) {
            if (ra.data) detalhe(ra.data); else lista();
          }, function () { lista(); });
        });
      });
    }

    var dataHora = function (iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR') + ' às ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''; };
    var primeiro = function (nome) { return String(nome || '').trim().split(/\s+/)[0] || ''; };
    function numeroWhats(n) { var d = String(n || '').replace(/\D/g, ''); return (d.length === 10 || d.length === 11) ? '55' + d : d; }
    function botaoOpcao(texto, marcada, aoClicar) {
      var b = el('button', { type: 'button', text: texto, 'aria-pressed': marcada ? 'true' : 'false' });
      b.style.cssText = 'background:transparent;color:#16233F;font:inherit;font-size:15px;cursor:pointer;border-radius:8px;margin:0 8px 8px 0;' +
        (marcada ? 'border:3px solid #1F5FA3;padding:8px 14px' : 'border:1px solid #1F5FA3;padding:10px 16px');
      b.addEventListener('click', aoClicar);
      return b;
    }

    var nomeAdmin = '';
    function lista(saudacao) {
      if (saudacao) nomeAdmin = saudacao;
      P.estado.gravar({ aba: aba });
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Aplicações' }), el('p', { class: 'portal-vazio', text: 'Carregando...' })]);
      app.appendChild(cartao);
      P.client.from('aplicacoes_mentoria').select('*').order('criado_em', { ascending: false }).then(function (r) {
        cartao.textContent = '';
        cartao.appendChild(el('h2', { text: 'Aplicações' }));
        if (r.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar as aplicações.' })); return; }
        var todas = r.data || [];
        var novasCompletas = todas.filter(function (a) { return a.concluida && a.situacao === 'nova'; });
        var naoConcluidas = todas.filter(function (a) { return !a.concluida && a.situacao === 'nova'; });
        var abas = el('div', { class: 'portal-abas', role: 'tablist' });
        var defs = [['novas', 'Novas (' + novasCompletas.length + ')'], ['incompletas', 'Não concluídas (' + naoConcluidas.length + ')'], ['todas', 'Todas (' + todas.length + ')']];
        var corpo = el('div');
        function pintar() {
          corpo.textContent = '';
          var itens = aba === 'novas' ? novasCompletas : aba === 'incompletas' ? naoConcluidas : todas;
          if (!itens.length) corpo.appendChild(el('p', { class: 'portal-vazio', text: aba === 'todas' ? 'Nenhuma aplicação ainda.' : 'Nada por aqui.' }));
          itens.forEach(function (a) {
            var abrir = el('button', { type: 'button', class: 'portal-btn', text: 'Abrir' });
            abrir.addEventListener('click', function () { detalhe(a); });
            var estado = (a.concluida ? 'Completa' : 'Não concluída') + ' · ' + SITUACOES[a.situacao];
            corpo.appendChild(el('div', { class: 'portal-item' }, [el('div', { class: 'portal-item-linha' }, [
              el('div', {}, [el('span', { class: 'portal-item-titulo', text: a.nome }), el('span', { class: 'portal-item-data', text: dataHora(a.criado_em) + ' · ' + estado })]), abrir
            ])]));
          });
        }
        defs.forEach(function (d) {
          var b = el('button', { type: 'button', role: 'tab', class: 'portal-aba' + (aba === d[0] ? ' ativa' : ''), text: d[1] });
          b.addEventListener('click', function () { aba = d[0]; lista(); });
          abas.appendChild(b);
        });
        cartao.appendChild(abas); cartao.appendChild(corpo); pintar();
      });
    }

    function detalhe(a) {
      P.estado.gravar({ aba: aba, aplicacao: a.id });
      limpar();
      app.appendChild(topo(nomeAdmin));
      var voltar = P.botaoVoltar(function () { lista(); });
      var texto = a.concluida
        ? 'Oi, ' + primeiro(a.nome) + '! Aqui é o Cássio. Recebi a sua aplicação para o Acompanhamento Prático de Astrologia.'
        : 'Oi, ' + primeiro(a.nome) + '! Aqui é o Cássio. Vi que você começou a aplicação para o Acompanhamento Prático de Astrologia e não terminou. Posso te ajudar com alguma dúvida?';
      var whats = el('a', { class: 'portal-btn portal-btn-whats', href: 'https://wa.me/' + numeroWhats(a.whatsapp) + '?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener', text: 'Chamar no WhatsApp' });
      app.appendChild(el('div', { class: 'portal-topo' }, [voltar, whats]));
      P.voltarNoFim(app, function () { lista(); });

      var dados = el('div', { class: 'portal-cartao' }, [el('h2', { text: a.nome }),
        el('p', { class: 'portal-item-data', text: dataHora(a.criado_em) + ' · ' + (a.concluida ? 'Aplicação completa' : 'Não concluída (parou no meio)') })]);
      function campo(rotulo, valor) {
        dados.appendChild(el('p', { class: 'portal-item-titulo', style: 'margin-top:14px', text: rotulo }));
        dados.appendChild(el('p', { class: 'portal-descricao', text: valor || 'Ainda não respondeu.' }));
      }
      campo('WhatsApp', a.whatsapp); campo('Gmail', a.email);
      campo('Nível de conhecimento em Astrologia hoje', a.nivel);
      campo('Topa estudar só com os planetas do céu e signos inteiros?', a.metodo);
      campo('Objetivos com a mentoria', (a.objetivos || []).join('\n') + (a.objetivo_outros ? '\nOutros: ' + a.objetivo_outros : ''));
      campo('Por que escolheu a mentoria com você', a.motivo);
      app.appendChild(dados);

      var sit = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Situação' })]);
      var msg = el('p', { class: 'portal-msg' });
      var area = el('div');
      function pintarSit() {
        area.textContent = '';
        Object.keys(SITUACOES).forEach(function (k) {
          area.appendChild(botaoOpcao(SITUACOES[k], a.situacao === k, function () {
            P.mensagem(msg, 'Salvando...');
            P.client.from('aplicacoes_mentoria').update({ situacao: k, atualizado_em: new Date().toISOString() }).eq('id', a.id).then(function (r) {
              if (r.error) { P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
              a.situacao = k; pintarSit(); P.mensagem(msg, 'Salvo.', 'ok');
            });
          }));
        });
      }
      pintarSit(); sit.appendChild(area); sit.appendChild(msg);
      app.appendChild(sit);

      var apagar = P.botaoApagar('Apagar esta aplicação');
      apagar.addEventListener('click', function () {
        if (!confirm('Apagar a aplicação de ' + a.nome + '?')) return;
        P.client.from('aplicacoes_mentoria').delete().eq('id', a.id).then(function (r) {
          if (r.error) { alert(P.traduzErro(r.error.message)); return; }
          lista();
        });
      });
      P.apagarNoFim(app, apagar); /* discreto, no fim da tela */
    }

    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
