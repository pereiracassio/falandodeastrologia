<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="index.html" class="cab-logo cab-logo-menor"><img src="img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="blog.html">Blog</a><a href="aluno.html">Alunos</a><a href="sobre.html">Cássio</a><a href="index.html#servicos">Serviços</a></nav>

</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=123"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="leitor.js?v=8"></script>
  <script src="mensalidade.js?v=1"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    function limpar() { app.textContent = ''; }
    function sair() { if (window.fdaEspaco) window.fdaEspaco.limpar(); P.client.auth.signOut().then(mostrarLogin); }

    /* O que o Astro Hellenic mostra depois do pagamento, embutido aqui. A volta do pagamento traz os dados na URL (u, servico, sa, agenda, nome, whatsapp, email, pedido);
       a página de dentro avisa a altura dela por postMessage. Sem esses dados na URL, o cartão nem aparece.
       Quem JÁ TEM CADASTRO no site vai direto pra AGENDA; quem não tem passa pelo formulário, que depois leva à agenda.
       Sinastria e retificação sempre passam pelo formulário (precisam de dados novos). */
    var FORM_BASE = 'https://astrohellenic.com/formulario.html';
    var AGENDA_BASE = 'https://astrohellenic.com/agendar.html';
    function cartaoFormulario() {
      var q = new URLSearchParams(location.search), f = new URLSearchParams();
      if (!q.get('u') || !q.get('servico')) return null;
      /* quem chega aqui já pagou: o carrinho se esvazia (senão a bolinha do carrinho continua mostrando o serviço comprado) */
      try { localStorage.removeItem('fda_carrinho'); localStorage.removeItem('fda_carrinho_saida'); } catch (e) { /* sem armazenamento */ }
      ['u', 'servico', 'sa', 'agenda', 'nome', 'whatsapp', 'email'].forEach(function (k) { if (q.get(k)) f.set(k, q.get(k)); });
      var caixa = el('div', { class: 'portal-form-caixa' });
      function abrir(endereco) {
        var quadro = el('iframe', { class: 'portal-form', src: endereco, title: 'Seus dados para o atendimento', scrolling: 'no' });
        window.addEventListener('message', function (ev) {
          if (ev.source !== quadro.contentWindow || !ev.data || ev.data.tipo !== 'astrohellenic-altura') return;
          var h = Number(ev.data.altura);
          if (h > 100 && h < 8000) quadro.style.height = h + 'px';
        });
        caixa.textContent = '';
        caixa.appendChild(quadro);
      }
      var formulario = FORM_BASE + '?' + f.toString();
      var pedido = q.get('pedido') || '';
      var podeIrDireto = q.get('agenda') !== '0' && !/sinastria|retifica/i.test(q.get('servico')) && /^fda-\d+$/.test(pedido);
      if (!podeIrDireto) { abrir(formulario); return caixa; }
      /* resposta imediata; se demorar mais de 3 s ou falhar, abre o formulário (o cliente nunca fica esperando) */
      var controle = new AbortController();
      var limite = setTimeout(function () { controle.abort(); }, 3000);
      fetch('https://falandodeastrologia.vercel.app/api/cliente-agenda?pedido=' + encodeURIComponent(pedido), { signal: controle.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (d) {
          clearTimeout(limite);
          if (d && d.agenda) {
            var a = new URLSearchParams({ u: q.get('u'), c: d.agenda, s: q.get('servico').slice(0, 400) });
            if (q.get('sa')) a.set('sa', q.get('sa').slice(0, 400));
            abrir(AGENDA_BASE + '?' + a.toString());
          } else abrir(formulario);
        });
      return caixa;
    }

    function mostrarLogin() {
      if (window.fdaEspaco) window.fdaEspaco.limpar();
      limpar();
      var form = cartaoFormulario(); if (form) app.appendChild(form);
      var entrar = el('button', { type: 'button', class: 'portal-btn', text: 'Entrar com o Google' });
      entrar.addEventListener('click', function () { P.entrarComGoogle('/cliente.html'); });
      app.appendChild(el('div', { class: 'portal-cartao' }, [
        el('p', { text: 'Aqui ficam os resultados dos serviços que você contratou. Entre com a mesma conta Google (Gmail) que você usou na contratação.' }),
        entrar
      ]));
    }

    /* guarda cada toque em "Baixar" (só o administrador enxerga); no modo "ver como o cliente" nada é guardado */
    function registrarBaixa(entregaId, tipo, verId) {
      if (verId) return;
      /* o aviso para o Cássio é gravado pelo próprio banco quando a baixa é registrada (docs/avisos-cliente-e-compras.sql) */
      try { P.client.from('entrega_baixas').insert({ entrega_id: entregaId, tipo: tipo }).then(function () {}, function () {}); } catch (e) { /* o link abre do mesmo jeito */ }
    }

    function itemEntrega(e, verId) {
      var titulo = el('div', {}, [el('span', { class: 'portal-item-titulo', text: e.servico })]);
      if (e.data) titulo.appendChild(el('span', { class: 'portal-item-data', text: P.dataBR(e.data) }));
      var botoes = el('div', { class: 'portal-acoes' });
      var pdf = P.linkSeguro(e.pdf_link), gravacao = P.linkSeguro(e.gravacao_link);
      var idPdf = pdf ? P.idArquivoDrive(pdf) : null;
      function abrirPdf(ev) {
        registrarBaixa(e.id, 'pdf', verId);
        if (!idPdf || !window.Leitor || !window.pdfjsLib) return;
        if (ev) ev.preventDefault();
        Leitor.abrirDoServidor({ nome: e.servico, id: idPdf, baixar: pdf, voltar: function () {} });
      }
      if (pdf) {
        /* o PDF abre no leitor do site (a linha toda, se não há gravação); o "Baixar" discreto leva ao Drive */
        var aPdf = el('a', { class: idPdf && !gravacao ? 'portal-baixar' : 'portal-btn', href: pdf, target: '_blank', rel: 'noopener', text: idPdf ? (gravacao ? 'Abrir o PDF' : 'Baixar') : 'Baixar o PDF' });
        if (idPdf && !gravacao) aPdf.addEventListener('click', function (ev) { ev.stopPropagation(); });
        else aPdf.addEventListener('click', abrirPdf);
        botoes.appendChild(aPdf);
        if (idPdf && gravacao) botoes.appendChild(el('a', { class: 'portal-baixar', href: pdf, target: '_blank', rel: 'noopener', text: 'Baixar' }));
      }
      if (gravacao) {
        var aGrav = el('a', { class: 'portal-btn', href: gravacao, target: '_blank', rel: 'noopener', text: 'Baixar a gravação' });
        aGrav.addEventListener('click', function () { registrarBaixa(e.id, 'gravacao', verId); });
        botoes.appendChild(aGrav);
      }
      var caixa = el('div', { class: 'portal-item', 'data-entrega': e.id });
      if (gravacao || pdf) {
        /* o arquivo abre no Drive do cliente; o download é pelo menu do próprio Drive (o link de download direto dava erro do Google em arquivo grande) */
        caixa.appendChild(titulo);
        if (gravacao) caixa.appendChild(el('p', { style: 'margin:8px 0', text: 'Ao tocar em baixar, o arquivo vai abrir no seu Drive. Você deve tocar nos três pontos e ir na opção de baixar o arquivo.' }));
        caixa.appendChild(botoes);
      } else {
        caixa.appendChild(el('div', { class: 'portal-item-linha' }, [titulo, botoes]));
      }
      if (idPdf && !gravacao) {
        caixa.className += ' portal-item-clicavel';
        caixa.setAttribute('role', 'button'); caixa.setAttribute('tabindex', '0');
        caixa.addEventListener('click', function () { abrirPdf(); });
        caixa.addEventListener('keydown', function (ev) { if (ev.target === caixa && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); abrirPdf(); } });
      }
      return caixa;
    }

    /* aviso fixo no topo, só no navegador: como instalar o app (dentro do app não aparece, porque já está instalado) */
    function avisoDoApp() {
      var dentro = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (dentro) return document.createDocumentFragment();
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(navigator.userAgent);
      var instalar = ios ? 'No Safari, toque no botão Compartilhar (o quadradinho com a setinha para cima) e depois em Adicionar à Tela de Início.'
        : android ? 'No Chrome, toque nos três pontinhos do canto e depois em Instalar app (ou Adicionar à tela inicial).'
        : 'No celular ou no iPad, abra esta página pelo navegador, toque em Compartilhar ou no menu e escolha Adicionar à Tela de Início (ou Instalar app).';
      return el('div', { class: 'portal-cartao' }, [
        el('h2', { text: 'Instale o app' }),
        el('p', { text: 'Existe um app para você acompanhar tudo por aqui. Ele não pesa nada: é levíssimo e quase não ocupa memória no seu aparelho. Pelo app você entra direto na videoconferência da sua sessão, sem precisar procurar o link.' }),
        el('ol', { style: 'text-align:left;margin:8px 0 0;padding-left:22px' }, [
          el('li', { text: instalar }),
          el('li', { text: 'Abra o app pela tela inicial e entre com o seu Gmail.' })
        ])
      ]);
    }

    /* o carrinho do canto vira o sino dos avisos; tocar nele abre e fecha o cartão Avisos, logo abaixo do "Olá" */
    /* aviso tocado ou aberto pelo celular (&e=ID): mostra onde está o serviço na lista, sem abrir; se a lista ainda está chegando, espera */
    var paraDestacar = (/[?&]e=([0-9a-f-]{36})/i.exec(location.search) || [])[1] || null;
    function destacarEntrega(id) {
      var alvo = id && document.querySelector('[data-entrega="' + id + '"]');
      if (alvo) { paraDestacar = null; P.destacar(alvo); } else paraDestacar = id;
    }
    var naoLidos = 0, abrirAvisos = function () {}, abrirAvisosNaEntrada = /[?&]aviso=1/.test(location.search) && !paraDestacar;
    function pintarSino() {
      P.numeroNoIcone(naoLidos);
      var cfg = { n: naoLidos, aoTocar: function () { abrirAvisos(); } };
      if (window.fdaSinoAvisos) window.fdaSinoAvisos(cfg); else document.addEventListener('DOMContentLoaded', function () { if (window.fdaSinoAvisos) window.fdaSinoAvisos(cfg); });
    }
    /* tela própria dos avisos (aberta pelo sino): avisos recebidos e o botão de ativar no celular */
    function telaDeAvisos(user, verId) {
      limpar();
      var voltar = function () { mostrarPortal(user, verId); };
      app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(voltar)]));
      if (!verId) app.appendChild(el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Avisos' }),
        P.avisos.lista(function (a) { voltar(); var m = /[?&]e=([0-9a-f-]{36})/i.exec(a.url || ''); if (m) destacarEntrega(m[1]); }, function () { naoLidos = Math.max(0, naoLidos - 1); pintarSino(); }, 30)]));
      app.appendChild(P.avisos.cartao('cliente'));
      P.voltarNoFim(app, voltar);
      window.scrollTo(0, 0);
    }
    function ligarAvisos(user, verId) {
      abrirAvisos = function () { telaDeAvisos(user, verId); };
      if (paraDestacar && !verId) P.client.from('avisos_recebidos').update({ lido: true }).eq('url', '/cliente.html?aviso=1&e=' + paraDestacar).eq('lido', false).then(function () {}, function () {});
      pintarSino();
      var contarNaoLidos = function () { P.client.from('avisos_recebidos').select('id', { count: 'exact', head: true }).eq('lido', false).then(function (r) {
        if (r && !r.error && typeof r.count === 'number' && r.count !== naoLidos) { naoLidos = r.count; pintarSino(); }
      }, function () {}); };
      if (!verId) {
        contarNaoLidos();
        if (!window.__contagemAvisos) { window.__contagemAvisos = true; setInterval(function () { if (document.visibilityState === 'visible') contarNaoLidos(); }, 60000); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') contarNaoLidos(); }); }
      }
      if (abrirAvisosNaEntrada) { abrirAvisosNaEntrada = false; setTimeout(abrirAvisos, 0); }
    }

    /* próximo atendimento (horário e Google Meet), buscado na agenda pelo servidor; sem atendimento marcado, o cartão nem aparece */
    function carregarAtendimento(verId) {
      app.appendChild(P.cartaoAtendimento(verId || null, false));
    }

    /* o que é só do aluno e fica aqui (e não na página dele): Mensalidade e Trocar senha */
    function blocosDoAluno(user, aluno) {
      app.appendChild(el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Mensalidade' }), window.mensalidade.tela(aluno, false)]));
      var trocar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Trocar senha' });
      trocar.addEventListener('click', function () { trocarSenha(user); });
      app.appendChild(el('div', { class: 'portal-cartao' }, [el('div', { class: 'portal-acoes' }, [trocar])]));
    }
    function trocarSenha(user) {
      limpar();
      var voltar = function () { mostrarPortal(user); };
      app.appendChild(el('div', { class: 'portal-acoes', style: 'margin:0 0 10px' }, [P.botaoVoltar(voltar)]));
      P.montarNovaSenha(app, voltar, 'Trocar senha');
      P.voltarNoFim(app, voltar);
    }

    /* verId = o administrador vendo como o cliente vê (cliente.html?ver=ID); nada é salvo nem enviado */
    function mostrarPortal(user, verId) {
      limpar();
      var form = cartaoFormulario(); if (form) app.appendChild(form);
      var email = String(user.email || '').toLowerCase();
      var sairBtn = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' });
      sairBtn.addEventListener('click', sair);
      var busca = verId ? P.client.from('clientes').select('id,nome,email').eq('id', verId).maybeSingle()
                        : P.client.from('clientes').select('id,nome').eq('email', email).maybeSingle();
      /* aluno também usa o Seu espaço: ficha de aluno (se houver) traz a Mensalidade, Trocar senha e o resto do que é administrativo */
      var alunoBusca = verId ? Promise.resolve(null) : P.client.from('alunos').select('id,nome').eq('email', email).maybeSingle().then(function (ra) { return ra && !ra.error ? ra.data : null; }, function () { return null; });
      Promise.all([busca, alunoBusca]).then(function (par) {
        var r = par[0], aluno = par[1];
        var nome = r.data ? r.data.nome : (aluno ? aluno.nome : (P.nomeDoGoogle(user) || email));
        if (verId) {
          var paraOPainel = function () { location.href = 'admin-clientes.html?cliente=' + encodeURIComponent(verId); };
          app.appendChild(el('div', { class: 'portal-topo' }, [el('span', { text: 'Você está vendo como ' + nome + ' vê (modo administrador)' }), el('div', {}, [P.botaoVoltar(paraOPainel)])]));
          P.voltarNoFim(app, paraOPainel);
        } else {
          app.appendChild(el('div', { class: 'portal-topo' }, [el('span', { text: 'Olá, ' + nome + '!' }), sairBtn]));
        }
        app.appendChild(avisoDoApp());
        if (r.error) { app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar agora. Tente de novo em instantes.' })); return; }
        if (!r.data) {
          /* aluno sem serviço de cliente: vê só o que é dele; quem não é aluno nem cliente vê o aviso de "nada disponível" */
          if (aluno) { blocosDoAluno(user, aluno); return; }
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Ainda não há nada disponível para o e-mail ' + email + '. Assim que o seu resultado for entregue, ele aparece aqui. Se você usou outro Gmail na contratação, saia e entre com ele.' })]));
          return;
        }
        if (aluno) blocosDoAluno(user, aluno);
        if (!verId && window.fdaEspaco) window.fdaEspaco.marcar('cliente', true);   /* o botão Cássio da barra de cima vira Seu espaço nas outras páginas (quem já é aluno continua indo para a página de aluno) */
        ligarAvisos(user, verId);
        carregarAtendimento(verId);
        app.appendChild(el('div', { class: 'portal-cartao' }, [
          el('h2', { text: 'Importante' }),
          el('p', { text: 'Baixe e guarde os seus arquivos. Eles podem ser removidos daqui a qualquer momento, para liberar espaço.' }),
        ]));
        P.client.from('entregas').select('id,servico,data,pdf_link,gravacao_link,criado_em').eq('cliente_id', r.data.id)
          .order('data', { ascending: false, nullsFirst: false }).order('criado_em', { ascending: false }).then(function (re) {
            var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Seus serviços' })]);
            app.appendChild(cartao);
            if (re.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os seus serviços agora.' })); return; }
            if (!re.data.length) cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum serviço entregue ainda.' }));
            re.data.forEach(function (e) { cartao.appendChild(itemEntrega(e, verId)); });
            if (paraDestacar) destacarEntrega(paraDestacar);
            /* depois do atendimento (já há material entregue): convite para avaliar no Google */
            if (re.data.length) {
              app.appendChild(el('div', { class: 'portal-cartao' }, [
                el('h2', { text: 'Sua opinião' }),
                el('p', { text: 'Se o atendimento fez bem para você, conte como foi. A sua avaliação no Google ajuda outras pessoas a me encontrarem.' }),
                el('a', { class: 'portal-btn portal-btn-sec', href: 'https://g.page/r/CcWP1ZarYgigEBM/review', target: '_blank', rel: 'noopener', text: 'Deixar minha avaliação no Google' })
              ]));
            }
            var whats = el('a', { href: 'https://wa.me/5511970404508?text=Oi%20C%C3%A1ssio!%20Estou%20na%20%C3%A1rea%20do%20cliente%20e%20queria%20tirar%20uma%20d%C3%BAvida.', target: '_blank', rel: 'noopener', title: 'WhatsApp', 'aria-label': 'Falar pelo WhatsApp' }, [
              el('img', { src: 'img/rede-whatsapp.svg', alt: 'WhatsApp', width: '44', height: '44' })
            ]);
            app.appendChild(el('div', { class: 'portal-whats' }, [whats]));
          });
      });
    }

    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      var ver = new URLSearchParams(location.search).get('ver');
      if (!sessao) { mostrarLogin(); return; }
      if (!ver) { mostrarPortal(sessao.user); return; }
      // só o administrador vê como outro cliente; qualquer outra pessoa cai na própria página
      limpar();
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      P.client.rpc('sou_admin').then(function (ra) { mostrarPortal(sessao.user, ra.data === true ? ver : null); });
    });
  })();
  </script>
  <script src="menu.js?v=50" defer></script>
