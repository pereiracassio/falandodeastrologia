<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="index.html" class="cab-logo"><img src="img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="blog.html">Blog</a><a href="aluno.html">Alunos</a><a href="sobre.html">Cássio</a><a href="index.html#servicos">Serviços</a></nav>

    <h1 class="portal-titulo">Seu espaço</h1>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=53"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, app = document.getElementById('app');
    function limpar() { app.textContent = ''; }
    function sair() { P.client.auth.signOut().then(mostrarLogin); }

    /* O que o Astro Hellenic mostra depois do pagamento, embutido aqui. A volta do pagamento traz os dados na URL (u, servico, sa, agenda, nome, whatsapp, email, pedido);
       a página de dentro avisa a altura dela por postMessage. Sem esses dados na URL, o cartão nem aparece.
       Quem JÁ TEM CADASTRO no site vai direto pra AGENDA; quem não tem passa pelo formulário, que depois leva à agenda.
       Sinastria e retificação sempre passam pelo formulário (precisam de dados novos). */
    var FORM_BASE = 'https://astrohellenic.com/formulario.html';
    var AGENDA_BASE = 'https://astrohellenic.com/agendar.html';
    function cartaoFormulario() {
      var q = new URLSearchParams(location.search), f = new URLSearchParams();
      if (!q.get('u') || !q.get('servico')) return null;
      /* quem chega aqui já pagou: o carrinho se esvazia (senão a bolinha do carrinho continua mostrando o serviço comprado) */
      try { localStorage.removeItem('fda_carrinho'); localStorage.removeItem('fda_carrinho_saida'); } catch (e) { /* sem armazenamento */ }
      ['u', 'servico', 'sa', 'agenda', 'nome', 'whatsapp', 'email'].forEach(function (k) { if (q.get(k)) f.set(k, q.get(k)); });
      var caixa = el('div', { class: 'portal-form-caixa' });
      function abrir(endereco) {
        var quadro = el('iframe', { class: 'portal-form', src: endereco, title: 'Seus dados para o atendimento', scrolling: 'no' });
        window.addEventListener('message', function (ev) {
          if (ev.source !== quadro.contentWindow || !ev.data || ev.data.tipo !== 'astrohellenic-altura') return;
          var h = Number(ev.data.altura);
          if (h > 100 && h < 8000) quadro.style.height = h + 'px';
        });
        caixa.textContent = '';
        caixa.appendChild(quadro);
      }
      var formulario = FORM_BASE + '?' + f.toString();
      var pedido = q.get('pedido') || '';
      var podeIrDireto = q.get('agenda') !== '0' && !/sinastria|retifica/i.test(q.get('servico')) && /^fda-\d+$/.test(pedido);
      if (!podeIrDireto) { abrir(formulario); return caixa; }
      /* resposta imediata; se demorar mais de 3 s ou falhar, abre o formulário (o cliente nunca fica esperando) */
      var controle = new AbortController();
      var limite = setTimeout(function () { controle.abort(); }, 3000);
      fetch('https://falandodeastrologia.vercel.app/api/cliente-agenda?pedido=' + encodeURIComponent(pedido), { signal: controle.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (d) {
          clearTimeout(limite);
          if (d && d.agenda) {
            var a = new URLSearchParams({ u: q.get('u'), c: d.agenda, s: q.get('servico').slice(0, 400) });
            if (q.get('sa')) a.set('sa', q.get('sa').slice(0, 400));
            abrir(AGENDA_BASE + '?' + a.toString());
          } else abrir(formulario);
        });
      return caixa;
    }

    function mostrarLogin() {
      limpar();
      var form = cartaoFormulario(); if (form) app.appendChild(form);
      var entrar = el('button', { type: 'button', class: 'portal-btn', text: 'Entrar com o Google' });
      entrar.addEventListener('click', function () { P.entrarComGoogle('/cliente.html'); });
      app.appendChild(el('div', { class: 'portal-cartao' }, [
        el('p', { text: 'Aqui ficam os resultados dos serviços que você contratou. Entre com a mesma conta Google (Gmail) que você usou na contratação.' }),
        entrar
      ]));
    }

    /* guarda cada toque em "Baixar" (só o administrador enxerga); no modo "ver como o cliente" nada é guardado */
    function registrarBaixa(entregaId, tipo, verId) {
      if (verId) return;
      try { P.client.from('entrega_baixas').insert({ entrega_id: entregaId, tipo: tipo }).then(function () {}, function () {}); } catch (e) { /* o link abre do mesmo jeito */ }
    }

    function itemEntrega(e, verId) {
      var titulo = el('div', {}, [el('span', { class: 'portal-item-titulo', text: e.servico })]);
      if (e.data) titulo.appendChild(el('span', { class: 'portal-item-data', text: P.dataBR(e.data) }));
      var botoes = el('div', { class: 'portal-acoes' });
      var pdf = P.linkSeguro(e.pdf_link), gravacao = P.linkSeguro(e.gravacao_link);
      if (pdf) {
        var aPdf = el('a', { class: 'portal-btn', href: pdf, target: '_blank', rel: 'noopener', text: 'Baixar o PDF' });
        aPdf.addEventListener('click', function () { registrarBaixa(e.id, 'pdf', verId); });
        botoes.appendChild(aPdf);
      }
      if (gravacao) {
        var aGrav = el('a', { class: 'portal-btn', href: gravacao, target: '_blank', rel: 'noopener', text: 'Baixar a gravação' });
        aGrav.addEventListener('click', function () { registrarBaixa(e.id, 'gravacao', verId); });
        botoes.appendChild(aGrav);
      }
      var caixa = el('div', { class: 'portal-item' });
      if (gravacao || pdf) {
        /* o arquivo abre no Drive do cliente; o download é pelo menu do próprio Drive (o link de download direto dava erro do Google em arquivo grande) */
        caixa.appendChild(titulo);
        caixa.appendChild(el('p', { style: 'margin:8px 0', text: 'Ao tocar em baixar, o arquivo vai abrir no seu Drive. Você deve tocar nos três pontos e ir na opção de baixar o arquivo.' }));
        caixa.appendChild(botoes);
      } else {
        caixa.appendChild(el('div', { class: 'portal-item-linha' }, [titulo, botoes]));
      }
      return caixa;
    }

    /* próximo atendimento (horário e Google Meet), buscado na agenda pelo servidor; sem atendimento marcado, o cartão nem aparece */
    function carregarAtendimento(verId) {
      app.appendChild(P.cartaoAtendimento(verId || null, false));
    }

    /* verId = o administrador vendo como o cliente vê (cliente.html?ver=ID); nada é salvo nem enviado */
    function mostrarPortal(user, verId) {
      limpar();
      var form = cartaoFormulario(); if (form) app.appendChild(form);
      var email = String(user.email || '').toLowerCase();
      var sairBtn = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Sair' });
      sairBtn.addEventListener('click', sair);
      var busca = verId ? P.client.from('clientes').select('id,nome,email').eq('id', verId).maybeSingle()
                        : P.client.from('clientes').select('id,nome').eq('email', email).maybeSingle();
      busca.then(function (r) {
        var nome = r.data ? r.data.nome : (P.nomeDoGoogle(user) || email);
        if (verId) {
          var paraOPainel = function () { location.href = 'admin-clientes.html'; };
          app.appendChild(el('div', { class: 'portal-topo' }, [el('span', { text: 'Você está vendo como ' + nome + ' vê (modo administrador)' }), el('div', {}, [P.botaoVoltar(paraOPainel)])]));
          P.voltarNoFim(app, paraOPainel);
        } else {
          app.appendChild(el('div', { class: 'portal-topo' }, [el('span', { text: 'Olá, ' + nome + '!' }), sairBtn]));
        }
        if (r.error) { app.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar agora. Tente de novo em instantes.' })); return; }
        if (!r.data) {
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Ainda não há nada disponível para o e-mail ' + email + '. Assim que o seu resultado for entregue, ele aparece aqui. Se você usou outro Gmail na contratação, saia e entre com ele.' })]));
          return;
        }
        carregarAtendimento(verId);
        app.appendChild(el('div', { class: 'portal-cartao' }, [
          el('h2', { text: 'Importante' }),
          el('p', { text: 'Baixe e guarde os seus arquivos. Eles podem ser removidos daqui a qualquer momento, para liberar espaço.' }),
        ]));
        P.client.from('entregas').select('id,servico,data,pdf_link,gravacao_link,criado_em').eq('cliente_id', r.data.id)
          .order('data', { ascending: false, nullsFirst: false }).order('criado_em', { ascending: false }).then(function (re) {
            var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Seus serviços' })]);
            app.appendChild(cartao);
            if (re.error) { cartao.appendChild(el('p', { class: 'portal-msg erro', text: 'Não foi possível carregar os seus serviços agora.' })); return; }
            if (!re.data.length) cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhum serviço entregue ainda.' }));
            re.data.forEach(function (e) { cartao.appendChild(itemEntrega(e, verId)); });
            /* depois do atendimento (já há material entregue): convite para avaliar no Google */
            if (re.data.length) {
              app.appendChild(el('div', { class: 'portal-cartao' }, [
                el('h2', { text: 'Sua opinião' }),
                el('p', { text: 'Se o atendimento fez bem para você, conte como foi. A sua avaliação no Google ajuda outras pessoas a me encontrarem.' }),
                el('a', { class: 'portal-btn portal-btn-sec', href: 'https://g.page/r/CcWP1ZarYgigEBM/review', target: '_blank', rel: 'noopener', text: 'Deixar minha avaliação no Google' })
              ]));
            }
            var whats = el('a', { href: 'https://wa.me/5511970404508?text=Oi%20C%C3%A1ssio!%20Estou%20na%20%C3%A1rea%20do%20cliente%20e%20queria%20tirar%20uma%20d%C3%BAvida.', target: '_blank', rel: 'noopener', title: 'WhatsApp', 'aria-label': 'Falar pelo WhatsApp' }, [
              el('img', { src: 'img/rede-whatsapp.svg', alt: 'WhatsApp', width: '44', height: '44' })
            ]);
            app.appendChild(el('div', { class: 'portal-whats' }, [whats]));
          });
      });
    }

    P.client.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      var ver = new URLSearchParams(location.search).get('ver');
      if (!sessao) { mostrarLogin(); return; }
      if (!ver) { mostrarPortal(sessao.user); return; }
      // só o administrador vê como outro cliente; qualquer outra pessoa cai na própria página
      limpar();
      app.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
      P.client.rpc('sou_admin').then(function (ra) { mostrarPortal(sessao.user, ra.data === true ? ver : null); });
    });
  })();
  </script>
  <script src="menu.js?v=28" defer></script>
