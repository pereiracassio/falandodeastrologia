<body>
<div class="pagina pagina-servico pagina-papiro"><div class="folha-pagina">
  <div class="cab-papiro">
    <a href="/index.html" class="cab-logo"><img src="/img/logo-menu.svg?v=3" alt="Falando de Astrologia Helenística" width="752" height="238"></a>
    <nav class="cab-nav"><a href="/blog.html">Blog</a><a href="/aluno.html">Alunos</a><a href="/sobre.html">Cássio</a><a href="/index.html#servicos">Serviços</a></nav>
    <hr class="cab-linha">
  </div>
  <div class="portal"><div class="portal-caixa">
    <h1 class="portal-titulo">Blog</h1>
    <p class="portal-sub">Acesso restrito ao administrador</p>
    <div id="app"></div>
  </div></div>
</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal.js?v=42"></script>
  <script>
  (function () {
    var P = window.portal, el = P.el, C = P.client, app = document.getElementById('app');
    var nomeAdmin = '';
    var LARGURA = 1600; /* largura máxima da imagem da postagem: nítida em tela grande e ainda leve */

    function limpar() { app.textContent = ''; }
    function sair() { C.auth.signOut().then(mostrarLogin); }
    function topo(texto) { return P.navAdmin('blog', texto, sair); }
    function mostrarLogin() { limpar(); P.montarLogin(app, iniciar); }
    function iniciar(user) {
      limpar();
      C.rpc('sou_admin').then(function (r) {
        if (r.error || r.data !== true) {
          app.appendChild(topo(user.email));
          app.appendChild(el('div', { class: 'portal-cartao' }, [el('p', { text: 'Este e-mail não tem acesso ao painel.' })]));
          return;
        }
        C.from('admins').select('nome').maybeSingle().then(function (rn) {
          nomeAdmin = rn.data && rn.data.nome ? 'Olá, ' + rn.data.nome + '!' : user.email;
          lista();
        });
      });
    }

    /* endereço (slug) a partir do título: sem acento, minúsculo, hífens */
    function slugDe(titulo) {
      var s = String(titulo || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80).replace(/-+$/, '');
      return s || 'texto';
    }
    var caminhoDe = function (url) { var i = String(url || '').indexOf('/object/public/site/'); return i >= 0 ? decodeURIComponent(String(url).slice(i + '/object/public/site/'.length).split('?')[0]) : null; };

    /* reduz a imagem (mantém a proporção) e salva em JPEG */
    function prepararImagem(arquivo) {
      return new Promise(function (ok, erro) {
        var url = URL.createObjectURL(arquivo), img = new Image();
        img.onload = function () {
          var f = Math.min(1, LARGURA / img.naturalWidth), w = Math.round(img.naturalWidth * f), h = Math.round(img.naturalHeight * f);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          c.toBlob(function (blob) { blob ? ok(blob) : erro(new Error('imagem')); }, 'image/jpeg', 0.85);
        };
        img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('imagem')); };
        img.src = url;
      });
    }

    /* pede ao servidor para gerar a página própria de cada postagem (para o Google) e o sitemap; o texto já está no ar sem isso */
    var GERAR_URL = 'https://falandodeastrologia.vercel.app/api/blog-publicar';
    function gerarPaginas() {
      return C.auth.getSession().then(function (r) {
        var jwt = r.data && r.data.session && r.data.session.access_token;
        return fetch(GERAR_URL, { method: 'POST', headers: { Authorization: 'Bearer ' + jwt } });
      }).then(function (resp) { return resp.ok; }).catch(function () { return false; });
    }
    /* salvar NÃO republica o site: cada republicação tira o site do ar por alguns segundos e o GitHub limita quantas aceita por hora.
       O texto já aparece no blog na hora; a página própria (para o Google) é gerada quando você toca em "Atualizar as páginas do blog". */
    function listaAposGravar() {
      lista('Salvo. O texto já está no blog. Quando terminar de mexer, toque UMA vez em "Atualizar as páginas do blog" para o Google ver.');
    }

    function lista(aviso) {
      limpar();
      app.appendChild(topo(nomeAdmin));
      if (aviso) { var av = el('p', { class: 'portal-msg portal-aviso-blog' }); app.appendChild(av); P.mensagem(av, aviso, 'ok'); }
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: 'Postagens' })]);
      var nova = el('button', { type: 'button', class: 'portal-btn', text: 'Nova postagem' });
      nova.addEventListener('click', function () { editor(null); });
      var atualizar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Atualizar as páginas do blog' });
      var avisoAtualizar = el('p', { class: 'portal-msg' });
      atualizar.addEventListener('click', function () {
        atualizar.disabled = true; P.mensagem(avisoAtualizar, 'Atualizando...');
        gerarPaginas().then(function (ok) { atualizar.disabled = false; P.mensagem(avisoAtualizar, ok ? 'Pronto! As páginas foram atualizadas.' : 'Não consegui atualizar agora. Tente de novo em instantes.', ok ? 'ok' : 'erro'); });
      });
      cartao.appendChild(el('div', { class: 'portal-acoes' }, [nova, atualizar]));
      cartao.appendChild(avisoAtualizar);
      var area = el('div', { style: 'margin-top:14px' }, [el('p', { class: 'portal-vazio', text: 'Carregando...' })]);
      cartao.appendChild(area); app.appendChild(cartao);
      C.from('blog_posts').select('id,titulo,slug,publicado,publicado_em,criado_em').order('criado_em', { ascending: false }).then(function (r) {
        area.textContent = '';
        if (r.error) { area.appendChild(el('p', { class: 'portal-msg erro', text: P.traduzErro(r.error.message) })); return; }
        if (!r.data.length) { area.appendChild(el('p', { class: 'portal-vazio', text: 'Nenhuma postagem ainda.' })); return; }
        r.data.forEach(function (p) {
          var editar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Editar' });
          editar.addEventListener('click', function () { editor(p.id); });
          var linha = el('div', { class: 'portal-item' }, [
            el('div', {}, [
              el('strong', { text: p.titulo }),
              el('div', { class: 'portal-item-data', text: p.publicado ? 'Publicada em ' + P.dataBR(String(p.publicado_em).slice(0, 10)) : 'Rascunho' })
            ]), editar]);
          linha.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(31,95,163,.7)';
          area.appendChild(linha);
        });
      });
    }

    /* id nulo = postagem nova */
    function editor(id) {
      limpar();
      app.appendChild(topo(nomeAdmin));
      var cartao = el('div', { class: 'portal-cartao' }, [el('h2', { text: id ? 'Editar postagem' : 'Nova postagem' })]);
      app.appendChild(cartao);
      var post = { titulo: '', resumo: '', corpo: '', imagem_url: '', publicado: false, slug: null, publicado_em: null };
      if (!id) montar(); else {
        cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Carregando...' }));
        C.from('blog_posts').select('*').eq('id', id).maybeSingle().then(function (r) {
          if (r.error || !r.data) { lista(); return; }
          post = r.data; cartao.textContent = ''; cartao.appendChild(el('h2', { text: 'Editar postagem' })); montar();
        });
      }

      function montar() {
        var msg = el('p', { class: 'portal-msg' });
        var titulo = el('input', { type: 'text', placeholder: 'Título', maxlength: '160' }); titulo.value = post.titulo || '';
        var assunto = el('input', { type: 'text', list: 'blog-assuntos', placeholder: 'Assunto (ex.: Casas) — escolha um que já existe ou escreva um novo', maxlength: '60' }); assunto.value = post.assunto || '';
        var sugestoes = el('datalist', { id: 'blog-assuntos' });
        C.from('blog_posts').select('assunto').not('assunto', 'is', null).then(function (r) {
          var vistos = {}; (r.data || []).forEach(function (x) { var n = String(x.assunto || '').trim(); if (n && !vistos[n]) { vistos[n] = 1; sugestoes.appendChild(el('option', { value: n })); } });
        });
        var palavras = el('input', { type: 'text', placeholder: 'Palavras que levam a este texto (ex.: casa 9, nona casa): viram link nas outras postagens', maxlength: '300' }); palavras.value = post.palavras_link || '';
        var resumo = el('textarea', { rows: '2', placeholder: 'Resumo para o Google e para a lista (opcional; se vazio, usa o começo do texto)' }); resumo.value = post.resumo || '';
        var video = el('input', { type: 'url', placeholder: 'Link do vídeo no YouTube (opcional; aparece no fim da postagem)' }); video.value = post.video_url || '';
        var corpo = el('textarea', { rows: '16', placeholder: 'Escreva o texto. Uma linha em branco separa os parágrafos.' }); corpo.value = post.corpo || '';
        corpo.style.minHeight = '260px';

        /* imagem */
        var imagemUrl = post.imagem_url || '', imagemNova = null, imagemAntiga = post.imagem_url || '';
        var previa = el('img', { alt: '' }); previa.style.cssText = 'display:none;width:100%;max-width:420px;height:auto;border-radius:6px;margin:0 0 10px;border:1px solid #1F5FA3';
        var escolher = el('input', { type: 'file', accept: 'image/*' }); escolher.style.display = 'none';
        var botImg = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: imagemUrl ? 'Trocar a imagem' : 'Escolher uma imagem' });
        var botTirar = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Tirar a imagem' });
        function atualizarImagem() {
          previa.style.display = imagemUrl ? 'block' : 'none'; if (imagemUrl) previa.src = imagemUrl;
          botImg.textContent = imagemUrl ? 'Trocar a imagem' : 'Escolher uma imagem';
          botTirar.style.display = imagemUrl ? '' : 'none';
        }
        botImg.addEventListener('click', function () { escolher.click(); });
        botTirar.addEventListener('click', function () { imagemUrl = ''; imagemNova = null; atualizarImagem(); });
        escolher.addEventListener('change', function () {
          var arq = escolher.files && escolher.files[0]; escolher.value = '';
          if (!arq) return;
          P.mensagem(msg, 'Preparando a imagem...');
          prepararImagem(arq).then(function (blob) {
            imagemNova = blob; imagemUrl = URL.createObjectURL(blob); atualizarImagem(); P.mensagem(msg, '');
          }).catch(function () { P.mensagem(msg, 'Não consegui ler essa imagem. Tente outra (JPEG ou PNG).', 'erro'); });
        });

        /* botão que marca a linha como subtítulo */
        var botSub = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Subtítulo' });
        botSub.addEventListener('click', function () {
          var t = corpo.value, ini = corpo.selectionStart, fim = corpo.selectionEnd;
          var comeco = t.lastIndexOf('\n', ini - 1) + 1, f = t.indexOf('\n', fim); if (f < 0) f = t.length;
          var trecho = t.slice(comeco, f), marcado = /^##\s/.test(trecho);
          var novo = marcado ? trecho.replace(/^##\s+/, '') : '## ' + trecho;
          corpo.value = t.slice(0, comeco) + novo + t.slice(f);
          corpo.focus(); corpo.selectionStart = corpo.selectionEnd = comeco + novo.length;
        });

        var botoes = el('div', { class: 'portal-acoes', style: 'margin-top:6px' });
        function travar(v) { Array.prototype.forEach.call(botoes.querySelectorAll('button'), function (b) { b.disabled = v; }); }

        /* grava a postagem; publicar: true/false decide o estado */
        function gravar(publicar) {
          var t = titulo.value.trim(), c = corpo.value.trim();
          if (!t) { P.mensagem(msg, 'Escreva o título.', 'erro'); return; }
          if (publicar && !c) { P.mensagem(msg, 'Escreva o texto antes de publicar.', 'erro'); return; }
          if (video.value.trim() && !/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(video.value.trim())) { P.mensagem(msg, 'O link do vídeo precisa ser do YouTube.', 'erro'); return; }
          travar(true); P.mensagem(msg, imagemNova ? 'Enviando a imagem...' : 'Salvando...');
          var enviada = null;
          var subir = imagemNova
            ? (function () {
                var caminho = 'blog-' + Date.now() + '.jpg';
                return C.storage.from('site').upload(caminho, imagemNova, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
                  if (r.error) throw r.error;
                  enviada = caminho; imagemUrl = C.storage.from('site').getPublicUrl(caminho).data.publicUrl;
                });
              })()
            : Promise.resolve();
          subir.then(function () {
            var agora = new Date().toISOString();
            var dados = {
              titulo: t, assunto: assunto.value.trim() || null, palavras_link: palavras.value.trim() || null, resumo: resumo.value.trim() || null, video_url: video.value.trim() || null, corpo: c, imagem_url: imagemUrl || null,
              publicado: publicar, atualizado_em: agora
            };
            if (publicar && !post.publicado_em) dados.publicado_em = agora;
            if (id) return C.from('blog_posts').update(dados).eq('id', id).then(function (r) { if (r.error) throw r.error; });
            /* postagem nova: cria o endereço; se já existir, acrescenta um número */
            var base = slugDe(t), tentativa = 1;
            function inserir() {
              dados.slug = tentativa === 1 ? base : base + '-' + tentativa;
              return C.from('blog_posts').insert(dados).select('id').single().then(function (r) {
                if (r.error && r.error.code === '23505' && tentativa < 20) { tentativa++; return inserir(); }
                if (r.error) throw r.error;
                id = r.data.id;
              });
            }
            return inserir();
          }).then(function () {
            if (imagemAntiga && imagemAntiga !== imagemUrl) { var velha = caminhoDe(imagemAntiga); if (velha) C.storage.from('site').remove([velha]); }
            listaAposGravar();
          }).catch(function (e) {
            if (enviada) C.storage.from('site').remove([enviada]);
            travar(false); P.mensagem(msg, P.traduzErro(e.message), 'erro');
          });
        }

        var publicar = el('button', { type: 'button', class: 'portal-btn', text: post.publicado ? 'Salvar alterações' : 'Publicar' });
        publicar.addEventListener('click', function () { gravar(true); });
        botoes.appendChild(publicar);
        {
          var rascunho = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: post.publicado ? 'Tirar do ar (voltar a rascunho)' : 'Salvar como rascunho' });
          rascunho.addEventListener('click', function () { gravar(false); });
          botoes.appendChild(rascunho);
        }
        var voltar = el('button', { type: 'button', class: 'portal-btn portal-btn-sec', text: 'Voltar' });
        voltar.addEventListener('click', lista);
        botoes.appendChild(voltar);
        if (id) {
          var excluir = el('button', { type: 'button', class: 'portal-btn portal-btn-perigo', text: 'Excluir' });
          excluir.addEventListener('click', function () {
            if (!window.confirm('Excluir esta postagem de vez? Não dá para desfazer.')) return;
            travar(true);
            C.from('blog_posts').delete().eq('id', id).then(function (r) {
              if (r.error) { travar(false); P.mensagem(msg, P.traduzErro(r.error.message), 'erro'); return; }
              var velha = caminhoDe(imagemAntiga); if (velha) C.storage.from('site').remove([velha]);
              listaAposGravar();
            });
          });
          botoes.appendChild(excluir);
        }

        cartao.appendChild(titulo); cartao.appendChild(assunto); cartao.appendChild(sugestoes); cartao.appendChild(palavras); cartao.appendChild(resumo);
        cartao.appendChild(previa); cartao.appendChild(el('div', { class: 'portal-acoes', style: 'margin-bottom:14px' }, [botImg, botTirar, escolher]));
        cartao.appendChild(el('div', { class: 'portal-acoes', style: 'margin-bottom:8px' }, [botSub]));
        cartao.appendChild(corpo);
        cartao.appendChild(video);
        cartao.appendChild(el('p', { class: 'portal-vazio', text: 'Subtítulo: clique na linha e toque em "Subtítulo". O visual (cores e fonte) é sempre o do site.' }));
        if (post.publicado && post.slug) {
          cartao.appendChild(el('p', { class: 'portal-vazio' }, [el('a', { href: 'postagem.html?p=' + encodeURIComponent(post.slug), target: '_blank', rel: 'noopener', text: 'Ver no site' })]));
        }
        cartao.appendChild(msg); cartao.appendChild(botoes);
        atualizarImagem();
      }
    }

    C.auth.getSession().then(function (r) {
      var sessao = r.data && r.data.session;
      if (sessao) iniciar(sessao.user); else mostrarLogin();
    });
  })();
  </script>
