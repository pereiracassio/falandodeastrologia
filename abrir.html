<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>/* Ícone do app: abre aqui e vai direto para a última tela em que você estava (guardada por portal.js em fda_ultima_pagina). Não carrega mais nada. */
  (function () { try {
    var app = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!app) return;
    var u = localStorage.getItem('fda_ultima_pagina');
    var destino = u && /^\/[a-z-]+\.html/.test(u) ? u : (localStorage.getItem('fda_admin') === '1' ? '/admin-agenda.html' : '/aluno.html');
    location.replace(destino);
  } catch (e) { location.replace('/aluno.html'); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6d3a0">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest-alunos.json">
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png?v=3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
