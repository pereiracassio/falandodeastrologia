    .container {
      max-width: 1000px;

    }

    /* Regras do iframe do Google Agenda */
    iframe {
      width: 100%;
      border: none;
      border-radius: 12px;
      overflow: hidden;
      /* os quadros brancos que o Google desenha atrás dos horários somem sobre o papiro (branco x papiro = papiro) */
      mix-blend-mode: multiply;
    }

    /* Altura no Computador e Tablet */
    @media (min-width: 769px) {
      iframe {
        min-height: 950px;
      }
    }

    /* Altura maior no Celular */
    @media (max-width: 768px) {
      iframe {
        min-height: 1400px;
      }
    }
  </style>
