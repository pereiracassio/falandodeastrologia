<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda de Consultas</title>
  
  <!-- Importação da fonte Cinzel do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Cinzel', serif;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* Regras do iframe do Google Agenda */
    iframe {
      width: 100%;
      border: none;
      border-radius: 12px;
      overflow: hidden;
      /* os quadros brancos que o Google desenha atrás dos horários somem sobre o papiro (branco x papiro = papiro) */
      mix-blend-mode: multiply;
    }

    /* Altura no Computador e Tablet */
    @media (min-width: 769px) {
      iframe {
        min-height: 950px;
      }
    }

    /* Altura maior no Celular */
    @media (max-width: 768px) {
      iframe {
        min-height: 1400px;
      }
    }
  </style>
  <link rel="stylesheet" href="home.css?v=8">
  <link rel="stylesheet" href="page.css?v=10">
</head>
<body>

  <div class="pagina pagina-larga"><div class="folha-pagina">
    <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3W9Wr4CrL3HV4VYCuQM4lgwPDRaXrxiJtYzCLDhpzdFsfYf7GDS7E7ocj9Dcg_xW6--h3Urr8P"></iframe>
  </div></div>

</body>
</html>
